  return [x0, y0, x1 - x0, y1 - y0];
}
/* A thumbnail shows its own unit, on its own level's real sheet — not a
   shared marketing crop. */
function boxForUnit(level, suffix) {
  const poly = contoursFor(level)[suffix];
  return poly ? polyBounds(poly) : [0, 0, 1, 1];
}


/* Frames one box with air around it: the drawing is scaled so the box fills
   the element, then slid so the box sits in the middle. */
function crop(box, pad = 0.45, axis = "width") {
  const [x, y, w, h] = box;
  const fw = Math.min(1, w * (1 + pad * 2));
  const fh = Math.min(1, h * (1 + pad * 2));
  const px = Math.max(0, Math.min(1 - fw, x + w / 2 - fw / 2));
  const py = Math.max(0, Math.min(1 - fh, y + h / 2 - fh / 2));
  /* A wide, short box reads better scaled off its height: the unit fills the
     strip and the neighbouring units supply the context on either side. */
  const size = axis === "height" ? `auto ${(100 / fh).toFixed(1)}%` : `${(100 / fw).toFixed(1)}% auto`;
  return `background-size:${size};`
    + `background-position:${(px / (1 - fw) * 100).toFixed(1)}% ${(py / (1 - fh) * 100).toFixed(1)}%`;
}

/* Matching exterior-wall corners, not property lines or balcony extents.
   Surveyor coordinates are measured after its 180-degree display rotation. */
const OVERLAY_SHEETS = {
  arp: { box: [298/1650,307/1560,1380/1650,1172/1560], ratio: 1650/1560, pdf: "assets/arp-site.pdf" },
  pay: { box: [156/835,178/800,711/835,624/800], ratio: 835/800, pdf: "assets/paysage.pdf" },
};
const BASE_BOX = [314/2000,325/1675,1488/2000,1270/1675];
const BASE_RATIO = 2000 / 1675;

/* Places one sheet so its building lands on the floor plan's building, then
   adds the nudge the panel holds. One scale for both axes: a sheet is never
   stretched to fit, it is placed and then nudged. The ground sheets cover
   the podium, so they bound the typical floor rather than trace it. */
function sheetStyle(key) {
  const L = V.lay[key], S = OVERLAY_SHEETS[key];
  const [bx0, by0, bx1, by1] = BASE_BOX;
  const [sx0, sy0, sx1, sy1] = S.box;
  /* The width the sheet needs so its building spans the plan's, and the
     height that width implies at the sheet's own proportions. */
  const w = (bx1 - bx0) / (sx1 - sx0) * L.scale / 100;
  const h = w * BASE_RATIO / S.ratio;
  const left = bx0 - sx0 * w + L.x / 100 - (paneLevel() === 1 ? 41/2000 : 0);
  /* Centred on the building vertically, since the height is no longer free. */
  const top = (by0 + by1) / 2 - (sy0 + sy1) / 2 * h + L.y / 100 + (paneLevel() === 1 ? 8/1675 : 0);
  return `left:${(left * 100).toFixed(2)}%;top:${(top * 100).toFixed(2)}%;`
    + `width:${(w * 100).toFixed(2)}%;height:${(h * 100).toFixed(2)}%;opacity:${L.opacity / 100}`;
}

/* The canvas sits on top of the picture inside the same box, so the two are
   registered by construction: a PDF page paints only its ink, and what shows
   through until it lands is the picture underneath. */
const layersHTML = () => (isNonresLevel(paneLevel()) ? [] : ["arp", "pay"]).filter((k) => V.lay[k].on)
  .map((k) => `<div class="lay" data-lay="${k}" style="${sheetStyle(k)}"><canvas data-laypdf="${k}" data-pdf-url="${OVERLAY_SHEETS[k].pdf}" data-pdf-turn="${k === "arp" ? 180 : 0}"></canvas></div>`).join("");

/* The consultant disciplines read the same way the surveyor and the
   landscaper already do — a chip per kind, toggled independently — except
   none of them needs sheetStyle()'s scale-and-nudge: the asset pipeline
   crops every engineering sheet to the floor plan's own 2000×1675 canvas,
   so registration is "the same box", not a transform. A kind a level has
   no page for stays on the row, greyed and unclickable: "not asked for"
   and "nothing here yet" are different sentences. */
function engChip(d, level) {
  const s = engSheet(d, level);
  const isBase = isNonresLevel(level) && d === engBaseDiscipline(level);
  const on = isBase || V.lay[d].on;
  const title = !s ? `${ENG_LABELS[d]} — aucune feuille pour ce niveau`
    : isBase ? `${ENG_LABELS[d]} — plan de base de ce niveau — ${s.code} · p.${s.page}`
    : `Superposer ${ENG_LABELS[d].toLowerCase()} — ${s.code} · p.${s.page}`;
  return `<span class="chip hi ${on ? "on" : ""}" ${s ? act("englayer", d) : ""} title="${title}"
    ${s ? "" : `aria-disabled="true" style="opacity:.4;cursor:default"`}>${icon(ENG_LAYICON[d])}
    <span class="lb">${ENG_LABELS[d]}${isBase ? " · base" : ""}</span></span>`;
}
/* Only the overlays paint a layer div: the base kind reuses the floor
   plan's own canvas and --plan background (see paneSheet()), the same slot
   the architecture fills on a residential level. */
const engLayersHTML = () => engOverlayDisciplines(paneLevel())
  .map((d) => {
    const s = engSheet(d, paneLevel());
    const vector = s.pdf && s.detail !== "image";
    return `<div class="lay eng" data-lay="${d}" style="opacity:.55;background-image:url(${s.img})">
      ${vector ? `<canvas data-laypdf="${d}" data-pdf-url="${s.pdf}"></canvas>` : ""}</div>`;
  }).join("");

/* The plan is read in black and white. Colour only arrives when a typology
   is asked for, and then only on the units that answer. */
const typosOn = () => TYPOS.filter((t) => V.typo[t]);
const typoHTML = () => {
  const on = typosOn();
  if (!on.length) return "";
  const polys = polysForPane();
  const levelRows = UNITS_BY_LEVEL[levelView(paneLevel())] || [];
  /* Laid on the sheet the level tabs opened, so the fill sits on the unit
     and not on the courtyard beside it. */
  const parts = levelRows.map((r) => {
    if (!on.includes(r[3])) return "";
    const poly = polys[r[2]];
    if (!poly) return "";
    return `<polygon points="${poly.map(([x, y]) => `${x},${y}`).join(" ")}" fill="${TYPO_INK[r[3]]}"></polygon>`;
  }).join("");
  return parts ? `<svg class="utagsvg" viewBox="0 0 1 1" preserveAspectRatio="none">${parts}</svg>` : "";
};

/* The selected unit, outlined on the sheet. Every other unit on this
   level keeps an invisible hit box, so the plan can be clicked the way
   the list can; a row from a different level is skipped, since its
   contour doesn't belong to the sheet actually on screen. */
function unitMarkHTML() {
  const rows = rowsOf("Unités");
  const sel = selIndex("Unités");
  const polys = polysForPane();
  const lv = paneLevel();
  const zs = V.zoom / 100;
  const parts = rows.map((r, i) => {
    if (r[4] !== lv) return "";
    const poly = polys[r[2]];
    if (!poly) return "";
    const on = i === sel;
    /* The whole pane is scaled by a CSS transform, which thickens a stroke
       along with everything else; dividing by the zoom keeps the outline
       the hairline it is meant to be at any magnification. */
    return `<polygon class="${on ? "on" : "hit"}" points="${poly.map(([x, y]) => `${x},${y}`).join(" ")}"
      style="stroke-width:${(1.6 / zs).toFixed(3)}px" data-act="row" data-value="${i}"><title>${r[0]} · ${r[1]}</title></polygon>`;
  }).join("");

  /* The label is HTML, not SVG text: the overlay is stretched to the sheet's
     own ratio, and a glyph inside it would be stretched with it. Its size is
     divided by the zoom so it stays a label and does not grow into a sign. */
  const cur = rows[sel];
  const z = V.zoom / 100;
  const tag = cur && polys[cur[2]] ? (() => {
    const [x, y, , h] = polyBounds(polys[cur[2]]);
    const below = y + h + 0.06 < 1;
    return `<div class="ulabel" data-side="${below ? "below" : "above"}" style="left:${(x * 100).toFixed(2)}%;`
      + `top:${((below ? y + h : y) * 100).toFixed(2)}%;`
      + `font-size:${(11 / z).toFixed(2)}px;transform:translateY(${below ? 2 / z : -(14 / z)}px)">`
      + `${cur[0]} · ${cur[1]}</div>`;
  })() : "";
  return `<svg class="umark" viewBox="0 0 1 1" preserveAspectRatio="none">${parts}</svg>${tag}`;
}



/* The tab glyph is a decision, not a default: what an architect reads in
   two seconds for "the floor and its units", "what the rules demand",
   "what is due when". Each screen carries its own shortlist, and the panel
   picks one per screen; the first of each list is what it opens with. */
const NAV_ICONS = {
  /* Coordination: two drawings brought side by side, which is the glyph
     git uses for the same idea. Layers stays on the shortlist. */
  "Unités": [["Compare", "git-compare"], ["Layers", "layers"], ["Floor grid", "grid-2x2"],
    ["Rooms", "bed-double"], ["Ruler", "ruler"]],
  "Codes": [["Number", "hash"], ["Checklist", "clipboard-list"], ["Flag", "flag"],
    ["Book", "book-open"], ["Shield", "shield-check"]],
  "Échéancier": [["Calendar", "calendar-check"], ["Timer", "timer"], ["Clock", "calendar-clock"],
    ["Checklist", "list-checks"], ["Flag", "flag"]],
};
const NAV = Object.keys(NAV_ICONS);
const navIcon = (name) => V.icons[name] || NAV_ICONS[name][0][1];

/* The cross-screen journey the prototype is built around. Everything else
   on the screen exists to serve one of these six moves. */
const JOURNEY = [
  { n: 1, t: "Un dessin a été enregistré", d: "Le niveau dit ce qui a bougé depuis la dernière lecture.", s: "Unités" },
  { n: 2, t: "Ouvrir l'unité qui a bougé", d: "Choisissez-la dans la liste, ou sur le plan lui-même.", s: "Unités" },
  { n: 3, t: "Voir les deux dessins à la fois", d: "Le plan 2D à côté de la maquette 3D, l'écart mesuré.", s: "Unités" },
  { n: 4, t: "Décider, et dire pourquoi", d: "La décision ne s'enregistre pas sans raison.", s: "Unités" },
  { n: 5, t: "Vérifier ce que ça brise", d: "Quel article du code, quel conflit, ce qui manque pour conclure.", s: "Codes" },
  { n: 6, t: "Savoir quand c'est dû", d: "Le calendrier et la liste de ce qui reste à faire.", s: "Échéancier" },
];

/* ------------------------------------------------------------- fidelity */

/* Isolation keeps the frame intact and fades everything that is not the
   region under study, so a variant is judged in place rather than alone. */
const solo = (region) => (V.isolate !== "none" && V.isolate === region ? "solo" : "");

/* The panel speaks French; the data attribute stays English because the
   stylesheet keys off it. */
const fiOf = (region) => (V[region] && V[region].fidelity !== "inherit" ? V[region].fidelity : V.fidelity);
const wrap = (region, label, html, step) =>
  `<div class="rg" data-rg="${label}" data-fi="${fiOf(region)}" style="display:contents">${html}</div>`
    .replace("</div>", "</div>"); // regions are grid children; see region()

/* A region is a grid child, so the tag and fidelity attributes live on the
   element itself rather than on a wrapper that would break the layout. */
function region(name, label, inner, step) {
  const s = step ? `<span class="step">${step}</span>` : "";
  return `<section class="pane rg ${solo(name)}" data-rg="${label}" data-fi="${fiOf(name)}" data-region="${name}">${s}${inner}</section>`;
}

const bars = (n, w = [100, 70, 85]) =>
  Array.from({ length: n }, (_, i) => `<div class="bar" style="width:${w[i % w.length]}%"></div>`).join("");

/* ------------------------------------------------------- what is selected
   The tab strip, the list and the chips all read from here, so a click
   changes the answer on the screen and not just the border of the control. */

const viewsOf = (screen) => CONTEXT[screen] || [];
/* Units opens on level 5: that is the floor every example here is about. */
const defaultView = (screen) => (screen === "Unités" ? Math.max(0, viewIndexOfLevel(5)) : 0);
const viewIndex = (screen) => Math.min(V.view[screen] === undefined ? defaultView(screen) : V.view[screen],
  Math.max(0, viewsOf(screen).length - 1));
const viewOf = (screen) => viewsOf(screen)[viewIndex(screen)];

/* The rows the current screen is showing, after its view and its search. */
function rowsOf(screen) {
  let all = screen === "Unités" ? (UNITS_BY_LEVEL[viewOf(screen)] || []) : [];
  /* No typology asked for means the whole level; asking for one narrows the
     list to it, the same units the plan then colours. */
  if (screen === "Unités" && typosOn().length) all = all.filter((r) => typosOn().includes(r[3]));
  const q = V.query.trim().toLowerCase();
  return q ? all.filter((r) => r.join(" ").toLowerCase().includes(q)) : all;
}

const selIndex = (screen) => {
  const n = rowsOf(screen).length;
  if (!n) return -1;
  return Math.min(V.sel[screen] === undefined ? 0 : V.sel[screen], n - 1);
};
const selRow = (screen) => rowsOf(screen)[selIndex(screen)];
const settleKey = () => `${V.screen} · ${(selRow(V.screen) || [""])[0]}`;
/* A decision is saveable as soon as there is something to save: a reason
   from the list, or a sentence written by hand. */
const saveReady = () => Boolean(V.reason || V.note.trim());
function paintSaveButton() {
  const b = document.querySelector("[data-save]");
  if (!b) return;
  const ok = saveReady();
  b.classList.toggle("go", ok);
  b.classList.toggle("off", !ok);
  b.title = ok ? "Enregistrer" : "Choisissez une raison ou écrivez une phrase";
}

/* A control is a control: it says what it does and it is clickable. */
const act = (name, value) => `data-act="${name}"${value === undefined ? "" : ` data-value="${value}"`}`;

/* The drawing the screen is reading right now: the level tab's own sheet,
   or, where that tab has none, the selected unit's real level (paneLevel
   above), so every other screen shows that unit's true floor rather than
   a stand-in composite. */
/* The architectural source for a residential floor; null on a basement or
   the roof, where none has been digitized — paneSheet() below is what the
   pane actually paints, architecture when there is one, the engineering
   base discipline when there is not. Never "Niveau 5": an unmapped level
   shows its own absence, not another floor's drawing. */
const sheet = () => SHEETS[levelView(paneLevel())] || null;
const paneSheet = () => sheet() || engSheet(engBaseDiscipline(paneLevel()), paneLevel());
const dwgName = () => V.docs.names[viewOf("Unités")] || sheet()?.file || "—";

/* What a drawing pane says about its file: where it is, what it is called,
   which revision was read. The button that hands the drawing back to the
   application sits in the pane header, a thumb away from the drawing
   instead of up in the screen header. */
const HOSTS = { plan: ["autocad", "Ouvrir dans AutoCAD"], model: ["sketchup", "Ouvrir dans SketchUp"] };

function hostButton(kind) {
  const [a, label] = HOSTS[kind];
  /* No DWG to hand back on a level with no architectural source: the
     button says so and does nothing, rather than opening on a file that
     does not exist for this level. */
  if (kind === "plan" && !sheet()) {
    return `<span class="btnw hi" style="opacity:.5;cursor:default"
      title="Aucun plan d'architecture importé pour ce niveau — remise à AutoCAD indisponible">
      ${icon("external-link")}<span class="hi">AutoCAD — indisponible</span></span>`;
  }
  /* Solid: handing the drawing back to its application is the one action
     on a drawing pane, so it carries the weight of the primary button. */
  return `<span class="btnw solid" ${act(a)} title="${label}">${icon("external-link")}
    <span class="lo bar" style="width:46px;background:#fff;opacity:.6"></span><span class="hi">${label}</span></span>`;
}

/* ------------------------------------------------------------ code cards
   A provision is only readable next to the number the drawings produced, so
   the card carries both, plus the sentence and the page it comes from. The
   link is a real link: the regulation is read where it is published. */

const unresolvedCount = () => ARTICLES.filter((a) => a.state === "non résolu").length;

/* The chain of authority for the one article that has no number: the law
   enables the bylaw, the bylaw carries the article that is measured. */
const chainSVG = () => `<svg viewBox="0 0 300 96" style="width:100%;height:auto">
  ${[["Loi", "A-19.1"], ["Règlement", "01-277"], ["Article", "art. 9, 22"]].map(([t, n], i) => {
    const x = 6 + i * 98;
    return `<rect x="${x}" y="24" width="84" height="44" rx="5" fill="var(--card)"
        stroke="var(--ink)" stroke-width="${i === 0 ? 1.4 : .9}"/>
      <text x="${x + 42}" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${t}</text>

        font-family="ui-monospace,Menlo,monospace" fill="var(--ink-2)">${n}</text>
      ${i < 2 ? `<path d="M${x + 88} 46 h6 m-2.5 -3 l3 3 -3 3" stroke="var(--ink)" fill="none" stroke-width="1"/>` : ""}`;
  }).join("")}
  <text x="6" y="88" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="var(--ink-3)">habilite</text>
</svg>`;

/* A1: the drawing opens the card and touches its edges. The two numbers are
   not repeated under it — they are written inside the drawing, where the
   geometry that produced them is visible. */
function codeCard(a, i) {
  const gap = a.state === "non résolu";
  return `<div class="code ${i === V.article ? "on" : ""} ${gap ? "gap" : ""}" ${act("article", i)}>
    <div class="draw">${a.img
      ? `<img src="${a.img}" alt="${a.topic} — ${a.measured} mesuré, ${a.required} exigé"

    <div class="tx">
      <div class="row" style="align-items:baseline">

        <span class="hi state" data-state="${a.state}">${a.state}</span>

      <blockquote class="hi quote">«&nbsp;${a.quote}&nbsp;»</blockquote>
      <div class="hi src">${a.doc} · ${a.place}<br>${a.edition}</div>
      ${gap ? `<div class="hi src">manque pour conclure: ${a.needs}</div>` : ""}
      <a class="btnw src-link hi" href="${a.url}" target="_blank" rel="noreferrer"
         ${act("source")} data-value="${a.id}">${icon("external-link")}Lire le texte officiel</a>
    </div>
  </div>`;
}

/* Schematics for the provisions that have no exported sheet behind them.

const FIGS = {

      stroke="var(--ink)" stroke-width="1"/>

    <path d="M70 60 h160" stroke="var(--ink-2)" stroke-dasharray="4 3" stroke-width="1"/>

    <path d="M20 62 h150" stroke="var(--ink)" stroke-width="1.2"/>
    <path d="M184 96 v-34 m-4 30 l4 4 4 -4 m-8 -26 l4 -4 4 4" stroke="var(--ink)" fill="none" stroke-width="1"/>
    <text x="192" y="74" font-size="12" font-weight="600" fill="var(--ink)">${a.measured}</text>

    <text x="20" y="114" font-size="10" fill="var(--ink-3)">dénivellation supérieure à 1 800 mm</text></svg>`,
  porte: (a) => `<svg viewBox="0 0 300 120" style="width:100%;height:auto">
    <path d="M40 92 h60 M200 92 h60" stroke="var(--ink)" stroke-width="3"/>

    <path d="M100 92 v-72" stroke="var(--ink)" stroke-width="1.6"/>
    <path d="M100 104 h100 m-96 -4 l-4 4 4 4 m92 -8 l4 4 -4 4" stroke="var(--ink)" fill="none" stroke-width="1"/>
    <text x="150" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${a.measured}</text>
    <text x="150" y="42" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${a.required} exigés</text>
    <text x="20" y="16" font-size="10" fill="var(--ink-3)">porte du parcours sans obstacles · plan</text></svg>`,
  classement: (a) => `<svg viewBox="0 0 300 120" style="width:100%;height:auto">
    ${[0, 1, 2, 3, 4, 5, 6, 7].map((k) => `<rect x="${60 + 0}" y="${14 + k * 11}" width="130" height="9"
      fill="${k === 7 ? "var(--fill)" : "none"}" stroke="var(--ink)" stroke-width=".9"/>`).join("")}
    <path d="M46 14 v88 m-4 4 l4 4 4 -4 m-8 -84 l4 -4 4 4" stroke="var(--ink)" fill="none" stroke-width="1"/>
    <text x="200" y="52" font-size="12" font-weight="600" fill="var(--ink)">${a.measured}</text>
    <text x="200" y="68" font-size="10.5" fill="var(--ink-2)">construction ${a.required}</text>

};
const codeFig = (a) => a.img
  ? `<img src="${a.img}" alt="${a.topic} — ${a.measured} mesuré, ${a.required} exigé"
       loading="lazy" style="aspect-ratio:${a.ratio}">`
  : (FIGS[a.fig] ? FIGS[a.fig](a) : chainSVG());

/* The Québec construction code first: it is what the building is judged
   against, and the borough's dimensions only decide what is allowed on the
   lot. Inside a body of rules the order is the one the articles were
   written in. */
const CODE_ORDER = ["Code de construction", "Loi sur", "Règlement"];
const codeRank = (a) => {
  const i = CODE_ORDER.findIndex((k) => a.doc.startsWith(k));
  return i < 0 ? CODE_ORDER.length : i;
};
/* No filter strip: the three bodies of rules are short enough to be read
   in one scroll, and a strip that hides two of them hides the fact that a
   provision in one is answered by a dimension in another. They are
   sections inside the list instead, in the order above. */
const CODE_GROUPS = [["Code de construction", "Code du Québec"],
  ["Loi sur", "Loi-cadre"], ["Règlement", "Règlement d'urbanisme"]];
const codeList = () => ARTICLES.slice().sort((x, y) => codeRank(x) - codeRank(y));
const codeGroups = () => CODE_GROUPS
  .map(([prefix, label]) => [label, ARTICLES.filter((a) => a.doc.startsWith(prefix))])
  .filter(([, rows]) => rows.length);

/* A note is written by a person against one article, and it never leaves
   this screen: nothing is ever written back into a drawing or into the
   bylaw. */
function codeRow(a) {
  const gap = a.state === "non résolu";
  const notes = V.notes[a.id] || [];
  const open = V.noteOn === a.id;
  return `<div class="coderow ${gap ? "gap" : ""} ${V.articleId === a.id ? "on" : ""}" ${act("article", a.id)}>
    <div class="draw">${codeFig(a)}</div>
    <div class="tx">
      <div class="row" style="align-items:baseline">
        <span class="hi tag">${a.id}</span>
        <span class="hi" style="font-weight:600;font-size:13px;flex:1">${a.topic}</span>
        <span class="hi state" data-state="${a.state}">${a.state}</span>
      </div>
      <blockquote class="hi quote">«&nbsp;${a.quote}&nbsp;»</blockquote>
      <div class="hi src">${a.doc} · ${a.place} · ${a.edition}</div>
      ${gap ? `<div class="hi src">manque pour conclure: ${a.needs}</div>` : ""}
      ${notes.length ? `<div class="col" style="gap:5px">${notes.map((n) => `<div class="note">
        <span class="hi" style="font-size:11px;color:var(--ink-3)">${n.who} · ${n.when}</span>
        <span class="hi" style="font-size:12px">${n.txt}</span></div>`).join("")}</div>` : ""}
      ${open ? `<div class="row" style="gap:6px;align-items:flex-start">
        <textarea class="noteinput" data-note="${a.id}" rows="2"
          placeholder="Ce qui manque, qui va le chercher, pour quand"></textarea>
        <span class="btnw solid" ${act("notesave", a.id)}>${icon("check")}<span class="hi">Écrire</span></span>
      </div>` : ""}
      <div class="row" style="gap:6px">
        <a class="btnw src-link hi" href="${a.url}" target="_blank" rel="noreferrer"
           ${act("source")} data-value="${a.id}">${icon("external-link")}Lire le texte officiel</a>
        <span class="btnw" ${act("noteopen", a.id)}>${icon("message-square")}<span class="hi">${open ? "Annuler" : "Ajouter une note"}</span></span>
        ${notes.length ? `<span class="hi" style="font-size:11px;color:var(--ink-3)">${notes.length} note${notes.length > 1 ? "s" : ""}</span>` : ""}
      </div>
    </div>
  </div>`;
}

/* ------------------------------------------------------- the calendar */

/* Dates are handled as ISO strings and plain UTC arithmetic: the screen
   never needs a locale calendar, only the day a task falls on. */
const MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
  "août", "septembre", "octobre", "novembre", "décembre"];
const MONTHS_AB = ["janv", "févr", "mars", "avr", "mai", "juin", "juil", "août", "sept", "oct", "nov", "déc"];
const DOW = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];
/* The three scales the calendar can be drawn at, in the order they widen. */
const CAL_SCALES = ["Semaine", "Mois", "Année"];
const iso = (d) => d.toISOString().slice(0, 10);
const dOf = (s) => new Date(s + "T00:00:00Z");
const shift = (s, n) => { const d = dOf(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
/* Monday as the first column, which is how a site week is read here. */
const monday = (s) => shift(s, -((dOf(s).getUTCDay() + 6) % 7));
const fmtDay = (s) => { const d = dOf(s); return `${d.getUTCDate()} ${MONTHS_AB[d.getUTCMonth()]}`; };
const tasksOn = (s) => TASKS.filter((t) => t.day === s);
const lateCount = () => TASKS.filter((t) => !t.done && t.day < TODAY).length;

function calTitle() {
  const d = dOf(V.day), v = V.scale;
  if (v === "Année") return `${d.getUTCFullYear()}`;
  if (v === "Semaine") {
    const a = monday(V.day);
    return `semaine du ${fmtDay(a)} au ${fmtDay(shift(a, 6))}`;
  }
  return `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

/* One day cell, at every scale: the number, a dot per task coloured by
   priority, and the open count once there is no room for dots. */
function dayCell(s, dim, big) {
  const ts = tasksOn(s), open = ts.filter((t) => !t.done);
  const cls = [s === V.day ? "on" : "", dim ? "dim" : "", s === TODAY ? "today" : "",
    open.some((t) => t.day < TODAY) ? "late" : ""].join(" ");
  return `<div class="day ${cls}" ${act("calday", s)} title="${fmtDay(s)} · ${ts.length} élément${ts.length > 1 ? "s" : ""}">
    <span class="lo bar" style="width:14px"></span>
    <span class="hi n">${dOf(s).getUTCDate()}</span>
    ${ts.length ? `<span class="hi dots">${ts.slice(0, big ? 4 : 3).map((t) =>
      `<i class="pdot" data-prio="${t.prio}" data-done="${t.done}"></i>`).join("")}${
      ts.length > (big ? 4 : 3) ? `<em>+${ts.length - (big ? 4 : 3)}</em>` : ""}</span>` : ""}
    ${big && ts.length ? `<span class="hi lbl">${ts[0].title}</span>` : ""}</div>`;
}

function monthGrid(y, m, big) {
  const first = iso(new Date(Date.UTC(y, m, 1)));
  const start = monday(first);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const s = shift(start, i);
    if (i >= 35 && dOf(s).getUTCMonth() !== m) break;
    cells.push(dayCell(s, dOf(s).getUTCMonth() !== m, big));
  }
  /* "sm", not "mini": .mini is already the drawing's minimap. */
  return `<div class="cal ${big ? "big" : "sm"}">
    ${DOW.map((d) => `<div class="dow"><span class="lo bar" style="width:16px"></span><span class="hi">${big ? d : d[0]}</span></div>`).join("")}
    ${cells.join("")}</div>`;
}

function calendarHTML() {
  const v = V.scale, d = dOf(V.day);
  if (v === "Année") {
    const y = d.getUTCFullYear();
    return `<div class="year">${MONTHS.map((name, m) => `<div class="ym">
      <div class="row" ${act("calmonth", `${y}-${String(m + 1).padStart(2, "0")}-01`)}>
        <span class="lo bar" style="width:40px"></span>
        <span class="hi" style="font-size:11.5px;font-weight:600">${name}</span>
        <span style="flex:1"></span>
        <span class="hi" style="font-size:11px;color:var(--ink-3)">${
          TASKS.filter((t) => t.day.slice(0, 7) === `${y}-${String(m + 1).padStart(2, "0")}`).length || ""}</span>
      </div>${monthGrid(y, m, false)}</div>`).join("")}</div>`;
  }
  if (v === "Semaine") {
    const a = monday(V.day);
    return `<div class="week">${DOW.map((name, i) => {
      const s = shift(a, i), ts = tasksOn(s);
      return `<div class="wcol ${s === V.day ? "on" : ""} ${s === TODAY ? "today" : ""}" ${act("calday", s)}>
        <div class="wh"><span class="lo bar" style="width:30px"></span>
          <span class="hi">${name} ${dOf(s).getUTCDate()}</span></div>
        <div class="wb">${ts.map((t) => `<div class="wtask" data-prio="${t.prio}" ${act("task", t.id)}>
          <span class="lo bar" style="width:80%"></span>
          <span class="hi">${t.title}</span>
          <span class="hi who">${t.who}</span></div>`).join("")}</div></div>`;
    }).join("")}</div>`;
  }
  return monthGrid(d.getUTCFullYear(), d.getUTCMonth(), true);
}

/* The list on the right is the same tasks, ordered by day and by priority
   inside a day. The calendar filters it: a day is selected, so the list
   opens on that day and keeps the rest below it under a divider. */
function taskListHTML() {
  const sorted = [...TASKS].sort((a, b) => a.day.localeCompare(b.day) || PRIO[b.prio] - PRIO[a.prio]);
  const here = sorted.filter((t) => t.day === V.day);
  const rest = sorted.filter((t) => t.day !== V.day && !t.done);
  const line = (t) => `<div class="task ${t.done ? "done" : ""} ${V.task === t.id ? "on" : ""}
      ${!t.done && t.day < TODAY ? "late" : ""}" ${act("task", t.id)}>
    <span class="dot" style="border-radius:3px;${t.done ? "background:var(--ink);border-color:var(--ink)" : ""}"
      ${act("tasktick", t.id)} title="Cocher"></span>
    <span class="col" style="flex:1;gap:2px;min-width:0">
      <span class="lo bar" style="width:70%"></span>
      <span class="hi" style="font-size:12.5px">${t.title}</span>
      <span class="lo bar" style="width:40%"></span>
      <span class="hi" style="font-size:11px;color:var(--ink-3)">${t.who} · ${t.phase}${
        t.code ? ` · ${t.code}` : ""}${!t.done && t.day < TODAY ? " · en retard" : ""}</span>
    </span>
    <span class="hi pr" data-prio="${t.prio}">${t.prio}</span>
    <span class="hi dte" ${act("calday", t.day)}>${fmtDay(t.day)}</span>
  </div>`;
  return `<div class="col" style="gap:7px">
    <div class="row" style="gap:6px">
      <span class="chip on"><span class="lo bar" style="width:40px"></span>
        <span class="hi">${fmtDay(V.day)}</span></span>
      <span class="chip"><span class="lo bar" style="width:40px"></span>
        <span class="hi">${lateCount()} en retard</span></span>
      <span style="flex:1"></span>
      <span class="btnw" ${act("calday", TODAY)}>${icon("plus")}<span class="hi">Ajouter une tâche</span></span>
    </div>
    ${here.length ? here.map(line).join("")
      : `<div class="tile"><span class="lo bar" style="width:60%"></span>
          <span class="hi" style="font-size:12px;color:var(--ink-2)">Rien ce jour-là.</span></div>`}
    <div class="row" style="gap:8px;margin-top:2px">
      <span class="lo bar" style="width:70px"></span>
      <span class="hi" style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">La suite</span>
      <span style="flex:1;border-top:1px solid var(--line-2)"></span></div>
    ${rest.map(line).join("")}
  </div>`;
}

/* Sections only appear in the grouped rail: the first three screens read a
   project, the next three act on it, the last one stores it. */
const SECTIONS = { 0: "Lecture", 3: "Décision", 6: "Archive" };
/* The key of a screen and the word on its tab are not the same thing. The
   key is "Unités" everywhere in this file — it indexes views, rows, titles
   and the fixture — while the tab says Coordination, because what the
   screen does is reconcile the drawing with the model, and the units are
   only the list it does it through. Renaming the key would touch thirty
   lookups for a word. */
const SCREEN_LABEL = { "Unités": "Coordination" };
const labelOf = (name) => SCREEN_LABEL[name] || name;
const SHORT = (name) => labelOf(name).slice(0, 3).toUpperCase();

/* One label rule for the rail and the tabs, so a title never reads two ways
   on the same screen. Hover and Hidden are CSS, the rest rewrite the text. */
function navLabel(name, i) {
  const m = V.nav.labels;
  if (m === "Short code") return SHORT(name);
  if (m === "Numbered") return `${i + 1}. ${labelOf(name)}`;
  return labelOf(name);
}

const railIcons = () => V.nav.icons === "Rail and tabs" || V.nav.icons === "Rail only";
/* With no rail to carry them, the glyphs belong to the tabs: "Rail only"

const tabIcons = () => V.nav.layout === "Two rows, no rail"

function navHTML() {
  if (SCREENS[V.screen].index) return "";
  const mode = V.nav.layout;
  if (mode === "Top bar only" || mode === "Tabs only, no rail"
    || mode === "Two rows, no rail") return "";
  const sections = mode === "Wide rail with sections";
  const wide = mode === "Wide rail with labels" || sections;
  const stack = mode === "Rail with labels under icons";
  const ic = railIcons();
  const items = NAV.map((name, i) => {
    const on = name === V.screen ? "on" : "";
    const g = ic ? icon(navIcon(name)) : "";
    const text = `<span class="hi">${navLabel(name, i)}</span>`;
    const head = sections && SECTIONS[i] ? `<div class="sct hi">${SECTIONS[i]}</div>` : "";
    if (wide) return `${head}<div class="row ${on}" data-screen="${name}" title="${labelOf(name)}">${g}<span class="lo bar" style="width:70%"></span>${text}</div>`;
    if (stack) return `<div class="stk ${on}" data-screen="${name}" title="${labelOf(name)}">${g}<span class="lo bar" style="width:70%;height:6px"></span>${text}</div>`;
    return `<div class="ic ${on}" data-screen="${name}" title="${labelOf(name)}">${g || `<span class="code hi">${SHORT(name)}</span>`}${g ? `<span class="cap hi">${navLabel(name, i)}</span>` : ""}</div>`;
  }).join("");
  const cls = wide ? "wide" : stack ? "stack" : "";
  return `<nav class="rail rg ${solo("nav")} ${cls}" data-rg="navigation" data-fi="${fiOf("nav")}"
       data-labels-mode="${V.nav.labels}">${items}</nav>`;
}

/* The rail and the tab strip never carry the same destinations. When the
   rail lists the screens, the strip drops to the current screen's own views. */
const CONTEXT = {

  "Unités": LEVEL_VIEWS,
};

function tabsHTML() {
  const mode = V.nav.layout;
  if (mode === "Rail only, no tabs") return "";
  const top = mode === "Top bar only";
  const ic = tabIcons();
  const names = Object.keys(SCREENS).filter((n) => !SCREENS[n].index);
  /* Icons off and labels away would leave an empty strip, so the short code
     stands in: a tab target never renders without something to read. */
  const bare = !ic && (V.nav.labels === "Hidden" || V.nav.labels === "Hover only");
  const tab = (name, i) => `<button data-screen="${name}" aria-current="${name === V.screen}" title="${labelOf(name)}">
      ${ic ? icon(SCREENS[name].icon) : ""}<span class="lo bar" style="width:46px"></span>
      ${bare ? `<span class="hi code">${SHORT(name)}</span>` : `<span class="hi">${navLabel(name, i)}</span>`}</button>`;

  let items;
  const views = CONTEXT[V.screen] || [];
  const viewBtn = (t, i) => `<button ${act("view", i)} aria-current="${i === viewIndex(V.screen)}" title="${t}">

  const back = `<span class="crumb hi" data-screen="Projets" title="Tous les projets">${icon("folder")}Tous les projets</span>`;
  if (SCREENS[V.screen].index) {

  } else if (!views.length && mode !== "Two rows, no rail") {

       carries the project's name and the way back, and no tabs at all. The
       two-row layout is the exception: it is the only way between screens,
       so its first row is on every screen, views or not. */
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span><span class="sp"></span>`;
  } else if (mode === "Rail + view menu") {
    /* One button that steps through the views, because a menu that cannot
       open is not a control. */
    items = `<span class="btnw solid" ${act("viewnext")} title="Vue suivante"><span class="hi">${views[viewIndex(V.screen)]}</span>${icon("chevron-down")}</span>
      <span class="sp"></span>
      <span class="chip hi">${viewIndex(V.screen) + 1} / ${views.length}</span>`;
  } else if (mode === "Rail + breadcrumb") {
    items = `${back}${icon("chevron-right")}
      <span class="crumb on hi">${V.project}</span>
      <span class="sp"></span>`;
  } else if (top || mode === "Tabs only, no rail" || mode === "Two rows, no rail") {
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span>
      <span class="div"></span><div class="views">${names.map(tab).join("")}</div><span class="sp"></span>`;
  } else {
    /* The project name is on the path, before the views: it is read at the
       same time as where one is, and it is the way back to the index. The
       views scroll under it rather than pushing it off the strip. */
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span>
      <span class="div"></span>
      <div class="views">${views.map(viewBtn).join("")}</div>
      <span class="sp"></span>`;
  }
  /* The second row only exists when the screen has something to ask for.
     Aperçu keeps the single row, and the drawing gets the thirty-two
     pixels back. "Bâtiment entier" sits at the head of that row, before
     Niveau 1, because it is the same question the levels answer: which
     floor — or all of them. Chosen, it dims the levels, since a figure
     counted over eight floors has no level; clicking one is how you come
     back. */
  const off = buildingScope();
  const wholeBtn = V.screen === "Unités"
    ? `<button ${act("scope", "Bâtiment")} aria-current="${off}" title="Compter le bâtiment entier"
         style="flex:0 0 auto">${icon("building-2")}<span class="hi">Bâtiment entier</span></button>`
    : "";
  const row2 = mode === "Two rows, no rail" && views.length
    ? `<div class="tabs lvl rg ${solo("nav")}" data-rg="vues" data-fi="${fiOf("nav")}"
         data-style="${V.nav.tabStyle}" data-labels-mode="${V.nav.labels}" data-off="${off}">
        ${wholeBtn}${wholeBtn ? `<span class="div"></span>` : ""}
        <div class="views">${views.map(viewBtn).join("")}</div></div>`
    : "";
  /* A project is read by people who do not draw: the client, the urbaniste,
     the contractor. Sharing is the end of the first row, on every screen
     that has a project open, because it is about the project and not about
     what is on screen. */
  /* Reading the screen as the shared link shows it belongs next to the share
     button, because that is the question it answers: what did the person on
     the other end actually get. */
  const guestChip = SCREENS[V.screen].index ? ""
    : `<span class="btnw ${V.guest ? "solid" : ""}" ${act("guest")}
         title="${V.guest ? "Revenir à la vue de l'atelier" : "Voir l'écran comme l'invité du lien partagé"}"
         style="margin-left:auto;flex:0 0 auto">${icon(V.guest ? "eye" : "lock")}<span class="hi">${
           V.guest ? "Vue invité" : `${teamPins()} note${teamPins() > 1 ? "s" : ""} d'atelier`}</span></span>`;
  const share = SCREENS[V.screen].index ? ""
    : `<span class="btnw" ${act("share")} title="Partager le projet en lecture et commentaires"
         style="flex:0 0 auto">${icon("share-2")}<span class="hi">Partager</span></span>`;

  return `<div class="tabs rg ${solo("nav")}" data-rg="${top ? "navigation + onglets" : "onglets"}" data-fi="${fiOf("nav")}"
       data-style="${V.nav.tabStyle}" data-align="${V.nav.tabAlign}" data-labels-mode="${V.nav.labels}">
    ${top ? `<span class="btnw" style="margin-right:8px">${icon("box")}<span class="hi">ça fitte</span></span>` : ""}
    ${items}${guestChip}${share}
  </div>${row2}`;
}

function headerHTML() {
  const step = V.journey ? SCREENS[V.screen].steps.header : null;
  /* The subtitle answers to the state: which project is open, which level is
     being read, how many rows the current view is actually showing. */
  const unresolved = unresolvedCount();
  const open = Object.keys(V.settled).length;
  /* The index needs no count: the projects are on screen, and one line of
     arithmetic above them only repeats what the eye already did. */
  /* Under "Bâtiment entier" the screen is not reading a floor, so the title
     says the building and counts it — the level in the strip below has no
     say in these figures, which is the confusion the scope switch removes.
     The counts are summed from the table, not typed twice. */
  const sup = QTABS["Superficies"].rows;
  const title = { "Projets": ["Projets", ""],
    "Codes": ["Codes et règlements", `${ARTICLES.length} articles suivis · ${unresolved} non résolus`],
    "Échéancier": ["Échéancier", `${TASKS.filter((t) => !t.done).length} tâches ouvertes · ${lateCount()} en retard`],
    "Unités": buildingScope()
      ? [`${V.project} — bâtiment entier`,
        `${sup.length} niveaux · ${sup.reduce((n, r) => n + r[1], 0)} unités · `
        + `${sup.reduce((n, r) => n + r[2], 0).toLocaleString("fr-CA")} pi² nets`]
      : [`Plans — ${viewOf("Unités").toLowerCase()}`,
        `${rowsOf("Unités").length} unités · ${rowsOf("Unités").filter((r) => /croisement/.test(r[1])).length} avec un croisement ouvert`],
  }[V.screen] || [V.screen, ""];
  const metrics = V.header.layout === "Title + metrics";
  const bare = V.header.layout === "Title only";
  return `<header class="pane rg ${solo("header")}" data-rg="entête" data-fi="${fiOf("header")}" style="flex:0 0 auto">
    ${step ? `<span class="step">${step}</span>` : ""}
    <div class="pb" style="padding:10px 12px;gap:8px">
      <div class="row">
        <div class="col" style="flex:1;gap:5px">
          <div class="lo bar" style="width:170px;height:13px"></div>
          <div class="lo bar lt" style="width:260px;height:8px"></div>
          <div class="hi" style="font-size:16px;font-weight:600">${title[0]}</div>
          <div class="hi" style="font-size:12px;color:var(--ink-2)">${title[1]}</div>
        </div>
        ${bare ? "" : SCREENS[V.screen].home
          ? `<span class="btnw solid" ${act("newproject")} title="Démarrer un projet">${icon("plus")}<span class="lo bar" style="width:52px"></span><span class="hi">Nouveau projet</span></span>`
          /* AutoCAD and SketchUp used to sit up here, a screen away from the
             drawing they open. They live on the drawing pane now. */
          : buildingScope()
          ? `<span class="btnw" ${act("csvall")} title="Télécharger les quatre tableaux en .csv">${icon("download")}<span class="lo bar" style="width:40px"></span><span class="hi">Tout exporter en .csv</span></span>`
          : `<span class="btnw" ${act("export")} title="Exporter ce que cet écran montre">${icon("table")}<span class="lo bar" style="width:40px"></span><span class="hi">Exporter</span></span>`}
      </div>
      ${metrics ? `<div class="row" style="gap:var(--gap)">${[1, 2, 3, 4].map((i) => `<div class="tile" style="flex:1">
        <div class="lo bar" style="width:38px;height:14px"></div><div class="lo bar lt" style="width:70%"></div>
        <div class="hi" style="font-size:17px;font-weight:600">${["6", "4", "5", "98"][i - 1]}</div>
        <div class="hi" style="font-size:11px;color:var(--ink-2)">${["écarts", "croisements", "articles à lire", "unités"][i - 1]}</div>
      </div>`).join("")}</div>` : ""}
    </div>
  </header>`;
}

function listHTML() {
  const mode = V.list.layout;
  if (mode === "Hidden") return "";
  const step = V.journey ? SCREENS[V.screen].steps.list : null;
  const label = V.screen === "Unités" ? "Unités" : "Liste";
  /* The list reads the same rows the header counts, so the view above it and
     the search inside it both change what is on screen. */
  const pairs = rowsOf(V.screen);
  const rows = pairs.length ? pairs.map((r) => `${r[0]} · ${r[1]}`) : ["rien ne correspond"];
  const sel = selIndex(V.screen);

  if (mode === "Filter bar only") {
    return `<section class="pane rg ${solo("list")}" data-rg="liste → barre de filtres" data-fi="${fiOf("list")}" style="flex:0 0 auto;grid-column:1/-1">
      ${step ? `<span class="step">${step}</span>` : ""}
      <div class="pb" style="flex-direction:row;align-items:center;padding:8px 10px">
        <span class="chip">${icon("search")}<span class="lo bar" style="width:70px"></span>
          <input class="hi find" value="${V.query}" placeholder="Chercher dans ${label.toLowerCase()}"></span>
        ${pairs.slice(0, 4).map((r, i) => `<span class="chip ${i === sel ? "on" : ""}" ${act("row", i)}><span class="lo bar" style="width:46px"></span><span class="hi">${r[0].split(" ")[0]}</span></span>`).join("")}
      </div></section>`;
  }
  /* A6: on Unités the number rides on the drawing and the line underneath
     carries the typology and the area, the two facts a reader compares from
     one card to the next. Other screens have no drawing and no typology, so
     they keep the plain pair. */
  const ucard = (r, i) => `<div class="tile ucard ${i === sel ? "on" : ""}" ${act("row", i)}
      title="${r[0]} · ${r[6]} pi²${r[7] ? ` · ${r[1]}` : ""}">
      <div class="plan" data-img="unit" style="height:88px;flex:0 0 88px;background-image:url(assets/plan-niveau-${r[4]}.jpg);${crop(boxForUnit(r[4], r[2]))}"></div>
      <span class="hi ub">${r[0].split(" · ")[0]}</span>
      ${r[7] ? `<span class="hi uc" title="${r[1]}"></span>` : ""}
      <div class="lo bar" style="width:70%"></div>
      <div class="hi ul"><span style="font-size:12px">${r[5]}</span>
        <span class="ua">${r[6]} pi²</span></div></div>`;
  /* One column: in two the drawings came out barely wider than a thumbnail,
     and the plan of a unit is the point of the card. */
  const inner = mode === "Card grid"
    ? (pairs.length ? `<div style="display:grid;grid-template-columns:1fr;gap:8px">${pairs.map((r, i) => V.screen === "Unités" ? ucard(r, i)
      : `<div class="tile ${i === sel ? "on" : ""}" ${act("row", i)}>
        <div class="plan" style="height:54px;flex:0 0 54px"></div>
        <div class="lo bar" style="width:70%"></div><div class="hi" style="font-size:11.5px">${r[0]} · ${r[1]}</div></div>`).join("")}</div>`
      : `<div class="tile"><span class="hi" style="font-size:12px;color:var(--ink-2)">${emptyMsg}</span></div>`)
    : rows.map((r, i) => `<div class="listrow ${i === sel ? "on" : ""}" ${pairs.length ? act("row", i) : ""}><span class="dot"></span>
        <span class="lo bar" style="flex:1"></span><span class="hi" style="font-size:12px">${r}${V.settled[`${V.screen} · ${(pairs[i] || [""])[0]}`] ? " · réglé" : ""}</span></div>`).join("");

  return region("list", `list — ${label.toLowerCase()}`,
    `<div class="ph">${icon("list")}<span class="lo bar" style="width:60px"></span><span class="hi">${label}</span></div>
     <div class="pb">${inner}</div>`, step);
}

function contentHTML() {
  const step = V.journey ? SCREENS[V.screen].steps.content : null;
  /* Counting the building replaces the drawings: see quantScreenHTML. */
  if (buildingScope()) return quantScreenHTML(step);
  const mode = V.content.layout;
  const body = {
    "Unités": () => {
      const unit = (selRow("Unités") || ["—"])[0];
      /* The zoom stands against the outer edge of each pane: flat, opaque,
         always there. Vertical, because the course it runs is vertical, and
         the two framings cap it — corners pushed out at the top, where the
         slider runs toward the whole drawing, corners pulled in at the
         bottom, where it runs toward the close view. */
      const wide = side => side === "plan"
        ? `${act("fitsheet")} title="Voir toute la feuille"`
        : `${act("mwide")} title="Voir tout le bâtiment"`;
      const close = side => side === "plan"
        ? `${act("fitunit")} title="Cadrer l'unité sélectionnée"`
        : `${act("mclose")} title="Se rapprocher du bâtiment"`;
      const zcol = (side) => `<div class="zcol" data-zcol="${side}">
        <span class="zb" ${wide(side)}>${icon("maximize")}</span>
        <span class="zb" ${act("zstep", side + ":+")} title="Agrandir">${icon("plus")}</span>
        <input class="zslider" type="range" ${side === "plan"
          ? `min="${ZMIN}" max="${ZMAX}" step="1" value="${V.zoom}" data-zoom aria-label="Zoom du plan"`
          : `min="0" max="100" step="1" value="${V.mzoom}" data-mzoom aria-label="Zoom de la maquette"`}>
        <span class="zb" ${act("zstep", side + ":-")} title="Reculer">${icon("minus")}</span>
        <span class="zread hi" ${side === "plan" ? "data-zread" : "data-mread"}>${side === "plan" ? V.zoom : V.mzoom}%</span>
        <span class="zb" ${close(side)}>${icon("minimize")}</span>
      </div>`;
      /* The corner view: the drawing whole, small. On the plan it is the
         sheet as a picture, with the rectangle of what is on screen, dragged
         to move it. On the model it is the model itself seen from straight
         above — the roof read in the same orientation as the sheet beside
         it — with a marker for the side the live camera stands on. Neither
         carries a caption: the percentage is already on the zoom column an
         inch away, and printing it twice only made the corner heavier. */
      const mini = (side) => (side === "plan"
        ? `<div class="mini hi" data-mini="plan">
        <span class="mi" data-mi>
          <img src="${paneSheet()?.img || ""}" alt="">
          <span class="mrect" data-mrect></span>
        </span>
      </div>`
        : `<div class="mini hi" data-mini="model">
        <span class="mi" data-mi><canvas data-mini3d></canvas></span>
      </div>`);
      /* North, top right of each pane. On the sheet it is a fixed mark: the
         drawing does not turn. On the model it is the same mark laid flat on
         the ground and seen from wherever the camera is, so the ring
         flattens and the needle swings as the building is orbited. */
      const north = (side) => (side === "plan"
        ? `<svg class="north hi" data-north viewBox="-22 -32 44 64" aria-label="Nord">
        <text x="0" y="-21">N</text>
        <circle cx="0" cy="6" r="14"></circle>
        <line x1="0" y1="6" x2="0" y2="-7"></line>
      </svg>`
        : `<svg class="north hi" data-north3d viewBox="-22 -32 44 64" aria-label="Nord">
        <polygon data-nring points=""></polygon>
        <line data-nneedle x1="0" y1="0" x2="0" y2="-14"></line>
        <text data-nlabel x="0" y="-21">N</text>
      </svg>`);
      /* Where each floor sits, said on the model itself: a line at the top
         of the slab, run out to the edge of the pane, and the level's name
         at the end of it — the way a section is annotated. The SVG is empty
         here; the viewer fills it once it knows where the camera is. */
      const levelMarks = `<svg class="lvls hi" data-levels aria-hidden="true"></svg>`;
      /* Which way is north, up, and along the façade: the three axes as the
         camera sees them, red X, green Y, blue Z, redrawn as it orbits. */
      const axes = `<svg class="axes hi" data-axes viewBox="-26 -26 52 52" aria-hidden="true">
        ${["x", "y", "z"].map((a) => `<line data-ax="${a}" x1="0" y1="0" x2="0" y2="0"></line>
          <text data-axt="${a}" x="0" y="0">${a.toUpperCase()}</text>`).join("")}
        <circle cx="0" cy="0" r="1.6"></circle>
      </svg>`;
      /* Which sheets are laid over the floor plan was a panel setting, which
         means it was not in the prototype at all: the person reading the
         drawing could not ask for the surveyor. The three chips are that
         question, on the pane that answers it. "Plan seul" is not a fourth
         layer, it is both overlays off — the floor plan is always there. */
      /* One glyph each, so the row reads as three kinds of drawing before it
         reads as three words: the sheet itself, the surveyor's rule, the
         landscape architect's planting. */
      const LAYICON = { none: "file", arp: "ruler", pay: "trees" };
      const laychip = (k, t) => {
        const unavailable = k !== "none" && isNonresLevel(paneLevel());
        const on = !unavailable && (k === "none"
          ? !V.lay.arp.on && !V.lay.pay.on && !ENG_DISCIPLINES.some((d) => V.lay[d].on)
          : V.lay[k].on);
        return `<span class="chip hi ${on ? "on" : ""}" ${unavailable ? 'aria-disabled="true" style="opacity:.4"' : act("layer", k)}
          title="${unavailable ? `${t} — non disponible pour ce niveau` : k === "none" ? "Le plan de base seul" : `Superposer ${t.toLowerCase()}`}">${icon(LAYICON[k])}<span class="lb">${t}</span></span>`;
      };
      const pane = (t, note, kind, cls = "", layers = "") => `<div class="pane drawing" style="flex:1"><div class="ph">${icon("file")}
        <span class="lo bar" style="width:90px"></span><span class="hi">${t}</span>
        <span style="flex:1"></span>
        ${kind === "plan" ? `<span class="laychips">${laychip("none", "Plan seul")}${laychip("arp", "Arpenteur")}${laychip("pay", "Paysage")}</span>` : ""}
        ${hostButton(kind === "plan" ? "plan" : "model")}</div>
        ${kind === "plan" ? `<div class="engineering-bar hi">
          <span class="laychips eng">${ENG_DISCIPLINES.map((d) => engChip(d, paneLevel())).join("")}</span>
          ${!sheet() ? `<div class="engineering-source">Architecture non fournie · ${paneSheet()?.code || "—"} · p.${paneSheet()?.page || "—"}</div>` : ""}
        </div>` : isNonresLevel(paneLevel()) ? `<div class="model-context-note hi">${note}</div>` : ""}
        ${kind === "plan"
          /* The sheet is larger than the pane, so the pane is a window onto
             it: the drawing, the consultants' layers, the typology fills and
             the unit outline all sit inside one transformed box and move
             together. The wheel zooms where the pointer is; dragging pans. */
          ? `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="plan">
              <div class="vp" data-vp>
              <div class="plan ${cls}" data-img="${kind}" data-src="${planVector() ? "vector" : "image"}"
                   style="transform:translate(${V.pan.x}px,${V.pan.y}px) scale(${V.zoom / 100})">
                <span class="lo"></span><span class="hi">${note}</span>
                ${planVector() ? `<canvas class="sheetpdf" data-sheetpdf data-pdf-url="${paneSheet().pdf}"></canvas>` : ""}
                ${layers}${unitMarkHTML()}${pinMarkHTML()}</div></div>
              ${north("plan")}${mini("plan")}${zcol("plan")}</div>`
          : `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="model">
              <div class="model3d" data-building-model data-state="loading" role="region"
                   aria-label="Maquette 3D interactive du Baldwin III" aria-busy="true">
                <div class="model3d-status" data-model-status aria-live="polite">Chargement de la maquette…</div>
              </div>
              <div class="npins" data-npins></div>
              ${levelMarks}${north("model")}${axes}${mini("model")}${zcol("model")}
            </div>`}
        </div>`;
      /* The 2D pane carries the surveyor's and the landscaper's sheets, which
         is why it is the one pane drawn at the plan's own aspect. */
      const nonres = isNonresLevel(paneLevel());
      const planNote = nonres
        ? `${levelView(paneLevel())} — architecture non fournie — base ${ENG_LABELS[engBaseDiscipline(paneLevel())].toLowerCase()}`
        : `${unit} — contours par-dessus`;
      /* The two basements are not in the model: the massing starts at the
         ground. A pane saying so is a pane of nothing, so the plan takes
         the full width there. The roof is in the model, so it keeps both. */
      const noModel = paneLevel() === -1 || paneLevel() === 0;
      const modelNote = paneLevel() === 9
        ? "Toiture — bandeau et repère affichés sur la maquette"
        : `${unit} — volumétrie, même niveau`;
      const plan = () => pane("Plan 2D", planNote, "plan", "align", typoHTML() + layersHTML() + engLayersHTML());
      const model = () => (noModel ? "" : pane("Maquette 3D", modelNote, "model", "fit"));
      if (mode === "Stacked") return `<div class="col" style="flex:1">${plan()}${model()}</div>`;
      if (mode === "Single pane + inset") return `<div class="col" style="flex:1;gap:var(--gap)">
        <div style="position:relative;flex:1;display:flex">${plan()}
        ${noModel ? "" : `<div class="pane" style="position:absolute;right:10px;bottom:10px;width:220px;height:150px">
        <div class="pb"><div class="plan" data-img="massing"><span class="hi">3D inset</span></div></div></div>`}</div></div>`;
      return `<div class="col" style="flex:1;gap:var(--gap)">
        <div class="row" style="flex:1;align-items:stretch;gap:var(--gap);min-height:0">${plan()}${model()}</div></div>`;
    },
    /* Codes is the vertical reading of the provisions: the Québec
       construction code first, then the bylaw, each one with the schematic
       of what it measures, the sentence in French, what is still missing,
       and the notes written against it. Nothing here writes to a drawing.
       Every body of rules is in the one list, each under its own heading. */
    "Codes": () => {
      const groups = codeGroups();
      const section = ([label, rows]) => {
        const open = rows.filter((a) => a.state === "non résolu").length;
        return `<div class="codesec"><span class="hi">${label}</span>
            <span class="hi" style="color:var(--ink-3)">${rows.length} article${rows.length > 1 ? "s" : ""}${open ? ` · ${open} non résolu${open > 1 ? "s" : ""}` : ""}</span></div>
          ${rows.map(codeRow).join("")}`;
      };
      return `<div class="col" style="flex:1;gap:var(--gap)">
        <div class="pane" style="flex:0 0 auto">
          <div class="ph">${icon("hash")}<span class="lo bar" style="width:90px"></span>
            <span class="hi">Articles suivis</span><span style="flex:1"></span>
            <span class="chip"><span class="lo bar" style="width:52px"></span>
              <span class="hi">${ARTICLES.length} articles · ${unresolvedCount()} non résolus</span></span>
            <span class="btnw solid" ${act("addcode")}>${icon("plus")}<span class="hi">Ajouter</span></span></div>
          <div class="pb">
            <div class="codelist">${groups.map(section).join("")}</div>
            <div class="tile"><div class="row">${icon("alert-triangle")}<span class="lo bar" style="width:70%"></span>
              <span class="hi" style="font-size:11.5px;color:var(--ink-2)">Extraits de travail, abrégés. La version qui fait foi est celle de la RBQ ou de l'arrondissement, liée sur chaque article. Une lecture automatique ne déclare pas une non-conformité.</span></div></div>
          </div></div>
      </div>`;
    },
    /* Échéancier is a calendar on the left and the work on the right. They
       are one object seen twice: a task has a date, so it is a mark on the
       calendar; a day holds tasks, so clicking it filters the list. The
       scale sits on the calendar it draws, beside the dates it changes,
       rather than in a strip above that looked like a change of screen. */
    "Échéancier": () => `<div class="row" style="flex:1;align-items:stretch;gap:var(--gap)">
      <div class="pane" style="flex:1.25">
        <div class="ph">${icon("calendar-check")}<span class="lo bar" style="width:70px"></span>
          <span class="hi">${calTitle()}</span><span style="flex:1"></span>
          ${CAL_SCALES.map((s) => `<span class="chip ${V.scale === s ? "on" : ""}" ${act("calscale", s)}
            title="Dessiner le calendrier par ${s.toLowerCase()}"><span class="hi">${s}</span></span>`).join("")}
          <span class="btnw" ${act("calmove", "-1")} title="Avant">${icon("chevron-left")}</span>
          <span class="btnw" ${act("calmove", "1")} title="Après">${icon("chevron-right")}</span>

  const lines = [[`${V.project} — ${name} — bâtiment entier`],
    t.head, ...t.rows].map((r) => r.map(q).join(",")).join("\r\n");

/* What the point landed on. The unit outlines are already in sheet
   coordinates, so the pin can name the unit it sits in without guessing. */
function unitAt(x, y) {
  const polys = polysForPane();
  const lv = paneLevel();
  for (const r of rowsOf("Unités")) {
    if (r[4] !== lv) continue;
    const poly = polys[r[2]];
    if (poly && pointInPoly(x, y, poly)) return `unité ${r[0].split(" · ")[0]}`;
  }
  return "";
}
function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i, i += 1) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function postPin() {
  if (!V.pending) return;
  const txt = V.draft.trim();
  if (!txt) { document.querySelector("[data-pindraft]")?.focus(); return; }
  V.pins.push({ id: nextPinId(), scope: V.pinScope, who: V.pinScope === "equipe" ? "Vous" : "Vous (partagé)",
    when: "à l'instant", txt, ...V.pending });

  V.pending = null; V.draft = ""; V.pinMode = false;
  savePins();
  render();
}
