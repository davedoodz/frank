<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype C — wireframe</title>
<link rel="stylesheet" href="vendor/geist/geist.css">
<link rel="stylesheet" href="vendor/dialkit/styles.css">
<script type="importmap">
{"imports":{
  "three":"./vendor/three/build/three.module.js",
  "three/addons/":"./vendor/three/examples/jsm/"
}}
</script>
<script type="module" src="wireframe-c3-viewer.js"></script>
<style>
/* Low fidelity on purpose: one grey, one line weight, one type size ramp.
   What is being tested here is where things sit and in what order they are
   read, not how they look. */
:root{
  --sans:'Geist',ui-sans-serif,system-ui,sans-serif;
  --ink:#1b1b1b; --ink-2:#6b6b6b; --ink-3:#9b9b9b;
  --line:#c9c9c9; --line-2:#e2e2e2;
  --fill:#ededed; --fill-2:#f6f6f6; --page:#fafafa; --page-field:#f4f4f5;
  --bar:#dcdcdc;
  --hi:#111;
  --gap:10px; --pad:12px; --r:6px;
}
[data-density="compact"]{--gap:6px;--pad:8px}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--sans)}
/* The app is a window, not a page. Nothing scrolls or rubber-bands at the
   document level, so the whole screen cannot be pulled up, down or sideways;
   what needs to scroll scrolls inside its own pane. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--page);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* The prototype is the screen: no page chrome around it, no explainer under
   it. What is being judged fills the window. */
.stage{padding:0;max-width:none;margin:0;height:100dvh;display:flex;overflow:hidden}
/* render() writes the frame into this wrapper, so the wrapper has to carry
   the stretch as well. */
#frame{flex:1;display:flex;min-width:0}

/* screen frame -------------------------------------------------------- */
.frame{margin:0;border:0;border-radius:0;background:#fff;
  flex:1;height:100vh;display:grid;overflow:hidden;position:relative}
.frame[data-nav="rail"]{grid-template-columns:86px 1fr;grid-template-rows:1fr}
.frame[data-nav="wide"]{grid-template-columns:180px 1fr;grid-template-rows:1fr}
.frame[data-nav="top"]{grid-template-columns:1fr;grid-template-rows:1fr}
.frame[data-nav="stack"]{grid-template-columns:72px 1fr;grid-template-rows:1fr}

/* The chrome is a grey field and the work is a white card on it. The rail is
   as wide as its items, and an item is only drawn when it is under the
   pointer or current: resting state is the field itself. */
.rail{border-right:0;background:transparent;
  display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:10px 8px}
.rail.wide{align-items:stretch;padding:10px}
.rail .ic{width:auto;height:auto;min-height:32px;border-radius:9px;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:7px 4px;color:var(--ink-3);cursor:pointer;
  transition:background .12s ease,color .12s ease}
.rail .ic:hover{background:rgba(17,17,18,.055);color:var(--ink-2)}
.rail .ic:active{background:rgba(17,17,18,.11)}
.rail .ic.on{background:rgba(17,17,18,.085);color:var(--ink)}
.rail .ic.on .cap{color:var(--ink-2)}
.rail .row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:9px;cursor:pointer;
  color:var(--ink-3);transition:background .12s ease,color .12s ease}
.rail .row:hover{background:rgba(17,17,18,.055);color:var(--ink-2)}
.rail .row.on{background:rgba(17,17,18,.085);color:var(--ink)}

/* min-height:0 is what keeps a tall screen — the code cards, a long list —
   inside the window instead of pushing the card past the bottom edge. The
   pane scrolls; the card keeps its four sides. */
.body{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.tabs{height:42px;border-bottom:0;display:flex;align-items:center;
  gap:4px;padding:0 12px;flex:0 0 auto}
.tabs button{border:0;background:transparent;font-size:12.5px;color:var(--ink-3);
  padding:6px 9px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background .12s ease,color .12s ease}
.tabs button:hover{background:rgba(17,17,18,.055);color:var(--ink-2)}
.tabs button:active{background:rgba(17,17,18,.11)}
.tabs button[aria-current="true"]{background:rgba(17,17,18,.085);color:var(--ink);font-weight:500}
.tabs .sp{flex:1}
/* The project name holds its place; the views are what gives way when the
   strip runs out of room, so they scroll instead of pushing the name off. */
.tabs .crumb{flex:0 0 auto;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .views{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;
  scrollbar-width:none}
.tabs .views::-webkit-scrollbar{display:none}
.tabs .views button{flex:0 0 auto}

/* rail with the label under the icon */
.rail.stack{align-items:stretch;padding:10px 6px}
.rail .stk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;
  border-radius:9px;font-size:10px;color:var(--ink-3);text-align:center;cursor:pointer;
  transition:background .12s ease,color .12s ease}
.rail .stk:hover{background:rgba(17,17,18,.055);color:var(--ink-2)}
.rail .stk.on{background:rgba(17,17,18,.085);color:var(--ink)}

/* how the tab strip presents itself */
.tabs[data-align="Centred"]{justify-content:center}
.tabs[data-align="Centred"] .sp{display:none}
.tabs[data-align="Spread"] button{flex:1;justify-content:center}
.tabs[data-align="Spread"] .sp{display:none}
.tabs[data-style="Underline"] button{border-radius:0}
.tabs[data-style="Underline"] button[aria-current="true"]{background:transparent;
  box-shadow:inset 0 -2px 0 var(--ink)}
.tabs[data-style="Pills"] button{border:1px solid var(--line-2);border-radius:999px}
.tabs[data-style="Pills"] button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs[data-style="Segmented"]{gap:0}
.tabs[data-style="Segmented"] button{border-radius:0;border-right:1px solid var(--line-2);background:var(--fill-2)}
.tabs[data-style="Segmented"] button:first-of-type{border-top-left-radius:6px;border-bottom-left-radius:6px}
.tabs[data-style="Segmented"] button:last-of-type{border-right:0;border-top-right-radius:6px;border-bottom-right-radius:6px}
.tabs[data-style="Segmented"] button[aria-current="true"]{background:#fff;color:var(--ink)}

/* label presets, shared by the rail and the tab strip */
.rail[data-labels-mode="Hidden"] .hi:not(.code),.tabs[data-labels-mode="Hidden"] .hi:not(.code),
.rail[data-labels-mode="Hover only"] .hi:not(.code),.tabs[data-labels-mode="Hover only"] .hi:not(.code){display:none}
.tabs[data-labels-mode="Hover only"] button:hover .hi,
.rail[data-labels-mode="Hover only"] .row:hover .hi,
.rail[data-labels-mode="Hover only"] .stk:hover .hi{display:inline}
.rail[data-labels-mode="Uppercase"] .hi,.tabs[data-labels-mode="Uppercase"] .hi{
  text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.rail[data-labels-mode="Short code"] .hi,.tabs[data-labels-mode="Short code"] .hi{letter-spacing:.04em}
/* a caption that does not fit on one line wraps rather than truncating:
   "Quantités" is a destination, not an ellipsis */
.rail .ic .cap{font-size:9px;line-height:1.2;text-align:center;max-width:100%;
  white-space:normal;overflow-wrap:normal;hyphens:none;color:var(--ink-3)}
.rail .ic.on .cap{color:var(--ink)}
.rail .code{font-size:9.5px;letter-spacing:.03em;color:inherit}
.rail .sct{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:8px 4px 2px}
.rail.stack .stk .hi{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail.wide .row .hi{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* breadcrumb, screen menu and grouped tabs live in the tab strip */
.tabs .crumb{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
/* the crumb is a .hi too, and the fidelity rule sets .hi to block: this wins
   on specificity so the folder keeps its gap from the label */
.tabs .crumb.hi{display:inline-flex}
.tabs .crumb .lu{width:13px;height:13px;flex:0 0 13px}
.tabs .crumb:hover{color:var(--ink)}
.tabs .crumb.on{cursor:default}
.tabs .crumb.on{color:var(--ink);font-weight:500}
.tabs .grp{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:0 6px 0 2px}
.tabs .div{width:1px;height:18px;background:var(--line-2);margin:0 6px}
.tabs [data-menu]{cursor:pointer}
.tabs[data-style="Top accent"] button{border-radius:0}
.tabs[data-style="Top accent"] button[aria-current="true"]{background:transparent;
  box-shadow:inset 0 2px 0 var(--ink)}
.tabs[data-style="Boxed"] button{border:1px solid transparent}
.tabs[data-style="Boxed"] button[aria-current="true"]{background:#fff;border-color:var(--line-2);
  box-shadow:0 1px 2px rgba(0,0,0,.05)}

.work{flex:1;min-height:0;display:grid;gap:var(--gap);padding:var(--gap)}
.pane{border:1px solid var(--line-2);border-radius:var(--r);background:#fff;
  display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden}
.pane > .ph{height:34px;flex:0 0 auto;border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;color:var(--ink-2)}
/* No overscroll-behavior here. A pane whose content fits still counts as a
   scroller, and `contain` on it swallows the wheel instead of handing it to
   the region behind — which is what actually scrolls on Aperçu. The window
   itself is already locked on html and body, so chaining stops there. */
.pane > .pb{flex:1;min-height:0;overflow:auto;
  padding:var(--pad);display:flex;flex-direction:column;gap:8px}
.pane.flat > .pb{padding:0}
/* The decision is the last thing in the column: it sits at the foot of the
   inspector rather than floating under the rows, so the empty space is above
   it and the button is where the thumb already is. */
.pane > .pb > .decide{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px}

/* low-fi primitives --------------------------------------------------- */
.bar{height:9px;border-radius:3px;background:var(--bar)}
.bar.lt{background:var(--fill)}
.box{background:var(--fill);border-radius:var(--r);flex:1}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.chip{height:22px;border:1px solid var(--line-2);border-radius:999px;background:var(--fill-2);
  display:inline-flex;align-items:center;gap:5px;padding:0 9px;font-size:11.5px;color:var(--ink-2)}
/* An icon chip: square, no label, the name carried by the tooltip and by the
   line beside the row. Four of them fit where two words did not. */
.chip.ico{width:26px;height:26px;padding:0;justify-content:center;border-radius:7px;flex:0 0 26px}
.chip.ico.on{border-color:var(--ink);color:var(--ink);background:var(--fill)}
.utabs{gap:5px;align-items:center}
.btnw{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--fill-2);
  display:inline-flex;align-items:center;gap:6px;padding:0 9px;font-size:12px;color:var(--ink-2)}
.btnw.solid{background:var(--bar);border-color:var(--line);color:var(--ink)}
/* The file strip sits between the pane title and the drawing: where the
   file is, what it is called, and the two applications it can be handed
   back to. One line, no card. */
.fstrip{display:flex;align-items:center;gap:8px;padding:6px 10px;flex-wrap:nowrap;
  border-bottom:1px solid var(--line-2);min-width:0}
.fstrip .btnw{flex:0 0 auto;white-space:nowrap}
.fpath{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;overflow:hidden;
  height:24px;padding:0 8px;border:1px solid var(--line-2);border-radius:5px;
  background:var(--fill-2);font-size:11.5px;color:var(--ink-2);cursor:pointer}
.fpath:hover{border-color:var(--line);background:var(--fill)}
.fpath .lu{flex:0 0 13px}
/* The folder gives way first, then the revision: the file name is what is
   being read, the folder only says where it lives. */
.fdir{font-family:var(--mono,ui-monospace,monospace);color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:0}
.fname{font-family:var(--mono,ui-monospace,monospace);color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:40px}
.frev{color:var(--ink-3);white-space:nowrap;flex:0 2 auto;overflow:hidden}
[data-fi="low"] .fdir,[data-fi="low"] .fname,[data-fi="low"] .frev{color:transparent;
  background:var(--bar);border-radius:3px;height:9px;display:inline-block;min-width:60px}
.pcard{cursor:pointer}
.pcard:hover{border-color:var(--line);background:var(--fill-2)}
.tile{border:1px solid var(--line-2);border-radius:var(--r);padding:10px;display:flex;
  flex-direction:column;gap:6px;min-width:0}
.listrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px}
.listrow.on{background:var(--fill)}
.listrow .dot{width:8px;height:8px;border-radius:50%;background:var(--bar);flex:0 0 8px}

/* Anything that does something says so under the cursor, and anything that
   cannot act yet is visibly out of reach rather than silently inert. */
[data-act],[data-screen]{cursor:pointer}
[data-act]:hover{border-color:var(--line)}
.chip[data-act]:hover,.btnw[data-act]:hover{background:var(--fill)}
.listrow[data-act]:hover{background:var(--fill-2)}
.tbl tr[data-act]:hover td{background:var(--fill-2)}
.tile[data-act].on,.chip.on{border-color:var(--ink)}
.btnw.off{opacity:.45}
input.find,input.note{border:1px solid var(--line-2);border-radius:5px;padding:5px 7px;
  font:inherit;font-size:11.5px;color:var(--ink);background:#fff;min-width:0;width:100%}
input.find{border:0;background:transparent;padding:0;width:140px}
input.find:focus,input.note:focus{outline:1px solid var(--ink);outline-offset:1px}
/* The answer to an action that leaves no other mark on the screen. */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;
  background:var(--ink);color:#fff;border-radius:7px;padding:8px 12px;font-size:12px;
  max-width:min(620px,80vw);box-shadow:0 8px 24px rgba(17,17,18,.22)}

/* The dialog sits over the frame, centred, and dims what it interrupts. */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(17,17,18,.28);
  display:grid;place-items:center;padding:24px}
.dialog{width:min(520px,92vw);background:#fff;border-radius:12px;border:1px solid rgba(17,17,18,.07);
  box-shadow:0 12px 40px rgba(17,17,18,.22);display:flex;flex-direction:column;max-height:86vh}
.dialog .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.dialog .db{display:flex;flex-direction:column;gap:9px;padding:14px;overflow:auto;overscroll-behavior:contain}
.dialog .df{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line-2)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input{border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;font:inherit;font-size:12px;color:var(--ink);background:#fff}
.fld input:focus{outline:1px solid var(--ink);outline-offset:1px}

/* A provision reads as a card, drawing first: the rule is seen before its
   number is read. The drawing touches the card's edges, the words sit under
   it, and the two numbers are not repeated — they are inside the drawing. */
.codegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}
.code{border:1px solid var(--line-2);border-radius:var(--r);display:flex;flex-direction:column;
  min-width:0;background:#fff;overflow:hidden}
.code:hover{border-color:var(--line)}
.code.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.code .draw{padding:10px;background:var(--fill-2);border-bottom:1px solid var(--line-2)}
/* multiply drops the file's white onto the tray without tinting the line. */
.code .draw img{width:100%;height:auto;display:block;mix-blend-mode:multiply}
.code .tx{padding:11px;display:flex;flex-direction:column;gap:7px;min-width:0}
.code .tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.code .src{font-size:11px;color:var(--ink-3);line-height:1.45}
.code .quote{margin:0;border-left:2px solid var(--line);padding-left:9px;
  font-size:12px;line-height:1.5;color:var(--ink-2)}
.code .state{font-size:10.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px}
.code .state::before{content:"";display:inline-block;vertical-align:middle;margin-right:5px;
  width:7px;height:7px;border-radius:50%;background:var(--bar)}
.code .state[data-state="non résolu"]::before{background:var(--hi,#b3261e)}
.code .state[data-state="conforme"]::before{background:var(--ink-3)}
.code .src-link{align-self:flex-start;text-decoration:none;color:var(--ink-2);gap:6px}
.code .src-link:hover{background:var(--fill);color:var(--ink)}
.plan{position:relative;flex:1;background:repeating-linear-gradient(0deg,var(--fill-2) 0 15px,transparent 15px 16px),
  repeating-linear-gradient(90deg,var(--fill-2) 0 15px,transparent 15px 16px);
  border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--ink-3);font-size:11.5px}
/* A card with no drawing behind it shows the picture glyph, not a sentence
   describing a picture. */
.plan.ghost{color:var(--line-2)}
.plan.ghost .lu{width:22px;height:22px;stroke-width:1.5}
/* the projects page: one ratio for every project, so the rows line up */
.pcard{cursor:pointer}
.pcard .thumb{aspect-ratio:16 / 9;flex:0 0 auto;position:relative}
.pcard .thumb.mark{display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);
  border-radius:var(--r);overflow:hidden;background:var(--tint);color:var(--mark)}
.pcard .thumb.mark span{font-size:20px;font-weight:600;letter-spacing:.04em}
.pcard .thumb .lv{position:absolute;right:6px;bottom:5px;z-index:2;font-size:10px;color:var(--ink-3);
  background:rgba(255,255,255,.86);border-radius:4px;padding:1px 5px}
/* The rendering reads as the cover once the screen is at full fidelity; the
   initials carry the card until then. */
[data-fi="high"] .pcard .thumb.cover{background-image:url(assets/baldwin-cover.png);
  background-size:cover;background-position:center 42%}
[data-fi="high"] .pcard .thumb.cover span{display:none}
[data-fi="high"] .plan.ghost.cover{background:url(assets/baldwin-cover.png) center 42%/cover no-repeat;
  border-style:solid}
[data-fi="high"] .plan.ghost.cover svg{display:none}
.pnew .newbox{aspect-ratio:16 / 9;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--fill-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:12px}
.state{display:inline-flex;align-items:center;gap:5px}
/* the home fills the width it is given, whatever the window is */
.work > div > .pane{flex:1 1 auto;min-width:0}
.state .d{width:6px;height:6px;border-radius:50%;background:var(--bar)}
.state[data-open="1"]{color:var(--hi)}
.state[data-open="1"] .d{background:var(--hi)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-weight:500;color:var(--ink-3);font-size:11px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.sheet{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--line);
  background:#fff;box-shadow:0 -8px 24px rgba(0,0,0,.07);z-index:3}
.drawer{position:absolute;top:0;right:0;bottom:0;width:360px;border-left:1px solid var(--line);
  background:#fff;box-shadow:-10px 0 28px rgba(0,0,0,.08);z-index:3}

/* fidelity ------------------------------------------------------------ */
[data-fi="high"] .bar{display:none}
[data-fi="high"] .hi{display:block}
/* A button that only exists at high fidelity still has to be a row: without
   this, display:block wins over .btnw's inline-flex and the icon falls back
   to the text baseline instead of the centre of the button. */
[data-fi="high"] .btnw.hi,[data-fi="high"] .chip.hi{display:inline-flex}
.hi{display:none}
/* The dialog and the toast are not part of the fidelity study: they are the
   application answering, so their words show at any fidelity. */
.dialog .hi,.toast.hi{display:block}
.dialog .chip .hi,.dialog .btnw .hi{display:inline}
[data-fi="high"] .lo{display:none}
[data-fi="high"] .pane{border-color:var(--line)}

/* inset card: the chrome sinks into a grey field and the work becomes one
   white card floating on it, the way a document-first app reads. The card
   is held by its own light edge and a soft drop, not by a hard border. */
.frame[data-shell="inset"]{background:var(--page-field);border-color:#eaeaec}
.frame[data-shell="inset"] .rail{background:none;border-right:0}
.frame[data-shell="inset"] .tabs{border-bottom:0}
.frame[data-shell="inset"] .body{padding:0 10px 10px}
.frame[data-shell="inset"] .work{background:#fff;border:1px solid rgba(17,17,18,.07);border-radius:12px;
  gap:0;padding:0;overflow:hidden;box-shadow:0 1px 2px rgba(17,17,18,.04),0 10px 26px rgba(17,17,18,.045)}
.frame[data-shell="inset"] .pane{border:0;border-radius:0;background:none}
.frame[data-shell="inset"] .work > div > .pane,
.frame[data-shell="inset"] .work > .pane{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.frame[data-shell="inset"] .pane.sheet,.frame[data-shell="inset"] .pane.drawer{background:#fff;
  border:1px solid rgba(17,17,18,.07);box-shadow:0 10px 26px rgba(17,17,18,.06)}

/* --------------------------------------------------------- black chrome
   The navigation goes black and the white card is the only lit surface, so
   the drawing gets all the attention. Green marks one thing: the view being
   read. The rail stays sober — where one came from is not the question. */
.frame[data-chrome="black"]{background:#141416;border-color:#141416;--vert:#C3E05A}
.frame[data-chrome="black"] .rail .ic,
.frame[data-chrome="black"] .rail .row,
.frame[data-chrome="black"] .rail .stk{color:rgba(255,255,255,.52)}
.frame[data-chrome="black"] .rail .ic:hover,
.frame[data-chrome="black"] .rail .row:hover,
.frame[data-chrome="black"] .rail .stk:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.frame[data-chrome="black"] .rail .ic.on,
.frame[data-chrome="black"] .rail .row.on,
.frame[data-chrome="black"] .rail .stk.on{background:rgba(255,255,255,.12);color:#fff}
.frame[data-chrome="black"] .rail .ic.on .cap{color:rgba(255,255,255,.72)}
.frame[data-chrome="black"] .tabs button{color:rgba(255,255,255,.5)}
.frame[data-chrome="black"] .tabs button:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
/* The view being read is the one green thing in the chrome. Dark ink on it,
   because the green is light enough to read against black but not to carry
   white text. */
.frame[data-chrome="black"] .tabs button[aria-current="true"]{background:var(--vert);color:#111112;font-weight:600}
.frame[data-chrome="black"] .tabs .crumb{color:rgba(255,255,255,.5)}
.frame[data-chrome="black"] .tabs .crumb.on{color:#fff}
.frame[data-chrome="black"] .tabs .div,
.frame[data-chrome="black"] .tabs .sep{background:rgba(255,255,255,.16)}
/* The card is the same white card; only what holds it changes. */
.frame[data-chrome="black"][data-shell="inset"] .work{border-color:rgba(255,255,255,.1);
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35)}
.frame[data-chrome="black"] .rg::before{color:rgba(255,255,255,.45)}

/* High fidelity swaps the hatch for the drawing it stands for: the floor
   plan, the elevation, or the massing view, all from the platform assets. */
[data-fi="high"] .plan{background:none;border-style:solid}
[data-fi="high"] .plan[data-img]{background-repeat:no-repeat;background-position:center;
  background-size:cover;border-color:var(--line)}
[data-fi="high"] .plan[data-img] > .hi{display:none}
/* --plan is set on the frame from the level the tabs are on: one sheet per
   level, not one picture relabelled. */
[data-fi="high"] .plan[data-img="plan"]{background-image:var(--plan,url(assets/plan-etage.jpg))}
/* Une vignette est recadrée sur une boîte mesurée sur l'étage type: elle lit
   donc toujours cette feuille-là, pas celle du niveau courant, sinon le
   cadrage tombe à côté de l'unité. */
[data-fi="high"] .plan[data-img="unit"]{background-image:url(assets/plan-etage.jpg)}
[data-fi="high"] .plan[data-img="massing"]{background-image:url(assets/skp-ensemble.jpg)}
/* The opening schedules: the sheets a window or door size is read from,
   which is what the Ouvertures tab is about — not another floor plan. */
[data-fi="high"] .plan[data-img="openings"]{background-image:url(assets/ouvertures-fenetres.jpg);
  background-size:contain;background-color:#fff}
[data-fi="high"] .plan[data-img="doors"]{background-image:url(assets/ouvertures-portes.jpg);
  background-size:contain;background-color:#fff}

/* The consultants' sheets sit over the floor plan in one shared coordinate
   space: the plan box takes the drawing's own aspect, so the drawing fills
   it without being stretched and a percentage means the same thing on every
   layer. The plan itself is read in black and white; the sheets keep their
   own ink, since their colour is what tells them apart. */
.plan.align{aspect-ratio:1280 / 1160;height:auto;flex:0 0 auto;overflow:hidden}
[data-fi="high"] .plan.align[data-img]{background:none}
[data-fi="high"] .plan.align[data-img="plan"]::before{content:"";position:absolute;inset:0;
  background:var(--plan,url(assets/plan-etage.jpg)) center/contain no-repeat;filter:grayscale(1)}
/* Vectors over the picture, not instead of it: a pass takes a few seconds
   on a permit sheet, and the pane must never be empty while it runs. The
   canvas is transparent until the sheet lands on it, then it covers the
   JPEG exactly, in the same box, so every overlay keeps its coordinates. */
.plan canvas.sheetpdf{position:absolute;inset:0;width:100%;height:100%;display:block;
  z-index:0;filter:grayscale(1)}
.plan canvas.sheetpdf[data-ready="1"]{background:#fff}
/* While the pass runs, the pane says so where the file name is. */
.pane[data-pdf="busy"] .fpath::after{content:"rendu vectoriel…";margin-left:auto;
  color:var(--ink-3);font-size:10.5px}
/* The thumbnails are crops of the same plan, so they read the same way. */
[data-fi="high"] .plan[data-img="plan"]:not(.align){filter:grayscale(1)}
.plan .lay{position:absolute;display:none;background-repeat:no-repeat;
  background-size:contain;background-position:center;pointer-events:none;z-index:2}
[data-fi="high"] .plan[data-img] .lay{display:block}
.plan .lay[data-lay="arp"]{background-image:url(assets/arp-site.png)}
/* The landscaping sheet is drawn the other way round from the surveyor's:
   the 8,26 m drive island reads (.375,.313) on one and (.354,.276) on the
   other once both are measured against their property lines. The file stays
   as extracted; the half turn happens here. */
.plan .lay[data-lay="pay"]{background-image:url(assets/paysage.png);transform:rotate(180deg)}
/* One typology, one colour, laid on the unit it belongs to. */
.plan .utagsvg{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
.plan .utagsvg polygon{opacity:.45;mix-blend-mode:multiply}
/* The 2D pane is a window onto a sheet that is larger than it: the drawing
   and everything laid over it move and scale together inside .vp, so a
   percentage keeps meaning the same thing at every zoom. */
/* Same box as the model pane beside it: the field is the pane, the drawing
   is centred in it, and neither drawing states an edge of its own. The
   field is the sheet's own white — the paper of these plans is #fff — so
   the drawing has no visible edge and the pane reads as one surface. */
.vp{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;background:#fff}
.vp.drag{cursor:grabbing}

/* Zoom belongs on the drawing it zooms, and only while the hand is there.
   One bar of glass at the foot of each pane: it leaves 1.6 s after the last
   gesture and returns at the first movement over the sheet, so at rest the
   pane is nothing but drawing. */
.pb.zone{position:relative}
.zbar{position:absolute;left:50%;bottom:12px;z-index:4;transform:translateX(-50%);
  height:34px;display:flex;align-items:center;gap:4px;padding:0 7px;border-radius:999px;
  border:1px solid var(--line-2);background:color-mix(in srgb, var(--paper) 58%, transparent);
  backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
  box-shadow:0 1px 4px rgba(0,0,0,.07);opacity:1;transition:opacity .4s,transform .4s}
.zbar.gone{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}
.zslider{appearance:auto;-webkit-appearance:auto;width:112px;accent-color:var(--ink);
  cursor:ew-resize;margin:0}
.zread{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:40px;
  text-align:center}
.zsep{width:1px;height:16px;background:var(--line-2)}
.zb{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;color:var(--ink-2);cursor:pointer;flex:0 0 26px}
.zb:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.zb svg{width:14px;height:14px}
/* The two drawing panes are the thing being compared, so their edge is
   stated instead of implied — including in the inset shell, where panes
   otherwise give up their border to the grid lines. */
.pane.drawing{border:1px solid #b4b4b7;border-radius:9px;
  box-shadow:0 1px 2px rgba(17,17,18,.06),0 6px 16px rgba(17,17,18,.07)}
.frame[data-shell="inset"] .pane.drawing{border:1px solid #b4b4b7;border-radius:9px;background:#fff}
.frame[data-chrome="black"] .pane.drawing{border-color:rgba(255,255,255,.22);
  box-shadow:0 2px 14px rgba(0,0,0,.45)}
/* The sheet's own box is sized in script to fit this one, so 0–1 on the
   drawing stays 0–1 on the element the overlays are drawn in. */
.vp > .plan{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
  border:0;background-color:#fff}
/* The selected unit, drawn over the sheet and never into it: a thin outline
   and a light wash, both in the one accent the screen already uses. */
.umark{position:absolute;inset:0;z-index:3;overflow:visible}
.umark polygon.hit{fill:transparent;pointer-events:auto;cursor:pointer}
.umark polygon.on{fill:rgba(139,160,15,.16);stroke:#8ba00f;stroke-width:1.6;
  vector-effect:non-scaling-stroke;pointer-events:auto;cursor:pointer}
.ulabel{position:absolute;z-index:4;pointer-events:none;white-space:nowrap;
  font-weight:600;color:#4c5906;background:rgba(255,255,255,.88);
  border:1px solid rgba(139,160,15,.5);border-radius:4px;padding:1px 4px;line-height:1.25}
/* In wireframe fidelity the mark keeps its shape and loses its words, the
   way every other label on the screen does. */
[data-fi="low"] .ulabel{display:none}
/* The live SketchUp export fills its pane. The previous facade JPG stays
   behind it only while the 58 MB GLB loads, or if WebGL cannot start. */
/* No border of its own: the pane around it now states the edge, and two
   boxes one inside the other state it twice. */
.model3d{position:relative;flex:1;min-height:0;overflow:hidden;
  background:#f1f3f4 url(assets/skp-facade.jpg) center/contain no-repeat}
.model3d-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
  opacity:0;cursor:grab;touch-action:none;transition:opacity .18s ease}
.model3d-canvas:active{cursor:grabbing}
.model3d[data-state="ready"]{background:#f1f3f4}
.model3d[data-state="ready"] .model3d-canvas{opacity:1}
.model3d-status{position:absolute;left:50%;bottom:12px;z-index:2;transform:translateX(-50%);
  border:1px solid rgba(17,17,18,.12);border-radius:999px;background:rgba(255,255,255,.9);
  padding:5px 9px;color:var(--ink-2);font-size:11px;white-space:nowrap;backdrop-filter:blur(8px)}
.model3d[data-state="ready"] .model3d-status{visibility:hidden;opacity:0}
.model3d[data-state="error"] .model3d-status{color:#8b2e2e;border-color:rgba(139,46,46,.25)}
.model3d-hint{position:absolute;left:10px;top:10px;z-index:2;border-radius:5px;
  background:rgba(255,255,255,.84);padding:4px 7px;color:var(--ink-2);font-size:10.5px;
  pointer-events:none;backdrop-filter:blur(8px)}
.model3d-selection{position:absolute;left:10px;top:40px;z-index:2;padding:4px 7px;
  background:rgba(255,255,255,.9);font-size:11px;color:var(--ink-2);border-radius:5px;
  pointer-events:none;backdrop-filter:blur(8px)}
[data-fi="low"] .model3d-canvas,[data-fi="low"] .model3d-hint,[data-fi="low"] .model3d-selection,
[data-fi="low"] .model3d-status{display:none}
[data-fi="high"] .btnw.solid{background:var(--hi);color:#fff;border-color:var(--hi)}
/* Ready to be saved: the project's green, the same one the selected level
   wears, so the one colour means "this is live" everywhere. */
[data-fi="high"] .btnw.solid.go{background:#8ba00f;border-color:#8ba00f;color:#fff}
[data-fi="high"] .listrow.on{background:#eef1e0}
[data-fi="high"] .listrow .dot{background:#8ba00f}

/* region tagging ------------------------------------------------------ */
.rg{position:relative}
[data-labels="true"] .rg{outline:1px dashed #b9b9ff;outline-offset:-1px}
[data-labels="true"] .pane.rg,[data-labels="true"] .rail.rg,[data-labels="true"] .tabs.rg{padding-top:14px}  /* room for the tag */
[data-labels="true"] .rg::after{content:attr(data-rg);position:absolute;top:0;left:0;z-index:4;
  background:#4b4bd6;color:#fff;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 5px;border-bottom-right-radius:4px;pointer-events:none}
[data-isolate]:not([data-isolate="none"]) .rg{opacity:.12;filter:grayscale(1)}
[data-isolate]:not([data-isolate="none"]) .rg.solo{opacity:1;filter:none;outline:1px solid #4b4bd6}
.step{position:absolute;z-index:5;width:19px;height:19px;border-radius:50%;background:var(--hi);
  color:#fff;font-size:11px;display:none;place-items:center;top:6px;right:6px}
[data-journey="true"] .step{display:grid}

/* journey strip ------------------------------------------------------- */
.journey{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 14px}
.journey h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .st{flex:1;min-width:150px;border:1px solid var(--line-2);border-radius:6px;padding:9px 10px;margin-right:18px;position:relative}
.flow .st:last-child{margin-right:0}
.flow .st::after{content:"";position:absolute;right:-13px;top:50%;width:8px;height:8px;
  border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.flow .st:last-child::after{display:none}
.flow .st.on{border-color:var(--hi)}
.flow .st b{display:block;font-size:12.5px;font-weight:600}
.flow .st span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.flow .st em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:4px;
  letter-spacing:.06em;text-transform:uppercase}
.flow .st .num{position:absolute;top:-8px;left:9px;width:17px;height:17px;border-radius:50%;
  background:var(--hi);color:#fff;font-size:10.5px;display:grid;place-items:center}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;background:var(--bar);display:inline-block}
.legend i.dash{background:none;border:1px dashed #b9b9ff}
svg.lu{width:14px;height:14px;stroke-width:1.8;color:currentColor}
</style>
</head>
<body>
<div class="stage">
  <div id="frame"></div>
</div>

<script src="vendor/lucide/lucide.min.js"></script>
<script src="vendor/dialkit/browser.global.js"></script>
<script>
/* ---------------------------------------------------------------- state */

const V = {
  screen: "Unités",
  fidelity: "low",
  labels: true,
  journey: true,
  density: "comfortable",
  shell: "Inset card",
  chrome: "Light",
  homeLayout: "Card grid",
  isolate: "none",
  /* One glyph per screen, written by the panel. Keyed by the French screen
     name, filled from NAV_ICONS which is declared further down the file. */
  icons: {},

  /* Everything below is what the screen is actually doing, as opposed to how
     it is drawn: which view, which row, which article, what has been decided.
     Every control on the screen writes one of these. */
  project: "Le Baldwin III",
  view: {},          // screen → index of the view in its tab strip
  sel: {},           // screen → index of the selected row
  article: 2,        // which article is open under Zonage et code
  utab: 1,           // which tab of the unit inspector
  zoom: 100,         // plan zoom, in percent
  /* Where the sheet has been dragged to inside the 2D pane, in pixels of
     the pane. Zoom and pan are one pair: the wheel writes both. */
  pan: { x: 0, y: 0 },
  /* How close the camera is to the model, 0 far to 100 near. The slider on
     the right edge writes it; orbiting or wheeling writes it back. */
  mzoom: 40,
  /* The zoom bars have no stored state: they show themselves when the hand
     is on the drawing and leave on their own. */
  /* "image" reads the exported JPEG of the sheet, "vector" reads the PDF of
     the same crop through pdf.js and re-renders it at the zoom in use. */
  planSrc: "image",
  query: "",         // the text in the list search
  reason: null,      // the reason picked for the decision being recorded
  note: "",          // the sentence written for the next person
  settled: {},       // "screen · row" → the reason it was settled with
  toast: null,       // what the last action answered
  /* The new-project dialog, while it is open: what has been typed, which
     kinds of file the office folder will be read for, and what is missing. */
  dialog: null,
  /* Where the two drawings this screen reads actually sit. The folder is on
     the office server, not an upload: renaming here changes what fitte
     looks for, never the file itself. */
  docs: {
    dir: "\\\\serveur-bureau\\Projets\\2026\\BAL3\\Dessins\\",
    names: {},   // level → the drawing file read for it, once it was changed
    skpDir: "\\\\serveur-bureau\\Projets\\2026\\BAL3\\Maquette\\",
    skp: "BAL3_Maquette_R07.skp",
  },
  /* Which typologies are asked for. Nothing is on: the plan is read in black
     and white until someone asks a question of it. Keyed by TYPOS, written
     out here because TYPOS is declared further down the file. */
  typo: { "3½": false, "4½": false, "5½": false },
  nav: { fidelity: "inherit", layout: "Icon rail + tabs" },
  header: { fidelity: "inherit", layout: "Title + actions" },
  list: { fidelity: "inherit", layout: "Vertical list" },
  content: { fidelity: "inherit", layout: "Two panes" },
  /* Which typologies are asked for. None asked for is the plain black and
     white plan, which is how the drawing is read by default. */
  typo: { "3½": false, "4½": false, "5½": false },
  inspector: { fidelity: "inherit", layout: "Right panel" },
  footer: { fidelity: "inherit", layout: "Impact strip" },
  lay: { arp: { on: true, opacity: 55, scale: 100, x: 0, y: 0 },
    pay: { on: false, opacity: 55, scale: 100, x: 0, y: 0 } },
};

const icon = (n) => `<svg class="lu"><use href="#lu-${n}"></use></svg>`;

/* Lucide ships as a sprite-less library, so the icons are stamped once into
   a hidden sprite and referenced by id afterwards. */
function sprite() {
  const names = ["home", "folder", "image", "layout-grid", "layers", "table", "scale", "git-compare", "calendar-check",
    "file", "box", "pen-line", "chevron-right", "chevron-left", "chevron-down", "search", "plus", "minus", "maximize", "minimize",
    "external-link", "check", "alert-triangle", "info", "clock", "list", "circle", "x", "link",
    /* the rail's alternatives, one shortlist per screen; see NAV_ICONS */
    "gauge", "building-2", "clipboard-list", "grid-2x2", "bed-double", "door-open", "ruler",
    "sigma", "calculator", "chart-column", "percent", "calendar-clock", "timer", "list-checks",
    "flag", "folder-tree", "file-stack", "hard-drive"];
  const defs = names.map((n) => {
    const node = lucide.icons[toPascal(n)];
    if (!node) return "";
    const inner = node[2].map(([tag, attrs]) =>
      `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`).join("");
    return `<symbol id="lu-${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-linecap="round" stroke-linejoin="round">${inner}</symbol>`;
  }).join("");
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("style", "display:none");
  s.innerHTML = defs + '<symbol id="x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#111"/></symbol>';
  document.body.append(s);
}
const toPascal = (n) => n.split("-").map((p) => p[0].toUpperCase() + p.slice(1)).join("");

/* --------------------------------------------------------------- screens */

const SCREENS = {
  "Projets": { icon: "folder", regions: ["header", "content"], steps: {}, home: true, index: true },
  "Aperçu": {
    icon: "layout-grid",
    regions: ["header", "content", "inspector"],
    steps: { content: 1, inspector: 2 },
  },
  "Unités": {
    icon: "layers",
    regions: ["header", "list", "content", "inspector", "footer"],
    steps: { list: 1, content: 2, inspector: 3, footer: 4 },
  },
  "Quantités": { icon: "table", regions: ["header", "content"], steps: { header: 1, content: 2 } },
  /* Neither Rules nor Coordination is a destination. An article is read
     against a number the drawings produced, so it lives in the overview; a
     crossing lands on one unit, so it lives in that unit's inspector. */
  "Suivi": { icon: "calendar-check", regions: ["header", "content", "inspector"], steps: { inspector: 1, content: 2 } },
  /* The rail offered Fichiers before the screen existed, so the entry threw
     on click. It is a screen now: what was read, and when. */
  "Fichiers": { icon: "file", regions: ["header", "content"], steps: {} },
};

/* ------------------------------------------------------- what the screens
   are reading. One table per question, so a control can change the answer
   instead of only changing a border colour. */

/* Le Baldwin III is eight storeys. Level 1 is ground-floor commerce, no
   residential suites at all (assets/plan-niveau-1.jpg). Levels 2–7 repeat
   the typical floor, fourteen units read off BAL3_Étage_Type.dwg. Level 8
   is the real penthouse, three suites visible on its sheet. 87 units in
   all. The typical floor's units come from BAL3_Étage_Type.dwg, so a
   level in 2–7 only renumbers them; level 8 has its own three. */
/* ty, net pi², and the unit's box on assets/plan-etage.jpg normalised 0–1,
   the same numbers the platform uses. */
const TYPICAL = [
  ["3½", 707, [0.3953, 0.5862, 0.1203, 0.1586]], ["3½", 727, [0.5063, 0.0328, 0.1141, 0.1552]],
  ["3½", 753, [0.6281, 0.0328, 0.1172, 0.1552]], ["3½+bureau", 880, [0.1609, 0.7293, 0.1266, 0.2172]],
  ["4½", 968, [0.2203, 0.5207, 0.1422, 0.1724]], ["4½", 1012, [0.2203, 0.3483, 0.1422, 0.1724]],
  ["4½", 1170, [0.4891, 0.2259, 0.1984, 0.1552]], ["4½", 1203, [0.2203, 0.1362, 0.1625, 0.2034]],
  ["5½", 1249, [0.303, 0.0276, 0.1969, 0.1603]], ["5½", 1350, [0.0266, 0.6966, 0.1859, 0.25]],
  ["4½", 1380, [0.3938, 0.3155, 0.1438, 0.2638]], ["5½", 1470, [0.6953, 0.1966, 0.2719, 0.1845]],
  ["4½+bureau", 1494, [0.7516, 0.0328, 0.2156, 0.1741]], ["5½", 1626, [0.2953, 0.7293, 0.2016, 0.2172]],
];

/* A unit reads as its base typology: the den or the office does not make a
   fourth colour on the plan. */
const TYPOS = ["3½", "4½", "5½"];
const TYPO_INK = { "3½": "#d98b8b", "4½": "#6fa9d8", "5½": "#78c47f" };
const LEVELS = [1, 2, 3, 4, 5, 6, 7, 8];
const baseTypo = (ty) => ty.split("+")[0];


/* One drawing per level, the sheets the permit set actually carries: a level

const polysForPane = () => {
  const lv = currentLevel();

function polyBounds(poly) {
  const xs = poly.map((p) => p[0]), ys = poly.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  return [x0, y0, x1 - x0, y1 - y0];
}


/* Frames one box with air around it: the drawing is scaled so the box fills
   the element, then slid so the box sits in the middle. */
function crop(box, pad = 0.45, axis = "width") {
  const [x, y, w, h] = box;
  const fw = Math.min(1, w * (1 + pad * 2));
  const fh = Math.min(1, h * (1 + pad * 2));
  const px = Math.max(0, Math.min(1 - fw, x + w / 2 - fw / 2));
  const py = Math.max(0, Math.min(1 - fh, y + h / 2 - fh / 2));
  /* A wide, short box reads better scaled off its height: the unit fills the
     strip and the neighbouring units supply the context on either side. */
  const size = axis === "height" ? `auto ${(100 / fh).toFixed(1)}%` : `${(100 / fw).toFixed(1)}% auto`;
  return `background-size:${size};`
    + `background-position:${(px / (1 - fw) * 100).toFixed(1)}% ${(py / (1 - fh) * 100).toFixed(1)}%`;
}

/* Where each consultant's building sits inside its own sheet, measured once
   and normalised 0–1, with the sheet's own pixel ratio beside it. The
   surveyor's box is the teal implantation outline; the landscaping box is
   the same outline carried across by the two property lines, which agree to
   within half a percent on the drive island. */
/* Named apart from SHEETS above: that one is the project's own sheet per
   level, this one is where a consultant's drawing sits inside its sheet. */
const OVERLAY_SHEETS = {
  arp: { box: [.159, .246, .818, .814], ratio: 1650 / 1560 },
  pay: { box: [.138, .224, .808, .796], ratio: 835 / 800 },
};
/* The floor plan's own building, and the plan's pixel ratio. */
const BASE_BOX = [.014, .019, .978, .961];
const BASE_RATIO = 1280 / 1160;

/* Places one sheet so its building lands on the floor plan's building, then
   adds the nudge the panel holds. One scale for both axes: a sheet is never
   stretched to fit, it is placed and then nudged. The ground sheets cover
   the podium, so they bound the typical floor rather than trace it. */
function sheetStyle(key) {
  const L = V.lay[key], S = OVERLAY_SHEETS[key];
  const [bx0, by0, bx1, by1] = BASE_BOX;
  const [sx0, sy0, sx1, sy1] = S.box;
  /* The width the sheet needs so its building spans the plan's, and the
     height that width implies at the sheet's own proportions. */
  const w = (bx1 - bx0) / (sx1 - sx0) * L.scale / 100;
  const h = w * BASE_RATIO / S.ratio;
  const left = bx0 - sx0 * w + L.x / 100;
  /* Centred on the building vertically, since the height is no longer free. */
  const top = (by0 + by1) / 2 - (sy0 + sy1) / 2 * h + L.y / 100;
  return `left:${(left * 100).toFixed(2)}%;top:${(top * 100).toFixed(2)}%;`
    + `width:${(w * 100).toFixed(2)}%;height:${(h * 100).toFixed(2)}%;opacity:${L.opacity / 100}`;
}

const layersHTML = () => ["arp", "pay"].filter((k) => V.lay[k].on)
  .map((k) => `<div class="lay" data-lay="${k}" style="${sheetStyle(k)}"></div>`).join("");

/* The plan is read in black and white. Colour only arrives when a typology
   is asked for, and then only on the units that answer. */
const typosOn = () => TYPOS.filter((t) => V.typo[t]);
const typoHTML = () => {
  const on = typosOn();
  if (!on.length) return "";
  const polys = polysForPane();
  /* Laid on the sheet the level tabs opened, so the fill sits on the unit
     and not on the courtyard beside it. */
  const parts = TYPICAL.map(([ty], i) => {
    const t = baseTypo(ty);
    if (!on.includes(t)) return "";
    const poly = polys[i];
    if (!poly) return "";
    return `<polygon points="${poly.map(([x, y]) => `${x},${y}`).join(" ")}" fill="${TYPO_INK[t]}"></polygon>`;
  }).join("");
  return parts ? `<svg class="utagsvg" viewBox="0 0 1 1" preserveAspectRatio="none">${parts}</svg>` : "";
};

/* The selected unit, outlined on the sheet. Every other unit keeps an
   invisible hit box, so the plan can be clicked the way the list can: the
   journey says the unit is chosen in the list or on the drawing itself. */
function unitMarkHTML() {
  const rows = rowsOf("Unités");
  const sel = selIndex("Unités");
  const polys = polysForPane();
  const seen = new Set();
  const zs = V.zoom / 100;
  const parts = rows.map((r, i) => {
    const u = r[2];
    if (seen.has(u)) return "";   // Tous les niveaux repeats the same plan
    seen.add(u);
    const poly = polys[u];
    if (!poly) return "";
    const on = i === sel;
    /* The whole pane is scaled by a CSS transform, which thickens a stroke
       along with everything else; dividing by the zoom keeps the outline
       the hairline it is meant to be at any magnification. */
    return `<polygon class="${on ? "on" : "hit"}" points="${poly.map(([x, y]) => `${x},${y}`).join(" ")}"
      style="stroke-width:${(1.6 / zs).toFixed(3)}px" data-act="row" data-value="${i}"><title>${r[0]} · ${r[1]}</title></polygon>`;
  }).join("");

  /* The label is HTML, not SVG text: the overlay is stretched to the sheet's
     own ratio, and a glyph inside it would be stretched with it. Its size is
     divided by the zoom so it stays a label and does not grow into a sign. */
  const cur = rows[sel];
  const z = V.zoom / 100;
  const tag = cur && polys[cur[2]] ? (() => {
    const [x, y, , h] = polyBounds(polys[cur[2]]);
    const below = y + h + 0.06 < 1;
    return `<div class="ulabel" data-side="${below ? "below" : "above"}" style="left:${(x * 100).toFixed(2)}%;`
      + `top:${((below ? y + h : y) * 100).toFixed(2)}%;`
      + `font-size:${(11 / z).toFixed(2)}px;transform:translateY(${below ? 2 / z : -(14 / z)}px)">`
      + `${cur[0]} · ${cur[1]}</div>`;
  })() : "";
  return `<svg class="umark" viewBox="0 0 1 1" preserveAspectRatio="none">${parts}</svg>${tag}`;
}



/* The rail glyph is a decision, not a default: what an architect reads in
   two seconds for "the project at a glance", "the floor and its units",
   "the numbers", "what is due", "where the files are". Each screen carries
   its own shortlist, and the panel picks one per screen; the first of each

const NAV_ICONS = {
  "Aperçu": [["Dashboard", "layout-grid"], ["Gauge", "gauge"], ["Building", "building-2"],
    ["Zoning scale", "scale"], ["Checklist", "clipboard-list"]],
  "Unités": [["Layers", "layers"], ["Floor grid", "grid-2x2"], ["Rooms", "bed-double"],
    ["Doors", "door-open"], ["Ruler", "ruler"]],
  "Quantités": [["Table", "table"], ["Sum", "sigma"], ["Calculator", "calculator"],
    ["Bar chart", "chart-column"], ["Percent", "percent"]],
  "Suivi": [["Calendar check", "calendar-check"], ["Calendar clock", "calendar-clock"],
    ["Timer", "timer"], ["Checklist", "list-checks"], ["Flag", "flag"]],
  "Fichiers": [["File", "file"], ["Folder", "folder"], ["Folder tree", "folder-tree"],
    ["File stack", "file-stack"], ["Office server", "hard-drive"]],
};
const NAV = Object.keys(NAV_ICONS);

/* The cross-screen journey the prototype is built around. Everything else

const JOURNEY = [
  { n: 1, t: "Un dessin a été enregistré", d: "La page du projet dit ce qui a bougé depuis la dernière lecture.", s: "Aperçu" },
  { n: 2, t: "Ouvrir l'unité qui a bougé", d: "Choisissez-la dans la liste, ou sur le plan lui-même.", s: "Unités" },
  { n: 3, t: "Voir les deux dessins à la fois", d: "Le plan 2D à côté de la maquette 3D, l'écart mesuré.", s: "Unités" },
  { n: 4, t: "Décider, et dire pourquoi", d: "La décision ne s'enregistre pas sans raison.", s: "Unités" },
  { n: 5, t: "Vérifier ce que ça brise", d: "Quel article, quel conflit, quelle échéance.", s: "Aperçu" },

/* ------------------------------------------------------------- fidelity */

/* Isolation keeps the frame intact and fades everything that is not the
   region under study, so a variant is judged in place rather than alone. */
const solo = (region) => (V.isolate !== "none" && V.isolate === region ? "solo" : "");

/* The panel speaks French; the data attribute stays English because the
   stylesheet keys off it. */
const fiOf = (region) => (V[region] && V[region].fidelity !== "inherit" ? V[region].fidelity : V.fidelity);
const wrap = (region, label, html, step) =>
  `<div class="rg" data-rg="${label}" data-fi="${fiOf(region)}" style="display:contents">${html}</div>`
    .replace("</div>", "</div>"); // regions are grid children; see region()

/* A region is a grid child, so the tag and fidelity attributes live on the
   element itself rather than on a wrapper that would break the layout. */
function region(name, label, inner, step) {
  const s = step ? `<span class="step">${step}</span>` : "";
  return `<section class="pane rg ${solo(name)}" data-rg="${label}" data-fi="${fiOf(name)}" data-region="${name}">${s}${inner}</section>`;
}

const bars = (n, w = [100, 70, 85]) =>
  Array.from({ length: n }, (_, i) => `<div class="bar" style="width:${w[i % w.length]}%"></div>`).join("");

/* ------------------------------------------------------- what is selected
   The tab strip, the list and the chips all read from here, so a click
   changes the answer on the screen and not just the border of the control. */

const viewsOf = (screen) => CONTEXT[screen] || [];
/* Units opens on level 5: that is the floor every example here is about. */
const defaultView = (screen) => (screen === "Unités" ? Math.max(0, LEVELS.indexOf(5)) : 0);
const viewIndex = (screen) => Math.min(V.view[screen] === undefined ? defaultView(screen) : V.view[screen],
  Math.max(0, viewsOf(screen).length - 1));
const viewOf = (screen) => viewsOf(screen)[viewIndex(screen)];

/* The rows the current screen is showing, after its view and its search. */
function rowsOf(screen) {
  let all = screen === "Unités" ? (UNITS_BY_LEVEL[viewOf(screen)] || UNITS_BY_LEVEL["Niveau 5"]) : [];
  /* No typology asked for means the whole level; asking for one narrows the
     list to it, the same units the plan then colours. */
  if (screen === "Unités" && typosOn().length) all = all.filter((r) => typosOn().includes(r[3]));
  const q = V.query.trim().toLowerCase();
  return q ? all.filter((r) => r.join(" ").toLowerCase().includes(q)) : all;
}

const selIndex = (screen) => {
  const n = rowsOf(screen).length;
  if (!n) return -1;
  return Math.min(V.sel[screen] === undefined ? 0 : V.sel[screen], n - 1);
};
const selRow = (screen) => rowsOf(screen)[selIndex(screen)];
const settleKey = () => `${V.screen} · ${(selRow(V.screen) || [""])[0]}`;
/* A decision is saveable as soon as there is something to save: a reason
   from the list, or a sentence written by hand. */
const saveReady = () => Boolean(V.reason || V.note.trim());
function paintSaveButton() {
  const b = document.querySelector("[data-save]");
  if (!b) return;
  const ok = saveReady();
  b.classList.toggle("go", ok);
  b.classList.toggle("off", !ok);
  b.title = ok ? "Enregistrer" : "Choisissez une raison ou écrivez une phrase";
}

/* A control is a control: it says what it does and it is clickable. */
const act = (name, value) => `data-act="${name}"${value === undefined ? "" : ` data-value="${value}"`}`;

/* The drawing the screen is reading right now. The level tabs own it, so
   every other screen shows the same level's sheet rather than a stand-in. */
const sheet = () => SHEETS[viewOf("Unités")] || SHEETS["Tous les niveaux"];
const dwgName = () => V.docs.names[viewOf("Unités")] || sheet().file;

/* What a drawing pane says about its file: where it is, what it is called,
   which revision was read. The button that hands the drawing back to the
   application sits in the pane header, a thumb away from the drawing
   instead of up in the screen header. */
const HOSTS = { plan: ["autocad", "Ouvrir dans AutoCAD"], model: ["sketchup", "Ouvrir dans SketchUp"] };

function hostButton(kind) {
  const [a, label] = HOSTS[kind];
  return `<span class="btnw" ${act(a)} title="${label}">${icon("external-link")}
    <span class="lo bar" style="width:46px"></span><span class="hi">${label}</span></span>`;
}

function fileStrip(kind) {
  const dir = kind === "plan" ? V.docs.dir : V.docs.skpDir;
  const name = kind === "plan" ? dwgName() : V.docs.skp;
  const stamp = kind === "plan" ? `${sheet().rev} · ${sheet().date}` : "R07 · 22 Oct";
  /* The chip itself is never a .hi: that class switches display, which
     would stop it being a flex row and let the path spill out of it. */
  return `<div class="fstrip rg" data-rg="fichier">
    <span class="fpath" ${act("renamefile", kind)} title="${dir}${name}  ·  changer le dossier ou le nom">
      ${icon("file")}<span class="lo bar" style="width:84px"></span>
      <span class="hi fdir">${dir}</span><span class="hi fname">${name}</span>
      <span class="hi frev">${stamp}</span>${icon("pen-line")}</span>
  </div>`;
}

/* ------------------------------------------------------------ code cards

   the card carries both, plus the sentence and the page it comes from. The
   link is a real link: the regulation is read where it is published. */

const unresolvedCount = () => ARTICLES.filter((a) => a.state === "non résolu").length;

/* The chain of authority for the one article that has no number: the law
   enables the bylaw, the bylaw carries the article that is measured. */
const chainSVG = () => `<svg viewBox="0 0 300 96" style="width:100%;height:auto">
  ${[["Loi", "A-19.1"], ["Règlement", "01-277"], ["Article", "art. 9, 22"]].map(([t, n], i) => {
    const x = 6 + i * 98;
    return `<rect x="${x}" y="24" width="84" height="44" rx="5" fill="#fff"
        stroke="var(--ink)" stroke-width="${i === 0 ? 1.4 : .9}"/>
      <text x="${x + 42}" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${t}</text>
      <text x="${x + 42}" y="59" text-anchor="middle" font-size="10"
        font-family="ui-monospace,Menlo,monospace" fill="var(--ink-2)">${n}</text>
      ${i < 2 ? `<path d="M${x + 88} 46 h6 m-2.5 -3 l3 3 -3 3" stroke="var(--ink)" fill="none" stroke-width="1"/>` : ""}`;
  }).join("")}
  <text x="6" y="88" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="var(--ink-3)">habilite</text>
</svg>`;

/* A1: the drawing opens the card and touches its edges. The two numbers are

function codeCard(a, i) {

      <a class="btnw src-link hi" href="${a.url}" target="_blank" rel="noreferrer"
         ${act("source")} data-value="${a.id}">${icon("external-link")}Lire le texte officiel</a>

}

/* ------------------------------------------------------------ the parts */

const railIcons = () => V.nav.icons === "Rail and tabs" || V.nav.icons === "Rail only";
const tabIcons = () => V.nav.icons === "Rail and tabs" || V.nav.icons === "Tabs only";

function navHTML() {
  if (SCREENS[V.screen].index) return "";
  const mode = V.nav.layout;
  if (mode === "Top bar only" || mode === "Tabs only, no rail") return "";
  const sections = mode === "Wide rail with sections";
  const wide = mode === "Wide rail with labels" || sections;
  const stack = mode === "Rail with labels under icons";
  const ic = railIcons();
  const items = NAV.map((name, i) => {
    const on = name === V.screen ? "on" : "";
    const g = ic ? icon(navIcon(name)) : "";
    const text = `<span class="hi">${navLabel(name, i)}</span>`;
    const head = sections && SECTIONS[i] ? `<div class="sct hi">${SECTIONS[i]}</div>` : "";
    if (wide) return `${head}<div class="row ${on}" data-screen="${name}" title="${name}">${g}<span class="lo bar" style="width:70%"></span>${text}</div>`;
    if (stack) return `<div class="stk ${on}" data-screen="${name}" title="${name}">${g}<span class="lo bar" style="width:70%;height:6px"></span>${text}</div>`;
    return `<div class="ic ${on}" data-screen="${name}" title="${name}">${g || `<span class="code hi">${SHORT(name)}</span>`}${g ? `<span class="cap hi">${navLabel(name, i)}</span>` : ""}</div>`;
  }).join("");
  const cls = wide ? "wide" : stack ? "stack" : "";
  return `<nav class="rail rg ${solo("nav")} ${cls}" data-rg="navigation" data-fi="${fiOf("nav")}"
       data-labels-mode="${V.nav.labels}">${items}</nav>`;
}

/* The rail and the tab strip never carry the same destinations. When the
   rail lists the screens, the strip drops to the current screen's own views. */
const CONTEXT = {
  "Projets": ["En cours", "Archivés"],
  /* Aperçu has no views: the whole project reads on one page, so the strip
     above it carries nothing but the way back to the index. */
  "Unités": [...LEVELS.map((lv) => `Niveau ${lv}`), "Tous les niveaux"],
  "Quantités": ["Unités", "Superficies", "Fenêtres", "Matériaux"],
  "Suivi": ["Programme", "Esquisse", "Comité", "Permis", "Site"],
  "Fichiers": ["Dessins", "Maquette", "Arpenteur", "Correspondance"],
};

function tabsHTML() {
  const mode = V.nav.layout;
  if (mode === "Rail only, no tabs") return "";
  const top = mode === "Top bar only";
  const ic = tabIcons();
  const names = Object.keys(SCREENS).filter((n) => !SCREENS[n].index);
  /* Icons off and labels away would leave an empty strip, so the short code
     stands in: a tab target never renders without something to read. */
  const bare = !ic && (V.nav.labels === "Hidden" || V.nav.labels === "Hover only");
  const tab = (name, i) => `<button data-screen="${name}" aria-current="${name === V.screen}" title="${name}">
      ${ic ? icon(SCREENS[name].icon) : ""}<span class="lo bar" style="width:46px"></span>
      ${bare ? `<span class="hi code">${SHORT(name)}</span>` : `<span class="hi">${navLabel(name, i)}</span>`}</button>`;

  let items;
  const views = CONTEXT[V.screen] || [];
  /* The index is reached from the words "Tous les projets". They sit in the strip
     on every screen; on the index itself they are the only thing in it. */
  const back = `<span class="crumb hi" data-screen="Projets" title="Tous les projets">${icon("folder")}Tous les projets</span>`;
  if (SCREENS[V.screen].index) {
    items = `<span class="crumb on hi">${icon("folder")}Tous les projets</span><span class="sp"></span>`;
  } else if (!views.length) {
    /* A screen that reads on one page has nothing to filter, so the strip
       carries the project's name and the way back, and no tabs at all. */
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span><span class="sp"></span>`;
  } else if (mode === "Rail + view menu") {
    /* One button that steps through the views, because a menu that cannot
       open is not a control. */
    items = `<span class="btnw solid" ${act("viewnext")} title="Vue suivante"><span class="hi">${views[viewIndex(V.screen)]}</span>${icon("chevron-down")}</span>
      <span class="sp"></span>
      <span class="chip hi">${viewIndex(V.screen) + 1} / ${views.length}</span>`;
  } else if (mode === "Rail + breadcrumb") {
    items = `${back}${icon("chevron-right")}
      <span class="crumb on hi">${V.project}</span>
      <span class="sp"></span>`;
  } else if (top || mode === "Tabs only, no rail") {
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span>
      <span class="div"></span><div class="views">${names.map(tab).join("")}</div><span class="sp"></span>`;
  } else {
    /* The project name is on the path, before the views: it is read at the
       same time as where one is, and it is the way back to the index. The
       views scroll under it rather than pushing it off the strip. */
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span>
      <span class="div"></span>
      <div class="views">${views.map((t, i) => `<button ${act("view", i)} aria-current="${i === viewIndex(V.screen)}" title="${t}">
        <span class="lo bar" style="width:46px"></span><span class="hi">${t}</span></button>`).join("")}</div>
      <span class="sp"></span>`;
  }

  return `<div class="tabs rg ${solo("nav")}" data-rg="${top ? "navigation + onglets" : "onglets"}" data-fi="${fiOf("nav")}"
       data-style="${V.nav.tabStyle}" data-align="${V.nav.tabAlign}" data-labels-mode="${V.nav.labels}">
    ${top ? `<span class="btnw" style="margin-right:8px">${icon("box")}<span class="hi">ça fitte</span></span>` : ""}
    ${items}
  </div>`;
}

function headerHTML() {
  const step = V.journey ? SCREENS[V.screen].steps.header : null;
  /* The subtitle answers to the state: which project is open, which level is
     being read, how many rows the current view is actually showing. */

  const open = Object.keys(V.settled).length;
  const title = { "Projets": ["Projets", `${PROJECTS.length} en cours`],
    "Aperçu": [V.project, `8 étages · ${UNITS_BY_LEVEL["Tous les niveaux"].length} unités · ${unresolved} articles non résolus`],
    "Unités": [`Étage type — ${viewOf("Unités").toLowerCase()}`,
      `${rowsOf("Unités").length} unités · ${rowsOf("Unités").filter((r) => /croisement/.test(r[1])).length} avec un croisement ouvert`],
    "Quantités": ["Quantités", `${viewOf("Quantités")} · compté à partir des dessins, rien de saisi`],
    "Fichiers": ["Fichiers", "ce qui a été lu, et quand"],
    "Suivi": ["Suivi", `${viewOf("Suivi")} · les signaux viennent des dessins`] }[V.screen] || [V.screen, ""];

          <div class="lo bar" style="width:170px;height:13px"></div>
          <div class="lo bar lt" style="width:260px;height:8px"></div>
          <div class="hi" style="font-size:16px;font-weight:600">${title[0]}</div>
          <div class="hi" style="font-size:12px;color:var(--ink-2)">${title[1]}</div>
        </div>
        ${bare ? "" : SCREENS[V.screen].home
          ? `<span class="btnw solid" ${act("newproject")} title="Démarrer un projet">${icon("plus")}<span class="lo bar" style="width:52px"></span><span class="hi">Nouveau projet</span></span>`
          /* AutoCAD and SketchUp used to sit up here, a screen away from the
             drawing they open. They live on the drawing pane now. */
          : `<span class="btnw" ${act("export")} title="Exporter ce que cet écran montre">${icon("table")}<span class="lo bar" style="width:40px"></span><span class="hi">Exporter</span></span>`}
      </div>
      ${metrics ? `<div class="row" style="gap:var(--gap)">${[1, 2, 3, 4].map((i) => `<div class="tile" style="flex:1">
        <div class="lo bar" style="width:38px;height:14px"></div><div class="lo bar lt" style="width:70%"></div>
        <div class="hi" style="font-size:17px;font-weight:600">${["6", "4", "5", "98"][i - 1]}</div>
        <div class="hi" style="font-size:11px;color:var(--ink-2)">${["écarts", "croisements", "articles à lire", "unités"][i - 1]}</div>
      </div>`).join("")}</div>` : ""}
    </div>
  </header>`;
}

function listHTML() {
  const mode = V.list.layout;
  if (mode === "Hidden") return "";
  const step = V.journey ? SCREENS[V.screen].steps.list : null;
  const label = V.screen === "Unités" ? "Unités" : "Liste";
  /* The list reads the same rows the header counts, so the view above it and
     the search inside it both change what is on screen. */
  const pairs = rowsOf(V.screen);
  const rows = pairs.length ? pairs.map((r) => `${r[0]} · ${r[1]}`) : ["rien ne correspond"];
  const sel = selIndex(V.screen);

  if (mode === "Filter bar only") {
    return `<section class="pane rg ${solo("list")}" data-rg="liste → barre de filtres" data-fi="${fiOf("list")}" style="flex:0 0 auto;grid-column:1/-1">
      ${step ? `<span class="step">${step}</span>` : ""}
      <div class="pb" style="flex-direction:row;align-items:center;padding:8px 10px">
        <span class="chip">${icon("search")}<span class="lo bar" style="width:70px"></span>
          <input class="hi find" value="${V.query}" placeholder="Chercher dans ${label.toLowerCase()}"></span>
        ${pairs.slice(0, 4).map((r, i) => `<span class="chip ${i === sel ? "on" : ""}" ${act("row", i)}><span class="lo bar" style="width:46px"></span><span class="hi">${r[0].split(" ")[0]}</span></span>`).join("")}
      </div></section>`;
  }
  const inner = mode === "Card grid"
    ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${pairs.map((r, i) => `<div class="tile ${i === sel ? "on" : ""}" ${act("row", i)}>
        <div class="plan"${V.screen === "Unités" ? ` data-img="unit" style="height:54px;flex:0 0 54px;${crop(UNIT_BOXES[(r[2] ?? i) % UNIT_BOXES.length])}"` : ` style="height:54px;flex:0 0 54px"`}></div>
        <div class="lo bar" style="width:70%"></div><div class="hi" style="font-size:11.5px">${r[0]} · ${r[1]}</div></div>`).join("")}</div>`
    : rows.map((r, i) => `<div class="listrow ${i === sel ? "on" : ""}" ${pairs.length ? act("row", i) : ""}><span class="dot"></span>
        <span class="lo bar" style="flex:1"></span><span class="hi" style="font-size:12px">${r}${V.settled[`${V.screen} · ${(pairs[i] || [""])[0]}`] ? " · réglé" : ""}</span></div>`).join("");

  return region("list", `list — ${label.toLowerCase()}`,
    `<div class="ph">${icon("list")}<span class="lo bar" style="width:60px"></span><span class="hi">${label}</span></div>
     <div class="pb">${inner}</div>`, step);
}

function contentHTML() {
  const step = V.journey ? SCREENS[V.screen].steps.content : null;
  const mode = V.content.layout;
  const body = {
    "Unités": () => {
      const unit = (selRow("Unités") || ["—"])[0];
      /* The zoom does not stand beside the drawing any more: it lies on it,
         at the foot, as one piece of glass that leaves 1.6 s after the last
         gesture and comes back at the first movement over the sheet. At rest
         the whole pane is drawing. */
      /* The pair of framings straddles the slider: corners pushed out on the
         left, where the slider runs toward the wide view, corners pulled in
         on the right, where it runs toward the close one. The same pair on
         both panes, so the gesture does not change with the drawing. */
      const wide = side => side === "plan"
        ? `${act("fitsheet")} title="Voir toute la feuille"`
        : `${act("mwide")} title="Voir tout le bâtiment"`;
      const close = side => side === "plan"
        ? `${act("fitunit")} title="Cadrer l'unité sélectionnée"`
        : `${act("mclose")} title="Se rapprocher du bâtiment"`;
      const zbar = (side) => `<div class="zbar glass gone" data-zbar="${side}">
        <span class="zb" ${wide(side)}>${icon("maximize")}</span>
        <span class="zb" ${act("zstep", side + ":-")} title="Reculer">${icon("minus")}</span>
        <input class="zslider" type="range" ${side === "plan"
          ? `min="${ZMIN}" max="${ZMAX}" step="1" value="${V.zoom}" data-zoom aria-label="Zoom du plan"`
          : `min="0" max="100" step="1" value="${V.mzoom}" data-mzoom aria-label="Zoom de la maquette"`}>
        <span class="zb" ${act("zstep", side + ":+")} title="Agrandir">${icon("plus")}</span>
        <span class="zsep"></span>
        <span class="zread hi" ${side === "plan" ? "data-zread" : "data-mread"}>${side === "plan" ? V.zoom : V.mzoom}%</span>
        <span class="zb" ${close(side)}>${icon("minimize")}</span>
      </div>`;
      const pane = (t, note, kind, cls = "", layers = "") => `<div class="pane drawing" style="flex:1"><div class="ph">${icon("file")}
        <span class="lo bar" style="width:90px"></span><span class="hi">${t}</span>
        <span style="flex:1"></span>${hostButton(kind === "plan" ? "plan" : "model")}</div>
        ${fileStrip(kind === "plan" ? "plan" : "model")}
        ${kind === "plan"
          /* The sheet is larger than the pane, so the pane is a window onto
             it: the drawing, the consultants' layers, the typology fills and
             the unit outline all sit inside one transformed box and move
             together. The wheel zooms where the pointer is; dragging pans. */
          ? `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="plan">
              <div class="vp" data-vp>
              <div class="plan ${cls}" data-img="${kind}" data-src="${planVector() ? "vector" : "image"}"
                   style="transform:translate(${V.pan.x}px,${V.pan.y}px) scale(${V.zoom / 100})">
                <span class="lo"></span><span class="hi">${note}</span>
                ${planVector() ? `<canvas class="sheetpdf" data-sheetpdf></canvas>` : ""}
                ${layers}${unitMarkHTML()}</div></div>
              ${zbar("plan")}</div>`
          : `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="model">
              <div class="model3d" data-building-model data-state="loading" role="region"
                   aria-label="Maquette 3D interactive du Baldwin III" aria-busy="true">
                <div class="model3d-status" data-model-status aria-live="polite">Chargement de la maquette…</div>
                <div class="model3d-hint hi">Glisser pour orbiter · molette pour zoomer</div>
              </div>
              ${zbar("model")}
            </div>`}
        </div>`;
      /* The 2D pane carries the surveyor's and the landscaper's sheets, which
         is why it is the one pane drawn at the plan's own aspect. */
      const plan = () => pane("Plan 2D", `${unit} — contours par-dessus`, "plan", "align", typoHTML() + layersHTML());
      const model = () => pane("Maquette 3D", `${unit} — volumétrie, même niveau`, "model", "fit");
      if (mode === "Stacked") return `<div class="col" style="flex:1">${plan()}${model()}</div>`;
      if (mode === "Single pane + inset") return `<div style="position:relative;flex:1;display:flex">${plan()}
        <div class="pane" style="position:absolute;right:10px;bottom:10px;width:220px;height:150px">
        <div class="pb"><div class="plan" data-img="massing"><span class="hi">3D inset</span></div></div></div></div>`;
      return `<div class="row" style="flex:1;align-items:stretch;gap:var(--gap)">${plan()}${model()}</div>`;
    },
    /* Aperçu is one page, not four tabs. The project opens on everything it
       knows at once: what changed, the totals, and the zoning and code block
       that used to be its own screen. Nothing here is worth a click to see. */
    "Aperçu": () => {
      const tiles = [["Ce qui a changé depuis la dernière lecture", "lignes lues dans les dessins"],
        ["Les deux sources connectées", "plan et maquette, même niveau"],
        ["Étage type — 14 unités", "typologies et superficies"],
        ["Répartition des typologies", "part de chaque type au projet"]];
      const grid = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)">
        ${tiles.map(([t, note]) => `<div class="tile">
          <div class="lo bar" style="width:60%"></div><div class="hi" style="font-weight:600">${t}</div>
          <div class="lo col">${bars(4)}</div>
          <div class="hi" style="color:var(--ink-2);font-size:11.5px">${note}</div></div>`).join("")}</div>`;
      /* One card per provision: the number read in the drawings beside the
         number the provision asks for, the sentence in French, and a link to
         the official page. The card the footer strip points at is marked. */
      const zoning = `<div class="pane" style="flex:0 0 auto">
          <div class="ph">${icon("scale")}<span class="lo bar" style="width:90px"></span>
            <span class="hi">Zonage et code</span><span style="flex:1"></span>
            <span class="chip"><span class="lo bar" style="width:52px"></span><span class="hi">${unresolvedCount()} non résolus sur ${ARTICLES.length}</span></span></div>
          <div class="pb">
            <div class="codegrid">${ARTICLES.map((x, i) => codeCard(x, i)).join("")}</div>
            <div class="tile"><div class="row">${icon("alert-triangle")}<span class="lo bar" style="width:70%"></span>
              <span class="hi" style="font-size:11.5px;color:var(--ink-2)">Extraits de travail, abrégés. La version qui fait foi est celle de l'arrondissement ou de la RBQ, liée sur chaque carte. Une lecture automatique ne déclare pas une non-conformité.</span></div></div>
          </div></div>`;
      return `<div class="col" style="flex:1;gap:var(--gap)">${grid}${zoning}</div>`;
    },
    /* No chip row here: the four tables are already the views in the strip
       at the top of the card, and naming them twice makes the second row
       look like a filter it is not. */
    "Quantités": () => {
      const t = QTABS[viewOf("Quantités")];
      return `<div class="col" style="flex:1">
        <table class="tbl"><thead><tr>${t.head.map((h) => `<th><span class="lo bar" style="width:40px"></span><span class="hi">${h}</span></th>`).join("")}</tr></thead>
        <tbody>${t.rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i ? "n" : ""}"><span class="lo bar" style="width:${i ? 34 : 50}px"></span><span class="hi">${c}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    },
    "Suivi": () => {
      const views = viewsOf("Suivi");
      return `<div class="col" style="flex:1">
        <div class="row">${views.map((t, i) => `<span class="chip" ${act("view", i)} style="${i === viewIndex("Suivi") ? "border-color:var(--ink)" : ""}">
          <span class="lo bar" style="width:44px"></span><span class="hi">${t}</span></span>`).join("")}</div>
        ${(PHASES[viewOf("Suivi")] || []).map((t) => `<div class="listrow" ${act("tick", t)} title="Cocher">
          <span class="dot" style="border-radius:3px;${V.settled[`Suivi · ${t}`] ? "background:var(--ink);border-color:var(--ink)" : ""}"></span>
          <span class="lo bar" style="flex:1"></span>
          <span class="hi" style="font-size:12px">${t}${V.settled[`Suivi · ${t}`] ? " · fait" : ""}</span></div>`).join("")}</div>`;
    },
    /* Files: what was read, and when. The view picks the kind. */
    "Fichiers": () => `<div class="col" style="flex:1">
        ${(FILES[viewOf("Fichiers")] || []).map(([n, meta]) => `<div class="listrow" ${act("openfile", n)} title="Ouvrir ${n}">
          <span class="dot"></span><span class="lo bar" style="flex:1"></span>
          <span class="hi" style="font-size:12px;flex:1">${n}</span>
          <span class="hi" style="font-size:11.5px;color:var(--ink-3)">${meta}</span></div>`).join("")}
        <div class="tile"><div class="row">${icon("info")}<span class="lo bar" style="width:60%"></span>
          <span class="hi" style="font-size:11.5px">rien n'est écrit dans un fichier de dessin; les mises à jour sont proposées</span></div></div></div>`,
  }[V.screen]();

  /* No header strip on this pane: it only repeated the screen name already
     set in large type two lines above, and the pane is the whole middle of
     the card — nothing else it could be. */
  return region("content", "contenu", `<div class="pb">${body}</div>`, step);
}

function inspectorHTML() {
  const mode = V.inspector.layout;
  if (mode === "Hidden") return "";
  const step = V.journey ? SCREENS[V.screen].steps.inspector : null;
  const row = selRow(V.screen);
  const title = { "Unités": `Unité ${(row || ["—"])[0].split(" ")[0]}`, "Aperçu": "Ce qui bloque",

  /* A decision panel on the screen where something is decided; a short
     read-only column everywhere else. */
