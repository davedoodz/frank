/* A click on the model is a ray into the building; a drag is an orbit. The
   canvas belongs to the viewer and survives re-renders, so this is wired
   once, on the pane, and asks the viewer what was hit. */
function wireModelPins() {
  let down = null;
  document.addEventListener("pointerdown", (e) => {
    down = e.target.closest('[data-zone="model"]') ? [e.clientX, e.clientY] : null;
  }, true);
  document.addEventListener("pointerup", (e) => {
    const start = down; down = null;
    if (!start || !V.pinMode || V.guest) return;
    if (Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 4) return;
    const hit = window.fitteModel?.pick?.(e.clientX, e.clientY);
    if (!hit) return;
    e.stopPropagation();
    V.pending = { surface: "model", ...hit };
    V.selPin = null;
    render();
    document.querySelector("[data-pindraft]")?.focus();
  }, true);
}

/* ------------------------------------------------- reading the sheet
   The pane is a fixed window; the sheet moves behind it. Zoom is a number
   in percent, pan two pixel offsets, both on V, so a re-render draws the
   drawing exactly where it was left. Nothing here touches the file. */

/* 100 % is the sheet filling the pane; below it the paper keeps going, which
   is what lets the eye step back from a drawing that runs to its own edges.
   The two camera stops are the wide shot and the close one, the numbers the
   viewer settles at when either framing is asked for. */
const ZMIN = 45, ZMAX = 600;
const MZOOM_WIDE = 13, MZOOM_CLOSE = 55;
const vpEl = () => document.querySelector("[data-vp]");

/* PDF detail is automatic; the image remains underneath during rendering.
   wireframe-c3-pdf.js paints viewport-sized tiles at the current pixel density. */
const planVector = () => !!(paneSheet() && paneSheet().pdf && paneSheet().detail !== "image");
const SHEET_AR = 2000 / 1675;
function layoutSheet(el) {
  const plan = el.querySelector(".plan");
  if (!plan) return { w: 0, h: 0 };
  const r = el.getBoundingClientRect();
  let w = r.width, h = w / SHEET_AR;
  if (h > r.height) { h = r.height; w = h * SHEET_AR; }
  plan.style.width = `${w}px`;
  plan.style.height = `${h}px`;
  return { w, h };
}

/* The sheet never leaves the pane: while it is smaller than the viewport it
   stays centred in it, and once it is larger it may be dragged until an
   edge reaches the opposite edge of the pane. */
function clampPan(rect, zoom, base) {
  const z = zoom / 100;
  const bw = base.w * z, bh = base.h * z;
  V.pan.x = bw <= rect.width ? (rect.width - bw) / 2 : Math.min(0, Math.max(rect.width - bw, V.pan.x));
  V.pan.y = bh <= rect.height ? (rect.height - bh) / 2 : Math.min(0, Math.max(rect.height - bh, V.pan.y));
}

/* Zooms around a point of the pane, the pointer under the wheel or the
   middle of the pane for the buttons, so what is being read stays put. */
function zoomTo(next, cx, cy, rect, base) {
  const z0 = V.zoom / 100;
  const z1 = Math.min(ZMAX, Math.max(ZMIN, next)) / 100;
  V.pan.x = cx - (cx - V.pan.x) * (z1 / z0);
  V.pan.y = cy - (cy - V.pan.y) * (z1 / z0);
  V.zoom = Math.round(z1 * 100);
  clampPan(rect, V.zoom, base);
}

function zoomBy(next) {
  const el = vpEl();
  if (!el) { V.zoom = Math.min(ZMAX, Math.max(ZMIN, next)); return; }
  const r = el.getBoundingClientRect();
  zoomTo(next, r.width / 2, r.height / 2, r, layoutSheet(el));
}

/* Moving from one unit to the next is a move across one sheet, so the sheet
   moves: the eye keeps the drawing it was reading and arrives knowing where
   it went. Jumping does the opposite — the plan looks like a different
   plan every click, and the reader has to find the building again.
   The pan is interpolated in the pane's pixels and the zoom geometrically,
   because zoom is multiplicative: 50 → 200 % must pass through 100, not
   through 125. Nothing re-renders during the glide; only the transform and
   the two readouts move, which is the same path the wheel takes. */
let GLIDE = 0;
const stopGlide = () => { if (GLIDE) { cancelAnimationFrame(GLIDE); GLIDE = 0; } };
function glideTo(to, ms = 0) {
  stopGlide();
  const z0 = V.zoom, p0 = { x: V.pan.x, y: V.pan.y };
  const dz = Math.abs(to.zoom - z0), dp = Math.hypot(to.pan.x - p0.x, to.pan.y - p0.y);
  /* A move of a few pixels is not a journey: snap, and keep the frames. */
  if (dz < 1 && dp < 2) { V.zoom = to.zoom; V.pan = to.pan; paintSheet(); return; }
  /* Neighbours on the same floor are a short hop; the far corner of the
     sheet is a trip. A fixed duration makes the first feel sluggish and the
     second feel thrown, so the time follows the distance, bounded. */
  if (!ms) ms = Math.max(240, Math.min(560, 200 + dp * 0.22 + dz * 0.25));
  /* The clock starts on the first frame, not on the call: between the two
     the screen is rebuilt, and a glide measured from before that work would
     spend part of its duration on a thread that cannot paint. */
  let t0 = 0;
  /* Slow at both ends, quickest in the middle: the start says "we are
     leaving this unit", the end says "we have arrived at that one". */
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - ((-2 * t + 2) ** 3) / 2);
  const step = (now) => {
    if (!t0) t0 = now;
    const t = Math.min(1, (now - t0) / ms), k = ease(t);
    V.zoom = z0 * ((to.zoom / z0) ** k);
    V.pan.x = p0.x + (to.pan.x - p0.x) * k;
    V.pan.y = p0.y + (to.pan.y - p0.y) * k;
    paintSheet();
    if (t < 1) { GLIDE = requestAnimationFrame(step); return; }
    GLIDE = 0;
    V.zoom = to.zoom; V.pan = to.pan;
    paintSheet();
  };
  GLIDE = requestAnimationFrame(step);
}

/* The selected unit, filling the pane with a little air: the box is 0–1 on
   the sheet, so the zoom that frames it is the pane over the box. */
function fitUnit(glide = true) {
  const el = vpEl();
  const row = selRow("Unités");
  if (!el || !row) return;
  const poly = polysForPane()[row[2]];
  if (!poly) return;   // no measured contour for this unit — leave the view as it is
  const r = el.getBoundingClientRect();
  const base = layoutSheet(el);
  const [x, y, w, h] = polyBounds(poly);
  const z = Math.min(ZMAX, Math.max(ZMIN,
    Math.min(r.width / (base.w * w * 1.5), r.height / (base.h * h * 1.5)) * 100));
  /* clampPan writes V.pan, so the target is computed in V and the start is
     put back before the glide: the frames own V from here on. */
  const from = { zoom: V.zoom, pan: { x: V.pan.x, y: V.pan.y } };
  V.zoom = Math.round(z);
  V.pan.x = r.width / 2 - (x + w / 2) * base.w * (z / 100);
  V.pan.y = r.height / 2 - (y + h / 2) * base.h * (z / 100);
  clampPan(r, V.zoom, base);
  const to = { zoom: V.zoom, pan: { x: V.pan.x, y: V.pan.y } };
  V.zoom = from.zoom; V.pan = from.pan;
  /* The sheet is only ever glided across itself: a level change replaces
     the drawing, and sliding one plan onto another says they are the same
     building seen from the side, which they are not. */
  if (!glide) { V.zoom = to.zoom; V.pan = to.pan; paintSheet(); return; }
  glideTo(to);
}

/* Bidirectional selection: the 3D viewer raycasts a window, finds which
   CONTOURS polygon it falls closest to, and calls this with the real
   unit number that key implies (e.g. "816" for CONTOURS[8][16]) — the
   mirror of window.fitteSelection above. This is the same level switch
   and row selection a list-row click already makes, and it frames the
   unit the same way: choosing a unit is asking to see it. Matched
   against the row's own suffix (r[2]) directly:
   the suffixes aren't sequential, so no.slice(-2) can't be turned into
   an array index by subtracting one. */
window.fitteSelectUnit = (unitStr) => {
  const no = String(unitStr);
  const level = Number(no.slice(0, -2));
  const suffix = Number(no.slice(-2));
  const rows = UNITS_BY_LEVEL[levelView(level)];
  if (!rows) return;
  const rowIndex = rows.findIndex((r) => r[2] === suffix);
  if (rowIndex < 0) return;
  // A picked window must remain selectable even when the list is filtered.
  V.query = "";
  TYPOS.forEach((type) => {
    if (V.typo[type]) dial.setValue(`typologies.${type}`, false);
  });
  V.screen = "Unités";
  dial.setValue("screen", FR_SCREEN[V.screen]);
  /* A window picked in the 3D model can be on another floor, and the pane
     is about to carry a different sheet: there is nothing to glide across,
     so a change of level lands instead of sliding. */
  const sameSheet = V.view["Unités"] === viewIndexOfLevel(level);
  V.view["Unités"] = viewIndexOfLevel(level);
  V.sel["Unités"] = rowIndex;
  /* A level change rebuilds the sheet and the thumbnails, so this path
     cannot avoid a full render — but it can put it before the glide, the
     way a list click does: a tween started ahead of ~650 ms of raster gets
     its first frame after it is already over. */
  if (sameSheet) paintSelection(); else render();
  /* A window click can select a row well below the fold: keep it in view,
     but only scroll the list pane itself, never the page around it. */
  document.querySelector(`[data-region="list"] [data-act="row"][data-value="${rowIndex}"]`)
    ?.scrollIntoView({ block: "nearest", inline: "nearest" });
  fitUnit(sameSheet);
};

/* The wheel and the drag write straight to the element and to V, without a
   re-render: a re-render per wheel tick would rebuild the whole screen and
   the drag would stutter. The slider and the percentage on the edge of the
   pane are patched in place, and the next real action draws from the same
   numbers. */
function paintSheet() {
  const el = vpEl();
  if (!el) return;
  const plan = el.querySelector(".plan");
  /* Laid out first: the pane can have been resized since the last paint,
     and the pan is centred against the box this returns. */
  const base = layoutSheet(el);
  clampPan(el.getBoundingClientRect(), V.zoom, base);
  if (plan) plan.style.transform = `translate(${V.pan.x}px,${V.pan.y}px) scale(${V.zoom / 100})`;
  /* V.zoom runs through fractions while the sheet glides; the slider and
     the percentage are read by a person, so they are rounded here rather
     than quantising the motion itself. */
  const shown = Math.round(V.zoom);
  const slider = document.querySelector("[data-zoom]");
  if (slider && document.activeElement !== slider) slider.value = String(shown);
  const read = document.querySelector("[data-zread]");
  if (read) read.textContent = `${shown}%`;
  const z = V.zoom / 100;
  const label = el.querySelector(".ulabel");
  if (label) {
    label.style.fontSize = `${(11 / z).toFixed(2)}px`;
    label.style.transform = `translateY(${(label.dataset.side === "below" ? 2 / z : -(14 / z)).toFixed(2)}px)`;
  }
  el.querySelectorAll(".umark polygon").forEach((r) => { r.style.strokeWidth = `${(1.6 / z).toFixed(3)}px`; });
  window.dispatchEvent(new Event("fitte:plan-paint"));
  /* The corner rectangle is the same state read small; painted here so it
     cannot drift from the sheet by a frame. */
  paintMiniPlan();
}

function wireViewport() {
  const el = vpEl();
  if (!el) return;
  const paint = paintSheet;
  /* With the pin armed, a click on the sheet is a point, not a unit: it is
     caught before the outlines underneath get it. Coordinates are 0–1 of
     the sheet itself, like the unit outlines, so the pin keeps its place
     when the drawing is zoomed, panned, or re-exported larger. */
  el.addEventListener("click", (e) => {
    if (!V.pinMode || V.guest) return;
    const plan = el.querySelector(".plan");
    if (!plan) return;
    const r = plan.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    e.stopPropagation();
    V.pending = { surface: "plan", level: paneLevel(), sheet: currentSheetKey(),
      x, y, zone: unitAt(x, y) };
    V.selPin = null;
    render();
    document.querySelector("[data-pindraft]")?.focus();
  }, true);
  /* The hand always wins: a wheel, a drag or a double-click during a glide
     stops it where it is rather than fighting it for the transform. */
  el.onwheel = (e) => {
    e.preventDefault();
    stopGlide();
    const r = el.getBoundingClientRect();
    zoomTo(V.zoom * Math.exp(-e.deltaY * 0.0016), e.clientX - r.left, e.clientY - r.top, r, layoutSheet(el));
    paint();
  };
  el.ondblclick = () => { stopGlide(); V.zoom = 100; V.pan = { x: 0, y: 0 }; paint(); };
  el.onpointerdown = (e) => {
    if (e.button !== 0) return;
    stopGlide();
    const r = el.getBoundingClientRect();
    const start = { x: e.clientX, y: e.clientY, px: V.pan.x, py: V.pan.y };
    let moved = false;
    el.onpointermove = (m) => {
      if (!moved && Math.abs(m.clientX - start.x) + Math.abs(m.clientY - start.y) <= 3) return;
      if (!moved) {
        /* The pointer is captured only once the hand has actually moved: a
           capture taken on press retargets the click to this element, and
           the unit under the finger would never be selected. */
        moved = true;
        el.setPointerCapture(m.pointerId);
        el.classList.add("drag");
      }
      V.pan.x = start.px + (m.clientX - start.x);
      V.pan.y = start.py + (m.clientY - start.y);
      clampPan(r, V.zoom, layoutSheet(el));
      paint();
    };
    el.onpointerup = (u) => {
      el.classList.remove("drag");
      el.onpointermove = null; el.onpointerup = null;
      /* A drag is not a click: only a still pointer picks the unit under it. */
      if (moved) { u.stopPropagation(); u.preventDefault(); }
    };
  };
  /* Drawn once here: the markup carries the last transform, but the box it
     is measured against only exists after the pane has been laid out. */
  paintSheet();
  /* The pane does not settle on one width at first paint: the model beside
     it loads a canvas and takes its share late, a rail is folded, the panel
     opens. Every one of those resizes this box, and a sheet laid out
     against the old width would hang past the edge and be cut. */
  if (!el.__ro) {
    el.__ro = new ResizeObserver(() => paintSheet());
    el.__ro.observe(el);
  }
}

/* The pane changes width with the window, and the sheet is centred in it,
   so the one listener re-centres whatever is on screen. */
window.addEventListener("resize", () => paintSheet());

/* The two sliders are the only zoom controls left, so each one is wired to
   the thing it moves: the plan slider to the sheet transform, the model
   slider to the camera distance the viewer module exposes. The model writes
   back through an event, because orbiting with the mouse changes the same
   number the slider shows. */
function wireZoomRails() {
  const sheet = document.querySelector("[data-zoom]");
  if (sheet) sheet.oninput = () => { zoomBy(Number(sheet.value)); paintSheet(); };
  const cam = document.querySelector("[data-mzoom]");
  if (cam) {
    cam.value = String(V.mzoom);
    cam.oninput = () => {
      V.mzoom = Number(cam.value);
      paintModelRead();
      window.fitteModel?.writeZoom(V.mzoom);
    };
  }
  paintModelRead();
  wireMiniPlan();
}

/* The corner view of the plan is a control: pressing or dragging inside it
   centres the sheet on the point touched, which is the fastest way across a
   permit sheet at 400 %. */
function wireMiniPlan() {
  const mi = document.querySelector('[data-mini="plan"] [data-mi]');
  if (!mi) return;
  const goTo = (e) => {
    const el = vpEl();
    if (!el) return;
    const b = mi.getBoundingClientRect(), r = el.getBoundingClientRect();
    const base = layoutSheet(el), z = V.zoom / 100;
    const fx = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width));
    const fy = Math.max(0, Math.min(1, (e.clientY - b.top) / b.height));
    V.pan.x = r.width / 2 - fx * base.w * z;
    V.pan.y = r.height / 2 - fy * base.h * z;
    paintSheet();
  };
  let on = false;
  mi.onpointerdown = (e) => { on = true; mi.setPointerCapture(e.pointerId); goTo(e); e.stopPropagation(); };
  mi.onpointermove = (e) => { if (on) goTo(e); };
  mi.onpointerup = () => { on = false; };
}

/* The rectangle is the pane expressed in the sheet's own 0–1 box, clipped
   to it: past the edge there is no sheet left to frame. */
function paintMiniPlan() {
  const box = document.querySelector('[data-mini="plan"]');
  const el = vpEl();
  if (!box || !el) return;
  const mi = box.querySelector("[data-mi]"), rect = box.querySelector("[data-mrect]");
  const b = mi.getBoundingClientRect();
  if (!b.width) return;
  const r = el.getBoundingClientRect(), base = layoutSheet(el), z = V.zoom / 100;
  const x = Math.max(0, Math.min(1, -V.pan.x / (base.w * z)));
  const y = Math.max(0, Math.min(1, -V.pan.y / (base.h * z)));
  const w = Math.min(1 - x, r.width / (base.w * z));
  const h = Math.min(1 - y, r.height / (base.h * z));
  rect.style.left = `${x * b.width}px`;
  rect.style.top = `${y * b.height}px`;
  rect.style.width = `${w * b.width}px`;
  rect.style.height = `${h * b.height}px`;
}

/* The model's corner view is rendered by the viewer module from the live
   scene, so nothing here draws it. The zoom column carries the number. */
function paintModelRead() {
  const read = document.querySelector("[data-mread]");
  if (read) read.textContent = `${V.mzoom}%`;
}

window.addEventListener("fitte:model-zoom", (e) => {
  if (!Number.isFinite(e.detail)) return;
  V.mzoom = e.detail;
  const cam = document.querySelector("[data-mzoom]");
  if (cam && document.activeElement !== cam) cam.value = String(V.mzoom);
  paintModelRead();
});
/* ---------------------------------------------------------------- frame */

function render() {
  const def = SCREENS[V.screen];
  /* Counting the building is not reading a floor: the unit list, the two
     drawings, the margin and its rail all belong to a floor, so the four
     tables take the work area on their own. */
  const whole = buildingScope();
  /* A basement and the roof carry no apartment unit: a list whose only
     line says it is empty is worse than no list, and the plan is the
     reason one is on those levels at all. */
  const noUnits = V.screen === "Unités" && isNonresLevel(paneLevel());
  const hasList = !whole && !noUnits && def.regions.includes("list")
    && V.list.layout !== "Hidden" && V.list.layout !== "Filter bar only";
  const hasInsp = !whole && def.regions.includes("inspector") && V.inspector.layout === "Right panel";
  /* The margin is narrower than the inspector and is followed by the rail of
     tool icons, which is what makes folding the inspector worth the trade:
     the drawings keep their width. */
  const rightW = V.rightTool === "notes" ? "286px" : "340px";
  const cols = [hasList ? "260px" : null, "1fr",
    hasInsp ? rightW : null, hasInsp ? "40px" : null].filter(Boolean).join(" ");
  /* No rail until a project is open: the rail is the proof that one is. */
  const navMode = def.index ? "top"
    : { "Top bar only": "top", "Tabs only, no rail": "top", "Two rows, no rail": "top",
        "Wide rail with labels": "wide", "Wide rail with sections": "wide",
        "Rail with labels under icons": "stack" }[V.nav.layout] || "rail";

  document.getElementById("frame").innerHTML = `
    <div class="frame" data-nav="${navMode}" data-labels="${V.labels}" data-journey="${V.journey}"
         data-density="${V.density}" data-fi="${V.fidelity}" data-isolate="${V.isolate}"
         data-shell="${V.shell === "Inset card" ? "inset" : "flat"}"
         data-chrome="${V.chrome === "Black" ? "black" : "light"}"
         style="--plan:url(${paneSheet()?.img || ""})">
      ${navHTML()}
      <div class="body">
        ${tabsHTML()}
        <div class="work" style="grid-template-columns:${SCREENS[V.screen].home ? "1fr" : cols};grid-auto-rows:min-content 1fr min-content;align-content:stretch">
          <div style="grid-column:1/-1">${headerHTML()}</div>
          ${SCREENS[V.screen].home ? `<div style="grid-column:1/-1;display:flex;min-height:0;gap:var(--gap)">${(HOMES[V.homeLayout] || HOMES["Card grid"])()}</div>` : ""}
          ${SCREENS[V.screen].home ? "" : `${!whole && !noUnits && V.list.layout === "Filter bar only" && def.regions.includes("list") ? listHTML() : ""}
          ${hasList ? listHTML() : ""}
          ${contentHTML()}
          ${hasInsp ? (V.rightTool === "notes" ? marginHTML() : inspectorHTML()) + railToolsHTML() : ""}`}
        </div>
        ${!whole && def.regions.includes("inspector") && !hasInsp ? inspectorHTML() : ""}
      </div>
    </div>`;

  /* The journey strip lived under the frame; with the frame filling the
     window, the step badges on the screen carry it alone. */

  if (V.dialog) document.getElementById("frame").insertAdjacentHTML("beforeend", dialogHTML());

  if (V.toast) {
    const t = document.createElement("div");
    t.className = "toast hi";
    t.textContent = V.toast;
    document.getElementById("frame").appendChild(t);
  }

  /* One handler for the whole screen, assigned rather than added: render runs
     often and a stack of identical listeners would fire the same action
     several times. Every control carries data-act, so a new control is wired
     the moment it is drawn. */
  document.getElementById("frame").onclick = onClick;
  /* The pane that holds the sheet is rebuilt with the screen, so its wheel
     and drag are hooked back up every time it is drawn. */
  wireViewport();
  wireZoomRails();
  /* The margin's three live parts: the pin cursor on the drawings, the
     model's projected markers, and the composer's field — which writes
     straight to state so typing never costs a re-render. */
  document.getElementById("frame")?.setAttribute("data-pin", V.pinMode ? "on" : "off");
  pushModelPins();
  const draft = document.querySelector("[data-pindraft]");
  if (draft) draft.oninput = (e) => { V.draft = e.target.value; };
  const find = document.querySelector(".find");
  if (find) find.oninput = (e) => {
    V.query = e.target.value;
    render();
    const f = document.querySelector(".find");
    f.focus(); f.setSelectionRange(f.value.length, f.value.length);
  };
  /* Typing must not re-render — the field would lose the caret — so the one
     thing that changes with the text is patched in place. */
  const note = document.querySelector(".note");
  if (note) note.oninput = (e) => { V.note = e.target.value; paintSaveButton(); };

  /* The dialog's fields write straight into state without a re-render, so
     typing is never interrupted; the button validates when it is pressed. */
  document.querySelectorAll("[data-field]").forEach((el) => {
    el.oninput = (e) => { V.dialog[e.target.dataset.field] = e.target.value; };
  });
  const first = document.querySelector(".dialog input");
  if (first) first.focus();
  /* The selected unit as the 3D viewer needs it: the level and unit number
     that drive which windows highlight and which floor band tints, read
     off the same selected row the 2D plan outlines — including in "Tous
     les niveaux", where the level has to be read back out of the unit
     number since the row itself no longer carries a single one. */
  const selectedRow = selRow("Unités");
  if (selectedRow) {
    const no = selectedRow[0].split(" · ")[0];
    const level = currentLevel() ?? Number(no.slice(0, -2));
    window.fitteSelection = { level, unit: no, index: selectedRow[2] };
  } else {
    window.fitteSelection = { level: currentLevel(), unit: null, index: null };
  }
  window.dispatchEvent(new CustomEvent("fitte:render"));
}

/* Choosing a unit is not a new screen. render() rewrites the frame's whole
   innerHTML, and the browser then re-rasterises fifteen cropped plan
   thumbnails, the sheet and the inspector: measured here, that is ~650 ms
   of paint on top of 5 ms of JavaScript, which swallowed the first frames
   of the glide and turned it back into a jump. Three boxes actually change
   when the selection moves, so three boxes are rewritten. */
function paintSelection() {
  const sel = selIndex("Unités");
  document.querySelectorAll('[data-region="list"] [data-act="row"]').forEach((el) => {
    el.classList.toggle("on", Number(el.dataset.value) === sel);
  });
  const insp = document.querySelector('[data-region="inspector"]');
  const inner = inspectorHTML();
  /* Hidden inspector, or a layout that does not draw one: nothing to swap,
     and nothing to fall back to either. */
  if (insp && inner) insp.outerHTML = inner;
  /* The header is counted from the floor, not from the selection: measured
     identical for every row, so it is left alone. */
  /* The outline and its label are children of the scaled sheet, so they are
     replaced inside it rather than around it. */
  const plan = vpEl()?.querySelector(".plan");
  if (plan) {
    plan.querySelectorAll(".umark, .ulabel").forEach((n) => n.remove());
    plan.insertAdjacentHTML("beforeend", unitMarkHTML());
  }
  /* The decision panel is drawn again, so its field is wired again; the
     rest of the controls go through the one delegated click handler. */
  const note = document.querySelector(".note");
  if (note) note.oninput = (e) => { V.note = e.target.value; paintSaveButton(); };
  /* What the 3D viewer reads to tint the right windows. Measured at ~15 ms,
     against ~650 ms for a full render: the model follows the list without
     the screen being rebuilt around it. */
  const row = selRow("Unités");
  window.fitteSelection = row
    ? { level: currentLevel() ?? Number(row[0].split(" · ")[0].slice(0, -2)),
        unit: row[0].split(" · ")[0], index: row[2] }
    : { level: currentLevel(), unit: null, index: null };
  window.dispatchEvent(new CustomEvent("fitte:render"));
}

/* Saying what just happened, briefly. An action that leaves no trace on the
   screen says so here instead of pretending to be a button. */
let TOAST_TIMER = null;
function say(message) {
  V.toast = message;
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(() => { V.toast = null; render(); }, 2600);
}

function onClick(e) {
  const screenEl = e.target.closest("[data-screen]");
  const el = e.target.closest("[data-act]");
  if (screenEl && !el) {
    V.screen = screenEl.dataset.screen;
    /* The panel speaks English: hand it the English name, or it rejects the
       value and the first click is swallowed. */
    dial.setValue("screen", FR_SCREEN[V.screen]);
    return render();
  }
  if (!el) return;
  const value = el.dataset.value;
  const screen = V.screen;

  switch (el.dataset.act) {
    case "view":
      V.view[screen] = Number(value);
      /* A new view is a new set of rows, so the old row number means nothing. */
      V.sel[screen] = 0;
      /* Asking for a floor is asking to read a floor: the building-wide
         count steps aside. */
      if (screen === "Unités") V.scope = "Niveau";
      /* A basement or the roof has no unit to glide to: landing with a
         residential floor's zoom and pan left over would show an empty,
         arbitrarily cropped corner of the sheet instead of the sheet. */
      if (screen === "Unités" && isNonresLevel(currentLevel())) { V.zoom = 100; V.pan = { x: 0, y: 0 }; }
      break;
    case "viewnext":
      V.view[screen] = (viewIndex(screen) + 1) % viewsOf(screen).length;
      V.sel[screen] = 0;
      if (screen === "Unités" && isNonresLevel(currentLevel())) { V.zoom = 100; V.pan = { x: 0, y: 0 }; }
      break;
    /* Picking a unit moves the sheet to it, whatever the zoom was: the list
       is a way of looking at the plan, so the answer to a click is the unit
       filling the pane, not a contour somewhere off-screen. Choosing a unit
       is also choosing to read a floor, so it ends the building scope. */
    case "row":
      V.sel[screen] = Number(value);
      if (screen === "Unités" && V.scope === "Bâtiment") { V.scope = "Niveau"; break; }
      /* Mark the destination first, then move the sheet to it: the mark is
         visible for the whole journey, and the glide's first frame lands on
         a thread that has nothing left to rasterise. */
      if (screen === "Unités") { paintSelection(); fitUnit(); return; }
      break;
    case "article": V.articleId = value; V.noteOn = null; break;
    /* One floor, or all of them. Leaving the building scope goes back to the
       unit that was being read, so the switch is not a one-way door. */
    case "scope":
      V.scope = value;
      /* A typology fill belongs to a floor plan, and the plan is leaving
         the screen: nothing should stay lit on a drawing no longer shown. */
      if (V.scope === "Bâtiment") TYPOS.forEach((ty) => { if (V.typo[ty]) dial.setValue(`typologies.${ty}`, false); });
      break;
    case "csv": exportCSV(value); say(`Tableau « ${value} » téléchargé en .csv.`); break;
    /* Four files would be four clicks; the four tables in one file are read
       as one sheet with four blocks, which is how a quantity take-off is
       passed around anyway. */
    case "csvall": exportAllCSV(); say("Les quatre tableaux ont été téléchargés en .csv."); break;
    /* Writing a note never touches a drawing or a bylaw: it is a sentence
       stored against the provision's number, with a name and a day. */
    case "noteopen": V.noteOn = V.noteOn === value ? null : value; break;
    case "notesave": {
      const el = document.querySelector(`[data-note="${CSS.escape(value)}"]`);
      const txt = (el?.value || "").trim();
      if (!txt) { say("Rien à écrire: la note est vide."); break; }
      (V.notes[value] ||= []).push({ who: "Chargée de projet", when: "aujourd'hui", txt });
      V.noteOn = null;
      say(`Note écrite sur ${value}. Elle reste dans fitte, rien n'est envoyé au texte officiel.`);
      break;
    }
    /* Three questions, in the order a person asks them: which body of
       rules, which part of it, which article. */
    case "addcode": V.dialog = { kind: "addcode", source: CODE_SOURCES[0].name, section: null, art: null }; break;
    case "picksource": V.dialog = { ...V.dialog, source: value, section: null, art: null }; break;
    case "picksection": V.dialog = { ...V.dialog, section: value, art: null }; break;
    case "pickart": V.dialog = { ...V.dialog, art: value }; break;
    case "addcodeok": {
      const d = V.dialog, src = CODE_SOURCES.find((s) => s.name === d.source);
      const a = (src?.arts[d.section] || []).find((x) => x.id === d.art);
      if (!a) { say("Choisissez un article avant d'ajouter."); break; }
      if (ARTICLES.some((x) => x.id === a.id)) { say(`${a.id} est déjà suivi.`); V.dialog = null; break; }
      ARTICLES.push({ id: a.id, topic: a.topic, doc: src.name, place: src.place, edition: src.edition,
        quote: a.quote, measured: "—", required: a.required, state: "non résolu",
        needs: a.needs, url: src.url, fig: a.fig });
      V.articleId = a.id; V.dialog = null;
      say(`${a.id} ajouté. Rien n'est mesuré tant que le dessin n'a pas été lu.`);
      break;
    }
    /* The calendar and the list are one object: a day click filters the
       list, a date in the list moves the calendar. */
    case "calday": V.day = value; break;
    /* Clicking a month in the year grid is asking to read that month. */
    case "calmonth": V.day = value; V.scale = "Mois"; break;
    case "calscale": V.scale = value; break;
    case "calmove": {
      const n = Number(value), v = V.scale;
      if (v === "Semaine") V.day = shift(V.day, 7 * n);
      else if (v === "Année") {
        const d = dOf(V.day); d.setUTCFullYear(d.getUTCFullYear() + n); V.day = iso(d);
      } else { const d = dOf(V.day); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); V.day = iso(d); }
      break;
    }
    case "task": { V.task = V.task === value ? null : value; const t = TASKS.find((x) => x.id === value);
      if (t) V.day = t.day; break; }
    case "tasktick": { const t = TASKS.find((x) => x.id === value); if (t) t.done = !t.done; break; }
    /* The source link is a real link: the browser follows it, and the screen
       only notes what was opened. */
    case "source": say(`${value} — texte officiel ouvert dans un onglet. Lecture seule.`); return render();
    case "utab": V.utab = Number(value); break;
    /* The right rail: the margin, or one tab of the folded inspector. */
    case "rtool":
      if (value === "notes") { V.rightTool = "notes"; break; }
      V.rightTool = "inspector";
      if (value === "quant") break;
      V.utab = Number(value.replace("utab", ""));
      break;
    case "pinscope": V.pinScope = value; break;
    /* Arming the pin: the next click on a drawing puts the point down, and
       nothing else on the screen changes meaning in the meantime. */
    case "pinmode": V.pinMode = !V.pinMode; V.pending = null; break;
    case "pincancel": V.pending = null; V.draft = ""; V.pinMode = false; break;
    case "pinpost": postPin(); return;
    case "note":
      V.selPin = V.selPin === Number(value) ? null : Number(value);
      break;
    case "notedel":
      V.pins = V.pins.filter((p) => p.id !== Number(value));
      V.selPin = null;
      savePins();
      break;
    /* Reading the screen as the shared link shows it. The studio's notes are
       not greyed in this view, they are not rendered — and their count goes
       with them, because a count of hidden things is itself a leak. */
    case "guest":
      V.guest = !V.guest;
      if (V.guest) { V.pinScope = "partage"; V.pinMode = false; V.pending = null; }
      break;
    /* The chips drive the panel, not V directly: the panel is the single
       source for the layers, and applyDial writes V and re-renders. Writing
       both would let the two disagree on the next dial change. */
    case "layer":
      if (value === "none") {
        ENG_DISCIPLINES.forEach((d) => { V.lay[d].on = false; });
        dial.setValue("layers.surveyor", false);
        dial.setValue("layers.landscaping", false);
      } else {
        dial.setValue(value === "arp" ? "layers.surveyor" : "layers.landscaping", !V.lay[value].on);
      }
      return;
    /* The four consultant disciplines are not part of the fidelity panel:
       they toggle straight on V, the way picking a row does. */
    case "englayer": V.lay[value].on = !V.lay[value].on; break;
    /* The unit the list is on, filling the pane: the move the plan is
       opened for, without hunting for it with the wheel. */
    case "fitunit": fitUnit(); break;
    /* The way back out: the sheet at its own size, centred, which is the
       state the pane opens in. No render — only the transform moves. */
    case "fitsheet":
      /* The sheet filling the pane, not the floor of the slider: below 100 %
         there is only paper, and nothing more of the drawing to see. */
      stopGlide();
      V.zoom = 100; V.pan = { x: 0, y: 0 };
      paintSheet();
      return;
    /* The camera has the same pair: the whole building in the pane, or close
       enough to read a façade. Both write the one number the slider shows. */
    case "mwide": case "mclose": {
      V.mzoom = el.dataset.act === "mwide" ? MZOOM_WIDE : MZOOM_CLOSE;
      const cam = document.querySelector("[data-mzoom]");
      if (cam) cam.value = String(V.mzoom);
      paintModelRead();
      window.fitteModel?.writeZoom(V.mzoom);
      return;
    }
    /* The two steppers move the same numbers the sliders move, so they do
       not go through render: the drawing must not be rebuilt to be pushed
       one notch. */
    case "zstep": {
      const [side, dir] = value.split(":");
      const k = dir === "+" ? 1 : -1;
      if (side === "plan") {
        zoomBy(Math.round(V.zoom * (dir === "+" ? 1.25 : 1 / 1.25)));
        paintSheet();
      } else {
        V.mzoom = Math.max(0, Math.min(100, V.mzoom + k * 8));
        const cam = document.querySelector("[data-mzoom]");
        if (cam) cam.value = String(V.mzoom);
        paintModelRead();
        window.fitteModel?.writeZoom(V.mzoom);
      }
      return;
    }
    case "reason": V.reason = V.reason === value ? null : value; break;
    case "save":
      if (!saveReady()) { say("Rien à enregistrer: choisissez une raison ou écrivez une phrase."); break; }
      V.settled[settleKey()] = [V.reason, V.note.trim()].filter(Boolean).join(" · ");
      say(`Décision enregistrée sur ${settleKey()}.`);
      V.reason = null; V.note = "";
      break;
    case "open":
      V.project = value;
      V.screen = "Unités";
      dial.setValue("screen", FR_SCREEN[V.screen]);
      break;
    /* A project is not created by a click: it is a folder on the server that
       someone points at, so the button opens the dialog that asks where. */
    case "newproject":
      V.dialog = { name: "", folder: "", kinds: ["Dessins DXF"], error: "" };
      break;
    case "dlgstop": return;
    case "dlgclose": V.dialog = null; break;
    case "dlgfolder": V.dialog.folder = value; V.dialog.error = ""; break;
    case "dlgkind": {
      const k = V.dialog.kinds;
      V.dialog.kinds = k.includes(value) ? k.filter((x) => x !== value) : [...k, value];
      break;
    }
    case "dlgcreate": {
      const d = V.dialog;
      /* Both answers are needed: a name with no folder has nothing to read,
         a folder with no name cannot be found again in the list. */
      if (!d.name.trim() || !d.folder.trim()) {
        d.error = "Il faut un nom et un dossier: la lecture part du dossier, la liste part du nom.";
        break;
      }
      if (!d.kinds.length) { d.error = "Choisissez au moins un type de fichier à lire."; break; }
      if (PROJECTS.some((p) => p[0].toLowerCase() === d.name.trim().toLowerCase())) {
        d.error = "Ce nom est déjà dans la liste."; break;
      }
      PROJECTS.unshift([d.name.trim(), "aucun dessin lu",
        `${d.folder.trim()} · ${d.kinds.length} type${d.kinds.length > 1 ? "s" : ""}`, "première lecture en attente", true]);
      say(`${d.name.trim()} — dossier connecté. La première lecture est en file; rien n'est écrit dans le dossier.`);
      V.dialog = null;
      V.screen = "Projets";
      dial.setValue("screen", FR_SCREEN[V.screen]);
      V.view["Projets"] = 0;
      break;
    }
    /* Sharing: a link, a right, and nothing else. The invitation itself is
       out of scope for the prototype — what is being judged is that read
       and comment are two different grants. */
    case "share":
      V.dialog = { kind: "share", right: "Lecture et commentaires" };
      break;
    case "shareright":
      V.dialog = { ...V.dialog, right: value };
      break;
    case "sharecopy":
      say(`Lien copié: ${value} — ${(V.dialog && V.dialog.right) || "Lecture et commentaires"}.`);
      break;
    case "autocad":
      say(`Remise à AutoCAD: ${dwgName()} s'ouvre sur l'unité, la décision suit.`);
      break;
    case "sketchup":
      say(`Remise à SketchUp: ${V.docs.skp} s'ouvre sur ${viewOf("Unités").toLowerCase()}. Lecture seule.`);
      break;
    case "export": say(`Export préparé: ${screen}${CONTEXT[screen] ? ` · ${viewOf(screen)}` : ""}.`); break;
    default: return;
  }
  render();
}

/* -------------------------------------------------------------- the dial */

const FI = { type: "select", options: ["inherit", "low", "high"], default: "inherit" };
/* The panel names a screen in English; the prototype knows it in French. */
const SCREEN_FR = { Projects: "Projets", Units: "Unités", Codes: "Codes", Schedule: "Échéancier" };
const FR_SCREEN = Object.fromEntries(Object.entries(SCREEN_FR).map(([en, fr]) => [fr, en]));

const sel = (options) => ({ type: "select", options, default: options[0] });

const dial = DialKit.createDialKit("Wireframe C3", {
  /* The panel is the tool, not the product: it stays in English while the
     screen it drives is in French. SCREEN_FR maps the two. */
  screen: sel(Object.keys(SCREEN_FR)),
  fidelity: sel(["high", "low"]),
  /* The region tags are a debugging overlay, not a default state: the panel
     opens on the screen as it is meant to be read. */
  regionLabels: false,
  journeySteps: true,
  density: sel(["comfortable", "compact"]),
  shell: sel(["Inset card", "Flat"]),
  /* The dark bar: the chrome stops imitating paper, so the drawing is the
     only white thing on the screen. Green marks the level, white marks the
     open view. The grey chrome is kept beside it for comparison. */
  chrome: sel(["Black", "Light"]),
  /* The whole screen on a dark ramp. The drawing keeps its own paper: a
     plan is a white sheet, and inverting it would be redrawing it. */
  theme: sel(["Light", "Dark"]),
  homeLayout: sel(["Card grid", "Table of projects", "List + preview", "Recent, then all", "Start first"]),
  isolate: sel(["none", "nav", "header", "list", "content", "inspector"]),
  /* One shortlist per screen, so the rail can be judged against what the
     screen actually holds rather than against a default grid of squares. */
  railIcons: { _collapsed: false,
    units: sel(NAV_ICONS["Unités"].map(([l]) => l)),
    codes: sel(NAV_ICONS["Codes"].map(([l]) => l)),
    schedule: sel(NAV_ICONS["Échéancier"].map(([l]) => l)) },
  /* The plan is black and white until a typology is asked for. */
  typologies: { _collapsed: false, "3½": false, "4½": false, "5½": false },
  layers: { _collapsed: false,
    surveyor: true,
    surveyorOpacity: [55, 0, 100, 5],
    landscaping: false,
    landscapingOpacity: [55, 0, 100, 5],
    align: { _collapsed: true,
      surveyorScale: [100, 60, 160, 1],
      surveyorX: [0, -40, 40, .5],
      surveyorY: [0, -40, 40, .5],
      landscapingScale: [100, 60, 160, 1],
      landscapingX: [0, -40, 40, .5],
      landscapingY: [0, -40, 40, .5] } },
  nav: { _collapsed: true, fidelity: FI,
    layout: sel(["Two rows, no rail", "Icon rail + tabs", "Top bar only", "Wide rail with labels",
      "Wide rail with sections", "Rail with labels under icons", "Rail only, no tabs",
      "Tabs only, no rail", "Rail + view menu", "Rail + breadcrumb"]),
    icons: sel(["Rail only", "Tabs only", "Rail and tabs", "None"]),
    labels: sel(["Full label", "Hover only", "Short code", "Numbered", "Uppercase", "Hidden"]),
    tabStyle: sel(["Plain", "Underline", "Pills", "Segmented", "Top accent", "Boxed"]),
    tabAlign: sel(["Left", "Centred", "Spread"]) },
  header: { _collapsed: true, fidelity: FI, layout: sel(["Title + actions", "Title only", "Title + metrics"]) },
  list: { _collapsed: true, fidelity: FI, layout: sel(["Card grid", "Vertical list", "Filter bar only", "Hidden"]) },
  content: { _collapsed: true, fidelity: FI, layout: sel(["Two panes", "Single pane + inset", "Stacked"]) },
  inspector: { _collapsed: true, fidelity: FI, layout: sel(["Right panel", "Bottom sheet", "Overlay drawer", "Hidden"]) },
/* The id carries the saved panel. It is bumped whenever a default changes,
   because a panel saved before it would keep reopening on the old one — the
   dark bar and the card grid would never be seen by anyone who had already
   opened the file. r3: dark chrome and unit cards by default. r4: the
   Coordination tab and its glyph, which a saved panel would otherwise pin
   back to Layers. r5: the footer strip is gone, so its group must not
   reappear from a saved panel. r6: the Codes glyph is a number sign, and
   a panel saved on "Scale" would name an option that no longer exists. */
}, { id: "wireframe-c3-r6", persist: true });

DialKit.createDialRoot({ position: "top-right", theme: "light" });

function applyDial(v) {
  V.screen = SCREEN_FR[v.screen] || V.screen;
  V.fidelity = v.fidelity;
  V.labels = v.regionLabels;
  V.journey = v.journeySteps;
  V.density = v.density;
  V.shell = v.shell;
  V.chrome = v.chrome;
  V.homeLayout = v.homeLayout;
  V.isolate = v.isolate;
  /* On the root, not on the frame: the toast and the dialog sit outside it
     and read the same tokens. */
  document.documentElement.dataset.theme = String(v.theme || "").toLowerCase() === "dark" ? "dark" : "light";
  /* The panel names the glyph in English and title-cases what it is given,
     so the label is matched without regard to case. */
  const pick = (screen, label) => {
    const want = String(label || "").toLowerCase();
    const hit = NAV_ICONS[screen].find(([l]) => l.toLowerCase() === want);
    V.icons[screen] = (hit || NAV_ICONS[screen][0])[1];
  };
  pick("Unités", v.railIcons.units);
  pick("Codes", v.railIcons.codes);
  pick("Échéancier", v.railIcons.schedule);
  const la = v.layers, al = la.align;
  TYPOS.forEach((t) => { V.typo[t] = v.typologies[t]; });
  V.lay.arp = { on: la.surveyor, opacity: la.surveyorOpacity,
    scale: al.surveyorScale, x: al.surveyorX, y: al.surveyorY };
  V.lay.pay = { on: la.landscaping, opacity: la.landscapingOpacity,
    scale: al.landscapingScale, x: al.landscapingX, y: al.landscapingY };
  ["nav", "header", "list", "content", "inspector"].forEach((r) => { V[r] = v[r]; });
  render();
}

dial.subscribe(applyDial);

sprite();
/* The notes outlive the tab: they are read back before the first paint, and
   the model's picker is wired once because its canvas survives re-renders. */
V.pins = loadPins();
wireModelPins();
/* The first paint happens while the model is still downloading, so the pins
   hung on it are handed over again the moment there is a camera. */
window.addEventListener("fitte:model-state", (e) => { if (e.detail === "ready") pushModelPins(); });
applyDial(dial.values);
</script>
</body>
</html>
