<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype C — wireframe</title>
<link rel="stylesheet" href="vendor/geist/geist.css">
<link rel="stylesheet" href="vendor/dialkit/styles.css">
<style>
/* Low fidelity on purpose: one grey, one line weight, one type size ramp.
   What is being tested here is where things sit and in what order they are
   read, not how they look. */
:root{
  --sans:'Geist',ui-sans-serif,system-ui,sans-serif;
  --ink:#1b1b1b; --ink-2:#6b6b6b; --ink-3:#9b9b9b;
  --line:#c9c9c9; --line-2:#e2e2e2;
  --fill:#ededed; --fill-2:#f6f6f6; --page:#fafafa;
  --bar:#dcdcdc;
  --hi:#111;
  --gap:10px; --pad:12px; --r:6px;
}
[data-density="compact"]{--gap:6px;--pad:8px}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--sans)}
body{background:var(--page);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* The prototype is the screen: no page chrome around it, no explainer under
   it. What is being judged fills the window. */
.stage{padding:0;max-width:none;margin:0;height:100vh;display:flex}
/* render() writes the frame into this wrapper, so the wrapper has to carry
   the stretch as well. */
#frame{flex:1;display:flex;min-width:0}

/* screen frame -------------------------------------------------------- */
.frame{margin:0;border:0;border-radius:0;background:#fff;
  flex:1;height:100vh;display:grid;overflow:hidden;position:relative}
.frame[data-nav="rail"]{grid-template-columns:86px 1fr;grid-template-rows:1fr}
.frame[data-nav="wide"]{grid-template-columns:180px 1fr;grid-template-rows:1fr}
.frame[data-nav="top"]{grid-template-columns:1fr;grid-template-rows:1fr}
.frame[data-nav="stack"]{grid-template-columns:72px 1fr;grid-template-rows:1fr}

/* The rail is as wide as its items: the tile stretches to the column instead
   of overflowing a column narrower than itself. */
.rail{border-right:1px solid var(--line-2);background:var(--fill-2);
  display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px 8px}
.rail.wide{align-items:stretch;padding:10px}
.rail .ic{width:auto;height:auto;min-height:30px;border-radius:var(--r);background:var(--fill);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:7px 4px;color:var(--ink-3)}
.rail .ic.on{background:var(--bar);color:var(--ink)}
.rail .row{display:flex;align-items:center;gap:8px;padding:4px;border-radius:var(--r)}
.rail .row.on{background:var(--bar)}

.body{display:flex;flex-direction:column;min-width:0}
.tabs{height:40px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;
  gap:4px;padding:0 10px;flex:0 0 auto}
.tabs button{border:0;background:transparent;font-size:12.5px;color:var(--ink-2);
  padding:6px 9px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tabs button[aria-current="true"]{background:var(--fill);color:var(--ink);font-weight:500}
.tabs .sp{flex:1}

/* rail with the label under the icon */
.rail.stack{align-items:stretch;padding:10px 6px}
.rail .stk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
  border-radius:var(--r);font-size:10px;color:var(--ink-2);text-align:center}
.rail .stk.on{background:var(--bar);color:var(--ink)}

/* how the tab strip presents itself */
.tabs[data-align="Centred"]{justify-content:center}
.tabs[data-align="Centred"] .sp{display:none}
.tabs[data-align="Spread"] button{flex:1;justify-content:center}
.tabs[data-align="Spread"] .sp{display:none}
.tabs[data-style="Underline"] button{border-radius:0}
.tabs[data-style="Underline"] button[aria-current="true"]{background:transparent;
  box-shadow:inset 0 -2px 0 var(--ink)}
.tabs[data-style="Pills"] button{border:1px solid var(--line-2);border-radius:999px}
.tabs[data-style="Pills"] button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs[data-style="Segmented"]{gap:0}
.tabs[data-style="Segmented"] button{border-radius:0;border-right:1px solid var(--line-2);background:var(--fill-2)}
.tabs[data-style="Segmented"] button:first-of-type{border-top-left-radius:6px;border-bottom-left-radius:6px}
.tabs[data-style="Segmented"] button:last-of-type{border-right:0;border-top-right-radius:6px;border-bottom-right-radius:6px}
.tabs[data-style="Segmented"] button[aria-current="true"]{background:#fff;color:var(--ink)}

/* label presets, shared by the rail and the tab strip */
.rail[data-labels-mode="Hidden"] .hi:not(.code),.tabs[data-labels-mode="Hidden"] .hi:not(.code),
.rail[data-labels-mode="Hover only"] .hi:not(.code),.tabs[data-labels-mode="Hover only"] .hi:not(.code){display:none}
.tabs[data-labels-mode="Hover only"] button:hover .hi,
.rail[data-labels-mode="Hover only"] .row:hover .hi,
.rail[data-labels-mode="Hover only"] .stk:hover .hi{display:inline}
.rail[data-labels-mode="Uppercase"] .hi,.tabs[data-labels-mode="Uppercase"] .hi{
  text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.rail[data-labels-mode="Short code"] .hi,.tabs[data-labels-mode="Short code"] .hi{letter-spacing:.04em}
/* a caption that does not fit on one line wraps rather than truncating:
   "Coordination" is a destination, not an ellipsis */
.rail .ic .cap{font-size:9px;line-height:1.2;text-align:center;max-width:100%;
  white-space:normal;overflow-wrap:normal;hyphens:none;color:var(--ink-3)}
.rail .ic.on .cap{color:var(--ink)}
.rail .code{font-size:9.5px;letter-spacing:.03em;color:inherit}
.rail .sct{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:8px 4px 2px}
.rail.stack .stk .hi{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail.wide .row .hi{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* breadcrumb, screen menu and grouped tabs live in the tab strip */
.tabs .crumb{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
/* the crumb is a .hi too, and the fidelity rule sets .hi to block: this wins
   on specificity so the folder keeps its gap from the label */
.tabs .crumb.hi{display:inline-flex}
.tabs .crumb .lu{width:13px;height:13px;flex:0 0 13px}
.tabs .crumb:hover{color:var(--ink)}
.tabs .crumb.on{cursor:default}
.tabs .crumb.on{color:var(--ink);font-weight:500}
.tabs .grp{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:0 6px 0 2px}
.tabs .div{width:1px;height:18px;background:var(--line-2);margin:0 6px}
.tabs [data-menu]{cursor:pointer}
.tabs[data-style="Top accent"] button{border-radius:0}
.tabs[data-style="Top accent"] button[aria-current="true"]{background:transparent;
  box-shadow:inset 0 2px 0 var(--ink)}
.tabs[data-style="Boxed"] button{border:1px solid transparent}
.tabs[data-style="Boxed"] button[aria-current="true"]{background:#fff;border-color:var(--line-2);
  box-shadow:0 1px 2px rgba(0,0,0,.05)}

.work{flex:1;min-height:0;display:grid;gap:var(--gap);padding:var(--gap)}
.pane{border:1px solid var(--line-2);border-radius:var(--r);background:#fff;
  display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden}
.pane > .ph{height:34px;flex:0 0 auto;border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;color:var(--ink-2)}
.pane > .pb{flex:1;min-height:0;overflow:auto;padding:var(--pad);display:flex;flex-direction:column;gap:8px}
.pane.flat > .pb{padding:0}

/* low-fi primitives --------------------------------------------------- */
.bar{height:9px;border-radius:3px;background:var(--bar)}
.bar.lt{background:var(--fill)}
.box{background:var(--fill);border-radius:var(--r);flex:1}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.chip{height:22px;border:1px solid var(--line-2);border-radius:999px;background:var(--fill-2);
  display:inline-flex;align-items:center;gap:5px;padding:0 9px;font-size:11.5px;color:var(--ink-2)}
.btnw{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--fill-2);
  display:inline-flex;align-items:center;gap:6px;padding:0 9px;font-size:12px;color:var(--ink-2)}
.btnw.solid{background:var(--bar);border-color:var(--line);color:var(--ink)}
.pcard{cursor:pointer}
.pcard:hover{border-color:var(--line);background:var(--fill-2)}
.tile{border:1px solid var(--line-2);border-radius:var(--r);padding:10px;display:flex;
  flex-direction:column;gap:6px;min-width:0}
.listrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px}
.listrow.on{background:var(--fill)}
.listrow .dot{width:8px;height:8px;border-radius:50%;background:var(--bar);flex:0 0 8px}
.plan{flex:1;background:repeating-linear-gradient(0deg,var(--fill-2) 0 15px,transparent 15px 16px),
  repeating-linear-gradient(90deg,var(--fill-2) 0 15px,transparent 15px 16px);
  border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--ink-3);font-size:11.5px}
/* A card with no drawing behind it shows the picture glyph, not a sentence
   describing a picture. */
.plan.ghost{color:var(--line-2)}
.plan.ghost .lu{width:22px;height:22px;stroke-width:1.5}
/* the projects page: one ratio for every project, so the rows line up */
.pcard{cursor:pointer}
.pcard .thumb{aspect-ratio:16 / 9;flex:0 0 auto;position:relative}
.pcard .thumb.mark{display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);
  border-radius:var(--r);overflow:hidden}
.pcard .thumb.mark span{font-size:20px;font-weight:600;letter-spacing:.04em}
.pcard .thumb .lv{position:absolute;right:6px;bottom:5px;z-index:2;font-size:10px;color:var(--ink-3);
  background:rgba(255,255,255,.86);border-radius:4px;padding:1px 5px}
.pnew .newbox{aspect-ratio:16 / 9;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--fill-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:12px}
.state{display:inline-flex;align-items:center;gap:5px}
/* the home fills the width it is given, whatever the window is */
.work > div > .pane{flex:1 1 auto;min-width:0}
.state .d{width:6px;height:6px;border-radius:50%;background:var(--bar)}
.state[data-open="1"]{color:var(--hi)}
.state[data-open="1"] .d{background:var(--hi)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-weight:500;color:var(--ink-3);font-size:11px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.sheet{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--line);
  background:#fff;box-shadow:0 -8px 24px rgba(0,0,0,.07);z-index:3}
.drawer{position:absolute;top:0;right:0;bottom:0;width:360px;border-left:1px solid var(--line);
  background:#fff;box-shadow:-10px 0 28px rgba(0,0,0,.08);z-index:3}

/* fidelity ------------------------------------------------------------ */
[data-fi="high"] .bar{display:none}
[data-fi="high"] .hi{display:block}
.hi{display:none}
[data-fi="high"] .lo{display:none}
[data-fi="high"] .pane{border-color:var(--line)}

/* inset card: the chrome sinks into a grey field and the work becomes one
   white card floating on it, the way a document-first app reads */
.frame[data-shell="inset"]{background:var(--fill-2);border-color:#eaeaec}
.frame[data-shell="inset"] .rail{background:none;border-right:0}
.frame[data-shell="inset"] .tabs{border-bottom:0}
.frame[data-shell="inset"] .body{padding:0 10px 10px}
.frame[data-shell="inset"] .work{background:#fff;border:1px solid var(--line);border-radius:12px;
  gap:0;padding:0;overflow:hidden}
.frame[data-shell="inset"] .pane{border:0;border-radius:0;background:none}
.frame[data-shell="inset"] .work > div > .pane,
.frame[data-shell="inset"] .work > .pane{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.frame[data-shell="inset"] .pane.sheet,.frame[data-shell="inset"] .pane.drawer{background:#fff;border:1px solid var(--line)}

/* High fidelity swaps the hatch for the drawing it stands for: the floor
   plan, the elevation, or the massing view, all from the platform assets. */
[data-fi="high"] .plan{background:none;border-style:solid}
[data-fi="high"] .plan[data-img]{background-repeat:no-repeat;background-position:center;
  background-size:cover;border-color:var(--line)}
[data-fi="high"] .plan[data-img] > .hi{display:none}
[data-fi="high"] .plan[data-img="plan"]{background-image:url(assets/plan-etage.jpg)}
[data-fi="high"] .plan[data-img="model"]{background-image:url(assets/skp-facade.jpg)}
[data-fi="high"] .plan[data-img="massing"]{background-image:url(assets/skp-ensemble.jpg)}

/* The consultants' sheets sit over the floor plan in one shared coordinate
   space: the plan box takes the drawing's own aspect and is drawn edge to
   edge, so a percentage means the same thing on every layer. */
.plan.align{aspect-ratio:1280 / 1160;height:auto;flex:0 0 auto;overflow:hidden}
[data-fi="high"] .plan.align[data-img]{background-size:100% 100%;background-position:0 0}
.plan .lay{position:absolute;display:none;background-repeat:no-repeat;
  background-size:100% 100%;pointer-events:none;z-index:1}
[data-fi="high"] .plan[data-img] .lay{display:block}
.plan .lay[data-lay="arp"]{background-image:url(assets/arp-site.png)}
/* The landscaping sheet is drawn the other way round from the surveyor's:
   the 8,26 m drive island reads (.375,.313) on one and (.354,.276) on the
   other once both are measured against their property lines. The file stays
   as extracted; the half turn happens here. */
.plan .lay[data-lay="pay"]{background-image:url(assets/paysage.png);transform:rotate(180deg)}
[data-fi="high"] .btnw.solid{background:var(--hi);color:#fff;border-color:var(--hi)}
[data-fi="high"] .listrow.on{background:#eef1e0}
[data-fi="high"] .listrow .dot{background:#8ba00f}

/* region tagging ------------------------------------------------------ */
.rg{position:relative}
[data-labels="true"] .rg{outline:1px dashed #b9b9ff;outline-offset:-1px}
[data-labels="true"] .pane.rg,[data-labels="true"] .rail.rg,[data-labels="true"] .tabs.rg{padding-top:14px}  /* room for the tag */
[data-labels="true"] .rg::after{content:attr(data-rg);position:absolute;top:0;left:0;z-index:4;
  background:#4b4bd6;color:#fff;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 5px;border-bottom-right-radius:4px;pointer-events:none}
[data-isolate]:not([data-isolate="none"]) .rg{opacity:.12;filter:grayscale(1)}
[data-isolate]:not([data-isolate="none"]) .rg.solo{opacity:1;filter:none;outline:1px solid #4b4bd6}
.step{position:absolute;z-index:5;width:19px;height:19px;border-radius:50%;background:var(--hi);
  color:#fff;font-size:11px;display:none;place-items:center;top:6px;right:6px}
[data-journey="true"] .step{display:grid}

/* journey strip ------------------------------------------------------- */
.journey{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 14px}
.journey h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .st{flex:1;min-width:150px;border:1px solid var(--line-2);border-radius:6px;padding:9px 10px;margin-right:18px;position:relative}
.flow .st:last-child{margin-right:0}
.flow .st::after{content:"";position:absolute;right:-13px;top:50%;width:8px;height:8px;
  border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.flow .st:last-child::after{display:none}
.flow .st.on{border-color:var(--hi)}
.flow .st b{display:block;font-size:12.5px;font-weight:600}
.flow .st span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.flow .st em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:4px;
  letter-spacing:.06em;text-transform:uppercase}
.flow .st .num{position:absolute;top:-8px;left:9px;width:17px;height:17px;border-radius:50%;
  background:var(--hi);color:#fff;font-size:10.5px;display:grid;place-items:center}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;background:var(--bar);display:inline-block}
.legend i.dash{background:none;border:1px dashed #b9b9ff}
svg.lu{width:14px;height:14px;stroke-width:1.8;color:currentColor}
</style>
</head>
<body>
<div class="stage">
  <div id="frame"></div>
</div>

<script src="vendor/lucide/lucide.min.js"></script>
<script src="vendor/dialkit/browser.global.js"></script>
<script>
/* ---------------------------------------------------------------- state */

const V = {
  screen: "Unités",
  fidelity: "basse",
  labels: true,
  journey: true,
  density: "confortable",
  shell: "À plat",
  homeLayout: "Grille de fiches",
  isolate: "none",
  nav: { fidelity: "héritée", layout: "Rail d'icônes + onglets" },
  header: { fidelity: "héritée", layout: "Titre + actions" },
  list: { fidelity: "héritée", layout: "Liste verticale" },
  content: { fidelity: "héritée", layout: "Deux volets" },
  inspector: { fidelity: "héritée", layout: "Panneau de droite" },
  footer: { fidelity: "héritée", layout: "Bandeau d'impact" },
  lay: { arp: { on: true, opacity: 55, scale: 100, x: 0, y: 0 },
    pay: { on: false, opacity: 55, scale: 100, x: 0, y: 0 } },
};

const icon = (n) => `<svg class="lu"><use href="#lu-${n}"></use></svg>`;

/* Lucide ships as a sprite-less library, so the icons are stamped once into
   a hidden sprite and referenced by id afterwards. */
function sprite() {
  const names = ["home", "folder", "image", "layout-grid", "layers", "table", "scale", "git-compare", "calendar-check",
    "file", "box", "pen-line", "chevron-right", "chevron-down", "search", "plus", "minus", "maximize",
    "external-link", "check", "alert-triangle", "info", "clock", "list", "circle", "image"];
  const defs = names.map((n) => {
    const node = lucide.icons[toPascal(n)];
    if (!node) return "";
    const inner = node[2].map(([tag, attrs]) =>
      `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`).join("");
    return `<symbol id="lu-${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-linecap="round" stroke-linejoin="round">${inner}</symbol>`;
  }).join("");
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("style", "display:none");
  s.innerHTML = defs + '<symbol id="x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#111"/></symbol>';
  document.body.append(s);
}
const toPascal = (n) => n.split("-").map((p) => p[0].toUpperCase() + p.slice(1)).join("");

/* --------------------------------------------------------------- screens */

const SCREENS = {
  "Projets": { icon: "folder", regions: ["header", "content"], steps: {}, home: true, index: true },
  "Vue d'ensemble": {
    icon: "layout-grid",
    regions: ["header", "content", "inspector"],
    steps: { content: 1, inspector: 2 },
  },
  "Unités": {
    icon: "layers",
    regions: ["header", "list", "content", "inspector", "footer"],
    steps: { list: 1, content: 2, inspector: 3, footer: 4 },
  },
  "Quantités": { icon: "table", regions: ["header", "content"], steps: { header: 1, content: 2 } },
  /* Rules is not a destination: an article is only read against a number the
     drawings produced, so it lives inside the overview. */
  "Coordination": {
    icon: "git-compare",
    regions: ["header", "list", "content", "inspector"],
    steps: { list: 1, content: 2, inspector: 3 },
  },
  "Suivi": { icon: "calendar-check", regions: ["header", "content", "inspector"], steps: { inspector: 1, content: 2 } },
};

/* Unit boxes measured on assets/plan-etage.jpg, normalised 0–1, same numbers
   the platform uses. A thumbnail shows its own unit, never the whole sheet. */
const UNIT_BOXES = [
  [0.3953, 0.5862, 0.1203, 0.1586], [0.5063, 0.0328, 0.1141, 0.1552],
  [0.6281, 0.0328, 0.1172, 0.1552], [0.1609, 0.7293, 0.1266, 0.2172],
  [0.2203, 0.5207, 0.1422, 0.1724], [0.2203, 0.3483, 0.1422, 0.1724],
  [0.4891, 0.2259, 0.1984, 0.1552], [0.2203, 0.1362, 0.1625, 0.2034],
];

/* Frames one box with air around it: the drawing is scaled so the box fills
   the element, then slid so the box sits in the middle. */
function crop(box, pad = 0.45, axis = "width") {
  const [x, y, w, h] = box;
  const fw = Math.min(1, w * (1 + pad * 2));
  const fh = Math.min(1, h * (1 + pad * 2));
  const px = Math.max(0, Math.min(1 - fw, x + w / 2 - fw / 2));
  const py = Math.max(0, Math.min(1 - fh, y + h / 2 - fh / 2));
  /* A wide, short box reads better scaled off its height: the unit fills the
     strip and the neighbouring units supply the context on either side. */
  const size = axis === "height" ? `auto ${(100 / fh).toFixed(1)}%` : `${(100 / fw).toFixed(1)}% auto`;
  return `background-size:${size};`
    + `background-position:${(px / (1 - fw) * 100).toFixed(1)}% ${(py / (1 - fh) * 100).toFixed(1)}%`;
}

/* Where each consultant's building sits inside its own sheet, measured once
   and normalised 0–1. The surveyor's box is the teal implantation outline;
   the landscaping box is the same outline carried across by the two property
   lines, which agree to within half a percent on the drive island. */
const SHEETS = {
  arp: { box: [.159, .246, .818, .814] },
  pay: { box: [.138, .224, .808, .796] },
};
/* The floor plan's own building, in the same terms. */
const BASE_BOX = [.014, .019, .978, .961];

/* Places one sheet so its building lands on the floor plan's building, then
   adds the nudge the panel holds. The ground sheets cover the podium, so
   they bound the typical floor rather than trace it. */
function sheetStyle(key) {
  const L = V.lay[key];
  const [bx0, by0, bx1, by1] = BASE_BOX;
  const [sx0, sy0, sx1, sy1] = SHEETS[key].box;
  const w = (bx1 - bx0) / (sx1 - sx0) * L.scale / 100;
  const h = (by1 - by0) / (sy1 - sy0) * L.scale / 100;
  const left = bx0 - sx0 * w + L.x / 100;
  const top = by0 - sy0 * h + L.y / 100;
  return `left:${(left * 100).toFixed(2)}%;top:${(top * 100).toFixed(2)}%;`
    + `width:${(w * 100).toFixed(2)}%;height:${(h * 100).toFixed(2)}%;opacity:${L.opacity / 100}`;
}

const layersHTML = () => ["arp", "pay"].filter((k) => V.lay[k].on)

  { n: 5, t: "Vérifier ce que ça brise", d: "Quel article, quel conflit, quelle échéance.", s: "Vue d'ensemble" },

/* ------------------------------------------------------------- fidelity */

/* Isolation keeps the frame intact and fades everything that is not the
   region under study, so a variant is judged in place rather than alone. */
const ISO = { navigation: "nav", "entête": "header", liste: "list", contenu: "content",
  inspecteur: "inspector", "pied de page": "footer" };
const solo = (region) => (V.isolate !== "aucune" && ISO[V.isolate] === region ? "solo" : "");

/* The panel speaks French; the data attribute stays English because the
   stylesheet keys off it. */
const FI_ATTR = { haute: "high", basse: "low" };
const fiOf = (region) => FI_ATTR[(V[region] && V[region].fidelity !== "héritée"
  ? V[region].fidelity : V.fidelity)] || "low";
const wrap = (region, label, html, step) =>
  `<div class="rg" data-rg="${label}" data-fi="${fiOf(region)}" style="display:contents">${html}</div>`
    .replace("</div>", "</div>"); // regions are grid children; see region()

/* A region is a grid child, so the tag and fidelity attributes live on the
   element itself rather than on a wrapper that would break the layout. */
function region(name, label, inner, step) {
  const s = step ? `<span class="step">${step}</span>` : "";
  return `<section class="pane rg ${solo(name)}" data-rg="${label}" data-fi="${fiOf(name)}" data-region="${name}">${s}${inner}</section>`;
}

const bars = (n, w = [100, 70, 85]) =>
  Array.from({ length: n }, (_, i) => `<div class="bar" style="width:${w[i % w.length]}%"></div>`).join("");

/* Sections only appear in the grouped rail: the first three screens read a
   project, the next three act on it, the last one stores it. */
const SECTIONS = { 0: "Lecture", 3: "Décision", 6: "Archive" };
const SHORT = (name) => name.slice(0, 3).toUpperCase();

/* One label rule for the rail and the tabs, so a title never reads two ways
   on the same screen. Hover and Hidden are CSS, the rest rewrite the text. */
function navLabel(name, i) {
  const m = V.nav.labels;
  if (m === "Code court") return SHORT(name);
  if (m === "Numéroté") return `${i + 1}. ${name}`;
  return name;
}

const tabIcons = () => V.nav.icons === "Rail et onglets" || V.nav.icons === "Onglets seulement";

function navHTML() {
  if (SCREENS[V.screen].index) return "";
  const mode = V.nav.layout;
  if (mode === "Barre du haut seulement" || mode === "Onglets seulement, sans rail") return "";
  const sections = mode === "Rail large avec sections";
  const wide = mode === "Rail large avec libellés" || sections;
  const stack = mode === "Rail avec libellés sous les icônes";
  const ic = railIcons();
  const items = NAV.map(([glyph, name], i) => {
    const on = name === V.screen ? "on" : "";
    const g = ic ? icon(glyph) : "";
    const text = `<span class="hi">${navLabel(name, i)}</span>`;
    const head = sections && SECTIONS[i] ? `<div class="sct hi">${SECTIONS[i]}</div>` : "";
    if (wide) return `${head}<div class="row ${on}" data-screen="${name}" title="${name}">${g}<span class="lo bar" style="width:70%"></span>${text}</div>`;
    if (stack) return `<div class="stk ${on}" data-screen="${name}" title="${name}">${g}<span class="lo bar" style="width:70%;height:6px"></span>${text}</div>`;
    return `<div class="ic ${on}" data-screen="${name}" title="${name}">${g || `<span class="code hi">${SHORT(name)}</span>`}${g ? `<span class="cap hi">${navLabel(name, i)}</span>` : ""}</div>`;
  }).join("");
  const cls = wide ? "wide" : stack ? "stack" : "";
  return `<nav class="rail rg ${solo("nav")} ${cls}" data-rg="navigation" data-fi="${fiOf("nav")}"
       data-labels-mode="${V.nav.labels}">${items}</nav>`;
}

/* The rail and the tab strip never carry the same destinations. When the
   rail lists the screens, the strip drops to the current screen's own views. */

  "Projets": ["En cours", "Archivés"],
  "Vue d'ensemble": ["Ce qui a changé", "Totaux", "Zonage et code", "Ce qui bloque"],
  "Unités": ["Niveau 5", "Niveau 4", "Niveau 3", "Tous les niveaux"],

};

function tabsHTML() {
  const mode = V.nav.layout;
  if (mode === "Rail seulement, sans onglets") return "";
  const top = mode === "Barre du haut seulement";
  const ic = tabIcons();
  const names = Object.keys(SCREENS).filter((n) => !SCREENS[n].index);
  /* Icons off and labels away would leave an empty strip, so the short code
     stands in: a tab target never renders without something to read. */
  const bare = !ic && (V.nav.labels === "Masqué" || V.nav.labels === "Au survol seulement");
  const tab = (name, i) => `<button data-screen="${name}" aria-current="${name === V.screen}" title="${name}">
      ${ic ? icon(SCREENS[name].icon) : ""}<span class="lo bar" style="width:46px"></span>
      ${bare ? `<span class="hi code">${SHORT(name)}</span>` : `<span class="hi">${navLabel(name, i)}</span>`}</button>`;

  let items;
  const views = CONTEXT[V.screen] || ["Vue d'ensemble"];
  /* The index is reached from the words "Tous les projets". They sit in the strip
     on every screen; on the index itself they are the only thing in it. */
  const back = `<span class="crumb hi" data-screen="Projets" title="Tous les projets">${icon("folder")}Tous les projets</span>`;
  if (SCREENS[V.screen].index) {
    items = `<span class="crumb on hi">${icon("folder")}Tous les projets</span><span class="sp"></span>`;
  } else if (mode === "Rail + menu des vues") {
    items = `<span class="btnw solid" data-menu><span class="hi">${views[0]}</span>${icon("chevron-down")}</span>
      <span class="sp"></span>
      <span class="chip hi">1 of ${views.length}</span>`;
  } else if (mode === "Rail + fil d'Ariane") {
    items = `${back}${icon("chevron-right")}
      <span class="crumb on hi">Alder Court</span>
      <span class="sp"></span>`;
  } else if (top || mode === "Onglets seulement, sans rail") {
    items = `${back}<span class="div"></span>${names.map(tab).join("")}<span class="sp"></span>`;
  } else {
    /* A rail is on screen, so the strip shows this screen's views instead
       of repeating the screen list. */
    items = `${back}<span class="div"></span>${views.map((t, i) => `<button aria-current="${i === 0}" title="${t}">
        <span class="lo bar" style="width:46px"></span><span class="hi">${t}</span></button>`).join("")}
      <span class="sp"></span>`;
  }

  return `<div class="tabs rg ${solo("nav")}" data-rg="${top ? "navigation + onglets" : "onglets"}" data-fi="${fiOf("nav")}"
       data-style="${V.nav.tabStyle}" data-align="${V.nav.tabAlign}" data-labels-mode="${V.nav.labels}">
    ${top ? `<span class="btnw" style="margin-right:8px">${icon("box")}<span class="hi">ça fitte</span></span>` : ""}
    ${items}
  </div>`;
}

          <div class="hi" style="color:var(--ink-2);font-size:11.5px">liste de lignes lues dans les dessins</div></div>`).join("")}</div>
        <div class="pane" style="flex:0 0 auto">
          <div class="ph">${icon("scale")}<span class="lo bar" style="width:90px"></span>
            <span class="hi">Zonage et code</span><span style="flex:1"></span>
            <span class="chip"><span class="lo bar" style="width:52px"></span><span class="hi">5 non résolus</span></span></div>
          <div class="pb">
            <div class="row" style="flex-wrap:wrap">${["art. 9 hauteur", "art. 43 implantation", "art. 22 marge arrière", "art. 71 stationnement", "art. 134 verdissement", "3.2.3.1 ouvertures"]
              .map((t, i) => `<span class="chip" style="${i === 2 ? "border-color:var(--ink)" : ""}">
              <span class="lo bar" style="width:54px"></span><span class="hi">${t}</span></span>`).join("")}</div>
            <div class="tile"><div class="lo bar" style="width:55%"></div><div class="hi" style="font-weight:600">art. 22 — marge arrière</div>
              <div class="lo bar lt" style="width:90%"></div>
              <div class="hi" style="font-size:11.5px;color:var(--ink-2)">« La marge arrière minimale est de 3,00 m »</div></div>
            <div class="row" style="gap:var(--gap)">
              ${[["2.70 m", "mesuré dans les dessins"], ["3.00 m", "exigé par l'article"]].map(([a, b]) => `<div class="tile" style="flex:1">
                <div class="lo bar" style="width:60px;height:16px"></div><div class="hi" style="font-size:17px;font-weight:600">${a}</div>
                <div class="lo bar lt" style="width:80%"></div>
                <div class="hi" style="font-size:11.5px;color:var(--ink-2)">${b}</div></div>`).join("")}</div>
            <div class="tile"><div class="lo col">${bars(2)}</div>
              <div class="hi" style="font-size:12px;color:var(--ink-2)">lecture simple de l'écart, puis ce qui manque pour conclure</div></div>
            <div class="tile"><div class="row">${icon("alert-triangle")}<span class="lo bar" style="width:70%"></span>
              <span class="hi" style="font-size:11.5px">données manquantes, communes à tous les articles</span></div></div>
          </div></div></div>`,
    "Quantités": () => `<div class="col" style="flex:1">
        <div class="row">${["Unités", "Superficie par étage", "Fenêtres", "Matériaux"].map((t, i) => `<span class="chip" style="${i === 0 ? "border-color:var(--ink)" : ""}">
          <span class="lo bar" style="width:46px"></span><span class="hi">${t}</span></span>`).join("")}</div>
        <table class="tbl"><thead><tr>${["Type", "Par étage", "Projet", "pi² moy", "pi² total", "Part"].map((h) => `<th><span class="lo bar" style="width:40px"></span><span class="hi">${h}</span></th>`).join("")}</tr></thead>
        <tbody>${[["3½", 3, 21, 729, 2187, "21 %"], ["3½+den", 1, 7, 880, 880, "7 %"], ["4½", 5, 35, 1147, 5733, "36 %"], ["4½+den", 1, 7, 1494, 1494, "7 %"], ["5½", 4, 28, 1424, 5695, "29 %"]]
          .map((r) => `<tr>${r.map((c, i) => `<td class="${i ? "n" : ""}"><span class="lo bar" style="width:${i ? 34 : 50}px"></span><span class="hi">${c}</span></td>`).join("")}</tr>`).join("")}</tbody></table>
        <div class="tile"><div class="row">${icon("info")}<span class="lo bar" style="width:60%"></span>
          <span class="hi" style="font-size:11.5px">fichier source, révision et heure de lecture sous chaque tableau</span></div></div></div>`,

    "Coordination": () => `<div class="col" style="flex:1">
        <div class="pane" style="max-width:420px"><div class="pb"><div class="plan" data-img="plan" style="height:170px;flex:0 0 170px">
          <span class="lo"></span><span class="hi">deux dessins superposés, chevauchement marqué</span></div></div></div>
        <div class="tile"><div class="lo col">${bars(3)}</div>
          <div class="hi" style="font-size:12px;color:var(--ink-2)">quels deux fichiers, quel niveau, quelle unité est touchée</div></div></div>`,
    "Suivi": () => `<div class="col" style="flex:1">
        <div class="row">${["Programme", "Esquisse", "Comité", "Permis", "Site"].map((t, i) => `<span class="chip" style="${i === 2 ? "border-color:var(--ink)" : ""}">
          <span class="lo bar" style="width:44px"></span><span class="hi">${t}</span></span>`).join("")}</div>
        ${[1, 2, 3, 4, 5].map((i) => `<div class="listrow"><span class="dot" style="border-radius:3px"></span>
          <span class="lo bar" style="flex:1"></span>
          <span class="hi" style="font-size:12px">${["Tableau des superficies par étage", "Répartition des typologies", "Élévations avec matériaux", "Demande de dérogation mineure rédigée", "Note à l'urbaniste"][i - 1]}</span></div>`).join("")}</div>`,
  }[V.screen]();

  return region("content", "contenu", `<div class="ph">${icon("box")}
    <span class="lo bar" style="width:80px"></span><span class="hi">${V.screen}</span>
    <span style="flex:1"></span>
    ${V.screen === "Unités" ? `<span class="btnw">${icon("minus")}</span><span class="btnw">100%</span><span class="btnw">${icon("plus")}</span><span class="btnw">${icon("maximize")}</span>` : ""}
    </div><div class="pb">${body}</div>`, step);
}

function inspectorHTML() {
  const mode = V.inspector.layout;
  if (mode === "Masqué") return "";
  const step = V.journey ? SCREENS[V.screen].steps.inspector : null;
  const title = { "Unités": "Unité 502", "Vue d'ensemble": "Ce qui bloque", "Coordination": "Décision", "Suivi": "Échéances et signaux" }[V.screen] || "Détail";
  /* A decision panel on the screens where something is decided; a short
     read-only column everywhere else. */
  const decides = V.screen === "Unités" || V.screen === "Coordination";
  const rows = {
    "Unités": [["Le plan dit", "1800 × 1500"], ["La maquette dit", "1560 × 1500"], ["Écart", "240 mm"], ["Apparu dans", "R04 · 24 Oct"]],
    "Coordination": [["Niveau", "5"], ["Where", "corridor, axe 4"], ["Dessins", "mécanique + structure"], ["Unité", "507"]],
    "Vue d'ensemble": [["Dépôt au comité", "14 Nov"], ["Réponse de l'urbaniste", "12 jours de retard"], ["Émission du permis", "21 Nov"], ["Données manquantes", "10"]],
    "Suivi": [["Dépôt au comité", "14 Nov"], ["Réponse de l'urbaniste", "12 jours de retard"], ["Croisements ouverts", "4"], ["Articles à lire", "5"]],
  }[V.screen] || [["Chantier", "value"], ["Chantier", "value"], ["Chantier", "value"], ["Chantier", "value"]];

  const inner = `<div class="ph">${icon("circle")}<span class="lo bar" style="width:70px"></span><span class="hi">${title}</span></div>
    <div class="pb">
      ${V.screen === "Unités" ? `<div class="row">${["Vue d'ensemble", "Ouvertures", "Coordination", "Historique"].map((t, i) => `<span class="chip" style="${i === 1 ? "border-color:var(--ink)" : ""}">
        <span class="lo bar" style="width:40px"></span><span class="hi">${t}</span></span>`).join("")}</div>
      <div class="plan" data-img="plan" style="height:110px;flex:0 0 110px;${crop(UNIT_BOXES[6], .25, "height")}"><span class="hi">recadrage de l'unité</span></div>` : ""}
      ${rows.map(([k, val]) => `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line-2);padding-bottom:6px">
        <span class="lo bar" style="width:70px"></span><span class="lo bar" style="width:46px"></span>
        <span class="hi" style="font-size:12px;color:var(--ink-2)">${k}</span>
        <span class="hi" style="font-size:12px">${val}</span></div>`).join("")}
      ${decides ? `<div class="tile" style="border-color:var(--ink)">
        <div class="lo bar" style="width:50%"></div><div class="hi" style="font-weight:600;font-size:12.5px">Pourquoi ce changement?</div>
        <div class="row" style="flex-wrap:wrap;gap:5px">${["coût client", "structure", "code", "ville", "erreur de dessin"].map((m) => `<span class="chip">
          <span class="lo bar" style="width:40px"></span><span class="hi">${m}</span></span>`).join("")}</div>
        <div class="lo bar" style="width:100%;height:34px;border-radius:5px"></div>
        <div class="hi" style="border:1px solid var(--line-2);border-radius:5px;padding:7px;color:var(--ink-3);font-size:11.5px">une phrase pour la personne suivante</div>
        <span class="btnw solid" style="justify-content:center"><span class="lo bar" style="width:80px;background:#fff;opacity:.6"></span><span class="hi">Enregistrer la décision</span></span>
      </div>
      <span class="btnw solid" style="justify-content:center">${icon("external-link")}<span class="lo bar" style="width:70px;background:#fff;opacity:.6"></span><span class="hi">Ouvrir dans AutoCAD</span></span>`
      : `<div class="tile"><div class="lo col">${bars(3)}</div>
          <div class="hi" style="font-size:11.5px;color:var(--ink-2)">compté à partir des dessins, rien de saisi</div></div>`}
    </div>`;

  if (mode === "Feuille du bas") {
    return `<section class="pane rg sheet ${solo("inspector")}" data-rg="inspecteur → feuille du bas" data-fi="${fiOf("inspector")}" style="height:260px">
      ${step ? `<span class="step">${step}</span>` : ""}${inner}</section>`;
  }
  if (mode === "Tiroir superposé") {
    return `<section class="pane rg drawer ${solo("inspector")}" data-rg="inspecteur → superposition" data-fi="${fiOf("inspector")}">
      ${step ? `<span class="step">${step}</span>` : ""}${inner}</section>`;
  }
  return region("inspector", "inspecteur", inner, step);
}

function footerHTML() {
  if (V.footer.layout === "Masqué" || !SCREENS[V.screen].regions.includes("footer")) return "";
  const step = V.journey ? SCREENS[V.screen].steps.footer : null;
  return `<section class="pane rg ${solo("footer")}" data-rg="pied de page — effet du changement" data-fi="${fiOf("footer")}" style="flex:0 0 auto;grid-column:1/-1">
    ${step ? `<span class="step">${step}</span>` : ""}
    <div class="pb" style="flex-direction:row;align-items:center;gap:10px;padding:8px 12px">
      <span class="lo bar" style="width:150px"></span><span class="lo bar" style="width:60px"></span><span class="lo bar" style="width:60px"></span>
      <span class="hi" style="font-size:12px">Ouvertures de la façade sud</span>
      <span class="hi" style="font-size:12px;font-weight:600">68.5 m² → 74.2 m²</span>
      <span class="hi" style="font-size:12px;color:var(--ink-2)">+5.7 m²</span>
      <span style="flex:1"></span>
      <span class="btnw"><span class="lo bar" style="width:70px"></span><span class="hi">Lire l'article 3.2.3.1</span></span>
    </div></section>`;
}

/* ---------------------------------------------------------------- frame */

function render() {
  const def = SCREENS[V.screen];
  const hasList = def.regions.includes("list") && V.list.layout !== "Masqué" && V.list.layout !== "Barre de filtres seulement";
  const hasInsp = def.regions.includes("inspector") && V.inspector.layout === "Panneau de droite";
  const cols = [hasList ? "260px" : null, "1fr", hasInsp ? "340px" : null].filter(Boolean).join(" ");
  /* No rail until a project is open: the rail is the proof that one is. */
  const navMode = def.index ? "top"
    : { "Barre du haut seulement": "top", "Onglets seulement, sans rail": "top",
        "Rail large avec libellés": "wide", "Rail large avec sections": "wide",
        "Rail avec libellés sous les icônes": "stack" }[V.nav.layout] || "rail";

  document.getElementById("frame").innerHTML = `
    <div class="frame" data-nav="${navMode}" data-labels="${V.labels}" data-journey="${V.journey}"
         data-density="${V.density}" data-fi="${fiOf("")}" data-isolate="${ISO[V.isolate] || "none"}"
         data-shell="${V.shell === "Carte encastrée" ? "inset" : "flat"}">
      ${navHTML()}
      <div class="body">
        ${tabsHTML()}
        <div class="work" style="grid-template-columns:${SCREENS[V.screen].home ? "1fr" : cols};grid-auto-rows:min-content 1fr min-content;align-content:stretch">
          <div style="grid-column:1/-1">${headerHTML()}</div>
          ${SCREENS[V.screen].home ? `<div style="grid-column:1/-1;display:flex;min-height:0;gap:var(--gap)">${(HOMES[V.homeLayout] || HOMES["Grille de fiches"])()}</div>` : ""}
          ${SCREENS[V.screen].home ? "" : `${V.list.layout === "Barre de filtres seulement" && def.regions.includes("list") ? listHTML() : ""}
          ${hasList ? listHTML() : ""}
          ${contentHTML()}
          ${hasInsp ? inspectorHTML() : ""}
          ${footerHTML()}`}
        </div>
        ${def.regions.includes("inspector") && !hasInsp ? inspectorHTML() : ""}
      </div>
    </div>`;

  /* The journey strip lived under the frame; with the frame filling the
     window, the step badges on the screen carry it alone. */

  document.querySelectorAll("[data-screen]").forEach((b) => b.addEventListener("click", () => {
    V.screen = b.dataset.screen;
    dial.setValue("screen", V.screen);
    render();
  }));
}

/* -------------------------------------------------------------- the dial */

const FI = { type: "select", options: ["héritée", "basse", "haute"], default: "héritée" };
const sel = (options) => ({ type: "select",
  options: options.map((o) => ({ value: o, label: o })) });

const dial = DialKit.createDialKit("Fil de fer C3", {
  "Écran": sel(Object.keys(SCREENS)),
  "Fidélité": sel(["haute", "basse"]),
  "Étiquettes de zone": true,
  "Étapes du parcours": true,
  "Densité": sel(["confortable", "compact"]),
  "Cadre": sel(["À plat", "Carte encastrée"]),
  "Page d'accueil": sel(["Grille de fiches", "Tableau des projets", "Liste + aperçu", "Récents, puis tous", "Commencer d'abord"]),
  "Isoler": sel(["aucune", "navigation", "entête", "liste", "contenu", "inspecteur", "pied de page"]),
  "Calques": { _collapsed: false,
    "Arpenteur": true,
    "Opacité arpenteur": [55, 0, 100, 5],
    "Aménagement": false,
    "Opacité aménagement": [55, 0, 100, 5],
    "Alignement": { _collapsed: true,
      "Échelle arpenteur": [100, 60, 160, 1],
      "Arpenteur X": [0, -40, 40, .5],
      "Arpenteur Y": [0, -40, 40, .5],
      "Échelle aménagement": [100, 60, 160, 1],
      "Aménagement X": [0, -40, 40, .5],
      "Aménagement Y": [0, -40, 40, .5] } },
  "Navigation": { _collapsed: true, "Fidélité": FI,
    "Disposition": sel(["Rail d'icônes + onglets", "Barre du haut seulement", "Rail large avec libellés",
      "Rail large avec sections", "Rail avec libellés sous les icônes", "Rail seulement, sans onglets",
      "Onglets seulement, sans rail", "Rail + menu des vues", "Rail + fil d'Ariane"]),
    "Icônes": sel(["Rail seulement", "Onglets seulement", "Rail et onglets", "Aucune"]),
    "Libellés": sel(["Libellé complet", "Au survol seulement", "Code court", "Numéroté", "Majuscules", "Masqué"]),
    "Style des onglets": sel(["Simple", "Souligné", "Pastilles", "Segmenté", "Accent en haut", "Encadré"]),
    "Alignement des onglets": sel(["Gauche", "Centré", "Réparti"]) },
  "Entête": { _collapsed: true, "Fidélité": FI, "Disposition": sel(["Titre + actions", "Titre seulement", "Titre + chiffres"]) },
  "Liste": { _collapsed: true, "Fidélité": FI, "Disposition": sel(["Liste verticale", "Grille de fiches", "Barre de filtres seulement", "Masqué"]) },
  "Contenu": { _collapsed: true, "Fidélité": FI, "Disposition": sel(["Deux volets", "Volet unique + encart", "Empilé"]) },
  "Inspecteur": { _collapsed: true, "Fidélité": FI, "Disposition": sel(["Panneau de droite", "Feuille du bas", "Tiroir superposé", "Masqué"]) },
  "Pied de page": { _collapsed: true, "Fidélité": FI, "Disposition": sel(["Bandeau d'impact", "Masqué"]) },
}, { id: "wireframe-c3-fr", persist: true });;

DialKit.createDialRoot({ position: "top-right", theme: "light" });

function applyDial(v) {
  V.screen = v["Écran"];
  V.fidelity = v["Fidélité"];
  V.labels = v["Étiquettes de zone"];
  V.journey = v["Étapes du parcours"];
  V.density = v["Densité"];
  V.shell = v["Cadre"];
  V.homeLayout = v["Page d'accueil"];
  V.isolate = v["Isoler"];
  const la = v["Calques"], al = la["Alignement"];
  V.lay.arp = { on: la["Arpenteur"], opacity: la["Opacité arpenteur"],
    scale: al["Échelle arpenteur"], x: al["Arpenteur X"], y: al["Arpenteur Y"] };
  V.lay.pay = { on: la["Aménagement"], opacity: la["Opacité aménagement"],
    scale: al["Échelle aménagement"], x: al["Aménagement X"], y: al["Aménagement Y"] };
  /* The region state keeps its short English ids because they are also CSS
     hooks; only the panel speaks French. */
  [["nav", "Navigation"], ["header", "Entête"], ["list", "Liste"], ["content", "Contenu"],
   ["inspector", "Inspecteur"], ["footer", "Pied de page"]].forEach(([id, fr]) => {
    const f = v[fr];
    V[id] = { fidelity: f["Fidélité"], layout: f["Disposition"] };
  });
  render();
}

dial.subscribe(applyDial);

sprite();
applyDial(dial.values);
</script>
</body>
</html>
