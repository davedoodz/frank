          /* AutoCAD and SketchUp used to sit up here, a screen away from the
             drawing they open. They live on the drawing pane now. */
          : `<span class="btnw" ${act("export")} title="Exporter ce que cet écran montre">${icon("table")}<span class="lo bar" style="width:40px"></span><span class="hi">Exporter</span></span>`}
      </div>
      ${metrics ? `<div class="row" style="gap:var(--gap)">${[1, 2, 3, 4].map((i) => `<div class="tile" style="flex:1">
        <div class="lo bar" style="width:38px;height:14px"></div><div class="lo bar lt" style="width:70%"></div>
        <div class="hi" style="font-size:17px;font-weight:600">${["6", "4", "5", "98"][i - 1]}</div>
        <div class="hi" style="font-size:11px;color:var(--ink-2)">${["écarts", "croisements", "articles à lire", "unités"][i - 1]}</div>
      </div>`).join("")}</div>` : ""}
    </div>
  </header>`;
}

function listHTML() {
  const mode = V.list.layout;
  if (mode === "Hidden") return "";
  const step = V.journey ? SCREENS[V.screen].steps.list : null;
  const label = V.screen === "Unités" ? "Unités" : "Liste";
  /* The list reads the same rows the header counts, so the view above it and
     the search inside it both change what is on screen. */
  const pairs = rowsOf(V.screen);
  const rows = pairs.length ? pairs.map((r) => `${r[0]} · ${r[1]}`) : ["rien ne correspond"];
  const sel = selIndex(V.screen);

  if (mode === "Filter bar only") {
    return `<section class="pane rg ${solo("list")}" data-rg="liste → barre de filtres" data-fi="${fiOf("list")}" style="flex:0 0 auto;grid-column:1/-1">
      ${step ? `<span class="step">${step}</span>` : ""}
      <div class="pb" style="flex-direction:row;align-items:center;padding:8px 10px">
        <span class="chip">${icon("search")}<span class="lo bar" style="width:70px"></span>
          <input class="hi find" value="${V.query}" placeholder="Chercher dans ${label.toLowerCase()}"></span>
        ${pairs.slice(0, 4).map((r, i) => `<span class="chip ${i === sel ? "on" : ""}" ${act("row", i)}><span class="lo bar" style="width:46px"></span><span class="hi">${r[0].split(" ")[0]}</span></span>`).join("")}
      </div></section>`;
  }
  /* A6: on Unités the number rides on the drawing and the line underneath
     carries the typology and the area, the two facts a reader compares from
     one card to the next. Other screens have no drawing and no typology, so
     they keep the plain pair. */
  const ucard = (r, i) => `<div class="tile ucard ${i === sel ? "on" : ""}" ${act("row", i)}
      title="${r[0]} · ${r[6]} pi²${r[7] ? ` · ${r[1]}` : ""}">
      <div class="plan" data-img="unit" style="height:54px;flex:0 0 54px;background-image:url(assets/plan-niveau-${r[4]}.jpg);${crop(boxForUnit(r[4], r[2]))}"></div>
      <span class="hi ub">${r[0].split(" · ")[0]}</span>
      ${r[7] ? `<span class="hi uc" title="${r[1]}"></span>` : ""}
      <div class="lo bar" style="width:70%"></div>
      <div class="hi ul"><span style="font-size:12px">${r[5]}</span>
        <span class="ua">${r[6]} pi²</span></div></div>`;
  const inner = mode === "Card grid"
    ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${pairs.map((r, i) => V.screen === "Unités" ? ucard(r, i)
      : `<div class="tile ${i === sel ? "on" : ""}" ${act("row", i)}>
        <div class="plan" style="height:54px;flex:0 0 54px"></div>
        <div class="lo bar" style="width:70%"></div><div class="hi" style="font-size:11.5px">${r[0]} · ${r[1]}</div></div>`).join("")}</div>`
    : rows.map((r, i) => `<div class="listrow ${i === sel ? "on" : ""}" ${pairs.length ? act("row", i) : ""}><span class="dot"></span>
        <span class="lo bar" style="flex:1"></span><span class="hi" style="font-size:12px">${r}${V.settled[`${V.screen} · ${(pairs[i] || [""])[0]}`] ? " · réglé" : ""}</span></div>`).join("");

  return region("list", `list — ${label.toLowerCase()}`,
    `<div class="ph">${icon("list")}<span class="lo bar" style="width:60px"></span><span class="hi">${label}</span></div>
     <div class="pb">${inner}</div>`, step);
}

function contentHTML() {
  const step = V.journey ? SCREENS[V.screen].steps.content : null;
  const mode = V.content.layout;
  const body = {
    "Unités": () => {
      const unit = (selRow("Unités") || ["—"])[0];
      /* The zoom stands against the outer edge of each pane: flat, opaque,
         always there. Vertical, because the course it runs is vertical, and
         the two framings cap it — corners pushed out at the top, where the
         slider runs toward the whole drawing, corners pulled in at the
         bottom, where it runs toward the close view. */
      const wide = side => side === "plan"
        ? `${act("fitsheet")} title="Voir toute la feuille"`
        : `${act("mwide")} title="Voir tout le bâtiment"`;
      const close = side => side === "plan"
        ? `${act("fitunit")} title="Cadrer l'unité sélectionnée"`
        : `${act("mclose")} title="Se rapprocher du bâtiment"`;
      const zcol = (side) => `<div class="zcol" data-zcol="${side}">
        <span class="zb" ${wide(side)}>${icon("maximize")}</span>
        <span class="zb" ${act("zstep", side + ":+")} title="Agrandir">${icon("plus")}</span>
        <input class="zslider" type="range" ${side === "plan"
          ? `min="${ZMIN}" max="${ZMAX}" step="1" value="${V.zoom}" data-zoom aria-label="Zoom du plan"`
          : `min="0" max="100" step="1" value="${V.mzoom}" data-mzoom aria-label="Zoom de la maquette"`}>
        <span class="zb" ${act("zstep", side + ":-")} title="Reculer">${icon("minus")}</span>
        <span class="zread hi" ${side === "plan" ? "data-zread" : "data-mread"}>${side === "plan" ? V.zoom : V.mzoom}%</span>
        <span class="zb" ${close(side)}>${icon("minimize")}</span>
      </div>`;
      /* The corner view: the drawing whole, small, with the rectangle of
         what the pane is showing. On the plan the rectangle is dragged to
         move the sheet; on the model it only reports how much of the
         building the camera holds, since the camera orbits and does not
         pan. */
      const mini = (side) => `<div class="mini hi" data-mini="${side}">
        <span class="mi" data-mi>
          <img src="${side === "plan" ? sheet().img : "assets/skp-ensemble.jpg"}" alt="">
          <span class="mrect" data-mrect></span>
        </span>
        <span class="mcap"><span data-mpct>${side === "plan" ? V.zoom : V.mzoom}%</span></span>
      </div>`;
      const pane = (t, note, kind, cls = "", layers = "") => `<div class="pane drawing" style="flex:1"><div class="ph">${icon("file")}
        <span class="lo bar" style="width:90px"></span><span class="hi">${t}</span>
        <span style="flex:1"></span>${hostButton(kind === "plan" ? "plan" : "model")}</div>
        ${fileStrip(kind === "plan" ? "plan" : "model")}
        ${kind === "plan"
          /* The sheet is larger than the pane, so the pane is a window onto
             it: the drawing, the consultants' layers, the typology fills and
             the unit outline all sit inside one transformed box and move
             together. The wheel zooms where the pointer is; dragging pans. */
          ? `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="plan">
              <div class="vp" data-vp>
              <div class="plan ${cls}" data-img="${kind}" data-src="${planVector() ? "vector" : "image"}"
                   style="transform:translate(${V.pan.x}px,${V.pan.y}px) scale(${V.zoom / 100})">
                <span class="lo"></span><span class="hi">${note}</span>
                ${planVector() ? `<canvas class="sheetpdf" data-sheetpdf></canvas>` : ""}
                ${layers}${unitMarkHTML()}</div></div>
              ${mini("plan")}${zcol("plan")}</div>`
          : `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="model">
              <div class="model3d" data-building-model data-state="loading" role="region"
                   aria-label="Maquette 3D interactive du Baldwin III" aria-busy="true">
                <div class="model3d-status" data-model-status aria-live="polite">Chargement de la maquette…</div>
                <div class="model3d-hint hi">Glisser pour orbiter · molette pour zoomer · cliquer une fenêtre pour sélectionner l'unité</div>
              </div>
              ${mini("model")}${zcol("model")}
            </div>`}
        </div>`;
      /* The 2D pane carries the surveyor's and the landscaper's sheets, which
         is why it is the one pane drawn at the plan's own aspect. */
      const plan = () => pane("Plan 2D", `${unit} — contours par-dessus`, "plan", "align", typoHTML() + layersHTML());
      const model = () => pane("Maquette 3D", `${unit} — volumétrie, même niveau`, "model", "fit");
      if (mode === "Stacked") return `<div class="col" style="flex:1">${plan()}${model()}</div>`;
      if (mode === "Single pane + inset") return `<div style="position:relative;flex:1;display:flex">${plan()}
        <div class="pane" style="position:absolute;right:10px;bottom:10px;width:220px;height:150px">
        <div class="pb"><div class="plan" data-img="massing"><span class="hi">3D inset</span></div></div></div></div>`;
      return `<div class="row" style="flex:1;align-items:stretch;gap:var(--gap)">${plan()}${model()}</div>`;
    },
    /* Aperçu is the project on one page. What changed, the totals, the
       dates, and the zoning and code block: three of these were screens of
       their own and none of them was worth a trip. A section keeps its own
       chips, so the four tables and the five phases still switch in place. */
    "Aperçu": () => {
      /* No summary tiles: four boxes that only named what the tables below
         already say were a second heading for every section. */
      /* The chips belong to the section, not to the screen, so they carry
         the section's name with them and never move the strip above. */
      const chips = (name) => `<div class="row" style="gap:6px">${viewsOf(name).map((t, i) =>
        `<span class="chip ${i === viewIndex(name) ? "on" : ""}" ${act("subview", `${name}|${i}`)} title="${t}">
          <span class="lo bar" style="width:44px"></span><span class="hi">${t}</span></span>`).join("")}</div>`;
      const t = QTABS[viewOf("Quantités")];
      const quant = `<div class="pane" style="flex:0 0 auto">
          <div class="ph">${icon("table")}<span class="lo bar" style="width:70px"></span>
            <span class="hi">Quantités</span><span style="flex:1"></span>
            <span class="chip"><span class="lo bar" style="width:60px"></span>
              <span class="hi">compté à partir des dessins, rien de saisi</span></span></div>
          <div class="pb">${chips("Quantités")}
            <table class="tbl"><thead><tr>${t.head.map((h) => `<th><span class="lo bar" style="width:40px"></span><span class="hi">${h}</span></th>`).join("")}</tr></thead>
            <tbody>${t.rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i ? "n" : ""}"><span class="lo bar" style="width:${i ? 34 : 50}px"></span><span class="hi">${c}</span></td>`).join("")}</tr>`).join("")}</tbody></table>
          </div></div>`;
      const phases = PHASES[viewOf("Suivi")] || [];
      const done = phases.filter((p) => V.settled[`Suivi · ${p}`]).length;
      const suivi = `<div class="pane" style="flex:0 0 auto">
          <div class="ph">${icon("calendar-check")}<span class="lo bar" style="width:60px"></span>
            <span class="hi">Suivi</span><span style="flex:1"></span>
            <span class="chip"><span class="lo bar" style="width:40px"></span>
              <span class="hi">${done} sur ${phases.length} fait${done > 1 ? "s" : ""}</span></span></div>
          <div class="pb">${chips("Suivi")}
            ${phases.map((p) => `<div class="listrow" ${act("tick", p)} title="Cocher">
              <span class="dot" style="border-radius:3px;${V.settled[`Suivi · ${p}`] ? "background:var(--ink);border-color:var(--ink)" : ""}"></span>
              <span class="lo bar" style="flex:1"></span>
              <span class="hi" style="font-size:12px">${p}${V.settled[`Suivi · ${p}`] ? " · fait" : ""}</span></div>`).join("")}
          </div></div>`;
      /* One card per provision: the number read in the drawings beside the
         number the provision asks for, the sentence in French, and a link to
         the official page. The card the footer strip points at is marked. */
      const zoning = `<div class="pane" style="flex:0 0 auto">
          <div class="ph">${icon("scale")}<span class="lo bar" style="width:90px"></span>
            <span class="hi">Zonage et code</span><span style="flex:1"></span>
            <span class="chip"><span class="lo bar" style="width:52px"></span><span class="hi">${unresolvedCount()} non résolus sur ${ARTICLES.length}</span></span></div>
          <div class="pb">
            <div class="codegrid">${ARTICLES.map((x, i) => codeCard(x, i)).join("")}</div>
            <div class="tile"><div class="row">${icon("alert-triangle")}<span class="lo bar" style="width:70%"></span>
              <span class="hi" style="font-size:11.5px;color:var(--ink-2)">Extraits de travail, abrégés. La version qui fait foi est celle de l'arrondissement ou de la RBQ, liée sur chaque carte. Une lecture automatique ne déclare pas une non-conformité.</span></div></div>
          </div></div>`;
      return `<div class="col" style="flex:1;gap:var(--gap)">${quant}${suivi}${zoning}</div>`;
    },
    /* Files: what was read, and when. The view picks the kind. */
    "Fichiers": () => `<div class="col" style="flex:1">
        ${(FILES[viewOf("Fichiers")] || []).map(([n, meta]) => `<div class="listrow" ${act("openfile", n)} title="Ouvrir ${n}">
          <span class="dot"></span><span class="lo bar" style="flex:1"></span>
          <span class="hi" style="font-size:12px;flex:1">${n}</span>
          <span class="hi" style="font-size:11.5px;color:var(--ink-3)">${meta}</span></div>`).join("")}
        <div class="tile"><div class="row">${icon("info")}<span class="lo bar" style="width:60%"></span>
          <span class="hi" style="font-size:11.5px">rien n'est écrit dans un fichier de dessin; les mises à jour sont proposées</span></div></div></div>`,
  }[V.screen]();

  /* No header strip on this pane: it only repeated the screen name already
     set in large type two lines above, and the pane is the whole middle of
     the card — nothing else it could be. */
  return region("content", "contenu", `<div class="pb">${body}</div>`, step);
}

function inspectorHTML() {
  const mode = V.inspector.layout;
  if (mode === "Hidden") return "";
  const step = V.journey ? SCREENS[V.screen].steps.inspector : null;
  const row = selRow(V.screen);
  const title = { "Unités": `Unité ${(row || ["—"])[0].split(" ")[0]}`, "Aperçu": "Ce qui bloque",
    "Suivi": "Échéances et signaux" }[V.screen] || "Détail";
  /* A decision panel on the screen where something is decided; a short
     read-only column everywhere else. */
  const decides = V.screen === "Unités";
  /* The unit inspector answers a different question per tab, so the tabs
     carry four sets of rows and not one set with four labels. */
  const no = (row || ["—"])[0].split(" ")[0];
  const level = paneLevel();
  /* Coordination is read here, on the unit the crossing lands on. A unit with
     no crossing says so, and says what the level and the project carry. */
  const mine = crossingsFor(no);
  const crossRows = mine.length
    ? mine.map(([id, what, disc, , , done]) => [`${id} · ${disc}`, done ? "réglé" : what])
    : [["Sur cette unité", "aucun croisement"],
      ["Sur ce niveau", `${CROSSINGS.filter((c) => c[4] === level && !c[5]).length} ouverts`],
      ["Dans le projet", `${openCrossings().length} ouverts`],
      ["Dernier dessin lu", "S-301 R02"]];
  const unitRows = {

/* ------------------------------------------------- reading the sheet
   The pane is a fixed window; the sheet moves behind it. Zoom is a number
   in percent, pan two pixel offsets, both on V, so a re-render draws the
   drawing exactly where it was left. Nothing here touches the file. */

/* 100 % is the sheet filling the pane; below it the paper keeps going, which
   is what lets the eye step back from a drawing that runs to its own edges.
   The two camera stops are the wide shot and the close one, the numbers the
   viewer settles at when either framing is asked for. */
const ZMIN = 45, ZMAX = 600;
const MZOOM_WIDE = 13, MZOOM_CLOSE = 55;
const vpEl = () => document.querySelector("[data-vp]");

/* ------------------------------------------------- the sheet as vectors
   The exported JPEG is one resolution: past about 200 % a dimension string
   is four grey pixels. The same crop also exists as the drawing's own
   lines, in a PDF read by pdf.js.

   Measured on these sheets: one pass costs about fifteen seconds, and the
   cost is the geometry, not the pixels — 1 200 px and 3 400 px take the
   same time, because a permit floor plan is a hundred thousand little
   paths. So the sheet is not redrawn as the zoom moves. It is drawn once
   per level, at a fixed resolution well above the picture's, in the
   background, with the picture left in place underneath until it lands.
   The result is kept, so coming back to a level is instant. */
const PDF_W = 3000;                     // the width every sheet is drawn at
const planVector = () => V.planSrc === "vector" && !!sheet().pdf;
let pdfLib = null;
const pdfDocs = new Map();
const pdfBitmaps = new Map();           // url → the finished sheet
let pdfBusy = null;                     // the url being drawn, if any

function blitSheet(bmp) {
  const el = vpEl();
  const live = el && el.querySelector("[data-sheetpdf]");
  if (!live) return;
  live.width = bmp.width;
  live.height = bmp.height;
  live.getContext("2d").drawImage(bmp, 0, 0);
  live.dataset.ready = "1";
}

async function renderSheetPdf() {
  const el = vpEl();
  if (!el || !planVector()) return;
  const url = sheet().pdf;
  const done = pdfBitmaps.get(url);
  if (done) { blitSheet(done); return; }
  if (pdfBusy) return;                  // one sheet at a time
  pdfBusy = url;
  const pane = el.closest(".pane");
  if (pane) pane.dataset.pdf = "busy";
  try {
    if (!pdfLib) {
      pdfLib = await import("./vendor/pdfjs/pdf.min.mjs");
      pdfLib.GlobalWorkerOptions.workerSrc = "./vendor/pdfjs/pdf.worker.min.mjs";
    }
    let doc = pdfDocs.get(url);
    if (!doc) { doc = await pdfLib.getDocument(url).promise; pdfDocs.set(url, doc); }
    const page = await doc.getPage(1);
    const base = page.getViewport({ scale: 1 });
    const view = page.getViewport({ scale: PDF_W / base.width });
    /* Drawn on a canvas of its own and copied over when it is finished, so
       the pane never holds a half-drawn sheet and pdf.js never finds two
       passes on one canvas. */
    const off = document.createElement("canvas");
    off.width = Math.round(view.width);
    off.height = Math.round(view.height);
    await page.render({ canvasContext: off.getContext("2d"), viewport: view }).promise;
    const bmp = typeof createImageBitmap === "function" ? await createImageBitmap(off) : off;
    pdfBitmaps.set(url, bmp);
    if (sheet().pdf === url && planVector()) blitSheet(bmp);
  } catch (err) {
    /* An unreadable sheet falls back to the picture, which is still there,
       rather than leaving the pane empty. */
    console.error("plan vectoriel", url, err);
    say(`Feuille vectorielle illisible (${url}): ${err && err.message ? err.message : err}`);
    V.planSrc = "image";
    render();
  } finally {
    pdfBusy = null;
    const p = (vpEl() || el).closest(".pane");
    if (p) p.dataset.pdf = "";
    // A window pick may change floors while the previous PDF is rendering.
    if (planVector() && sheet().pdf !== url) scheduleSheetPdf();
  }
}

/* Called on every paint; it is cheap once the sheet is in hand. */
function scheduleSheetPdf() {
  if (!planVector()) return;
  renderSheetPdf();
}
const SHEET_AR = 2000 / 1675;
function layoutSheet(el) {
  const plan = el.querySelector(".plan");
  if (!plan) return { w: 0, h: 0 };
  const r = el.getBoundingClientRect();
  let w = r.width, h = w / SHEET_AR;
  if (h > r.height) { h = r.height; w = h * SHEET_AR; }
  plan.style.width = `${w}px`;
  plan.style.height = `${h}px`;
  return { w, h };
}

/* The sheet never leaves the pane: while it is smaller than the viewport it
   stays centred in it, and once it is larger it may be dragged until an
   edge reaches the opposite edge of the pane. */
function clampPan(rect, zoom, base) {
  const z = zoom / 100;
  const bw = base.w * z, bh = base.h * z;
  V.pan.x = bw <= rect.width ? (rect.width - bw) / 2 : Math.min(0, Math.max(rect.width - bw, V.pan.x));
  V.pan.y = bh <= rect.height ? (rect.height - bh) / 2 : Math.min(0, Math.max(rect.height - bh, V.pan.y));
}

/* Zooms around a point of the pane, the pointer under the wheel or the
   middle of the pane for the buttons, so what is being read stays put. */
function zoomTo(next, cx, cy, rect, base) {
  const z0 = V.zoom / 100;
  const z1 = Math.min(ZMAX, Math.max(ZMIN, next)) / 100;
  V.pan.x = cx - (cx - V.pan.x) * (z1 / z0);
  V.pan.y = cy - (cy - V.pan.y) * (z1 / z0);
  V.zoom = Math.round(z1 * 100);
  clampPan(rect, V.zoom, base);
}

function zoomBy(next) {
  const el = vpEl();
  if (!el) { V.zoom = Math.min(ZMAX, Math.max(ZMIN, next)); return; }
  const r = el.getBoundingClientRect();
  zoomTo(next, r.width / 2, r.height / 2, r, layoutSheet(el));
}

/* The selected unit, filling the pane with a little air: the box is 0–1 on
   the sheet, so the zoom that frames it is the pane over the box. */
function fitUnit() {
  const el = vpEl();
  const row = selRow("Unités");
  if (!el || !row) return;
  const poly = polysForPane()[row[2]];
  if (!poly) return;   // no measured contour for this unit — leave the view as it is
  const r = el.getBoundingClientRect();
  const base = layoutSheet(el);
  const [x, y, w, h] = polyBounds(poly);
  const z = Math.min(ZMAX, Math.max(ZMIN,
    Math.min(r.width / (base.w * w * 1.5), r.height / (base.h * h * 1.5)) * 100));
  V.zoom = Math.round(z);
  V.pan.x = r.width / 2 - (x + w / 2) * base.w * (z / 100);
  V.pan.y = r.height / 2 - (y + h / 2) * base.h * (z / 100);
  clampPan(r, V.zoom, base);
}

/* Bidirectional selection: the 3D viewer raycasts a window, finds which
   CONTOURS polygon it falls closest to, and calls this with the real
   unit number that key implies (e.g. "816" for CONTOURS[8][16]) — the
   mirror of window.fitteSelection above. This is the same level switch
   and row selection a list-row click already makes, and it frames the
   unit the same way: choosing a unit is asking to see it. Matched
   against the row's own suffix (r[2]) directly:
   the suffixes aren't sequential, so no.slice(-2) can't be turned into
   an array index by subtracting one. */
window.fitteSelectUnit = (unitStr) => {
  const no = String(unitStr);
  const level = Number(no.slice(0, -2));
  const suffix = Number(no.slice(-2));
  const rows = UNITS_BY_LEVEL[`Niveau ${level}`];
  if (!rows) return;
  const rowIndex = rows.findIndex((r) => r[2] === suffix);
  if (rowIndex < 0) return;
  // A picked window must remain selectable even when the list is filtered.
  V.query = "";
  TYPOS.forEach((type) => {
    if (V.typo[type]) dial.setValue(`typologies.${type}`, false);
  });
  V.screen = "Unités";
  dial.setValue("screen", FR_SCREEN[V.screen]);
  V.view["Unités"] = LEVELS.indexOf(level);
  V.sel["Unités"] = rowIndex;
  fitUnit();
  render();
  /* A window click can select a row well below the fold: keep it in view,
     but only scroll the list pane itself, never the page around it. */
  document.querySelector(`[data-region="list"] [data-act="row"][data-value="${rowIndex}"]`)
    ?.scrollIntoView({ block: "nearest", inline: "nearest" });
};

/* The wheel and the drag write straight to the element and to V, without a
   re-render: a re-render per wheel tick would rebuild the whole screen and
   the drag would stutter. The slider and the percentage on the edge of the
   pane are patched in place, and the next real action draws from the same
   numbers. */
function paintSheet() {
  const el = vpEl();
  if (!el) return;
  const plan = el.querySelector(".plan");
  /* Laid out first: the pane can have been resized since the last paint,
     and the pan is centred against the box this returns. */
  const base = layoutSheet(el);
  clampPan(el.getBoundingClientRect(), V.zoom, base);
  if (plan) plan.style.transform = `translate(${V.pan.x}px,${V.pan.y}px) scale(${V.zoom / 100})`;
  const slider = document.querySelector("[data-zoom]");
  if (slider && document.activeElement !== slider) slider.value = String(V.zoom);
  const read = document.querySelector("[data-zread]");
  if (read) read.textContent = `${V.zoom}%`;
  const z = V.zoom / 100;
  const label = el.querySelector(".ulabel");
  if (label) {
    label.style.fontSize = `${(11 / z).toFixed(2)}px`;
    label.style.transform = `translateY(${(label.dataset.side === "below" ? 2 / z : -(14 / z)).toFixed(2)}px)`;
  }
  el.querySelectorAll(".umark polygon").forEach((r) => { r.style.strokeWidth = `${(1.6 / z).toFixed(3)}px`; });
  /* The vectors are redrawn for the magnification they are now at. */
  scheduleSheetPdf();
  /* The corner rectangle is the same state read small; painted here so it
     cannot drift from the sheet by a frame. */
  paintMiniPlan();
}

function wireViewport() {
  const el = vpEl();
  if (!el) return;
  const paint = paintSheet;
  el.onwheel = (e) => {
    e.preventDefault();
    const r = el.getBoundingClientRect();
    zoomTo(V.zoom * Math.exp(-e.deltaY * 0.0016), e.clientX - r.left, e.clientY - r.top, r, layoutSheet(el));
    paint();
  };
  el.ondblclick = () => { V.zoom = 100; V.pan = { x: 0, y: 0 }; paint(); };
  el.onpointerdown = (e) => {
    if (e.button !== 0) return;
    const r = el.getBoundingClientRect();
    const start = { x: e.clientX, y: e.clientY, px: V.pan.x, py: V.pan.y };
    let moved = false;
    el.onpointermove = (m) => {
      if (!moved && Math.abs(m.clientX - start.x) + Math.abs(m.clientY - start.y) <= 3) return;
      if (!moved) {
        /* The pointer is captured only once the hand has actually moved: a
           capture taken on press retargets the click to this element, and
           the unit under the finger would never be selected. */
        moved = true;
        el.setPointerCapture(m.pointerId);
        el.classList.add("drag");
      }
      V.pan.x = start.px + (m.clientX - start.x);
      V.pan.y = start.py + (m.clientY - start.y);
      clampPan(r, V.zoom, layoutSheet(el));
      paint();
    };
    el.onpointerup = (u) => {
      el.classList.remove("drag");
      el.onpointermove = null; el.onpointerup = null;
      /* A drag is not a click: only a still pointer picks the unit under it. */
      if (moved) { u.stopPropagation(); u.preventDefault(); }
    };
  };
  /* Drawn once here: the markup carries the last transform, but the box it
     is measured against only exists after the pane has been laid out. */
  paintSheet();
  /* The pane does not settle on one width at first paint: the model beside
     it loads a canvas and takes its share late, a rail is folded, the panel
     opens. Every one of those resizes this box, and a sheet laid out
     against the old width would hang past the edge and be cut. */
  if (!el.__ro) {
    el.__ro = new ResizeObserver(() => paintSheet());
    el.__ro.observe(el);
  }
}

/* The pane changes width with the window, and the sheet is centred in it,
   so the one listener re-centres whatever is on screen. */
window.addEventListener("resize", () => paintSheet());

/* The two sliders are the only zoom controls left, so each one is wired to
   the thing it moves: the plan slider to the sheet transform, the model
   slider to the camera distance the viewer module exposes. The model writes
   back through an event, because orbiting with the mouse changes the same
   number the slider shows. */
function wireZoomRails() {
  const sheet = document.querySelector("[data-zoom]");
  if (sheet) sheet.oninput = () => { zoomBy(Number(sheet.value)); paintSheet(); };
  const cam = document.querySelector("[data-mzoom]");
  if (cam) {
    cam.value = String(V.mzoom);
    cam.oninput = () => {
      V.mzoom = Number(cam.value);
      paintModelRead();
      window.fitteModel?.writeZoom(V.mzoom);
    };
  }
  paintModelRead();
  wireMiniPlan();
}

/* The corner view of the plan is a control: pressing or dragging inside it
   centres the sheet on the point touched, which is the fastest way across a
   permit sheet at 400 %. */
function wireMiniPlan() {
  const mi = document.querySelector('[data-mini="plan"] [data-mi]');
  if (!mi) return;
  const goTo = (e) => {
    const el = vpEl();
    if (!el) return;
    const b = mi.getBoundingClientRect(), r = el.getBoundingClientRect();
    const base = layoutSheet(el), z = V.zoom / 100;
    const fx = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width));
    const fy = Math.max(0, Math.min(1, (e.clientY - b.top) / b.height));
    V.pan.x = r.width / 2 - fx * base.w * z;
    V.pan.y = r.height / 2 - fy * base.h * z;
    paintSheet();
  };
  let on = false;
  mi.onpointerdown = (e) => { on = true; mi.setPointerCapture(e.pointerId); goTo(e); e.stopPropagation(); };
  mi.onpointermove = (e) => { if (on) goTo(e); };
  mi.onpointerup = () => { on = false; };
}

/* The rectangle is the pane expressed in the sheet's own 0–1 box, clipped
   to it: past the edge there is no sheet left to frame. */
function paintMiniPlan() {
  const box = document.querySelector('[data-mini="plan"]');
  const el = vpEl();
  if (!box || !el) return;
  const mi = box.querySelector("[data-mi]"), rect = box.querySelector("[data-mrect]");
  const b = mi.getBoundingClientRect();
  if (!b.width) return;
  const r = el.getBoundingClientRect(), base = layoutSheet(el), z = V.zoom / 100;
  const x = Math.max(0, Math.min(1, -V.pan.x / (base.w * z)));
  const y = Math.max(0, Math.min(1, -V.pan.y / (base.h * z)));
  const w = Math.min(1 - x, r.width / (base.w * z));
  const h = Math.min(1 - y, r.height / (base.h * z));
  rect.style.left = `${x * b.width}px`;
  rect.style.top = `${y * b.height}px`;
  rect.style.width = `${w * b.width}px`;
  rect.style.height = `${h * b.height}px`;
  const pct = box.querySelector("[data-mpct]");
  if (pct) pct.textContent = `${V.zoom}%`;
}

/* The camera neither pans nor rolls: it circles the building at a distance.
   So the model's rectangle is centred by construction, and only its size
   carries information — how much of the building is held at this distance. */
function paintMiniModel() {
  const box = document.querySelector('[data-mini="model"]');
  if (!box) return;
  const mi = box.querySelector("[data-mi]"), rect = box.querySelector("[data-mrect]");
  const b = mi.getBoundingClientRect();
  if (!b.width) return;
  const f = Math.max(0.15, Math.min(1, 1 - V.mzoom / 120));
  rect.style.width = `${f * b.width}px`;
  rect.style.height = `${f * b.height}px`;
  rect.style.left = `${(1 - f) / 2 * b.width}px`;
  rect.style.top = `${(1 - f) / 2 * b.height}px`;
  const pct = box.querySelector("[data-mpct]");
  if (pct) pct.textContent = `${V.mzoom}%`;
}

function paintModelRead() {
  const read = document.querySelector("[data-mread]");
  if (read) read.textContent = `${V.mzoom}%`;
  paintMiniModel();
}

window.addEventListener("fitte:model-zoom", (e) => {
  if (!Number.isFinite(e.detail)) return;
  V.mzoom = e.detail;
  const cam = document.querySelector("[data-mzoom]");
  if (cam && document.activeElement !== cam) cam.value = String(V.mzoom);
  paintModelRead();
});
/* ---------------------------------------------------------------- frame */

function render() {
  const def = SCREENS[V.screen];
  const hasList = def.regions.includes("list") && V.list.layout !== "Hidden" && V.list.layout !== "Filter bar only";
  const hasInsp = def.regions.includes("inspector") && V.inspector.layout === "Right panel";
  const cols = [hasList ? "260px" : null, "1fr", hasInsp ? "340px" : null].filter(Boolean).join(" ");
  /* No rail until a project is open: the rail is the proof that one is. */
  const navMode = def.index ? "top"
    : { "Top bar only": "top", "Tabs only, no rail": "top", "Two rows, no rail": "top",
        "Wide rail with labels": "wide", "Wide rail with sections": "wide",
        "Rail with labels under icons": "stack" }[V.nav.layout] || "rail";

  document.getElementById("frame").innerHTML = `
    <div class="frame" data-nav="${navMode}" data-labels="${V.labels}" data-journey="${V.journey}"
         data-density="${V.density}" data-fi="${V.fidelity}" data-isolate="${V.isolate}"
         data-shell="${V.shell === "Inset card" ? "inset" : "flat"}"
         data-chrome="${V.chrome === "Black" ? "black" : "light"}"
         style="--plan:url(${sheet().img})">
      ${navHTML()}
      <div class="body">
        ${tabsHTML()}
        <div class="work" style="grid-template-columns:${SCREENS[V.screen].home ? "1fr" : cols};grid-auto-rows:min-content 1fr min-content;align-content:stretch">
          <div style="grid-column:1/-1">${headerHTML()}</div>
          ${SCREENS[V.screen].home ? `<div style="grid-column:1/-1;display:flex;min-height:0;gap:var(--gap)">${(HOMES[V.homeLayout] || HOMES["Card grid"])()}</div>` : ""}
          ${SCREENS[V.screen].home ? "" : `${V.list.layout === "Filter bar only" && def.regions.includes("list") ? listHTML() : ""}
          ${hasList ? listHTML() : ""}
          ${contentHTML()}
          ${hasInsp ? inspectorHTML() : ""}
          ${footerHTML()}`}
        </div>
        ${def.regions.includes("inspector") && !hasInsp ? inspectorHTML() : ""}
      </div>
    </div>`;

  /* The journey strip lived under the frame; with the frame filling the
     window, the step badges on the screen carry it alone. */

  if (V.dialog) document.getElementById("frame").insertAdjacentHTML("beforeend", dialogHTML());

  if (V.toast) {
    const t = document.createElement("div");
    t.className = "toast hi";
    t.textContent = V.toast;
    document.getElementById("frame").appendChild(t);
  }

  /* One handler for the whole screen, assigned rather than added: render runs
     often and a stack of identical listeners would fire the same action
     several times. Every control carries data-act, so a new control is wired
     the moment it is drawn. */
  document.getElementById("frame").onclick = onClick;
  /* The pane that holds the sheet is rebuilt with the screen, so its wheel
     and drag are hooked back up every time it is drawn. */
  wireViewport();
  wireZoomRails();
  const find = document.querySelector(".find");
  if (find) find.oninput = (e) => {
    V.query = e.target.value;
    render();
    const f = document.querySelector(".find");
    f.focus(); f.setSelectionRange(f.value.length, f.value.length);
  };
  /* Typing must not re-render — the field would lose the caret — so the one
     thing that changes with the text is patched in place. */
  const note = document.querySelector(".note");
  if (note) note.oninput = (e) => { V.note = e.target.value; paintSaveButton(); };

  /* The dialog's fields write straight into state without a re-render, so
     typing is never interrupted; the button validates when it is pressed. */
  document.querySelectorAll("[data-field]").forEach((el) => {
    el.oninput = (e) => { V.dialog[e.target.dataset.field] = e.target.value; };
  });
  const first = document.querySelector(".dialog input");
  if (first) first.focus();
  /* The selected unit as the 3D viewer needs it: the level and unit number
     that drive which windows highlight and which floor band tints, read
     off the same selected row the 2D plan outlines — including in "Tous
     les niveaux", where the level has to be read back out of the unit
     number since the row itself no longer carries a single one. */
  const selectedRow = selRow("Unités");
  if (selectedRow) {
    const no = selectedRow[0].split(" · ")[0];
    const level = currentLevel() ?? Number(no.slice(0, -2));
    window.fitteSelection = { level, unit: no, index: selectedRow[2] };
  } else {
    window.fitteSelection = { level: currentLevel(), unit: null, index: null };
  }
  window.dispatchEvent(new CustomEvent("fitte:render"));
}

function onClick(e) {
  const screenEl = e.target.closest("[data-screen]");
  const el = e.target.closest("[data-act]");
  if (screenEl && !el) {
    V.screen = screenEl.dataset.screen;
    /* The panel speaks English: hand it the English name, or it rejects the
       value and the first click is swallowed. */
    dial.setValue("screen", FR_SCREEN[V.screen]);
    return render();
  }
  if (!el) return;
  const value = el.dataset.value;
  const screen = V.screen;

  switch (el.dataset.act) {
    case "view":
      V.view[screen] = Number(value);
      /* A new view is a new set of rows, so the old row number means nothing. */
      V.sel[screen] = 0;
      break;
    /* A section inside a screen names itself, because the screen it sits on
       has no views of its own: "Quantités|2" switches that table alone. */
    case "subview": {
      const [name, i] = value.split("|");
      V.view[name] = Number(i);
      V.sel[name] = 0;
      break;
    }
    case "viewnext":
      V.view[screen] = (viewIndex(screen) + 1) % viewsOf(screen).length;
      V.sel[screen] = 0;
      break;
    /* Picking a unit moves the sheet to it, whatever the zoom was: the list
       is a way of looking at the plan, so the answer to a click is the unit
       filling the pane, not a contour somewhere off-screen. */
    case "row":
      V.sel[screen] = Number(value);
      if (screen === "Unités") fitUnit();
      break;
    case "article": V.article = Number(value); break;
    /* The source link is a real link: the browser follows it, and the screen
       only notes what was opened. */
    case "source": say(`${value} — texte officiel ouvert dans un onglet. Lecture seule.`); return render();
    case "utab": V.utab = Number(value); break;
    /* The unit the list is on, filling the pane: the move the plan is
       opened for, without hunting for it with the wheel. */
    case "fitunit": fitUnit(); break;
    /* The way back out: the sheet at its own size, centred, which is the
       state the pane opens in. No render — only the transform moves. */
    case "fitsheet":
      /* The sheet filling the pane, not the floor of the slider: below 100 %
         there is only paper, and nothing more of the drawing to see. */
      V.zoom = 100; V.pan = { x: 0, y: 0 };
      paintSheet();
      return;
    /* The camera has the same pair: the whole building in the pane, or close
       enough to read a façade. Both write the one number the slider shows. */
    case "mwide": case "mclose": {
      V.mzoom = el.dataset.act === "mwide" ? MZOOM_WIDE : MZOOM_CLOSE;
      const cam = document.querySelector("[data-mzoom]");
      if (cam) cam.value = String(V.mzoom);
      paintModelRead();
      window.fitteModel?.writeZoom(V.mzoom);
      return;
    }
    /* The two steppers move the same numbers the sliders move, so they do
       not go through render: the drawing must not be rebuilt to be pushed
       one notch. */
    case "zstep": {
      const [side, dir] = value.split(":");
      const k = dir === "+" ? 1 : -1;
      if (side === "plan") {
        zoomBy(Math.round(V.zoom * (dir === "+" ? 1.25 : 1 / 1.25)));
        paintSheet();
      } else {
        V.mzoom = Math.max(0, Math.min(100, V.mzoom + k * 8));
        const cam = document.querySelector("[data-mzoom]");
        if (cam) cam.value = String(V.mzoom);
        paintModelRead();
        window.fitteModel?.writeZoom(V.mzoom);
      }
      return;
    }
    case "reason": V.reason = V.reason === value ? null : value; break;
    case "save":
      if (!saveReady()) { say("Rien à enregistrer: choisissez une raison ou écrivez une phrase."); break; }
      V.settled[settleKey()] = [V.reason, V.note.trim()].filter(Boolean).join(" · ");
      say(`Décision enregistrée sur ${settleKey()}.`);
      V.reason = null; V.note = "";
      break;
    case "tick": {
      const key = `Suivi · ${value}`;
      if (V.settled[key]) delete V.settled[key]; else V.settled[key] = "fait";
      break;
    }
    case "open":
      V.project = value;
      V.screen = "Aperçu";
      dial.setValue("screen", FR_SCREEN[V.screen]);
      break;
    /* A project is not created by a click: it is a folder on the server that
       someone points at, so the button opens the dialog that asks where. */
    case "newproject":
      V.dialog = { name: "", folder: "", kinds: ["Dessins DXF"], error: "" };
      break;
    case "dlgstop": return;
    case "dlgclose": V.dialog = null; break;
    case "dlgfolder": V.dialog.folder = value; V.dialog.error = ""; break;
    case "dlgkind": {
      const k = V.dialog.kinds;
      V.dialog.kinds = k.includes(value) ? k.filter((x) => x !== value) : [...k, value];
      break;
    }
    case "dlgcreate": {
      const d = V.dialog;
      /* Both answers are needed: a name with no folder has nothing to read,
         a folder with no name cannot be found again in the list. */
      if (!d.name.trim() || !d.folder.trim()) {
        d.error = "Il faut un nom et un dossier: la lecture part du dossier, la liste part du nom.";
        break;
      }
      if (!d.kinds.length) { d.error = "Choisissez au moins un type de fichier à lire."; break; }
      if (PROJECTS.some((p) => p[0].toLowerCase() === d.name.trim().toLowerCase())) {
        d.error = "Ce nom est déjà dans la liste."; break;
      }
      PROJECTS.unshift([d.name.trim(), "aucun dessin lu",
        `${d.folder.trim()} · ${d.kinds.length} type${d.kinds.length > 1 ? "s" : ""}`, "première lecture en attente", true]);
      say(`${d.name.trim()} — dossier connecté. La première lecture est en file; rien n'est écrit dans le dossier.`);
      V.dialog = null;
      V.screen = "Projets";
      dial.setValue("screen", FR_SCREEN[V.screen]);
      V.view["Projets"] = 0;
      break;
    }
    case "openfile": say(`${value} — ouvert en lecture. Rien n'est écrit dans le fichier.`); break;
    case "autocad":
      say(`Remise à AutoCAD: ${dwgName()} s'ouvre sur l'unité, la décision suit.`);
      break;
    case "sketchup":
      say(`Remise à SketchUp: ${V.docs.skp} s'ouvre sur ${viewOf("Unités").toLowerCase()}. Lecture seule.`);
      break;
    /* The path is a control, not a label: the file moves and gets renamed
       in an office, and the tool has to be pointed at the new one. */
    case "renamefile":
      V.dialog = { kind: value, error: "",
        folder: value === "plan" ? V.docs.dir : V.docs.skpDir,
        name: value === "plan" ? dwgName() : V.docs.skp };
      break;
    case "dlgfile": {
      const d = V.dialog;
      const ext = d.kind === "plan" ? ".dwg" : ".skp";
      if (!d.folder.trim() || !d.name.trim()) {
        d.error = "Il faut un dossier et un nom: sans les deux, il n'y a rien à lire."; break;
      }
      if (!d.name.trim().toLowerCase().endsWith(ext)) {
        d.error = `fitte lit un ${ext} ici: le nom doit se terminer par ${ext}.`; break;
      }
      if (d.kind === "plan") {
        V.docs.dir = d.folder.trim();
        V.docs.names[viewOf("Unités")] = d.name.trim();
      } else {
        V.docs.skpDir = d.folder.trim();
        V.docs.skp = d.name.trim();
      }
      say(`${d.name.trim()} — chemin enregistré. La prochaine lecture part de là; rien n'est écrit dans le fichier.`);
      V.dialog = null;
      break;
    }
    case "export": say(`Export préparé: ${screen}${CONTEXT[screen] ? ` · ${viewOf(screen)}` : ""}.`); break;
    case "readarticle":
      /* Aperçu holds the articles on the same page, so the link only has to
         select the one the strip is talking about. */
      V.screen = "Aperçu";
      dial.setValue("screen", FR_SCREEN[V.screen]);
      V.article = ARTICLES.findIndex((a) => a.id === "3.2.3.1");
      break;
    default: return;
  }
  render();
}

function applyDial(v) {
  V.screen = SCREEN_FR[v.screen] || V.screen;

  V.labels = v.regionLabels;

  V.homeLayout = v.homeLayout;

     and read the same tokens. */

  /* The panel names the glyph in English and title-cases what it is given,
     so the label is matched without regard to case. */
  const pick = (screen, label) => {
    const want = String(label || "").toLowerCase();
    const hit = NAV_ICONS[screen].find(([l]) => l.toLowerCase() === want);
    V.icons[screen] = (hit || NAV_ICONS[screen][0])[1];
  };
  pick("Aperçu", v.railIcons.overview);
  pick("Unités", v.railIcons.units);
  pick("Fichiers", v.railIcons.files);
  const la = v.layers, al = la.align;
  TYPOS.forEach((t) => { V.typo[t] = v.typologies[t]; });
  V.lay.arp = { on: la.surveyor, opacity: la.surveyorOpacity,
    scale: al.surveyorScale, x: al.surveyorX, y: al.surveyorY };
  V.lay.pay = { on: la.landscaping, opacity: la.landscapingOpacity,
    scale: al.landscapingScale, x: al.landscapingX, y: al.landscapingY };
  ["nav", "header", "list", "content", "inspector", "footer"].forEach((r) => { V[r] = v[r]; });
  render();
}

dial.subscribe(applyDial);

sprite();
applyDial(dial.values);
</script>
</body>
