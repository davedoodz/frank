/* What the point landed on. The unit outlines are already in sheet
   coordinates, so the pin can name the unit it sits in without guessing. */
function unitAt(x, y) {
  const polys = polysForPane();
  const lv = paneLevel();
  for (const r of rowsOf("Unités")) {
    if (r[4] !== lv) continue;
    const poly = polys[r[2]];
    if (poly && pointInPoly(x, y, poly)) return `unité ${r[0].split(" — ")[0]}`;
  }
  return "";
}
function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i, i += 1) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function postPin() {
  if (!V.pending) return;
  const txt = V.draft.trim();
  if (!txt) { document.querySelector("[data-pindraft]")?.focus(); return; }
  V.pins.push({ id: nextPinId(), scope: V.pinScope, who: V.pinScope === "equipe" ? "Vous" : "Vous (partagé)",
    when: "à l'instant", txt, ...V.pending });
  V.selPin = V.pins[V.pins.length - 1].id;
  V.pending = null; V.draft = ""; V.pinMode = false;
  savePins();
  render();
}

/* The model's pins are world points, not screen points — the picture turns.
   The viewer is handed the list and projects it every frame. */
function pushModelPins() {
  if (!window.fitteModel?.setPins) return;
  const pending = V.pending && V.pending.surface === "model"
    ? [{ ...V.pending, id: 0, scope: V.pinScope, txt: "" }] : [];
  window.fitteModel.setPins([...pinsOnModel(), ...pending].map((p, i) => ({
    id: p.id, p: p.p, n: p.n,
    cls: `${p.scope === "equipe" ? "team" : ""} ${p.id && p.id === V.selPin ? "on" : ""} ${p.id ? "" : "pending"}`,
    html: p.id ? `<span class="nd"><i>${i + 1}</i></span>` : `<span class="nd"></span>`
      + (p.id ? `<span class="nl">${p.txt.length > 28 ? `${p.txt.slice(0, 28)}…` : p.txt}</span>` : ""),
  })));
}

/* The model takes no new pins. A point picked off a render is a point on
   nothing the drawings can be measured against, and a note is only worth
   keeping if the place it names can be found again on a sheet. Pins
   already anchored to the model are still drawn and still read. */

/* ------------------------------------------------- reading the sheet
   The pane is a fixed window; the sheet moves behind it. Zoom is a number
   in percent, pan two pixel offsets, both on V, so a re-render draws the
   drawing exactly where it was left. Nothing here touches the file. */

/* 100 % is the sheet filling the pane; below it the paper keeps going, which
   is what lets the eye step back from a drawing that runs to its own edges.
   1000 % reads a dimension string on a permit sheet; the PDF is painted at
   the screen's own density, so the line stays sharp all the way there. */
const ZMIN = 75, ZMAX = 1000;
/* What the pill reads. Zoomed all the way out the sheet spans three
   quarters of the pane, with paper round it, and that is 0 %; the sheet
   filling the pane is 100 %; from there the number is the scale itself, up
   to 1000 %. Between 0 and 100 it runs evenly from one to the other. */
const zoomShown = (z) => Math.round(z >= 100 ? z : ((z - ZMIN) / (100 - ZMIN)) * 100);
const vpEl = () => document.querySelector("[data-vp]");

/* The baked sheet carries every ordinary zoom. Past ZSHARP a 4000 px raster
   runs out of pixels — a 1000 px pane at two device pixels per CSS pixel
   needs 2000 px at 100 %, so about 200 % is where it stops being honest —
   and only then is the PDF worth its ten to twenty-five seconds. Below that
   nothing heavy is asked for, which is why the pane now paints at once.
   wireframe-c3-pdf.js paints viewport-sized tiles at the current density. */
const ZSHARP = 200;
const planVector = () => !!sheet().pdf && V.zoom > ZSHARP;
const SHEET_AR = 2000 / 1675;
function layoutSheet(el) {
  const plan = el.querySelector(".plan");
  if (!plan) return { w: 0, h: 0 };
  const r = vpBox(el);
  let w = r.width, h = w / SHEET_AR;
  if (h > r.height) { h = r.height; w = h * SHEET_AR; }
  plan.style.width = `${w}px`;
  plan.style.height = `${h}px`;
  return { w, h };
}

/* The sheet never leaves the pane: while it is smaller than the viewport it
   stays centred in it, and once it is larger it may be dragged until an
   edge reaches the opposite edge of the pane. */
function clampPan(rect, zoom, base) {
  const z = zoom / 100;
  const bw = base.w * z, bh = base.h * z;
  V.pan.x = bw <= rect.width ? (rect.width - bw) / 2 : Math.min(0, Math.max(rect.width - bw, V.pan.x));
  V.pan.y = bh <= rect.height ? (rect.height - bh) / 2 : Math.min(0, Math.max(rect.height - bh, V.pan.y));
}

/* ------------------------------------------------- the quarter turn
   The sheet, every layer on it, the outlines and the pins turn as one, by
   quarter turns, about the middle of the pane. Pan and zoom stay in the
   sheet's own upright frame — a box the size of the pane, its sides
   swapped when the sheet lies on its side — so every rule above (fit,
   centre, clamp, zoom about a point) reads the same at any angle. Only
   what the hand does on screen is turned back into that frame. */
const rotA = () => ((V.rot % 360) + 360) % 360;
const rotSide = () => rotA() % 180 !== 0;
function vpBox(el) {
  const r = el.getBoundingClientRect();
  return rotSide() ? { width: r.height, height: r.width } : { width: r.width, height: r.height };
}
const turnBy = (dx, dy, deg) => {
  const t = (deg * Math.PI) / 180, c = Math.round(Math.cos(t) * 1e6) / 1e6, s = Math.round(Math.sin(t) * 1e6) / 1e6;
  return { x: dx * c - dy * s, y: dx * s + dy * c };
};
/* A point of the screen, in the upright frame. */
function toWorld(el, cx, cy) {
  const r = el.getBoundingClientRect(), b = vpBox(el);
  const p = turnBy(cx - r.left - r.width / 2, cy - r.top - r.height / 2, -rotA());
  return { x: p.x + b.width / 2, y: p.y + b.height / 2 };
}
/* A 0–1 point of the sheet, on screen. */
function sheetToClient(el, x, y) {
  const r = el.getBoundingClientRect(), b = vpBox(el), base = layoutSheet(el), z = V.zoom / 100;
  const p = turnBy(V.pan.x + x * base.w * z - b.width / 2, V.pan.y + y * base.h * z - b.height / 2, rotA());
  return { x: r.left + r.width / 2 + p.x, y: r.top + r.height / 2 + p.y };
}

function rotPillHTML() {
  const a = rotA();
  return `<div class="zpill rpill ${a ? "turned" : ""}" data-rpill>
    <span class="zb" ${act("rot", "90")} title="Tourner de 90° (R · ⇧R à gauche)">${icon("rotate-cw")}</span>
    <span class="ang" data-rang ${act("rot0")} title="Remettre le nord en haut (⇧N)">${a}°</span></div>`;
}

/* While the sheet turns, the frame is painted from these instead of from
   V: the angle, the scale and the point of the sheet at the pane's middle,
   each eased from where it was to where it lands. */
let ROT_ANIM = null, ROT_RAF = 0;
function rotatePlan(d) {
  const el = vpEl();
  if (!d) return;
  if (!el) { V.rot += d; return; }
  stopGlide();
  if (ROT_RAF) { cancelAnimationFrame(ROT_RAF); ROT_RAF = 0; ROT_ANIM = null; }
  const z0 = V.zoom / 100, b0 = vpBox(el), base0 = layoutSheet(el);
  const f0 = { x: (b0.width / 2 - V.pan.x) / (base0.w * z0), y: (b0.height / 2 - V.pan.y) / (base0.h * z0) };
  const a0 = V.rot;
  V.rot += d;
  const b1 = vpBox(el), base1 = layoutSheet(el);
  /* Close in, the drawing keeps its size on screen, so the unit being read
     stays framed; at the whole sheet it is fitted to the pane again. */
  if (V.zoom > 100) V.zoom = Math.min(ZMAX, Math.max(100, Math.round(V.zoom * base0.w / base1.w * 100) / 100));
  const z1 = V.zoom / 100;
  V.pan.x = b1.width / 2 - f0.x * base1.w * z1;
  V.pan.y = b1.height / 2 - f0.y * base1.h * z1;
  clampPan(b1, V.zoom, base1);
  const f1 = { x: (b1.width / 2 - V.pan.x) / (base1.w * z1), y: (b1.height / 2 - V.pan.y) / (base1.h * z1) };
  const k0 = (base0.w * z0) / base1.w, k1 = z1;
  const pill = document.querySelector("[data-rpill]");
  pill?.classList.toggle("turned", rotA() !== 0);
  const ang = pill?.querySelector("[data-rang]");
  if (ang) ang.textContent = `${rotA()}°`;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { paintSheet(); return; }
  const t0 = performance.now(), ms = 320;
  const step = (now) => {
    const t = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - t, 3);
    ROT_ANIM = { a: a0 + d * e, k: k0 * Math.pow(k1 / k0, e), fx: f0.x + (f1.x - f0.x) * e, fy: f0.y + (f1.y - f0.y) * e };
    paintSheet();
    if (t < 1) { ROT_RAF = requestAnimationFrame(step); return; }
    ROT_RAF = 0; ROT_ANIM = null;
    paintSheet();
  };
  ROT_RAF = requestAnimationFrame(step);
}
/* North back at the top, the short way round: 270 goes on to 360. */
function resetPlanTurn() {
  const a = rotA();
  if (a) rotatePlan(a > 180 ? 360 - a : -a);
}
/* R turns right, ⇧R left, ⇧N puts north up — while the pointer is over
   the plan, and never while typing. */
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input,textarea,[contenteditable]")) return;
  if (!document.querySelector('[data-zone="plan"]')?.matches(":hover")) return;
  if (e.key === "r") rotatePlan(90);
  else if (e.key === "R") rotatePlan(-90);
  else if (e.key === "N") resetPlanTurn();
  else return;
  e.preventDefault();
});

/* Zooms around a point of the pane, the pointer under the wheel or the
   middle of the pane for the buttons, so what is being read stays put. */
function zoomTo(next, cx, cy, rect, base) {
  const z0 = V.zoom / 100;
  const z1 = Math.min(ZMAX, Math.max(ZMIN, next)) / 100;
  V.pan.x = cx - (cx - V.pan.x) * (z1 / z0);
  V.pan.y = cy - (cy - V.pan.y) * (z1 / z0);
  // Hundredths, not whole percents: a quarter step below 100 % is 6.25.
  V.zoom = Math.round(z1 * 10000) / 100;
  clampPan(rect, V.zoom, base);
}

function zoomBy(next) {
  const el = vpEl();
  if (!el) { V.zoom = Math.min(ZMAX, Math.max(ZMIN, next)); return; }
  const r = vpBox(el);
  zoomTo(next, r.width / 2, r.height / 2, r, layoutSheet(el));
}

/* Moving from one unit to the next is a move across one sheet, so the sheet
   moves: the eye keeps the drawing it was reading and arrives knowing where
   it went. Jumping does the opposite — the plan looks like a different
   plan every click, and the reader has to find the building again.
   The pan is interpolated in the pane's pixels and the zoom geometrically,
   because zoom is multiplicative: 50 → 200 % must pass through 100, not
   through 125. Nothing re-renders during the glide; only the transform and
   the two readouts move, which is the same path the wheel takes. */
let GLIDE = 0;
const stopGlide = () => { if (GLIDE) { cancelAnimationFrame(GLIDE); GLIDE = 0; } };
function glideTo(to, ms = 0) {
  stopGlide();
  const z0 = V.zoom, p0 = { x: V.pan.x, y: V.pan.y };
  const dz = Math.abs(to.zoom - z0), dp = Math.hypot(to.pan.x - p0.x, to.pan.y - p0.y);
  /* A move of a few pixels is not a journey: snap, and keep the frames. */
  if (dz < 1 && dp < 2) { V.zoom = to.zoom; V.pan = to.pan; paintSheet(); return; }
  /* Neighbours on the same floor are a short hop; the far corner of the
     sheet is a trip. A fixed duration makes the first feel sluggish and the
     second feel thrown, so the time follows the distance, bounded. */
  if (!ms) ms = Math.max(240, Math.min(560, 200 + dp * 0.22 + dz * 0.25));
  /* The clock starts on the first frame, not on the call: between the two
     the screen is rebuilt, and a glide measured from before that work would
     spend part of its duration on a thread that cannot paint. */
  let t0 = 0;
  /* Slow at both ends, quickest in the middle: the start says "we are
     leaving this unit", the end says "we have arrived at that one". */
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - ((-2 * t + 2) ** 3) / 2);
  const step = (now) => {
    if (!t0) t0 = now;
    const t = Math.min(1, (now - t0) / ms), k = ease(t);
    V.zoom = z0 * ((to.zoom / z0) ** k);
    V.pan.x = p0.x + (to.pan.x - p0.x) * k;
    V.pan.y = p0.y + (to.pan.y - p0.y) * k;
    paintSheet();
    if (t < 1) { GLIDE = requestAnimationFrame(step); return; }
    GLIDE = 0;
    V.zoom = to.zoom; V.pan = to.pan;
    paintSheet();
  };
  GLIDE = requestAnimationFrame(step);
}

/* The selected unit, filling the pane with a little air: the box is 0–1 on
   the sheet, so the zoom that frames it is the pane over the box. */
function fitUnit(glide = true) {
  const el = vpEl();
  const row = selRow("Unités");
  if (!el || !row) return;
  const poly = polysForPane()[row[2]];
  if (!poly) return;   // no measured contour for this unit — leave the view as it is
  const r = vpBox(el);
  const base = layoutSheet(el);
  const [x, y, w, h] = polyBounds(poly);
  const z = Math.min(ZMAX, Math.max(ZMIN,
    Math.min(r.width / (base.w * w * 1.5), r.height / (base.h * h * 1.5)) * 100));
  /* clampPan writes V.pan, so the target is computed in V and the start is
     put back before the glide: the frames own V from here on. */
  const from = { zoom: V.zoom, pan: { x: V.pan.x, y: V.pan.y } };
  V.zoom = Math.round(z);
  V.pan.x = r.width / 2 - (x + w / 2) * base.w * (z / 100);
  V.pan.y = r.height / 2 - (y + h / 2) * base.h * (z / 100);
  clampPan(r, V.zoom, base);
  const to = { zoom: V.zoom, pan: { x: V.pan.x, y: V.pan.y } };
  V.zoom = from.zoom; V.pan = from.pan;
  /* The sheet is only ever glided across itself: a level change replaces
     the drawing, and sliding one plan onto another says they are the same
     building seen from the side, which they are not. */
  if (!glide) { V.zoom = to.zoom; V.pan = to.pan; paintSheet(); return; }
  glideTo(to);
}

/* Choosing a comment shows its point: the drawing it sits on is unfolded,
   the plan turns to its level, and once drawn the sheet slides to the pin
   if the zoom had left it outside the pane. The zoom itself is kept. */
function revealPin(p) {
  if (p.surface === "model") { delete V.fold[splitKey("model")]; return; }
  if (p.surface !== "plan") return;
  delete V.fold[splitKey("plan")];
  if (p.level !== paneLevel()) {
    V.view["Unités"] = viewIndexOfLevel(p.level);
    V.sel["Unités"] = -1;
    V.scope = "Niveau";
    if (isNonresLevel(p.level)) { V.zoom = 100; V.pan = { x: 0, y: 0 }; }
  }
  requestAnimationFrame(() => {
    const el = vpEl(), mark = document.querySelector(`.zone[data-zone="plan"] .npin[data-value="${p.id}"]`);
    if (!el || !mark) return;
    const r = vpBox(el), m = mark.getBoundingClientRect(), b = el.getBoundingClientRect();
    if (m.left > b.left + 24 && m.right < b.right - 24 && m.top > b.top + 40 && m.bottom < b.bottom - 24) return;
    if (rotA()) return;   // a turned sheet is framed by its own turn, not by this
    const base = layoutSheet(el), z = V.zoom / 100;
    const from = { zoom: V.zoom, pan: { x: V.pan.x, y: V.pan.y } };
    V.pan.x = r.width / 2 - p.x * base.w * z;
    V.pan.y = r.height / 2 - p.y * base.h * z;
    clampPan(r, V.zoom, base);
    const to = { zoom: V.zoom, pan: { x: V.pan.x, y: V.pan.y } };
    V.zoom = from.zoom; V.pan = from.pan;
    glideTo(to);
  });
}

/* Bidirectional selection: the 3D viewer raycasts a window, finds which
   CONTOURS polygon it falls closest to, and calls this with the real
   unit number that key implies (e.g. "816" for CONTOURS[8][16]) — the
   mirror of window.fitteSelection above. This is the same level switch
   and row selection a list-row click already makes, and it frames the
   unit the same way: choosing a unit is asking to see it. Matched
   against the row's own suffix (r[2]) directly:
   the suffixes aren't sequential, so no.slice(-2) can't be turned into
   an array index by subtracting one. */
window.fitteSelectUnit = (unitStr) => {
  const no = String(unitStr);
  const level = Number(no.slice(0, -2));
  const suffix = Number(no.slice(-2));
  const rows = UNITS_BY_LEVEL[levelView(level)];
  if (!rows) return false;
  const rowIndex = rows.findIndex((r) => r[2] === suffix);
  if (rowIndex < 0) return false;
  // A picked window must remain selectable even when the list is filtered.
  V.query = "";
  /* The typologies filter the list too: they give way only when they
     would hide the unit picked, never when they already show it. */
  const on = typosOn();
  if (on.length && !on.includes(rows[rowIndex][3])) TYPOS.forEach((type) => {
    if (V.typo[type]) dial.setValue(`typologies.${type}`, false);
  });
  V.screen = "Unités";
  dial.setValue("screen", FR_SCREEN[V.screen]);
  /* A window picked in the 3D model can be on another floor, and the pane
     is about to carry a different sheet: there is nothing to glide across,
     so a change of level lands instead of sliding. */
  const sameSheet = V.view["Unités"] === viewIndexOfLevel(level);
  V.view["Unités"] = viewIndexOfLevel(level);
  V.sel["Unités"] = rowIndex;
  /* A level change rebuilds the sheet and the thumbnails, so this path
     cannot avoid a full render — but it can put it before the glide, the
     way a list click does: a tween started ahead of ~650 ms of raster gets
     its first frame after it is already over. */
  if (sameSheet) paintSelection(); else render();
  /* A window click can select a row well below the fold: keep it in view,
     but only scroll the list pane itself, never the page around it. */
  document.querySelector(`[data-region="list"] [data-act="row"][data-value="${rowIndex}"]`)
    ?.scrollIntoView({ block: "nearest", inline: "nearest" });
  fitUnit(sameSheet);
  return true;
};

/* A floor or the roof picked in the model: the same level switch the
   level tab makes, from whichever screen the page was on. */
window.fitteSelectLevel = (level) => {
  const index = viewIndexOfLevel(level);
  if (index < 0) return;
  V.screen = "Unités";
  dial.setValue("screen", FR_SCREEN[V.screen]);
  V.view["Unités"] = index;
  V.sel["Unités"] = 0;
  V.scope = "Niveau";
  if (isNonresLevel(level)) { V.zoom = 100; V.pan = { x: 0, y: 0 }; }
  render();
};

/* The wheel and the drag write straight to the element and to V, without a
   re-render: a re-render per wheel tick would rebuild the whole screen and
   the drag would stutter. The slider and the percentage on the edge of the
   pane are patched in place, and the next real action draws from the same
   numbers. */
function paintAnnotationLabels(el) {
  let layer = el.querySelector(":scope > .annotation-labels");
  if (!layer) {
    layer = document.createElement("div");
    layer.className = "annotation-labels";
    el.append(layer);
  }
  layer.replaceChildren();
  const bounds = el.getBoundingClientRect();
  for (const pin of el.querySelectorAll(".plan .npin")) {
    const source = pin.querySelector(".nl");
    if (!source?.textContent) continue;
    const point = pin.getBoundingClientRect();
    const label = document.createElement("span");
    label.className = `annotation-label${pin.classList.contains("on") ? " on" : ""}${pin.classList.contains("team") ? " team" : ""}`;
    label.textContent = source.textContent;
    label.style.left = `${point.left - bounds.left + 15}px`;
    label.style.top = `${point.top - bounds.top - 13}px`;
    layer.append(label);
  }
  el.dataset.sharpAnnotations = "1";
}

function paintSheet() {
  const el = vpEl();
  if (!el) return;
  const plan = el.querySelector(".plan");
  /* Laid out first: the pane can have been resized since the last paint,
     and the pan is centred against the box this returns. */
  const base = layoutSheet(el);
  const box = vpBox(el), real = el.getBoundingClientRect();
  clampPan(box, V.zoom, base);
  el.dataset.turn = String(rotA());
  /* The sheet's frame: to the pane's middle, turned, then the upright
     frame's own pan and zoom. While it turns, the eased frame instead. */
  const RA = ROT_ANIM;
  const ang = RA ? RA.a : V.rot, kz = RA ? RA.k : V.zoom / 100;
  if (plan) {
    plan.style.transform = RA
      ? `translate(${real.width / 2}px,${real.height / 2}px) rotate(${ang}deg) scale(${kz}) translate(${-RA.fx * base.w}px,${-RA.fy * base.h}px)`
      : `translate(${real.width / 2}px,${real.height / 2}px) rotate(${ang}deg) translate(${V.pan.x - box.width / 2}px,${V.pan.y - box.height / 2}px) scale(${kz})`;
  }
  /* North turns with the sheet: the needle swings, the letter rides round
     the ring and stays upright. */
  const nd = ((ang % 360) + 360) % 360, rad = (nd * Math.PI) / 180;
  document.querySelector("[data-nneedle2d]")?.setAttribute("transform", `rotate(${nd} 0 6)`);
  const nl = document.querySelector("[data-north] [data-nl]");
  if (nl) { nl.setAttribute("x", (Math.sin(rad) * 24).toFixed(1)); nl.setAttribute("y", (6 - Math.cos(rad) * 33 + 6).toFixed(1)); }
  /* V.zoom runs through fractions while the sheet glides; the percentage
     is read by a person, so it is rounded here rather than quantising the
     motion itself. */
  const shown = zoomShown(V.zoom);
  const read = document.querySelector("[data-zread]");
  if (read) read.textContent = `${shown}%`;
  el.querySelectorAll(".umark polygon").forEach((r) => { r.style.strokeWidth = `${(1.6 / V.zoom * 100).toFixed(3)}px`; });
  /* Pins and conflict marks stay upright and pin-sized whatever the sheet does. */
  el.querySelectorAll(".plan .npin").forEach((p) => { p.style.transform = `rotate(${-ang}deg) scale(${(1 / kz).toFixed(3)})`; });
  el.querySelectorAll(".plan .xmark").forEach((m) => {
    m.style.transform = `translate(-50%,-50%) rotate(${-ang}deg) scale(${(1 / kz).toFixed(4)})`;
  });
  paintAnnotationLabels(el);
  placePlanPills();
  if (V.pending) placePinBubble();
  window.dispatchEvent(new Event("fitte:plan-paint"));
  /* The corner rectangle is the same state read small; painted here so it
     cannot drift from the sheet by a frame. */
  paintMiniPlan();
}

/* What the pointer is over on the sheet. Held in a variable and not in V:
   it changes with every mouse move, and a re-render per frame would redraw
   the drawing to move a label. */
let planHover = null;

function placePill(vp, name, poly) {
  let pill = vp.querySelector(`:scope > .uhover[data-pill="${name}"]`);
  if (!poly) { if (pill) pill.hidden = true; return; }
  if (!pill) {
    pill = document.createElement("div");
    pill.className = "uhover";
    pill.dataset.pill = name;
    vp.append(pill);
  }
  const row = rowsOf("Unités")[Number(poly.dataset.value)];
  pill.textContent = row ? String(row[0]).split("—")[0].trim() : "";
  pill.hidden = false;
  /* Centred over the outline's top edge, 6 px above it, in whole pixels so
     the text lands on the pixel grid. */
  const b = poly.getBoundingClientRect();
  const v = vp.getBoundingClientRect();
  const x = Math.round(b.left + b.width / 2 - v.left - pill.offsetWidth / 2);
  const y = Math.round(Math.max(4, b.top - v.top - pill.offsetHeight - 6));
  pill.style.transform = `translate(${x}px,${y}px)`;
}

/* Two pills: the selected unit's stays put; the hovered one's follows the
   pointer. Hover only finds the other units' hit boxes, so the two never
   sit on the same outline. The overlay is rebuilt on every selection
   change, so a remembered outline can be a node no longer on the page. */
function placePlanPills() {
  const vp = vpEl();
  const plan = vp?.querySelector(".plan");
  if (!plan) return;
  const hover = planHover && plan.contains(planHover) ? planHover : null;
  placePill(vp, "sel", plan.querySelector(".umark polygon.on"));
  placePill(vp, "hover", hover);
}

/* Dragging an edge. Nothing re-renders while the pointer is down — a plan
   pane that redrew on every pixel would make the edge feel heavy — so the
   new width is written straight onto the layout and into state only once,
   on release. The grid case rewrites the whole track list because a grid
   item cannot widen its own column; the flex case writes the basis of the
   pane itself. */
/* Folding reads the pane's header first, so the strip it leaves carries
   the same icon and title on any screen. */
document.addEventListener("click", (e) => {
  const btn = e.target.closest?.(".fbtn[data-fold]");
  if (!btn) return;
  const ph = btn.closest(".ph");
  if (!ph) return;
  V.foldHead[splitKey(btn.dataset.fold)] = {
    ic: ph.querySelector("use")?.getAttribute("href")?.replace("#lu-", ""),
    t: ph.querySelector(".hi")?.textContent.trim(),
  };
}, true);
/* The narrowest a pane's header goes before its controls touch: the header
   laid out at its own max-content width, so every control is drawn whole
   and nothing is handed spare room. Read at the pane's width instead, a
   spacer (flex:1) or a pushed button (margin-left:auto) counts the free
   space as needed, and every pane stops at the width it already has.
   Text that already gives way with an ellipsis, like the file name in the
   model's chip, counts for nothing: it is meant to fold away first. */
function headNeed(pane) {
  let n = 0;
  pane.querySelectorAll(".ph").forEach((ph) => {
    const give = [...ph.querySelectorAll("*")].filter((c) => getComputedStyle(c).textOverflow === "ellipsis");
    const gw = give.map((c) => c.style.display);
    give.forEach((c) => { c.style.display = "none"; });
    const pw = ph.style.width;
    ph.style.width = "max-content";
    n = Math.max(n, ph.getBoundingClientRect().width);
    ph.style.width = pw;
    give.forEach((c, i) => { c.style.display = gw[i]; });
  });
  return Math.ceil(n);
}
document.addEventListener("pointerdown", (e) => {
  const gut = e.target.closest?.(".gut");
  if (!gut || gut.classList.contains("fold")) return;
  e.preventDefault();
  const parent = gut.parentElement;
  const grid = parent.classList.contains("work");
  const target = gut.dataset.grab === "prev" ? gut.previousElementSibling : gut.nextElementSibling;
  if (!target) return;
  const key = splitKey(gut.dataset.gut);
  const sign = gut.dataset.grab === "prev" ? 1 : -1;
  const startX = e.clientX, startW = target.getBoundingClientRect().width;
  /* The pane opposite keeps a readable width too: an edge that can be
     pushed until the drawing is a sliver is an edge that gets pushed. */
  const room = parent.getBoundingClientRect().width;
  const other = (gut.dataset.grab === "prev" ? gut.nextElementSibling : gut.previousElementSibling);
  /* Never narrower than where the edge already sits: a pane laid out past
     its own stop (a window too small for both headers) would otherwise jam
     the edge at the first pixel of the drag. */
  const max = Math.max(startW, startW + (other ? other.getBoundingClientRect().width - Math.max(SPLIT_MIN, headNeed(other)) : room - SPLIT_MIN));
  /* The track index of a grid child is its position, the header above
     spanning every column and taking none of its own. */
  const index = grid ? [...parent.children].indexOf(target) - 1 : -1;
  const tracks = grid ? getComputedStyle(parent).gridTemplateColumns.split(" ") : null;
  /* The computed tracks are all in pixels, so the drawing column has to be
     put back to 1fr or the grid stops filling the window and the panes
     spill past its right edge while the edge is moving. */
  if (grid) {
    const fr = [...parent.children].indexOf(parent.querySelector('[data-region="content"]')) - 1;
    if (fr >= 0) tracks[fr] = "1fr";
  }
  /* Option A: a pane stops at the width its tables and its header need,
     measured as laid out without the pane holding them in. A table drawn
     at 100 % reports the pane's width, not its own, so each is read at its
     natural width; the header by headNeed. */
  const need = (() => {
    const pr = target.getBoundingClientRect().width;
    let n = 0;
    target.querySelectorAll(".pb").forEach((pb) => {
      const pad = pr - pb.clientWidth + parseFloat(getComputedStyle(pb).paddingLeft) + parseFloat(getComputedStyle(pb).paddingRight);
      pb.querySelectorAll("table").forEach((t) => {
        const was = t.style.width;
        t.style.width = "max-content";
        n = Math.max(n, t.offsetWidth + pad);
        t.style.width = was;
      });
    });
    return Math.ceil(Math.max(n, headNeed(target)));
  })();
  /* Same on the other side: the stop never sits above the width the pane is
     already drawn at, or the edge could only ever grow. */
  const floor = Math.max(SPLIT_MIN, Math.min(need, max, startW));
  let w = startW;
  gut.classList.add("live");
  document.body.classList.add("splitting");
  /* A grid column will not go under its content (see `side` in render):
     when the pane stops wider than the pointer asks, the edge says so. */
  const stop = document.createElement("i");
  stop.className = "stop";
  stop.textContent = "butée";
  const move = (ev) => {
    const asked = startW + sign * (ev.clientX - startX);
    w = Math.max(floor, Math.min(max, asked));
    if (grid) {
      const next = tracks.slice();
      next[index] = `minmax(min-content, ${Math.round(w)}px)`;
      parent.style.gridTemplateColumns = next.join(" ");
      const held = target.getBoundingClientRect().width > w + 1 || asked < floor;
      if (held && !stop.isConnected) target.append(stop);
      else if (!held) stop.remove();
    } else {
      target.style.flex = `0 0 ${Math.round(w)}px`;
      if (asked < floor && !stop.isConnected) target.append(stop);
      else if (asked >= floor) stop.remove();
    }
    /* The drawing's card is fixed to the viewport beside its strip: it is
       placed again on every move so it travels with the edge, not after. */
    placeLayCard();
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    gut.classList.remove("live");
    document.body.classList.remove("splitting");
    stop.remove();
    /* The width kept is the one on screen, not the one asked past the stop. */
    V.split[key] = Math.round(grid ? Math.max(w, target.getBoundingClientRect().width) : w);
    render();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
});
/* Moving a task is dragging it onto a day in the calendar beside it. The
   row is carried under the pointer and the day it is over lights up, so the
   answer to "which day is that" is given before the drop, not after it.
   Typing a date in the editor does the same thing; this is the fast way. */
document.addEventListener("pointerdown", (e) => {
  const row = e.target.closest?.("[data-task]");
  if (!row || e.target.closest(".dot") || e.target.closest(".tact")) return;
  const id = row.dataset.task, task = TASKS.find((t) => t.id === id);
  if (!task) return;
  const start = [e.clientX, e.clientY];
  let moved = false, over = null;
  const dayUnder = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const cell = el && el.closest('[data-act="calday"]');
    return cell && cell.dataset.value ? cell : null;
  };
  const move = (ev) => {
    if (!moved && Math.hypot(ev.clientX - start[0], ev.clientY - start[1]) < 4) return;
    moved = true;
    row.classList.add("carry");
    document.body.classList.add("tdrag");
    row.style.transform = `translate(${ev.clientX - start[0]}px,${ev.clientY - start[1]}px)`;
    const cell = dayUnder(ev);
    if (cell === over) return;
    over?.classList.remove("drop");
    over = cell;
    over?.classList.add("drop");
  };
  const up = (ev) => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    document.body.classList.remove("tdrag");
    row.classList.remove("carry");
    row.style.transform = "";
    over?.classList.remove("drop");
    if (!moved) return;
    const cell = dayUnder(ev);
    if (!cell || cell.dataset.value === task.day) return;
    task.day = cell.dataset.value;
    V.day = task.day;
    say(`${task.title} — déplacée au ${fmtDay(task.day)}.`);
    render();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
});

/* Enter saves the task being written, Escape drops it: a one-line form
   should never need the mouse. */
document.addEventListener("keydown", (e) => {
  if (!V.taskEdit || !e.target.closest?.("[data-tedit]")) return;
  /* The same button the mouse would press, so there is one save path. */
  if (e.key === "Enter") { e.preventDefault(); document.querySelector('[data-tedit] [data-act="tsave"]')?.click(); }
  else if (e.key === "Escape") { e.preventDefault(); V.taskEdit = null; render(); }
});


/* Each card stands right beside the thumbnail it belongs to, on the strip's
   right — over the model's pane if need be, since the drawing on the left is
   what the card adjusts and must stay in view. Fixed to the viewport, so no
   pane's overflow crops it. The cards stack in the order of their tiles,
   each as close to its tile's top as the card above it allows: a card for a
   tile higher up pushes the other one down, never up past the pane's top
   onto it. If the stack runs off the bottom it is lifted as a block. Two
   cards cannot overlap. */
function placeLayCard() {
  const live = [];
  for (const card of document.querySelectorAll("[data-lcard]")) {
    const zone = card.parentElement, strip = zone.querySelector("[data-lstrip]");
    const tile = zone.querySelector(`[data-ltile="${card.dataset.anchor}"]`);
    if (!strip || !tile) { card.style.display = "none"; continue; }
    card.style.display = "";
    live.push({ card, zone, strip, t: tile.getBoundingClientRect().top, h: card.offsetHeight });
  }
  if (!live.length) return;
  live.sort((a, b) => a.t - b.t);
  const pad = 8, gap = 8;
  const z = live[0].zone.getBoundingClientRect();
  let y = z.top + pad;
  for (const c of live) { c.top = Math.max(c.t, y); y = c.top + c.h + gap; }
  const over = Math.max(0, y - gap - (z.bottom - pad));
  /* With the model folded there is no pane to lie over on the right, only
     the folded strips and the margin: the cards open on the strip's left,
     over the drawing, instead. */
  const s = live[0].strip.getBoundingClientRect();
  const modelOpen = Boolean(document.querySelector('[data-zone="model"]'));
  for (const c of live) {
    c.card.style.right = "";
    c.card.style.left = `${modelOpen ? s.right + 8 : s.left - 8 - c.card.offsetWidth}px`;
    c.card.style.top = `${Math.max(z.top + pad, c.top - over)}px`;
  }
}

/* Opacity is dragged, not stepped. The value is written straight onto the
   drawing and the card while the knob moves — a full render per frame
   would repaint fifteen cropped thumbnails and the sheet — and the panel
   is told once, on release, so the two never disagree. */
function layOpacity(k, v) {
  V.lay[k].opacity = v;
  const zone = document.querySelector('[data-zone="plan"]');
  if (!zone) return;
  if (k === "plan") zone.querySelector(".plan")?.style.setProperty("--planop", v / 100);
  else {
    const el = zone.querySelector(`.lay[data-lay="${k}"]`);
    if (el) el.style.opacity = v / 100;
  }
  const card = zone.querySelector("[data-lcard]");
  if (!card || card.dataset.anchor !== k) return;
  card.querySelector(".optrack .fill").style.width = `${v}%`;
  card.querySelector(".optrack .knob").style.left = `${v}%`;
  card.querySelector(".opval").textContent = `${Math.round(v)}%`;
}

/* The pile's order on the sheet itself: the two overlays carry it as an
   inline z-index, the architect's ink as a variable, because its raster
   and its canvas are two elements that must move together. */
function applyLayOrder() {
  const zone = document.querySelector('[data-zone="plan"]');
  if (!zone) return;
  zone.querySelector(".plan")?.style.setProperty("--planz", layZ("plan"));
  zone.querySelectorAll(".plan .lay[data-lay]").forEach((el) => {
    const k = el.dataset.lay;
    if (V.lay[k] && layKeys().includes(k)) el.style.zIndex = layZ(k);
  });
}

/* The strip alone, redrawn. A reorder changes three thumbnails and the
   drawings' stacking; it does not change the unit list, the model or the
   inspector, and a full render would cost ~650 ms of raster right at the
   end of a gesture that has to feel immediate. */
function paintStrip() {
  const pile = document.querySelector("[data-lpile]");
  if (!pile) return;
  pile.innerHTML = layKeys().map(layTile).join("");
  applyLayOrder();
  placeLayCard();
}

/* A press on the knob becomes a drag on that drawing's opacity. The track
   is measured once, so the same code serves any width. */
document.addEventListener("pointerdown", (e) => {
  const track = e.target.closest?.("[data-lop]");
  if (!track) return;
  const k = track.dataset.lop, box = track.getBoundingClientRect();
  /* A hidden drawing reads 0 %: taking hold of its opacity brings it back. */
  if (!V.lay[k].on) setLayShown(k, true);
  const apply = (ev) => {
    /* Never to zero: a drawing at 0 % is gone without being taken off,
       which is exactly the confusion a hidden layer used to cause. */
    const v = Math.max(15, Math.min(100, Math.round((ev.clientX - box.left) / box.width * 100)));
    if (v !== V.lay[k].opacity) layOpacity(k, v);
  };
  const up = () => {
    window.removeEventListener("pointermove", apply);
    window.removeEventListener("pointerup", up);
    /* The panel owns the consultants' sheets; told once the knob is let
       go, it writes V back and re-renders with the same number. */
    if (k === "arp") dial.setValue("layers.surveyorOpacity", V.lay[k].opacity);
    else if (k === "pay") dial.setValue("layers.landscapingOpacity", V.lay[k].opacity);
  };
  apply(e);
  window.addEventListener("pointermove", apply);
  window.addEventListener("pointerup", up);
  e.preventDefault();
  e.stopPropagation();
});

/* The pile is the stacking order, so a thumbnail is dragged to its place.
   Nothing is re-rendered during the gesture: a re-render would snap the
   drawing back under the pointer and kill the sense of carrying it. The
   held tile follows the finger exactly; the ones it passes slide out of
   its way; the order is written when it is let go. */
/* layKeys() is a subset on a level that has no sheet for a discipline, so
   the keys that are not on screen keep their own place in the pile. */
function commitOrder(shown) {
  let i = 0;
  V.layOrder = V.layOrder.map((k) => shown.includes(k) ? shown[i++] : k);
}

/* Thumbnails slide from where they were to where the new order puts them,
   the same landing a drag gets: positions noted, the change made, the
   difference played back. */
function slideStrip(change) {
  const was = {};
  document.querySelectorAll("[data-ltile]").forEach((el) => { was[el.dataset.ltile] = el.getBoundingClientRect().top; });
  change();
  const after = [...document.querySelectorAll("[data-ltile]")].filter((el) => was[el.dataset.ltile] !== undefined);
  after.forEach((el) => {
    const dy = was[el.dataset.ltile] - el.getBoundingClientRect().top;
    if (!dy) return;
    el.style.transition = "none";
    el.style.transform = `translateY(${dy}px)`;
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    after.forEach((el) => { el.style.transition = ""; el.style.transform = ""; });
  }));
}
/* A drawing brought to the front: first in the pile, on if it was off. A
   drawing already on only changes place, so the strip and the stacking are
   redrawn alone; one that was off needs its sheet drawn, so the whole pane
   is. The two consultants' sheets are switched on through their dials, as
   their badge does, so the panel and the sheet never disagree. */
function bringLayFront(k) {
  if (!layKeys().includes(k)) return;
  const wasOn = V.lay[k].on;
  slideStrip(() => {
    commitOrder([k, ...layKeys().filter((x) => x !== k)]);
    if (wasOn) { paintStrip(); return; }
    setLayShown(k, true);
  });
  say(`${LAYDOC[k].short} devant${wasOn ? "" : ", posé sur le plan"}.`);
}

document.addEventListener("pointerdown", (e) => {
  const tile = e.target.closest?.("[data-ltile]");
  if (!tile || e.target.closest(".lbadge")) return;
  const pile = tile.closest("[data-lpile]");
  const els = [...pile.querySelectorAll("[data-ltile]")];
  if (els.length < 2) return;
  const k = tile.dataset.ltile, from = els.indexOf(tile);
  /* Centres measured once, before anything moves: every later decision is
     taken against these, so the maths cannot drift as things slide. */
  const mid = els.map((el) => { const b = el.getBoundingClientRect(); return b.top + b.height / 2; });
  const startY = e.clientY;
  let to = from, moved = false;
  const orderAt = (t) => {
    const o = layKeys().slice();
    o.splice(o.indexOf(k), 1);
    o.splice(t, 0, k);
    return o;
  };
  /* The badges and the drawings follow the provisional order directly,
     with no re-render, so the mark and the sheet are already right while
     the thumbnail is still in the hand. */
  const reflect = (order) => {
    const zone = document.querySelector('[data-zone="plan"]');
    order.forEach((kk, j) => {
      const z = order.length - j;
      if (kk === "plan") zone?.querySelector(".plan")?.style.setProperty("--planz", z);
      else { const el = zone?.querySelector(`.lay[data-lay="${kk}"]`); if (el) el.style.zIndex = z; }
    });
  };

  /* A press is a click until the tile moves: the arrow stays. Moving, the
     closed hand: the tile is being carried. */
  tile.classList.add("held");
  const move = (ev) => {
    const dy = ev.clientY - startY;
    if (!moved && Math.abs(dy) < 3) return;   /* a press is not a drag */
    if (!moved) document.body.classList.add("ldrag");
    moved = true;
    tile.style.transform = `translateY(${dy}px)`;
    const c = mid[from] + dy;
    let t = to;
    /* One step at a time, each against a neighbour's original centre:
       cross it going down and that sheet rises, going up and it sinks. */
    while (t > 0 && c < mid[t - 1]) t--;
    while (t < els.length - 1 && c > mid[t + 1]) t++;
    if (t === to) return;
    to = t;
    els.forEach((el, j) => {
      if (j === from) return;
      const shift = j > from && j <= to ? mid[j - 1] - mid[j]
        : j < from && j >= to ? mid[j + 1] - mid[j] : 0;
      el.style.transform = shift ? `translateY(${shift}px)` : "";
    });
    reflect(orderAt(to));
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    document.body.classList.remove("ldrag");
    if (!moved) { tile.classList.remove("held"); tile.style.transform = ""; return; }
    /* The landing is where a drag usually stutters: animate to a guessed
       offset, wait on a timer, re-render, and the sheet jumps because the
       re-render put it somewhere else. Instead note where every thumbnail
       is right now, commit the order and redraw, measure again, and carry
       each one from where it was to where it now is. */
    const was = {};
    els.forEach((el) => { was[el.dataset.ltile] = el.getBoundingClientRect().top; });
    commitOrder(orderAt(to));
    paintStrip();
    const after = [...document.querySelectorAll("[data-ltile]")].filter((el) => was[el.dataset.ltile] !== undefined);
    after.forEach((el) => {
      const dy = was[el.dataset.ltile] - el.getBoundingClientRect().top;
      if (!dy) return;
      el.style.transition = "none";
      el.style.transform = `translateY(${dy}px)`;
      if (el.dataset.ltile === k) el.classList.add("landing");
    });
    /* Two frames: one for the inverted position to be taken as the start,
       the next to release it. One alone is sometimes collapsed with the
       style write and the animation never runs. */
    requestAnimationFrame(() => requestAnimationFrame(() => {
      after.forEach((el) => {
        el.style.transition = "";
        el.style.transform = "";
        el.classList.remove("landing");
      });
    }));
    say(`Ordre: ${layKeys().map((x) => LAYDOC[x].short).join(" devant ")}.`);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  e.preventDefault();
});

/* The marks live inside the transformed sheet, so their type and padding
   are divided by the zoom the way the unit pill's are: a mark is a mark at
   any magnification, never a sign. */
/* The bubble is pane furniture: it is put beside the point in pixels and
   kept inside the pane, so a pin at the edge of the sheet still gets a
   whole box to write in. */
function placePinBubble() {
  const el = vpEl();
  const bub = el && el.closest(".zone")?.querySelector(".pbub");
  if (!bub) return;
  const plan = el.querySelector(".plan");
  const zone = el.closest(".zone");
  if (!plan || !zone) return;
  const z = zone.getBoundingClientRect(), v = el.getBoundingClientRect();
  const tip = sheetToClient(el, V.pending.x, V.pending.y);
  const px = tip.x - z.left, py = tip.y - z.top;
  const pad = 10, gap = 14, head = 28;
  /* On a narrow pane the box gives up its width before it gives up being
     whole. */
  bub.style.width = `${Math.min(286, Math.round(v.width - 2 * pad))}px`;
  const w = bub.offsetWidth, h = bub.offsetHeight;
  const L = v.left - z.left + pad, R = v.right - z.left - pad, T = v.top - z.top + pad, B = v.bottom - z.top - pad;
  /* Centred under the pin's point, a tail pointing up at it; when there is
     no room below, above the pin's head. Either way it never covers the
     pin. With room for neither, the side with more of it. */
  const left = Math.max(L, Math.min(px - w / 2, R - w));
  const below = py + gap, above = py - head - gap - h;
  const under = below + h <= B || (above < T && B - py >= py - head - T);
  const top = under ? Math.min(below, B - h) : Math.max(T, above);
  bub.style.left = `${left.toFixed(0)}px`;
  bub.style.top = `${top.toFixed(0)}px`;
  let tail = bub.querySelector(":scope > .ptail");
  if (!tail) { tail = document.createElement("i"); bub.append(tail); }
  tail.className = `ptail ${under ? "t" : "b"}`;
  tail.style.left = `${Math.max(10, Math.min(w - 22, px - left - 6)).toFixed(0)}px`;
}

function setPlanHover(poly) {
  if (poly === planHover) return;
  planHover = poly;
  placePlanPills();
  if (V.pending) placePinBubble();
}

/* One way in for both gestures — the armed click and the double-click.
   Returns false when the pointer is off the sheet, so the caller can do
   whatever it does when there is no drawing under it. */
const inBubble = (e) => !!(e.target.closest && e.target.closest(".pbub"));

function dropPinAt(e, el) {
  if (inBubble(e)) return false;
  const plan = el.querySelector(".plan");
  if (!plan) return false;
  const base = layoutSheet(el), z = V.zoom / 100, p = toWorld(el, e.clientX, e.clientY);
  const x = (p.x - V.pan.x) / (base.w * z), y = (p.y - V.pan.y) / (base.h * z);
  if (x < 0 || x > 1 || y < 0 || y > 1) return false;
  V.pending = { surface: "plan", level: paneLevel(), sheet: currentSheetKey(),
    x, y, zone: unitAt(x, y) };
  V.selPin = null;
  V.pinMode = false;
  /* Armed from the margin: the point belongs to the comment already being
     written there, so it is held for that composer and no bubble opens. */
  if (V.pinFor === "margin") {
    V.mAnchor = V.pending; V.pending = null; V.pinFor = "";
    render();
    document.querySelector("[data-mdraft]")?.focus();
    return true;
  }
  render();
  document.querySelector("[data-pindraft]")?.focus();
  return true;
}

function wireViewport() {
  const el = vpEl();
  if (!el) return;
  const paint = paintSheet;
  /* With the pin armed, a click on the sheet is a point, not a unit: it is
     caught before the outlines underneath get it. Coordinates are 0–1 of
     the sheet itself, like the unit outlines, so the pin keeps its place
     when the drawing is zoomed, panned, or re-exported larger. */
  el.addEventListener("click", (e) => {
    if (!V.pinMode) return;
    if (dropPinAt(e, el)) e.stopPropagation();
  }, true);
  /* The hand always wins: a wheel, a drag or a double-click during a glide
     stops it where it is rather than fighting it for the transform. */
  el.onwheel = (e) => {
    if (inBubble(e)) return;
    e.preventDefault();
    stopGlide();
    const p = toWorld(el, e.clientX, e.clientY);
    /* One direction for every device. Guessing the device from the shape of
       the deltas got it wrong often enough that the same gesture zoomed both
       ways within one stroke, which is worse than any convention: a trackpad
       sends a stream of small deltas and a single large one is enough to flip
       the sign mid-swipe. Two fingers down, the drawing goes away. */
    zoomTo(V.zoom * Math.exp(e.deltaY * 0.0016), p.x, p.y, vpBox(el), layoutSheet(el));
    paint();
  };
  el.ondblclick = (e) => {
    stopGlide();
    if (dropPinAt(e, el)) return;
    V.zoom = 100; V.pan = { x: 0, y: 0 }; paint();
  };
  el.onpointerdown = (e) => {
    if (e.button !== 0) return;
    /* Selecting the words of a note is not a pan. */
    if (inBubble(e)) return;
    stopGlide();
    const r = vpBox(el);
    const start = { x: e.clientX, y: e.clientY, px: V.pan.x, py: V.pan.y };
    let moved = false;
    el.onpointermove = (m) => {
      if (!moved && Math.abs(m.clientX - start.x) + Math.abs(m.clientY - start.y) <= 3) return;
      if (!moved) {
        /* The pointer is captured only once the hand has actually moved: a
           capture taken on press retargets the click to this element, and
           the unit under the finger would never be selected. */
        moved = true;
        el.setPointerCapture(m.pointerId);
        el.classList.add("drag");
      }
      /* The hand moves on screen; the pan is in the sheet's upright frame. */
      const dd = turnBy(m.clientX - start.x, m.clientY - start.y, -rotA());
      V.pan.x = start.px + dd.x;
      V.pan.y = start.py + dd.y;
      clampPan(r, V.zoom, layoutSheet(el));
      paint();
    };
    el.onpointerup = (u) => {
      el.classList.remove("drag");
      el.onpointermove = null; el.onpointerup = null;
      /* A drag is not a click: only a still pointer picks the unit under it. */
      if (moved) { u.stopPropagation(); u.preventDefault(); }
    };
  };
  /* Hover is read on the pane and not on each outline: the overlay is
     rebuilt on every selection change, and a listener per polygon would
     die with it. */
  el.onmousemove = (e) => {
    if (el.classList.contains("drag")) return setPlanHover(null);
    setPlanHover(V.pinMode ? null : (e.target.closest ? e.target.closest(".umark polygon.hit") : null));
  };
  el.onmouseleave = () => setPlanHover(null);
  /* Drawn once here: the markup carries the last transform, but the box it
     is measured against only exists after the pane has been laid out. */
  paintSheet();
  /* The pane does not settle on one width at first paint: the model beside
     it loads a canvas and takes its share late, a rail is folded, the panel
     opens. Every one of those resizes this box, and a sheet laid out
     against the old width would hang past the edge and be cut. */
  if (!el.__ro) {
    el.__ro = new ResizeObserver(() => paintSheet());
    el.__ro.observe(el);
  }
}

/* The pane changes width with the window, and the sheet is centred in it,
   so the one listener re-centres whatever is on screen. */
window.addEventListener("resize", () => paintSheet());

/* The model's percentage follows the camera: orbiting and the wheel change
   the same number the pill shows, so the viewer writes back through an
   event (below) and the pill is painted from V.mzoom. */
function wireZoomRails() {
  paintModelRead();
  wireMiniPlan();
}

/* The corner view of the plan is a control: pressing or dragging inside it
   centres the sheet on the point touched, which is the fastest way across a
   permit sheet at 400 %. */
function wireMiniPlan() {
  const mi = document.querySelector('[data-mini="plan"] [data-mi]');
  if (!mi) return;
  const goTo = (e) => {
    const el = vpEl();
    if (!el) return;
    const b = mi.getBoundingClientRect(), r = vpBox(el);
    const base = layoutSheet(el), z = V.zoom / 100;
    const fx = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width));
    const fy = Math.max(0, Math.min(1, (e.clientY - b.top) / b.height));
    V.pan.x = r.width / 2 - fx * base.w * z;
    V.pan.y = r.height / 2 - fy * base.h * z;
    paintSheet();
  };
  let on = false;
  mi.onpointerdown = (e) => { on = true; mi.setPointerCapture(e.pointerId); goTo(e); e.stopPropagation(); };
  mi.onpointermove = (e) => { if (on) goTo(e); };
  mi.onpointerup = () => { on = false; };
}

/* The rectangle is the pane expressed in the sheet's own 0–1 box, clipped
   to it: past the edge there is no sheet left to frame. */
function paintMiniPlan() {
  const box = document.querySelector('[data-mini="plan"]');
  const el = vpEl();
  if (!box || !el) return;
  const mi = box.querySelector("[data-mi]"), rect = box.querySelector("[data-mrect]");
  const b = mi.getBoundingClientRect();
  if (!b.width) return;
  const r = vpBox(el), base = layoutSheet(el), z = V.zoom / 100;
  const x = Math.max(0, Math.min(1, -V.pan.x / (base.w * z)));
  const y = Math.max(0, Math.min(1, -V.pan.y / (base.h * z)));
  const w = Math.min(1 - x, r.width / (base.w * z));
  const h = Math.min(1 - y, r.height / (base.h * z));
  rect.style.left = `${x * b.width}px`;
  rect.style.top = `${y * b.height}px`;
  rect.style.width = `${w * b.width}px`;
  rect.style.height = `${h * b.height}px`;
}

/* The model's corner view is rendered by the viewer module from the live
   scene, so nothing here draws it. The zoom column carries the number. */
function paintModelRead() {
  const read = document.querySelector("[data-mread]");
  if (read) read.textContent = `${V.mzoom}%`;
}

window.addEventListener("fitte:model-zoom", (e) => {
  if (!Number.isFinite(e.detail)) return;
  V.mzoom = e.detail;
  paintModelRead();
});
/* ---------------------------------------------------------------- frame */

/* What the 3D viewer owns and draws into in the model pane: its host and
   canvas, the note markers, the north ring, the axes and the corner view. */
const LIVE_3D = ["[data-building-model]", "[data-npins]", "[data-north3d]", "[data-axes]", '[data-mini="model"]'];

function render() {
  const def = SCREENS[V.screen];
  /* Counting the building is not reading a floor: the Statistiques pane
     counts all of it, beside the model and the margin, with no plan. */
  const whole = buildingScope();
  /* A basement and the roof carry no apartment unit, and the column still
     stands: a level that drops a whole pane reads as a different screen,
     and the eye has to find the drawing again every time a tab is crossed.
     The tables are drawn as they always are, empty where there is nothing
     to count. */
  const hasList = def.regions.includes("list")
    && V.list.layout !== "Hidden" && V.list.layout !== "Filter bar only";
  const hasInsp = def.regions.includes("inspector") && V.inspector.layout === "Right panel";
  /* The margin is a note stuck to a point of a drawing, so it belongs to
     the screens that carry one. Codes carries sentences instead, and its
     notes are written against an article in the right column. */
  const margin = hasInsp && V.screen !== "Codes";
  /* A folded pane is not drawn at all — a zero-width section still paints
     its own two borders, and the point of folding is that nothing of it
     remains but the handle that brings it back. */
  const listShut = hasList && folded("list");
  const sideShut = hasInsp && folded("side");
  const listW = splitW("list", V.screen === "Unités" ? 400 : 260);
  /* The margin opens at the width of its own header — the two tabs and
     the fold button side by side — and is widened by dragging, not by
     default. The inspector keeps a readable column. */
  const sideW = splitW("side", margin ? null : 340);
  /* A side column is never narrower than what it holds: the track's floor
     is its content's own width, so a table is never cut at the edge. */
  const side = (shut, w) => (shut ? `${FOLD_W}px` : w === null ? "min-content" : `minmax(min-content, ${w}px)`);
  /* Beside a folded strip — a side column's, or the plan's or the model's at
     the content's own edge — the edge takes no room in the white card, so
     no white sliver opens between the strip and the pane next to it. */
  const strip = (k) => V.screen === "Unités" && folded(k);
  /* In the white card a seam takes no room at all: the pane on its left
     draws the rule as its own border and the strip's grip hangs over it.
     A pane then has the same white on both sides — its own padding — where
     before the gap on one side added ten pixels the other side never had. */
  const edge = (shut) => (V.shell === "Inset card" ? "0px" : "var(--gap)");
  const cols = [hasList ? side(listShut, listW) : null, hasList ? edge(listShut || strip("plan")) : null, "1fr",
    hasInsp ? edge(sideShut || strip("model")) : null, hasInsp ? side(sideShut, sideW) : null]
    .filter(Boolean).join(" ");
  /* No rail until a project is open: the rail is the proof that one is. */
  const navMode = def.index ? "top"
    : { "Top bar only": "top", "Tabs only, no rail": "top", "Two rows, no rail": "top",
        "Wide rail with labels": "wide", "Wide rail with sections": "wide",
        "Rail with labels under icons": "stack" }[V.nav.layout] || "rail";

  /* The 3D pane's live parts are never rebuilt. A render used to replace
     the model's host with a fresh one marked "loading": the canvas faded
     back in over 0.18 s with the old façade picture behind it, the north
     ring and the axes were blank for a frame, and a click on a 2D layer
     made the model flash. The live nodes are lifted out before the frame is
     rewritten and put back in place of their fresh copies after it. */
  const live3d = LIVE_3D.map((s) => document.querySelector(`[data-zone="model"] ${s}`));
  document.getElementById("frame").innerHTML = `
    <div class="frame" data-nav="${navMode}" data-labels="${V.labels}"
         data-density="${V.density}" data-fi="${V.fidelity}" data-isolate="${V.isolate}"
         data-shell="${V.shell === "Inset card" ? "inset" : "flat"}"
         data-chrome="${V.chrome === "Black" ? "black" : "light"}"
         style="--plan:url(${sheet().webp || sheet().img})">
      ${navHTML()}
      <div class="body">
        ${tabsHTML()}
        <div class="work" style="grid-template-columns:${SCREENS[V.screen].home ? "1fr" : cols};grid-auto-rows:min-content 1fr min-content;align-content:stretch">
          <div style="grid-column:1/-1">${headerHTML()}</div>
          ${SCREENS[V.screen].home ? `<div style="grid-column:1/-1;display:flex;min-height:0;gap:var(--gap)">${(HOMES[V.homeLayout] || HOMES["Card grid"])()}</div>` : ""}
          ${SCREENS[V.screen].home ? "" : `${!whole && V.list.layout === "Filter bar only" && def.regions.includes("list") ? listHTML() : ""}
          ${hasList ? (listShut ? foldStripHTML("list", "la liste") : listHTML()) : ""}
          ${hasList ? gutter({ size: "list", grab: "prev", prev: "list", lprev: "la liste" }) : ""}
          ${contentHTML()}
          ${hasInsp ? gutter({ size: "side", grab: "next", next: "side",
            lnext: margin ? "les commentaires" : "l'inspecteur" }) : ""}
          ${hasInsp ? (sideShut ? foldStripHTML("side", margin ? "les commentaires" : "l'inspecteur")
            : (margin ? marginHTML() : inspectorHTML())) : ""}`}
        </div>
        ${!whole && def.regions.includes("inspector") && !hasInsp ? inspectorHTML() : ""}
      </div>
    </div>`;

  LIVE_3D.forEach((s, i) => {
    const fresh = document.querySelector(`[data-zone="model"] ${s}`);
    if (live3d[i] && fresh) fresh.replaceWith(live3d[i]);
  });

  /* Inside the frame, not beside it: the frame carries data-fi, data-chrome
     and the rest, and a dialog hung outside them kept none of their rules —
     its primary button stayed the flat grey of the low-fidelity ramp. */
  if (V.dialog) document.querySelector("#frame > .frame").insertAdjacentHTML("beforeend", dialogHTML());

  if (V.toast) {
    const t = document.createElement("div");
    t.className = "toast hi";
    fillToast(t);
    document.getElementById("frame").appendChild(t);
  }

  /* One handler for the whole screen, assigned rather than added: render runs
     often and a stack of identical listeners would fire the same action
     several times. Every control carries data-act, so a new control is wired
     the moment it is drawn. */
  document.getElementById("frame").onclick = onClick;
  /* The pane that holds the sheet is rebuilt with the screen, so its wheel
     and drag are hooked back up every time it is drawn. */
  placeFoldButtons();
  wireViewport();
  wireZoomRails();
  /* The drawing's card is written without a position and then measured to
     its own thumbnail, so it follows a tile that the pile reordered. */
  placeLayCard();
  resumeLoads();
  /* The margin's three live parts: the pin cursor on the drawings, the
     model's projected markers, and the composer's field — which writes
     straight to state so typing never costs a re-render. */
  document.getElementById("frame")?.setAttribute("data-pin", V.pinMode ? "on" : "off");
  pushModelPins();
  const mdraft = document.querySelector("[data-mdraft]");
  if (mdraft) {
    mdraft.oninput = (e) => { V.mdraft = e.target.value; armSend("postnote", V.mdraft); };
    mdraft.onkeydown = (e) => {
      if (e.key !== "Enter" || !(e.metaKey || e.ctrlKey)) return;
      e.preventDefault();
      document.querySelector('[data-act="postnote"]')?.click();
    };
  }
  const draft = document.querySelector("[data-pindraft]");
  if (draft) {
    draft.oninput = (e) => { V.draft = e.target.value; armSend("pinpost", V.draft); };
    draft.onkeydown = (e) => {
      if (e.key === "Escape") { V.pending = null; V.draft = ""; render(); return; }
      if (e.key !== "Enter" || !(e.metaKey || e.ctrlKey)) return;
      e.preventDefault();
      postPin();
      render();
    };
  }
  const find = document.querySelector(".find");
  if (find) find.oninput = (e) => {
    V.query = e.target.value;
    render();
    const f = document.querySelector(".find");
    f.focus(); f.setSelectionRange(f.value.length, f.value.length);
  };
  /* Typing must not re-render — the field would lose the caret — so the one
     thing that changes with the text is patched in place. */
  const note = document.querySelector("input.note");
  if (note) note.oninput = (e) => { V.note = e.target.value; paintSaveButton(); };

  /* The dialog's fields write straight into state without a re-render, so
     typing is never interrupted; the button validates when it is pressed. */
  document.querySelectorAll("[data-field]").forEach((el) => {
    el.oninput = (e) => { V.dialog[e.target.dataset.field] = e.target.value; };
  });
  wireMailDrop();
  const first = document.querySelector(".dialog input");
  if (first) first.focus();
  /* The selected unit as the 3D viewer needs it: the level and unit number
     that drive which windows highlight and which floor band tints, read
     off the same selected row the 2D plan outlines — including in "Tous
     les niveaux", where the level has to be read back out of the unit
     number since the row itself no longer carries a single one. */
  const selectedRow = buildingScope() ? null : selRow("Unités");
  if (selectedRow) {
    const no = selectedRow[0].split(" — ")[0];
    const level = currentLevel() ?? Number(no.slice(0, -2));
    window.fitteSelection = { level, unit: no, index: selectedRow[2] };
  } else {
    window.fitteSelection = buildingLevelSelection();
  }
  syncElevation();
  window.dispatchEvent(new CustomEvent("fitte:render"));
}

/* Choosing a unit is not a new screen. render() rewrites the frame's whole
   innerHTML, and the browser then re-rasterises fifteen cropped plan
   thumbnails, the sheet and the inspector: measured here, that is ~650 ms
   of paint on top of 5 ms of JavaScript, which swallowed the first frames
   of the glide and turned it back into a jump. Three boxes actually change
   when the selection moves, so three boxes are rewritten. */
function paintSelection() {
  /* Choosing a unit is looking at the building again: the elevation
     closes and the model goes back to the unit. */
  if (V.facade || V.matShow) {
    V.facade = null;
    V.matShow = 0;
    document.querySelector("[data-facades]")?.replaceWith(document.createRange().createContextualFragment(facadeTablesHTML()));
    syncElevation();
  }
  const sel = selIndex("Unités");
  document.querySelectorAll('[data-region="list"] [data-act="row"]').forEach((el) => {
    el.classList.toggle("on", Number(el.dataset.value) === sel);
  });
  paintFQ();
  const insp = document.querySelector('[data-region="inspector"]');
  const inner = inspectorHTML();
  /* Hidden inspector, or a layout that does not draw one: nothing to swap,
     and nothing to fall back to either. */
  if (insp && inner) insp.outerHTML = inner;
  /* The header is counted from the floor, not from the selection: measured
     identical for every row, so it is left alone. */
  /* The outline and its label are children of the scaled sheet, so they are
     replaced inside it rather than around it. */
  const plan = vpEl()?.querySelector(".plan");
  if (plan) {
    plan.querySelectorAll(".umark").forEach((n) => n.remove());
    plan.insertAdjacentHTML("beforeend", unitMarkHTML());
    placePlanPills();
  if (V.pending) placePinBubble();
  }
  /* The decision panel is drawn again, so its field is wired again; the
     rest of the controls go through the one delegated click handler. */
  const note = document.querySelector("input.note");
  if (note) note.oninput = (e) => { V.note = e.target.value; paintSaveButton(); };
  /* ⌘/Ctrl+Entrée writes the note from the keyboard: the composer is a
     place where sentences are typed, and reaching for the button to end
     one is the slowest part of writing it. */
  document.querySelectorAll(".noteinput").forEach((el) => {
    el.onkeydown = (e) => {
      if (e.key === "Escape" && el.dataset.noteedit) { V.noteEdit = null; return render(); }
      if (e.key !== "Enter" || !(e.metaKey || e.ctrlKey)) return;
      e.preventDefault();
      if (el.dataset.noteedit) editNote(el.dataset.noteedit); else saveNote(el.dataset.note);
      render();
    };
  });
  /* What the 3D viewer reads to tint the right windows. Measured at ~15 ms,
     against ~650 ms for a full render: the model follows the list without
     the screen being rebuilt around it. */
  const row = buildingScope() ? null : selRow("Unités");
  window.fitteSelection = row
    ? { level: currentLevel() ?? Number(row[0].split(" — ")[0].slice(0, -2)),
        unit: row[0].split(" — ")[0], index: row[2] }
    : buildingLevelSelection();
  window.dispatchEvent(new CustomEvent("fitte:render"));
}
/* No unit chosen: on a floor, that floor's band; on the whole building,
   the level picked in its table, flown to, or nothing. */
function buildingLevelSelection() {
  if (!buildingScope()) return { level: currentLevel(), unit: null, index: null };
  return V.bLevel ? { level: V.bLevel, unit: null, index: null, frame: "level" } : { level: null, unit: null, index: null };
}

/* A menu left open over the table it exports is in the way of reading it:
   anything else clicked, or Escape, puts it away. */
document.addEventListener("click", (e) => {
  if (!V.exportMenu || e.target.closest?.(".expwrap")) return;
  V.exportMenu = false;
  render();
}, true);
document.addEventListener("keydown", (e) => {

  V.exportMenu = false;
  V.docs.skpOpen = false;
  V.docs.addOpen = false;

});
/* The model file's card closes the same way. */
document.addEventListener("click", (e) => {
  if (!V.docs.skpOpen || e.target.closest?.("[data-skppop],.fchip")) return;
  V.docs.skpOpen = false;
  render();
}, true);
/* And the « Ajouter un dessin » card. */
document.addEventListener("click", (e) => {
  if (!V.docs.addOpen || e.target.closest?.("[data-addpop],.ladd")) return;
  V.docs.addOpen = false;
  render();
}, true);

/* Escape closes the dialog, because a dialog that can only be dismissed by

document.addEventListener("keydown", (e) => {

});

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fileSize = (n) => (n >= 1e6 ? `${(n / 1e6).toLocaleString("fr-CA", { maximumFractionDigits: 1 })} Mo`
  : `${Math.max(1, Math.round(n / 1e3))} ko`);

/* Files from the computer: dropped anywhere on the dialog, or picked with
   the system file picker the drop zone opens. Wired after every render,
   because the dialog is drawn again on each change. */
function wireMailDrop() {
  const zone = document.querySelector("[data-maildrop]");
  if (!zone || V.dialog?.kind !== "mail") return;
  const dialog = zone.closest(".dialog");
  const add = (list) => {
    const have = new Set(V.dialog.local.map((f) => `${f.name}|${f.size}`));
    const next = [...list].map((f) => ({ name: f.name, size: f.size }))
      .filter((f) => !have.has(`${f.name}|${f.size}`));
    if (!next.length) return;
    V.dialog.local = [...V.dialog.local, ...next];
    render();
  };
  zone.querySelector("[data-mailpick]").onchange = (e) => add(e.target.files);
  let depth = 0;
  dialog.ondragenter = (e) => { e.preventDefault(); depth += 1; zone.classList.add("over"); };
  dialog.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; };
  dialog.ondragleave = () => { depth -= 1; if (depth <= 0) { depth = 0; zone.classList.remove("over"); } };
  dialog.ondrop = (e) => { e.preventDefault(); depth = 0; zone.classList.remove("over"); add(e.dataTransfer.files); };
}
