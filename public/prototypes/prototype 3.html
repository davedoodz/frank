     because no level answers for those figures. */
  scope: "Niveau",
  utab: 1,           // which tab of the unit inspector
  zoom: 100,         // plan zoom, in percent
  /* The margin: notes pinned on a drawing. Two publics share one list — the
     studio's own reminders, and the pins an invited collaborator can read
     through the shared link. */
  pins: [],
  pinScope: "equipe",   // what the next pin will be
  pinMode: false,       // the next click on a drawing puts a point down
  pending: null,        // a point put down, waiting for its sentence
  draft: "",
  selPin: null,
  /* Where the sheet has been dragged to inside the 2D pane, in pixels of
     the pane. Zoom and pan are one pair: the wheel writes both. */
  pan: { x: 0, y: 0 },
  /* How close the camera is to the model, 0 far to 100 near. The slider on
     the right edge writes it; orbiting or wheeling writes it back. */
  mzoom: 40,
  mtool: "orbit",    // what a left drag on the 3D pane does: "orbit" or "pan"
  /* The zoom bars have no stored state: they show themselves when the hand
     is on the drawing and leave on their own. */
  query: "",         // the text in the list search
  reason: null,      // the reason picked for the decision being recorded
  note: "",          // the sentence written for the next person
  settled: {},       // "screen · row" → the reason it was settled with
  toast: null,       // what the last action answered
  /* The new-project dialog, while it is open: what has been typed, which
     kinds of file the office folder will be read for, and what is missing. */
  dialog: null,
  /* Where the two drawings this screen reads actually sit. The folder is on
     the office server, not an upload: renaming here changes what fitte
     looks for, never the file itself. */
  docs: {
    dir: "\\\\serveur-bureau\\Projets\\2026\\BAL3\\Dessins\\",
    names: {},   // level → the drawing file read for it, once it was changed
    skpDir: "\\\\serveur-bureau\\Projets\\2026\\BAL3\\Maquette\\",
    skp: "BAL3_Maquette_R07.skp",
  },
  /* Which typologies are asked for. Nothing is on: the plan is read in black
     and white until someone asks a question of it. Keyed by TYPOS, written
     out here because TYPOS is declared further down the file. */
  typo: { "3½": false, "4½": false, "5½": false },
  nav: { fidelity: "inherit", layout: "Two rows, no rail" },
  header: { fidelity: "inherit", layout: "Title + actions" },
  list: { fidelity: "inherit", layout: "Card grid" },
  content: { fidelity: "inherit", layout: "Two panes" },
  /* Which typologies are asked for. None asked for is the plain black and
     white plan, which is how the drawing is read by default. */
  typo: { "3½": false, "4½": false, "5½": false },
  inspector: { fidelity: "inherit", layout: "Right panel" },
  /* The architect's sheet is in the pile with the two consultants', so it
     carries the same two fields. Its opacity and its presence are held
     here and not on the fidelity panel: the panel drives the consultants'
     sheets, and the architect's own drawing was never one of its dials. */
  lay: { plan: { on: true, opacity: 100 },
    arp: { on: true, opacity: 55, scale: 100, x: 0, y: 0 },
    pay: { on: false, opacity: 55, scale: 100, x: 0, y: 0 },
    /* The four consultant disciplines: independent toggles, full-bleed on
       the same 2000×1675 canvas the floor plan already uses, so none of
       them needs sheetStyle()'s scale-and-nudge the surveyor's sheet does. */
    electrical: { on: false, opacity: 55 }, drainage: { on: false, opacity: 55 },
    distribution: { on: false, opacity: 55 }, ventilation: { on: false, opacity: 55 } },
  /* The pile, front to back. Dragging a thumbnail rewrites this, and
     everything else — the badges, the z-index of each drawing — is read
     from it, so there is one answer to "which sheet is on top". */
  /* Front first, in the order the disciplines are read: the surveyor's
     ground, the architecture standing on it, the landscape around it, then
     electrical and mechanical running through it. Every sheet is printed
     white-on-white, so the pile multiplies instead of covering — see
     .plan .lay — and a sheet in front no longer erases the ones behind. */
  layOrder: ["arp", "plan", "pay", "electrical", "drainage", "distribution", "ventilation"],
  /* A conflict is caught the moment the drawing that reveals it is laid
     on the sheet; the stamp is kept so the ticket can say when, and so the
     same conflict is not "caught" twice. */
  caught: {},
  xopen: null,         /* the conflict whose card is open */
  xdraft: { who: [], day: null },
  layPick: "plan",     /* the thumbnail whose card is open */
  layCard: true,
  exportMenu: false,  /* the format list on the table's header */
  layMenu: false,
};

const icon = (n) => `<svg class="lu"><use href="#lu-${n}"></use></svg>`;

/* Lucide ships as a sprite-less library, so the icons are stamped once into
   a hidden sprite and referenced by id afterwards. */
function sprite() {
  const names = ["home", "folder", "image", "layout-grid", "layers", "table", "hash", "git-compare", "calendar-check",
    "file", "box", "pen-line", "chevron-right", "chevron-left", "chevron-down", "chevron-up", "search", "plus", "minus",
    "external-link", "check", "alert-triangle", "info", "clock", "list", "circle", "x", "link",
    /* the rail's alternatives, one shortlist per screen; see NAV_ICONS —
       and the glyph of each quantity table; see QTABS */
    "app-window",
    "gauge", "building-2", "clipboard-list", "grid-2x2", "bed-double", "door-open", "ruler",
    "sigma", "calculator", "chart-column", "percent", "calendar-clock", "timer", "list-checks",
    "flag", "folder-tree", "file-stack", "hard-drive", "book-open", "shield-check",
    /* sharing: the button, and the two rights it can grant */
    "share-2", "eye", "message-square",
    /* the opacity line on each drawing's card */
    "blend",
    /* the margin: posting a note, keeping one for the studio */
    "lock", "map-pin", "send", "users", "trash-2",
    /* a ticked task is filed by hand, and can be pulled back out */
    "archive", "archive-restore",
    /* the task editor */
    "pencil",
    /* the scope switch and the real .csv it exports */
    "download",
    /* Codes: copying an article with its notes, writing to the person who answers for it */
    "copy", "mail", "upload", "paperclip",
    /* the 3D pane's drag tools: orbit, move */
    "rotate-3d", "move"];
  const defs = names.map((n) => {
    const node = lucide.icons[toPascal(n)];
    if (!node) return "";
    const inner = node[2].map(([tag, attrs]) =>
      `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`).join("");
    return `<symbol id="lu-${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-linecap="round" stroke-linejoin="round">${inner}</symbol>`;
  }).join("");
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("style", "display:none");
  s.innerHTML = defs + '<symbol id="x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#111"/></symbol>';
  document.body.append(s);
}
const toPascal = (n) => n.split("-").map((p) => p[0].toUpperCase() + p.slice(1)).join("");

/* --------------------------------------------------------------- screens */

const SCREENS = {
  "Projets": { icon: "folder", regions: ["header", "content"], steps: {}, home: true, index: true },
  "Unités": {
    icon: "git-compare",
    regions: ["header", "list", "content", "inspector"],
    steps: { list: 1, content: 2, inspector: 3 },
  },
  /* The two questions asked about a project that are not about a floor:
     what the rules demand, and what is due when. Everything else that used
     to be a screen is a section of one of the three — a crossing lands on
     one unit, so it lives in that unit's inspector; the totals are counted
     from the floor, so they live beside it. */
  "Codes": {
    /* An article is a number before it is a principle, and a pair of scales
       reads as justice, which is not what this screen is: it is 3.3.1.9. */
    icon: "hash",
    regions: ["header", "content", "inspector"],
    steps: { content: 1, inspector: 2 },
  },
  "Échéancier": {
    icon: "calendar-check",
    regions: ["header", "content"],
    steps: { content: 1 },
    /* Studio scope: what is due this week falls on a person, not on a
       building, so it sits beside the project list and not inside one. */
    studio: true,
  },
};

/* ------------------------------------------------------- what the screens
   are reading. One table per question, so a control can change the answer
   instead of only changing a border colour. */

/* Permit-sheet identities: 104 apartments across eight floors.
   Ground has 04/05; level 2 omits 14; levels 3–7 have 01–15.
   Level 8 retains ten typical units and replaces 01/02/09/10/11 with
   PH16/17/18. IDs combine the level and drawing suffix, not list position.
   Typologies and source areas below are read from the floor-plan tags. */
const TYPICAL = {
  1: ["5½", 1275], 2: ["5½", 1496], 3: ["3½", 760], 4: ["4½", 1152],

function officialUrl(a) {
  if (a.url.includes("/rc/B-1.1")) {

    return page ? `${QC_CODE_PDF}#page=${page}` : `${a.url}#se:1_01`;

/* Frames one box with air around it: the drawing is scaled so the box fills
   the element, then slid so the box sits in the middle. */
function crop(box, pad = 0.45, axis = "width") {
  const [x, y, w, h] = box;
  const fw = Math.min(1, w * (1 + pad * 2));
  const fh = Math.min(1, h * (1 + pad * 2));
  const px = Math.max(0, Math.min(1 - fw, x + w / 2 - fw / 2));
  const py = Math.max(0, Math.min(1 - fh, y + h / 2 - fh / 2));
  /* A wide, short box reads better scaled off its height: the unit fills the
     strip and the neighbouring units supply the context on either side. */
  const size = axis === "height" ? `auto ${(100 / fh).toFixed(1)}%` : `${(100 / fw).toFixed(1)}% auto`;
  return `background-size:${size};`
    + `background-position:${(px / (1 - fw) * 100).toFixed(1)}% ${(py / (1 - fh) * 100).toFixed(1)}%`;
}

  const L = V.lay[key], S = OVERLAY_SHEETS[key];

  /* The width the sheet needs so its building spans the plan's, and the

  const w = (bx1 - bx0) / (sx1 - sx0) * L.scale / 100;
  const h = w * BASE_RATIO / S.ratio;
  const left = bx0 - sx0 * w + L.x / 100 - (paneLevel() === 1 ? 41/2000 : 0);

/* Typology fill is the one colour the prototype adds to the sheet: the
   architect's own ink stays as it was plotted. */
const typosOn = () => TYPOS.filter((t) => V.typo[t]);
const typoHTML = () => {
  const on = typosOn();
  if (!on.length) return "";
  const polys = polysForPane();
  const levelRows = UNITS_BY_LEVEL[levelView(paneLevel())] || [];
  /* Laid on the sheet the level tabs opened, so the fill sits on the unit
     and not on the courtyard beside it. */
  const parts = levelRows.map((r) => {
    if (!on.includes(r[3])) return "";
    const poly = polys[r[2]];
    if (!poly) return "";
    return `<polygon points="${poly.map(([x, y]) => `${x},${y}`).join(" ")}" fill="${TYPO_INK[r[3]]}"></polygon>`;
  }).join("");
  return parts ? `<svg class="utagsvg" viewBox="0 0 1 1" preserveAspectRatio="none">${parts}</svg>` : "";
};

/* The selected unit, outlined on the sheet. Every other unit on this
   level keeps an invisible hit box, so the plan can be clicked the way
   the list can; a row from a different level is skipped, since its
   contour doesn't belong to the sheet actually on screen. Its number is a
   pill placed in script (placePlanPills), so it follows the zoom. */
function unitMarkHTML() {
  const rows = rowsOf("Unités");
  const sel = selIndex("Unités");
  const polys = polysForPane();
  const lv = paneLevel();
  const zs = V.zoom / 100;
  const parts = rows.map((r, i) => {
    if (r[4] !== lv) return "";
    const poly = polys[r[2]];
    if (!poly) return "";
    const on = i === sel;
    /* The whole pane is scaled by a CSS transform, which thickens a stroke
       along with everything else; dividing by the zoom keeps the outline
       the hairline it is meant to be at any magnification. */
    return `<polygon class="${on ? "on" : "hit"}" points="${poly.map(([x, y]) => `${x},${y}`).join(" ")}"
      style="stroke-width:${(1.6 / zs).toFixed(3)}px" data-act="row" data-value="${i}"></polygon>`;
  }).join("");
  return `<svg class="umark" viewBox="0 0 1 1" preserveAspectRatio="none">${circulationMarkHTML()}${parts}</svg>`;
}

/* ------------------------------------------------------------- fidelity */

/* Isolation keeps the frame intact and fades everything that is not the
   region under study, so a variant is judged in place rather than alone. */
const solo = (region) => (V.isolate !== "none" && V.isolate === region ? "solo" : "");

/* The panel speaks French; the data attribute stays English because the
   stylesheet keys off it. */
const fiOf = (region) => (V[region] && V[region].fidelity !== "inherit" ? V[region].fidelity : V.fidelity);
const wrap = (region, label, html, step) =>
  `<div class="rg" data-rg="${label}" data-fi="${fiOf(region)}" style="display:contents">${html}</div>`
    .replace("</div>", "</div>"); // regions are grid children; see region()

/* A region is a grid child, so the tag and fidelity attributes live on the
   element itself rather than on a wrapper that would break the layout. */
function region(name, label, inner, step, cls = "") {
  const s = step ? `<span class="step">${step}</span>` : "";
  return `<section class="pane rg ${solo(name)} ${cls}" data-rg="${label}" data-fi="${fiOf(name)}" data-region="${name}">${s}${inner}</section>`;
}

/* ------------------------------------------------------- movable edges
   Every edge between two panes is the same object: a strip as wide as the
   gap that drags the edge, and one chevron per pane that can be folded
   away. "size" names the width being written, "grab" says which pane that
   width belongs to — the one before the strip or the one after — because
   that decides which way a drag of ten pixels moves the number. A folded
   pane leaves the strip behind, which is the only way back. */
const SPLIT_MIN = 170;
const splitKey = (name) => `${V.screen}/${name}`;
const splitW = (name, def) => (V.split[splitKey(name)] ?? def);
const folded = (name) => !!V.fold[splitKey(name)];
/* Tooltips read with the article — "Replier la liste" — and the tab of a
   folded pane reads without it, sideways, as a name: "LISTE". One label
   serves both. */
const gutName = (label) => {
  const noun = label.replace(/^(le |la |l'|les )/, "");
  return noun.charAt(0).toUpperCase() + noun.slice(1);
};
function gutter({ size, grab, prev, next, lprev, lnext }) {
  const shutP = prev && folded(prev), shutN = next && folded(next);
  const tab = (key, label, dir) => {
    const shut = folded(key);
    return `<span class="gfold" ${act("gutfold", key)}
      title="${shut ? `Déplier ${label}` : `Replier ${label}`}">${icon(dir)}${
        shut ? `<span class="gname">${gutName(label)}</span>` : ""}</span>`;
  };
  /* With a pane folded there is one thing to say, so one chevron says it,
     pointing the way the pane will come back. */
  const tabs = shutP ? tab(prev, lprev, "chevron-right")
    : shutN ? tab(next, lnext, "chevron-left")
    : `${prev ? tab(prev, lprev, "chevron-left") : ""}${next ? tab(next, lnext, "chevron-right") : ""}`;
  const shut = shutP || shutN;
  /* The tab is wider than the strip, so it lies over the pane that stays
     open: centred, it was cut in half at the screen's edge. */
  const side = shutP ? " fold-s" : shutN ? " fold-e" : "";
  return `<div class="gut${shut ? " fold" : ""}${side}" data-gut="${size}" data-grab="${grab}"
      title="${shut ? "" : "Glisser pour déplacer le bord"}">${tabs}</div>`;
}
const bars = (n, w = [100, 70, 85]) =>
  Array.from({ length: n }, (_, i) => `<div class="bar" style="width:${w[i % w.length]}%"></div>`).join("");

const viewsOf = (screen) => CONTEXT[screen] || [];
/* Units opens on level 5: that is the floor every example here is about. */
const defaultView = (screen) => (screen === "Unités" ? Math.max(0, viewIndexOfLevel(5)) : 0);
const viewIndex = (screen) => Math.min(V.view[screen] === undefined ? defaultView(screen) : V.view[screen],
  Math.max(0, viewsOf(screen).length - 1));

  const q = V.query.trim().toLowerCase();

const CLARITY = ["clair", "moyen", "obscur"];
const CLARITY_LABEL = { clair: "Clair", moyen: "Moyennement clair", obscur: "Pas clair du tout" };

     finished in the column, and neither place owned it. */
  const notes = V.notes[a.id] || [];
  return `<div class="coderow ${gap ? "gap" : ""} ${V.articleId === a.id ? "on" : ""}" ${act("article", a.id)}>

      ${gap ? `<div class="hi src">manque pour conclure: ${a.needs}</div>` : ""}
      <div class="row" style="gap:6px">
        <a class="btnw src-link hi" href="${officialUrl(a)}" target="_blank" rel="noreferrer"
           ${act("source")} data-value="${a.id}">${icon("external-link")}Lire le texte officiel</a>
        <span class="btnw" ${act("copyarticle", a.id)}>${icon("copy")}<span class="hi">Copier</span></span>
        ${notes.length ? `<span class="hi nct">${icon("message-square")}${notes.length}</span>` : ""}
      </div>
    </div>
  </div>`;
}

/* ------------------------------------------------------- the calendar */

/* Dates are handled as ISO strings and plain UTC arithmetic: the screen
   never needs a locale calendar, only the day a task falls on. */
const MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
  "août", "septembre", "octobre", "novembre", "décembre"];
const MONTHS_AB = ["janv", "févr", "mars", "avr", "mai", "juin", "juil", "août", "sept", "oct", "nov", "déc"];
const DOW = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];
/* The three scales the calendar can be drawn at, in the order they widen. */
const CAL_SCALES = ["Semaine", "Mois", "Année"];
const iso = (d) => d.toISOString().slice(0, 10);
const dOf = (s) => new Date(s + "T00:00:00Z");
const shift = (s, n) => { const d = dOf(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
/* Monday as the first column, which is how a site week is read here. */
const monday = (s) => shift(s, -((dOf(s).getUTCDay() + 6) % 7));
const fmtDay = (s) => { const d = dOf(s); return `${d.getUTCDate()} ${MONTHS_AB[d.getUTCMonth()]}`; };
const tasksOn = (s) => TASKS.filter((t) => t.day === s);
const lateCount = () => TASKS.filter((t) => !t.done && t.day < TODAY).length;

function calTitle() {
  const d = dOf(V.day), v = V.scale;
  if (v === "Année") return `${d.getUTCFullYear()}`;
  if (v === "Semaine") {
    const a = monday(V.day);
    return `semaine du ${fmtDay(a)} au ${fmtDay(shift(a, 6))}`;
  }
  return `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

/* One day cell, at every scale: the number, a dot per task coloured by
   priority, and the open count once there is no room for dots. */
function dayCell(s, dim, big) {
  const ts = tasksOn(s), open = ts.filter((t) => !t.done);
  const cls = [s === V.day ? "on" : "", dim ? "dim" : "", s === TODAY ? "today" : "",
    open.some((t) => t.day < TODAY) ? "late" : ""].join(" ");
  return `<div class="day ${cls}" ${act("calday", s)} title="${fmtDay(s)} · ${ts.length} élément${ts.length > 1 ? "s" : ""}">
    <span class="lo bar" style="width:14px"></span>
    <span class="hi n">${dOf(s).getUTCDate()}</span>
    ${ts.length ? `<span class="hi dots">${ts.slice(0, big ? 4 : 3).map((t) =>
      `<i class="pdot" data-prio="${t.prio}" data-done="${t.done}"></i>`).join("")}${
      ts.length > (big ? 4 : 3) ? `<em>+${ts.length - (big ? 4 : 3)}</em>` : ""}</span>` : ""}
    ${big && ts.length ? `<span class="hi lbl">${ts[0].title}</span>` : ""}</div>`;
}

function monthGrid(y, m, big) {
  const first = iso(new Date(Date.UTC(y, m, 1)));
  const start = monday(first);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const s = shift(start, i);
    if (i >= 35 && dOf(s).getUTCMonth() !== m) break;
    cells.push(dayCell(s, dOf(s).getUTCMonth() !== m, big));
  }
  /* "sm", not "mini": .mini is already the drawing's minimap. */
  return `<div class="cal ${big ? "big" : "sm"}">
    ${DOW.map((d) => `<div class="dow"><span class="lo bar" style="width:16px"></span><span class="hi">${big ? d : d[0]}</span></div>`).join("")}
    ${cells.join("")}</div>`;
}

function calendarHTML() {
  const v = V.scale, d = dOf(V.day);
  if (v === "Année") {
    const y = d.getUTCFullYear();
    return `<div class="year">${MONTHS.map((name, m) => `<div class="ym">
      <div class="row" ${act("calmonth", `${y}-${String(m + 1).padStart(2, "0")}-01`)}>
        <span class="lo bar" style="width:40px"></span>
        <span class="hi" style="font-size:11.5px;font-weight:600">${name}</span>
        <span style="flex:1"></span>
        <span class="hi" style="font-size:11px;color:var(--ink-3)">${
          TASKS.filter((t) => t.day.slice(0, 7) === `${y}-${String(m + 1).padStart(2, "0")}`).length || ""}</span>
      </div>${monthGrid(y, m, false)}</div>`).join("")}</div>`;
  }
  if (v === "Semaine") {
    const a = monday(V.day);
    return `<div class="week">${DOW.map((name, i) => {
      const s = shift(a, i), ts = tasksOn(s);
      return `<div class="wcol ${s === V.day ? "on" : ""} ${s === TODAY ? "today" : ""}" ${act("calday", s)}>
        <div class="wh"><span class="lo bar" style="width:30px"></span>
          <span class="hi">${name} ${dOf(s).getUTCDate()}</span></div>
        <div class="wb">${ts.map((t) => `<div class="wtask" data-prio="${t.prio}" ${act("task", t.id)}>
          <span class="lo bar" style="width:80%"></span>
          <span class="hi">${t.title}</span>
          <span class="hi who">${whoLabel(t)}</span></div>`).join("")}</div></div>`;
    }).join("")}</div>`;
  }
  return monthGrid(d.getUTCFullYear(), d.getUTCMonth(), true);
}

/* The list on the right is the same tasks, ordered by day and by priority
   inside a day. The calendar filters it: a day is selected, so the list
   opens on that day and keeps the rest below it under a divider.

   A ticked task leaves both lists and lands in the archive at the bottom,
   where it keeps the day it was closed on and can be brought back. Nothing
   is destroyed by a tick: that is what makes ticking safe to do quickly. */

/* Which object the open editor is writing into: a real task, or the draft
   that becomes one. */
const editingTask = () => (V.taskEdit === "new" ? V.taskDraft
  : TASKS.find((t) => t.id === V.taskEdit));

/* The two inputs hold their own value between renders, so what was typed is
   read back into the object before the screen is redrawn. Without this,
   clicking a priority chip would throw away a half-typed title. */
function readTaskForm() {
  const t = editingTask();
  const form = document.querySelector("[data-tedit]");
  if (!t || !form) return;
  form.querySelectorAll("[data-tfield]").forEach((el) => {
    if (el.value !== "") t[el.dataset.tfield] = el.value;
  });
}

const avatars = (t) => `<span class="avs">${t.who.map((id) =>
  `<i class="av" title="${person(id).label}">${person(id).ini}</i>`).join("")}</span>`;

/* One editor, used for a new task and for an existing one. It writes into
   the task itself — or into the draft, for a new one — so there is never a
   second copy of a task to keep in step. */
function taskForm(t, isNew) {
  return `<div class="tedit" data-tedit>
    <input class="tin" data-tfield="title" value="${(t.title || "").replace(/"/g, "&quot;")}"
      placeholder="Que faut-il faire?">
    <div class="row" style="gap:6px;flex-wrap:wrap">
      <input class="tin day" type="date" data-tfield="day" value="${t.day}">
      ${["haute", "moyenne", "basse"].map((p) =>
        `<span class="chip ${t.prio === p ? "on" : ""}" ${act("tprio", p)}>${p}</span>`).join("")}
    </div>
    <div class="row" style="gap:3px;flex-wrap:wrap">
      ${PHASES.map((p) => `<span class="chip ${t.phase === p ? "on" : ""}" ${act("tphase", p)}>${p}</span>`).join("")}
    </div>
    <div class="row" style="gap:3px;flex-wrap:wrap">
      ${PEOPLE.map((p) => `<span class="chip who ${t.who.includes(p.id) ? "on" : ""}" ${act("twho", p.id)}
        title="${p.label}"><i class="av">${p.ini}</i><span class="lb">${p.label}</span></span>`).join("")}
    </div>
    <div class="row" style="gap:6px">
      <span class="btnw solid" ${act("tsave")}>${icon("check")}<span class="hi">${isNew ? "Ajouter" : "Enregistrer"}</span></span>
      <span class="btnw" ${act("tcancel")}><span class="hi">Annuler</span></span>
      <span style="flex:1"></span>
      ${isNew ? "" : `<span class="btnw" ${act("tdel", t.id)} title="Supprimer">${icon("trash-2")}</span>`}
    </div></div>`;
}

function taskListHTML() {
  /* On the list: everything not filed away, ticked or not. The archive is
     what someone has deliberately put away. */
  const live = TASKS.filter((t) => !t.archived)
    .sort((a, b) => a.day.localeCompare(b.day) || PRIO[b.prio] - PRIO[a.prio]);
  const here = live.filter((t) => t.day === V.day);
  const rest = live.filter((t) => t.day !== V.day);
  const archive = TASKS.filter((t) => t.archived)
    .sort((a, b) => (b.doneAt || b.day).localeCompare(a.doneAt || a.day));
  const line = (t) => (V.taskEdit === t.id ? taskForm(t, false) : `<div class="task ${t.done ? "done" : ""}
      ${V.task === t.id ? "on" : ""} ${!t.done && t.day < TODAY ? "late" : ""}"
      data-task="${t.id}" ${act("task", t.id)}>
    <span class="tick dot ${t.done ? "on" : ""}"
      ${act("tasktick", t.id)} title="${t.done ? "Rouvrir" : "Cocher — elle reste ici, barrée"}">${t.done ? icon("check") : ""}</span>
    <span class="col" style="flex:1;gap:2px;min-width:0">
      <span class="lo bar" style="width:70%"></span>
      <span class="hi ttl" style="font-size:12.5px">${t.title}</span>
      <span class="lo bar" style="width:40%"></span>
      <span class="hi" style="font-size:11px;color:var(--ink-3)">${whoLabel(t)} · ${t.phase}${
        t.code ? ` · ${t.code}` : ""}${t.caught ? ` · relevé ${t.caught}` : ""}${
        !t.done && t.day < TODAY ? " · en retard" : ""}</span>
    </span>
    ${avatars(t)}
    ${t.done ? `<span class="hi file" ${act(t.archived ? "taskunfile" : "taskfile", t.id)}
      title="${t.archived ? "Ressortir de l'archive" : "Ranger dans l'archive"}">${icon(t.archived ? "archive-restore" : "archive")}<span
      class="hi">${t.archived ? "Ressortir" : "Archiver"}</span></span>`
      : `<span class="hi pr" data-prio="${t.prio}">${t.prio}</span>`}
    <span class="hi dte">${fmtDay(t.done ? t.doneAt || t.day : t.day)}</span>
    ${t.done ? "" : `<span class="hi tact" ${act("tedit", t.id)} title="Modifier">${icon("pencil")}</span>`}
  </div>`);
  return `<div class="col" style="gap:7px">
    <div class="row" style="gap:6px">
      <span class="chip on"><span class="lo bar" style="width:40px"></span>
        <span class="hi">${fmtDay(V.day)}</span></span>
      <span class="chip"><span class="lo bar" style="width:40px"></span>
        <span class="hi">${lateCount()} en retard</span></span>
      <span style="flex:1"></span>
      <span class="btnw" ${act("tnew")}>${icon("plus")}<span class="hi">Ajouter une tâche</span></span>
    </div>
    ${V.taskEdit === "new" ? taskForm(V.taskDraft, true) : ""}
    ${here.length ? here.map(line).join("")
      : `<div class="tile"><span class="lo bar" style="width:60%"></span>
          <span class="hi" style="font-size:12px;color:var(--ink-2)">Rien ce jour-là.</span></div>`}
    <div class="row" style="gap:8px;margin-top:2px">
      <span class="lo bar" style="width:70px"></span>
      <span class="hi" style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">La suite</span>
      <span style="flex:1;border-top:1px solid var(--line-2)"></span></div>
    ${rest.map(line).join("")}
    ${archive.length ? `<div class="row arch" ${act("tarch")} style="gap:8px;margin-top:2px;cursor:pointer">
      <span class="lo bar" style="width:70px"></span>
      <span class="hi" style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;
        display:flex;align-items:center;gap:4px">${icon(V.taskArch ? "chevron-down" : "chevron-right")}Archive · ${archive.length}</span>
      <span style="flex:1;border-top:1px solid var(--line-2)"></span></div>
      ${V.taskArch ? archive.map(line).join("") : ""}` : ""}
  </div>`;
}


/* ------------------------------------------------------------ the parts */

/* Sections only appear in the grouped rail: the first three screens read a
   project, the next three act on it, the last one stores it. */
const SECTIONS = { 0: "Lecture", 3: "Décision", 6: "Archive" };
/* The key of a screen and the word on its tab are not the same thing. The
   key is "Unités" everywhere in this file — it indexes views, rows, titles
   and the fixture — while the tab says Coordination, because what the
   screen does is reconcile the drawing with the model, and the units are
   only the list it does it through. Renaming the key would touch thirty
   lookups for a word. */
const SCREEN_LABEL = { "Unités": "Coordination" };
const labelOf = (name) => SCREEN_LABEL[name] || name;
const SHORT = (name) => labelOf(name).slice(0, 3).toUpperCase();

/* One label rule for the rail and the tabs, so a title never reads two ways
   on the same screen. Hover and Hidden are CSS, the rest rewrite the text. */
function navLabel(name, i) {
  const m = V.nav.labels;
  if (m === "Short code") return SHORT(name);
  if (m === "Numbered") return `${i + 1}. ${labelOf(name)}`;
  return labelOf(name);
}

const railIcons = () => V.nav.icons === "Rail and tabs" || V.nav.icons === "Rail only";
/* With no rail to carry them, the glyphs belong to the tabs: "Rail only"
   would otherwise leave a row of bare words where the icon was promised. */
const tabIcons = () => V.nav.layout === "Two rows, no rail"
  || V.nav.icons === "Rail and tabs" || V.nav.icons === "Tabs only";

   Open a project that is running, or start one. The layouts differ only in
   which of those two is louder. */

/* One real project, the one every drawing in assets/ belongs to:
   Le Baldwin III, boulevard Saint-Jean, Dollard-des-Ormeaux. */
const PROJECTS = [

];

/* The state is the one word on a card allowed colour: a project with
   differences or missing inputs reads in the accent, a settled one stays grey. */
const pstate = (p) => `<span class="state" data-open="${p[4]}"><span class="d"></span>${p[3]}</span>`;

/* At low fidelity a project is told apart by a tint and its initials. At
   high fidelity the card carries the project's own rendering, the one image
   that names the building faster than any sheet. */
const TINTS = [["#e8eef7", "#3f5a80"], ["#e6f1ea", "#3d6b52"], ["#f7ece3", "#85573a"],
  ["#eeeaf6", "#584a78"], ["#f7e9ec", "#7d4450"], ["#e9f1f3", "#3c6670"]];
const initials = (name) => name.split(/[\s—-]+/).filter(Boolean).slice(0, 2)
  .map((w) => w[0]).join("").toUpperCase() || name.slice(0, 2).toUpperCase();

/* Opening a project is the one thing this screen does: every card, row and
   table line carries it, and it is the project the rest of the app then

const pcard = (p, i = 0) => `<div class="tile pcard" ${act("open", p[0])} title="Ouvrir ${p[0]}">

</div>`;

function navHTML() {
  if (SCREENS[V.screen].index || SCREENS[V.screen].studio) return "";
  const mode = V.nav.layout;
  if (mode === "Top bar only" || mode === "Tabs only, no rail"
    || mode === "Two rows, no rail") return "";
  const sections = mode === "Wide rail with sections";
  const wide = mode === "Wide rail with labels" || sections;
  const stack = mode === "Rail with labels under icons";
  const ic = railIcons();
  const items = NAV.map((name, i) => {
    const on = name === V.screen ? "on" : "";
    const g = ic ? icon(navIcon(name)) : "";
    const text = `<span class="hi">${navLabel(name, i)}</span>`;
    const head = sections && SECTIONS[i] ? `<div class="sct hi">${SECTIONS[i]}</div>` : "";
    if (wide) return `${head}<div class="row ${on}" data-screen="${name}" title="${labelOf(name)}">${g}<span class="lo bar" style="width:70%"></span>${text}</div>`;
    if (stack) return `<div class="stk ${on}" data-screen="${name}" title="${labelOf(name)}">${g}<span class="lo bar" style="width:70%;height:6px"></span>${text}</div>`;
    return `<div class="ic ${on}" data-screen="${name}" title="${labelOf(name)}">${g || `<span class="code hi">${SHORT(name)}</span>`}${g ? `<span class="cap hi">${navLabel(name, i)}</span>` : ""}</div>`;
  }).join("");
  const cls = wide ? "wide" : stack ? "stack" : "";
  return `<nav class="rail rg ${solo("nav")} ${cls}" data-rg="navigation" data-fi="${fiOf("nav")}"
       data-labels-mode="${V.nav.labels}">${items}</nav>`;
}

/* The rail and the tab strip never carry the same destinations. When the
   rail lists the screens, the strip drops to the current screen's own views.
   The index has none: every project is on the page, and the Archivés tab
   filtered nothing — it offered a second list that was the same list. */
const CONTEXT = {
  "Unités": LEVEL_VIEWS,
};

function tabsHTML() {
  const mode = V.nav.layout;
  /* The rail belongs to a project, so it never carries the studio level:
     the studio strip is drawn even where tabs are off, or the week of the
     whole office would have no door. */
  const studio = SCREENS[V.screen].index || SCREENS[V.screen].studio;
  if (mode === "Rail only, no tabs" && !studio) return "";
  const top = mode === "Top bar only";
  const ic = tabIcons();
  const names = Object.keys(SCREENS).filter((n) => !SCREENS[n].index && !SCREENS[n].studio);
  /* Icons off and labels away would leave an empty strip, so the short code
     stands in: a tab target never renders without something to read. */
  const bare = !ic && (V.nav.labels === "Hidden" || V.nav.labels === "Hover only");
  const tab = (name, i) => `<button data-screen="${name}" aria-current="${name === V.screen}" title="${labelOf(name)}">
      ${ic ? icon(SCREENS[name].icon) : ""}<span class="lo bar" style="width:46px"></span>
      ${bare ? `<span class="hi code">${SHORT(name)}</span>` : `<span class="hi">${navLabel(name, i)}</span>`}</button>`;

  let items;
  const views = CONTEXT[V.screen] || [];
  /* Under "Bâtiment entier" no level is the one being read, so none is lit. */
  const viewBtn = (t, i) => `<button ${act("view", i)} aria-current="${i === viewIndex(V.screen) && !buildingScope()}" title="${t}">
    <span class="lo bar" style="width:46px"></span><span class="hi">${t}</span></button>`;
  /* The index is reached from the words "Tous les projets". They sit in the strip
     on every screen; on the index itself they are the only thing in it. */
  const late = lateCount();
  const back = `<span class="crumb hi" data-screen="Projets" title="Tous les projets">${icon("folder")}Tous les projets</span>`;
  /* The studio's schedule is not a step on the way into this project, so it
     leaves the path on the left and sits at the right end of the strip with
     the other things that are about leaving: it is a door out, like Partager
     is a door out, and the path reads project → screen without a detour. */
  const ech = `<span class="crumb ech hi" data-screen="Échéancier" style="margin-left:auto;flex:0 0 auto"
      title="Échéancier de l'atelier — ce qui est dû, tous les projets">${icon("calendar-check")}Échéancier${late
        ? `<span class="late">${late}</span>` : ""}</span>`;
  if (studio) {
    /* The studio strip: the projects and the week are siblings here, and
       the project's own tabs are not in it at all. */
    const stab = (name, label) => `<button data-screen="${name}" aria-current="${name === V.screen}"
        title="${label}">${ic ? icon(SCREENS[name].icon) : ""}<span class="lo bar" style="width:46px"></span>
        <span class="hi">${label}</span></button>`;
    items = `<span class="crumb on hi">${icon("folder")}Tous les projets</span>
      <span class="div"></span>
      <div class="views">${stab("Projets", "Projets")}${stab("Échéancier", "Échéancier")}</div>
      <span class="sp"></span>`;
  } else if (!views.length && mode !== "Two rows, no rail") {
    /* A screen that reads on one page has nothing to filter, so the strip
       carries the project's name and the way back, and no tabs at all. The
       two-row layout is the exception: it is the only way between screens,
       so its first row is on every screen, views or not. */
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span><span class="sp"></span>`;
  } else if (mode === "Rail + view menu") {
    /* One button that steps through the views, because a menu that cannot
       open is not a control. */
    items = `<span class="btnw solid" ${act("viewnext")} title="Vue suivante"><span class="hi">${views[viewIndex(V.screen)]}</span>${icon("chevron-down")}</span>
      <span class="sp"></span>
      <span class="chip hi">${viewIndex(V.screen) + 1} / ${views.length}</span>`;
  } else if (mode === "Rail + breadcrumb") {
    items = `${back}${icon("chevron-right")}
      <span class="crumb on hi">${V.project}</span>
      <span class="sp"></span>`;
  } else if (top || mode === "Tabs only, no rail" || mode === "Two rows, no rail") {
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span>
      <span class="div"></span><div class="views">${names.map(tab).join("")}</div><span class="sp"></span>`;
  } else {
    /* The project name is on the path, before the views: it is read at the
       same time as where one is, and it is the way back to the index. The
       views scroll under it rather than pushing it off the strip. */
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span>
      <span class="div"></span>
      <div class="views">${views.map(viewBtn).join("")}</div>
      <span class="sp"></span>`;
  }
  /* The second row only exists when the screen has something to ask for.
     Aperçu keeps the single row, and the drawing gets the thirty-two
     pixels back. "Bâtiment entier" sits at the head of that row, before
     Niveau 1, because it is the same question the levels answer: which
     floor — or all of them. Chosen, it dims the levels, since a figure
     counted over eight floors has no level; clicking one is how you come
     back. */
  const off = buildingScope();
  const wholeBtn = V.screen === "Unités"
    ? `<button ${act("scope", "Bâtiment")} aria-current="${off}" title="Compter le bâtiment entier"
         style="flex:0 0 auto">${icon("building-2")}<span class="hi">Bâtiment entier</span></button>`
    : "";
  const row2 = mode === "Two rows, no rail" && views.length
    ? `<div class="tabs lvl rg ${solo("nav")}" data-rg="vues" data-fi="${fiOf("nav")}"
         data-style="${V.nav.tabStyle}" data-labels-mode="${V.nav.labels}" data-off="${off}">
        ${wholeBtn}${wholeBtn ? `<span class="div"></span>` : ""}
        <div class="views">${views.map(viewBtn).join("")}</div></div>`
    : "";
  /* A project is read by people who do not draw: the client, the urbaniste,
     the contractor. Sharing is the end of the first row, on every screen
     that has a project open, because it is about the project and not about
     what is on screen. The studio screens span every project at once, so
     there is nothing there to share. */
  const share = studio ? ""
    : `<span class="btnw" ${act("share")} title="Partager le projet en lecture et commentaires"
         style="margin-left:auto;flex:0 0 auto">${icon("share-2")}<span class="hi">Partager</span></span>`;

  return `<div class="tabs rg ${solo("nav")}" data-rg="${top ? "navigation + onglets" : "onglets"}" data-fi="${fiOf("nav")}"
       data-style="${V.nav.tabStyle}" data-align="${V.nav.tabAlign}" data-labels-mode="${V.nav.labels}">
    ${top ? `<span class="btnw" style="margin-right:8px">${icon("box")}<span class="hi">ça fitte</span></span>` : ""}
    ${items}${studio ? "" : ech}${share}
  </div>${row2}`;
}

function headerHTML() {
  const step = V.journey ? SCREENS[V.screen].steps.header : null;
  /* The subtitle answers to the state: which project is open, which level is
     being read, how many rows the current view is actually showing. Codes
     has none: the articles are on screen and the only count that mattered
     there counted a compliance the screen does not declare. */
  const open = Object.keys(V.settled).length;
  /* The index needs no count: the projects are on screen, and one line of
     arithmetic above them only repeats what the eye already did. */
  /* Under "Bâtiment entier" the screen is not reading a floor, so the title
     says the building and counts it — the level in the strip below has no
     say in these figures, which is the confusion the scope switch removes.
     The counts are summed from the table, not typed twice. */
  const sup = QTABS["Superficies"].rows;
  const title = { "Projets": ["Projets", ""],
    "Codes": ["Codes et règlements", ""],
    "Échéancier": ["Échéancier", `${TASKS.filter((t) => !t.done).length} tâches ouvertes · ${lateCount()} en retard`],
    "Unités": buildingScope()
      ? [`${V.project} — bâtiment entier`,
        `${sup.length} niveaux · ${sup.reduce((n, r) => n + r[1], 0)} unités · `
        + `${sup.reduce((n, r) => n + r[2], 0).toLocaleString("fr-CA")} pi² nets`]
      : [`Plans — ${viewOf("Unités").toLowerCase()}`,
        `${rowsOf("Unités").length} unités · ${rowsOf("Unités").filter((r) => /croisement/.test(r[1])).length} avec un croisement ouvert`],
  }[V.screen] || [V.screen, ""];
  const metrics = V.header.layout === "Title + metrics";
  const bare = V.header.layout === "Title only";
  return `<header class="pane rg ${solo("header")}" data-rg="entête" data-fi="${fiOf("header")}" style="flex:0 0 auto">
    ${step ? `<span class="step">${step}</span>` : ""}
    <div class="pb" style="padding:10px 12px;gap:8px">
      <div class="row">
        <div class="col" style="flex:1;gap:5px">
          <div class="lo bar" style="width:170px;height:13px"></div>
          <div class="lo bar lt" style="width:260px;height:8px"></div>
          <div class="hi" style="font-size:16px;font-weight:600">${title[0]}</div>
          <div class="hi" style="font-size:12px;color:var(--ink-2)">${title[1]}</div>
        </div>
        ${bare ? "" : SCREENS[V.screen].home
          ? `<span class="btnw solid" ${act("newproject")} title="Démarrer un projet">${icon("plus")}<span class="lo bar" style="width:52px"></span><span class="hi">Nouveau projet</span></span>`
          /* AutoCAD and SketchUp used to sit up here, a screen away from the
             drawing they open. They live on the drawing pane now. */
          : buildingScope()
          ? `<span class="btnw" ${act("csvall")} title="Télécharger les quatre tableaux en .csv">${icon("download")}<span class="lo bar" style="width:40px"></span><span class="hi">Tout exporter en .csv</span></span>`
          /* Exporting a floor's table is an act on that table, so the
             button sits on the table's own header, not a screen away. */
          : ""}
      </div>
      ${metrics ? `<div class="row" style="gap:var(--gap)">${[1, 2, 3, 4].map((i) => `<div class="tile" style="flex:1">
        <div class="lo bar" style="width:38px;height:14px"></div><div class="lo bar lt" style="width:70%"></div>
        <div class="hi" style="font-size:17px;font-weight:600">${["6", "4", "5", "98"][i - 1]}</div>
        <div class="hi" style="font-size:11px;color:var(--ink-2)">${["écarts", "croisements", "articles à lire", "unités"][i - 1]}</div>
      </div>`).join("")}</div>` : ""}
    </div>
  </header>`;
}

function listHTML() {
  const mode = V.list.layout;
  if (mode === "Hidden") return "";
  const step = V.journey ? SCREENS[V.screen].steps.list : null;
  const label = V.screen === "Unités" ? "Unités" : "Liste";
  /* The list reads the same rows the header counts, so the view above it and
     the search inside it both change what is on screen. */
  const pairs = rowsOf(V.screen);
  const rows = pairs.length ? pairs.map((r) => `${r[0]} · ${r[1]}`) : ["rien ne correspond"];
  const sel = selIndex(V.screen);

  if (mode === "Filter bar only") {
    return `<section class="pane rg ${solo("list")}" data-rg="liste → barre de filtres" data-fi="${fiOf("list")}" style="flex:0 0 auto;grid-column:1/-1">
      ${step ? `<span class="step">${step}</span>` : ""}
      <div class="pb" style="flex-direction:row;align-items:center;padding:8px 10px">
        <span class="chip">${icon("search")}<span class="lo bar" style="width:70px"></span>
          <input class="hi find" value="${V.query}" placeholder="Chercher dans ${label.toLowerCase()}"></span>
        ${pairs.slice(0, 4).map((r, i) => `<span class="chip ${i === sel ? "on" : ""}" ${act("row", i)}><span class="lo bar" style="width:46px"></span><span class="hi">${r[0].split(" ")[0]}</span></span>`).join("")}
      </div></section>`;
  }
  /* On a floor the list is the area table (see "the floor's quantities"). */
  if (V.screen === "Unités") return unitListHTML(step);
  const inner = mode === "Card grid"
    ? (pairs.length ? `<div style="display:grid;grid-template-columns:1fr;gap:8px">${pairs.map((r, i) => `<div class="tile ${i === sel ? "on" : ""}" ${act("row", i)}>
        <div class="plan" style="height:54px;flex:0 0 54px"></div>
        <div class="lo bar" style="width:70%"></div><div class="hi" style="font-size:11.5px">${r[0]} · ${r[1]}</div></div>`).join("")}</div>`
      : `<div class="tile"><span class="hi" style="font-size:12px;color:var(--ink-2)">${emptyMsg}</span></div>`)
    : rows.map((r, i) => `<div class="listrow ${i === sel ? "on" : ""}" ${pairs.length ? act("row", i) : ""}><span class="dot"></span>
        <span class="lo bar" style="flex:1"></span><span class="hi" style="font-size:12px">${r}${V.settled[`${V.screen} · ${(pairs[i] || [""])[0]}`] ? " · réglé" : ""}</span></div>`).join("");

  return region("list", `list — ${label.toLowerCase()}`,
    `<div class="ph">${icon("list")}<span class="lo bar" style="width:60px"></span><span class="hi">${label}</span></div>
     <div class="pb">${inner}</div>`, step);
}

function contentHTML() {
  const step = V.journey ? SCREENS[V.screen].steps.content : null;
  /* Counting the building replaces the drawings: see quantScreenHTML. */
  if (buildingScope()) return quantScreenHTML(step);
  const mode = V.content.layout;
  const body = {
    "Unités": () => {
      const unit = (selRow("Unités") || ["—"])[0];
      /* The zoom stands against the outer edge of each pane: flat, opaque,
         always there. Vertical, because the course it runs is vertical. */
      const zcol = (side) => `<div class="zcol" data-zcol="${side}">
        <span class="zb" ${act("zstep", side + ":+")} title="Agrandir">${icon("plus")}</span>
        <input class="zslider" type="range" ${side === "plan"
          ? `min="${ZMIN}" max="${ZMAX}" step="1" value="${V.zoom}" data-zoom aria-label="Zoom du plan"`
          : `min="0" max="100" step="1" value="${V.mzoom}" data-mzoom aria-label="Zoom de la maquette"`}>
        <span class="zb" ${act("zstep", side + ":-")} title="Reculer">${icon("minus")}</span>
        <span class="zread hi ${side === "plan" ? "fit" : ""}" ${side === "plan"
          ? `data-zread ${act("zfit")} title="Revoir la feuille entière"` : "data-mread"}>${side === "plan" ? V.zoom : V.mzoom}%</span>
      </div>`;
      /* The corner view: the drawing whole, small. On the plan it is the
         sheet as a picture, with the rectangle of what is on screen, dragged
         to move it. On the model it is the model itself seen from straight
         above — the roof read in the same orientation as the sheet beside
         it — with a marker for the side the live camera stands on. Neither
         carries a caption: the percentage is already on the zoom column an
         inch away, and printing it twice only made the corner heavier. */
      const mini = (side) => (side === "plan"
        ? `<div class="mini hi" data-mini="plan">
        <span class="mi" data-mi>
          <img src="${sheet().img}" alt="">
          <span class="mrect" data-mrect></span>
        </span>
      </div>`
        : `<div class="mini hi" data-mini="model">
        <span class="mi" data-mi><canvas data-mini3d></canvas></span>
      </div>`);
      /* North, top right of each pane. On the sheet it is a fixed mark: the
         drawing does not turn. On the model it is the same mark laid flat on
         the ground and seen from wherever the camera is, so the ring
         flattens and the needle swings as the building is orbited. */
      const north = (side) => (side === "plan"
        ? `<svg class="north hi" data-north viewBox="-22 -32 44 64" aria-label="Nord">
        <text x="0" y="-21">N</text>
        <circle cx="0" cy="6" r="14"></circle>
        <line x1="0" y1="6" x2="0" y2="-7"></line>
      </svg>`
        : `<svg class="north hi" data-north3d viewBox="-22 -32 44 64" aria-label="Nord">
        <polygon data-nring points=""></polygon>
        <line data-nneedle x1="0" y1="0" x2="0" y2="-14"></line>
        <text data-nlabel x="0" y="-21">N</text>
      </svg>`);
      /* What a drag on the model does, top left where a hand reaches first:
         turn around the building, or move across it. */
      const mtools = `<div class="mtools" role="group" aria-label="Glisser pour">
        ${[["orbit", "rotate-3d", "Orbiter : glisser pour tourner autour du bâtiment"],
           ["pan", "move", "Déplacer : glisser pour déplacer la vue"]].map(([t, ic, tip]) =>
          `<span class="zb ${V.mtool === t ? "on" : ""}" ${act("mtool", t)} title="${tip}" aria-pressed="${V.mtool === t}">${icon(ic)}</span>`).join("")}
      </div>`;
      /* Which way is north, up, and along the façade: the three axes as the
         camera sees them, red X, green Y, blue Z, redrawn as it orbits. */
      const axes = `<svg class="axes hi" data-axes viewBox="-26 -26 52 52" aria-hidden="true">
        ${["x", "y", "z"].map((a) => `<line data-ax="${a}" x1="0" y1="0" x2="0" y2="0"></line>
          <text data-axt="${a}" x="0" y="0">${a.toUpperCase()}</text>`).join("")}
        <circle cx="0" cy="0" r="1.6"></circle>
      </svg>`;
      const pane = (t, note, kind, cls = "", layers = "", fx = "1") => `<div class="pane drawing" style="flex:${fx}"><div class="ph">${icon("file")}
        <span class="lo bar" style="width:90px"></span><span class="hi">${t}</span>
        <span style="flex:1"></span>
        ${hostButton(kind === "plan" ? "plan" : "model")}</div>
        ${kind !== "plan" && isNonresLevel(paneLevel()) ? `<div class="model-context-note hi">${note}</div>` : ""}
        ${kind === "plan"
          /* The sheet is larger than the pane, so the pane is a window onto
             it: the drawing, the consultants' layers, the typology fills and
             the unit outline all sit inside one transformed box and move
             together. The wheel zooms where the pointer is; dragging pans. */
          ? `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="plan">
              <div class="vp" data-vp>
              <div class="plan ${cls}" data-img="${kind}" data-src="${planVector() ? "vector" : "image"}"
                   style="transform:translate(${V.pan.x}px,${V.pan.y}px) scale(${V.zoom / 100});
                     --planz:${layZ("plan")};--planop:${V.lay.plan.on ? V.lay.plan.opacity / 100 : 0}">
                <span class="lo"></span><span class="hi">${note}</span>
                ${planVector() ? `<canvas class="sheetpdf" data-sheetpdf data-pdf-url="${sheet().pdf}"></canvas>` : ""}
                ${layers}${unitMarkHTML()}${conflictMarkHTML()}${pinMarkHTML()}</div></div>
              ${north("plan")}${mini("plan")}${zcol("plan")}${layStripHTML()}${layCardHTML()}${conflictCardHTML()}${pinBubbleHTML()}</div>`
          : `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="model">
              <div class="model3d" data-building-model data-state="loading" role="region"
                   aria-label="Maquette 3D interactive du Baldwin III" aria-busy="true">
                <div class="model3d-status" data-model-status aria-live="polite">Chargement de la maquette…</div>
              </div>
              <div class="npins" data-npins></div>
              ${mtools}${north("model")}${axes}${mini("model")}${zcol("model")}
            </div>`}
        </div>`;
      /* The 2D pane carries the surveyor's and the landscaper's sheets, which
         is why it is the one pane drawn at the plan's own aspect. */
      const planNote = isNonresLevel(paneLevel())
        ? `${levelView(paneLevel())} — aucune unité résidentielle à ce niveau`
        : `${unit} — contours par-dessus`;
      /* The two basements are not in the model: the massing starts at the
         ground. A pane saying so is a pane of nothing, so the plan takes
         the full width there. The roof is in the model, so it keeps both. */
      const noModel = paneLevel() === -1 || paneLevel() === 0;
      const modelNote = paneLevel() === 9
        ? "Toiture — bandeau et repère affichés sur la maquette"
        : `${unit} — volumétrie, même niveau`;
      /* The two drawings share the width and the edge between them moves:
         a plan read closely wants the window, a massing check wants the
         opposite. Folding either one gives the other everything, which is
         how a drawing fills the screen here without a full-screen mode. */
      const planShut = folded("plan"), modelShut = noModel || folded("model");
      const planW = V.split[splitKey("plan")];
      /* An explicit width only means something while both are open. */
      const planFlex = planW && !modelShut ? `0 0 ${planW}px` : "1";
      const plan = () => pane("Plan 2D", planNote, "plan", "align", typoHTML() + layersHTML(), planFlex);
      const model = () => (noModel ? "" : pane("Maquette 3D", modelNote, "model", "fit"));
      if (mode === "Stacked") return `<div class="col" style="flex:1">${plan()}${model()}</div>`;
      if (mode === "Single pane + inset") return `<div class="col" style="flex:1;gap:var(--gap)">
        <div style="position:relative;flex:1;display:flex">${plan()}
        ${noModel ? "" : `<div class="pane" style="position:absolute;right:10px;bottom:10px;width:220px;height:150px">
        <div class="pb"><div class="plan" data-img="massing"><span class="hi">3D inset</span></div></div></div>`}</div></div>`;
      return `<div class="row" style="flex:1;align-items:stretch;gap:0;min-height:0">${
        planShut ? "" : plan()}${noModel ? "" : gutter({ size: "plan", grab: "prev",
          prev: "plan", next: "model", lprev: "le plan", lnext: "la maquette" })}${
        modelShut ? "" : model()}</div>`;
    },
    /* Codes is the vertical reading of the provisions: the Québec
       construction code first, then the bylaw, each one with the schematic
       of what it measures, the sentence in French, what is still missing,
       and the notes written against it. Nothing here writes to a drawing.
       Every body of rules is in the one list, each under its own heading. */
    "Codes": () => {
      const section = ([label, rows]) => `<div class="codesec"><span class="hi">${label}</span></div>
          ${rows.map(codeRow).join("")}`;
      return `<div class="col" style="flex:1;gap:var(--gap)">
        <div class="pane" style="flex:0 0 auto">
          <div class="ph">${icon("hash")}<span class="lo bar" style="width:90px"></span>
            <span class="hi">Articles suivis</span><span style="flex:1"></span>
            <span class="btnw solid" ${act("addcode")}>${icon("plus")}<span class="hi">Ajouter</span></span></div>
          <div class="pb">
            <div class="codelist">${codeGroups().map(section).join("")}</div>
          </div></div>
      </div>`;
    },
    /* Échéancier is a calendar on the left and the work on the right. They
       are one object seen twice: a task has a date, so it is a mark on the
       calendar; a day holds tasks, so clicking it filters the list. The
       scale sits on the calendar it draws, beside the dates it changes,
       rather than in a strip above that looked like a change of screen. */
    "Échéancier": () => `<div class="row" style="flex:1;align-items:stretch;gap:0">
      ${folded("cal") ? "" : `<div class="pane" style="flex:${V.split[splitKey("cal")] ? `0 0 ${V.split[splitKey("cal")]}px` : "1.25"}">
        <div class="ph">${icon("calendar-check")}<span class="lo bar" style="width:70px"></span>
          <span class="hi">${calTitle()}</span><span style="flex:1"></span>
          ${CAL_SCALES.map((s) => `<span class="chip ${V.scale === s ? "on" : ""}" ${act("calscale", s)}
            title="Dessiner le calendrier par ${s.toLowerCase()}"><span class="hi">${s}</span></span>`).join("")}
          <span class="btnw" ${act("calmove", "-1")} title="Avant">${icon("chevron-left")}</span>
          <span class="btnw" ${act("calmove", "1")} title="Après">${icon("chevron-right")}</span>
          <span class="btnw" ${act("calday", TODAY)}><span class="hi">Aujourd'hui</span></span></div>
        <div class="pb">${calendarHTML()}</div></div>`}
      ${gutter({ size: "cal", grab: "prev", prev: "cal", next: "todo",
        lprev: "le calendrier", lnext: "la liste" })}
      ${folded("todo") ? "" : `<div class="pane" style="flex:1">
        <div class="ph">${icon("list-checks")}<span class="lo bar" style="width:60px"></span>
          <span class="hi">À faire</span><span style="flex:1"></span>
          <span class="chip"><span class="lo bar" style="width:40px"></span>
            <span class="hi">${TASKS.filter((t) => !t.done).length} ouvertes</span></span></div>
        <div class="pb">${taskListHTML()}</div></div>`}
    </div>`,
  }[V.screen]();

  /* No header strip on this pane: it only repeated the screen name already
     set in large type two lines above, and the pane is the whole middle of
     the card — nothing else it could be. */
  return region("content", "contenu", `<div class="pb">${body}</div>`, step,
    V.screen === "Unités" ? "bare" : "");
}

/* ------------------------------------------------------- the quantities
   "Bâtiment entier" is not a way of looking at one floor, so nothing that
   belongs to a floor stays on screen: no unit list, no plan, no model, no
   margin. A count made over eight levels cannot be lit on the sheet of one
   of them, and a window type or a cladding is on no floor plan at all —
   the honest screen is the four tables themselves, side by side, each with
   the glyph of what it counts and its own .csv. */
const buildingScope = () => V.screen === "Unités" && V.scope === "Bâtiment";

function qTableHTML(name) {
  const t = QTABS[name];
  const head = t.head.map((h, i) => `<th class="${t.type[i] === "n" ? "n" : ""}">
    <span class="lo bar" style="width:40px"></span><span class="hi">${h}</span></th>`).join("");

      <span class="lo bar" style="width:${t.type[j] === "n" ? 34 : 50}px"></span>
      <span class="hi">${c}</span></td>`).join("")}</tr>`).join("");
  return `<section class="pane" style="min-height:0">
    <div class="ph">${icon(t.glyph)}<span class="lo bar" style="width:70px"></span><span class="hi">${name}</span>
      <span style="flex:1"></span>
      <span class="btnw" ${act("csv", name)} title="Télécharger « ${name} » en .csv">${icon("download")}<span class="hi">.csv</span></span></div>
    <div class="pb" style="overflow:auto">
      <table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>

function quantScreenHTML(step) {
  const inner = `<div class="pb" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start;align-content:start;overflow:auto">
    ${Object.keys(QTABS).map(qTableHTML).join("")}</div>`;
  return region("content", "quantités du bâtiment", inner, step);
}

/* ------------------------------------------------ the floor's quantities
   On a floor the unit list is the floor's area table: every unit with its
   type, net area and share, the floor's totals at the foot, and under it
   the selected unit's share of what the floor counts. A click in the
   table, on the plan or on the model moves the selection, and the green
   row follows. Windows and materials have no per-floor count in the
   drawings yet: the unit's figures are the building schedule shared out by
   net area, and the block says so. */
const BUILDING_NET = ALL_UNITS.reduce((s, r) => s + r[6], 0);
const fqNum = (n, d = 0) => n.toLocaleString("fr-CA", { minimumFractionDigits: d, maximumFractionDigits: d });
const fqPct = (a, b) => `${b ? Math.round(a / b * 100) : 0} %`;
const unitNo = (r) => r[0].split(" · ")[0];
const M2 = 0.092903;

function floorQuant() {
  const floor = UNITS_BY_LEVEL[viewOf("Unités")] || [];
  const unit = selRow("Unités");
  const visible = rowsOf("Unités");
  const net = floor.reduce((s, r) => s + r[6], 0);
  const brut = net / 0.85;
  const types = [...new Set(floor.map((r) => r[5]))].sort();
  const ofType = (ty) => floor.filter((r) => r[5] === ty);
  const mean = unit ? ofType(unit[5]).reduce((s, r) => s + r[6], 0) / ofType(unit[5]).length : 0;
  const unitShare = (q) => (unit ? q * unit[6] / BUILDING_NET : 0);
  return {
    level: viewOf("Unités"), unit, u: unit ? unitNo(unit) : null,
    /* A count answers "how many 4½"; the share answers "what kind of floor
       is this", which is the question a mix is read for. Both, plus the net
       area the type actually occupies. */
    types: types.map((ty) => [ty, ofType(ty).length, floor.length ? ofType(ty).length / floor.length : 0,
      ofType(ty).reduce((s, r) => s + r[6], 0)]),
    count: floor.length,
    net,
    /* An open crossing rides on the number, as it did on the card. */
    rows: floor.map((r) => ({
      cells: [`${unitNo(r)}${r[7] ? `<span class="xdot" title="${r[1]}"></span>` : ""}`, r[5],
        fqNum(r[6]), fqNum(r[6] * M2, 1), fqPct(r[6], net)],
      on: r === unit, index: visible.indexOf(r),
    })),
    foot: [["Net", "", fqNum(net), fqNum(net * M2), "100 %"],
      ["Circulation", "", fqNum(brut - net), fqNum((brut - net) * M2), "15 %"],
      ["Brut", "", fqNum(brut), fqNum(brut * M2), ""]],
    versus: unit ? `${unit[6] >= mean ? "+" : "−"}${fqNum(Math.abs(unit[6] - mean))} pi² par rapport à la moyenne des ${unit[5]} de l'étage` : "",
    windows: QTABS["Fenêtres"].rows.map((r) => [r[0], fqNum(unitShare(r[3]), 1)]),
    materials: QTABS["Matériaux"].rows.map((r) => [r[0], fqNum(unitShare(r[2]), 1)]),
  };
}

/* The mix of a floor, read in one line: a bar in the typology colours the
   plan already uses, then one chip per type with its count and its share.
   The floor's net area stands beside it because every percentage on the
   row is a share of it. */
function fqMixHTML(q) {
  return `<div class="fqmix">
    <div class="mixbar">${q.types.map(([ty, , share]) =>
      `<span style="width:${(share * 100).toFixed(1)}%;background:${TYPO_INK[ty]}" title="${ty} — ${Math.round(share * 100)} %"></span>`).join("")}</div>
    <div class="mixrow">
      ${q.types.map(([ty, count, share]) => `<span class="chip"><span class="sw" style="background:${TYPO_INK[ty]}"></span><span
        class="lb">${ty} · ${count} · ${Math.round(share * 100)} %</span></span>`).join("")}
      <span style="flex:1"></span>
      <span class="mixnet"><b>${fqNum(q.net)}</b> pi² nets · ${q.count} unités</span>
    </div>
  </div>`;
}

const FQ_TYPE = ["t", "t", "n", "n", "n"];
function fqTableHTML(q) {
  const cell = (c, j, tag = "td") => `<${tag} class="${FQ_TYPE[j] === "n" ? "n" : ""}">${c}</${tag}>`;
  /* A unit the typology filter hides stays in the floor's arithmetic but
     is not offered as a click. */
  const body = q.rows.map((r) => `<tr class="${r.on ? "on" : ""} ${r.index < 0 ? "dim" : ""}" ${r.index >= 0 ? act("row", r.index) : ""}>
    ${r.cells.map((c, j) => cell(c, j)).join("")}</tr>`).join("");
  return `<div class="fqt">
    <table class="tbl"><thead><tr>${["Unité", "Type", "Net pi²", "m²", "Part"].map((h, j) => cell(h, j, "th")).join("")}</tr></thead>
      <tbody>${body}</tbody><tfoot>${q.foot.map((r) => r[0] === "Circulation" ? circulationRowHTML(r, cell) : `<tr>${r.map((c, j) => cell(c, j)).join("")}</tr>`).join("")}</tfoot></table>
    <div class="fqn">net : étiquettes du plan · circulation : 15 %, comme le tableau du bâtiment</div></div>`;
}

function fqUnitHTML(q) {
  const pairs = (rows) => rows.map(([k, v]) => `<tr><td>${k}</td><td class="n">${v}</td></tr>`).join("");
  return `<div class="fq-unit" data-fq>
    <div class="fqh">${icon("box")}<span>Unité ${q.u || "—"}</span><span class="fqs">${q.unit ? `${q.unit[5]} · ${fqNum(q.unit[6])} pi²` : ""}</span></div>
    ${q.versus ? `<div class="fqn">${q.versus}</div>` : ""}
    <table class="tbl"><thead><tr><th>Fenêtres</th><th class="n">qté</th></tr></thead><tbody>${pairs(q.windows)}</tbody></table>
    <table class="tbl"><thead><tr><th>Matériaux</th><th class="n">m²</th></tr></thead><tbody>${pairs(q.materials)}</tbody></table>
    <div class="fqn">estimation : bordereau du bâtiment réparti par superficie nette — à vérifier</div></div>`;
}

/* One table, four ways out of it: the spreadsheet the broker opens, the
   plain text another tool reads, the page that is printed, and the drawing
   the table was measured from. Every line is named the same way — what the
   file is, then its extension — so the list is read by its ends, not by
   guessing which word is a format. */
const EXPORTS = [["xlsx", "Classeur Excel (.xlsx)"], ["csv", "Tableau CSV (.csv)"],
  ["pdf", "Document PDF (.pdf)"], ["dwg", "Dessin AutoCAD (.dwg)"]];

function exportMenuHTML() {
  return `<span class="expwrap">
    <span class="btnw sm ${V.exportMenu ? "on" : ""}" ${act("expmenu")}
      title="Exporter le tableau de ce niveau">${icon("download")}<span class="hi">Exporter</span>${icon("chevron-down")}</span>
    ${V.exportMenu ? `<span class="expmenu">${EXPORTS.map(([k, label]) =>
      `<span class="mi" ${act("export", k)}>${label}</span>`).join("")}</span>` : ""}
  </span>`;
}

function unitListHTML(step) {
  const q = floorQuant();
  return region("list", "liste — unités et superficies",
    `<div class="ph">${icon("table")}<span class="hi">Unités et superficies</span><span class="fqs">${q.level}</span>
       <span style="flex:1"></span>${exportMenuHTML()}</div>
     <div class="pb" style="overflow:auto;gap:10px">
       ${fqMixHTML(q)}
       ${fqTableHTML(q)}
       ${fqUnitHTML(q)}
     </div>`, step);
}

/* A new selection redraws the table and the unit block, not the drawings. */
function paintFQ() {
  const list = document.querySelector('[data-region="list"] .fqt');
  if (!list) return;
  const q = floorQuant();
  list.outerHTML = fqTableHTML(q);
  document.querySelector("[data-fq]")?.replaceWith(document.createRange().createContextualFragment(fqUnitHTML(q)));
}

/* A real file, not a toast: the table as it is on screen, in the order it
   is on screen, with the BOM Excel needs to read the accents. */
function exportCSV(name) {
  const t = QTABS[name];
  const q = (c) => `"${String(c).replace(/"/g, '""')}"`;
  const lines = [[`${V.project} — ${name} — bâtiment entier`],
    t.head, ...t.rows].map((r) => r.map(q).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + lines], { type: "text/csv;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url,
    download: `baldwin-iii-${name.toLowerCase()}.csv` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* The same rows, four blocks, one file, a blank line between them: a
   take-off is passed around as one sheet, not as four attachments. */
function exportAllCSV() {
  const q = (c) => `"${String(c).replace(/"/g, '""')}"`;
  const block = (name) => [[`${V.project} — ${name} — bâtiment entier`],
    QTABS[name].head, ...QTABS[name].rows].map((r) => r.map(q).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + Object.keys(QTABS).map(block).join("\r\n\r\n")],
    { type: "text/csv;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: "baldwin-iii-quantites.csv" });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* A basement or the roof carries no apartment units: the inspector reads
   as the level itself — the architectural sheet it is on, then whichever
   disciplines are laid over it, each with its real code and page — never a
   stand-in unit, and never a decision panel with nothing to decide. */
function nonresInspectorHTML(mode, step) {
  const level = paneLevel();
  const s = sheet();
  const rows = [["Architecture", `${s.code} · p.${s.page}`],
    ...engOverlayDisciplines(level).map((d) => {
      const e = engSheet(d, level);
      return [ENG_LABELS[d], `${engCode(e)} · p.${e.page}`];
    })];
  const inner = `<div class="ph">${icon("circle")}<span class="lo bar" style="width:70px"></span><span class="hi">${levelView(level)}</span></div>
    <div class="pb">
      <div class="tile"><div class="lo col">${bars(2)}</div>
        <div class="hi" style="font-size:12px">Ce niveau ne porte aucune unité résidentielle.</div>
        <div class="hi" style="font-size:11.5px;color:var(--ink-2)">Lecture du plan et des disciplines superposées — rien à sélectionner comme unité, rien à décider ici.</div></div>
      ${rows.map(([k, val]) => `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line-2);padding-bottom:6px">
        <span class="lo bar" style="width:70px"></span><span class="lo bar" style="width:46px"></span>
        <span class="hi" style="font-size:12px;color:var(--ink-2)">${k}</span>
        <span class="hi" style="font-size:12px">${val}</span></div>`).join("")}
    </div>`;
  if (mode === "Bottom sheet") return `<section class="pane rg sheet" data-rg="inspecteur → feuille du bas" data-fi="${fiOf("inspector")}" style="height:260px">${step ? `<span class="step">${step}</span>` : ""}${inner}</section>`;
  if (mode === "Overlay drawer") return `<section class="pane rg drawer" data-rg="inspecteur → superposition" data-fi="${fiOf("inspector")}">${step ? `<span class="step">${step}</span>` : ""}${inner}</section>`;
  return region("inspector", "inspecteur", inner, step);
}

function inspectorHTML() {
  const mode = V.inspector.layout;
  if (mode === "Hidden") return "";
  const step = V.journey ? SCREENS[V.screen].steps.inspector : null;
  /* The quantities screen has no inspector: it is not reading anything. */
  if (V.screen === "Unités" && isNonresLevel(paneLevel())) return nonresInspectorHTML(mode, step);
  const row = selRow(V.screen);
  const title = { "Unités": `Unité ${(row || ["—"])[0].split(" ")[0]}`,
    "Codes": "Article ouvert" }[V.screen] || "Détail";
  /* A decision panel on the screen where something is decided; a short

  const decides = V.screen === "Unités";

     no crossing says so, and says what the level and the project carry. */
  const mine = crossingsFor(no);

      ["Dernier dessin lu", "S-301 R02"]];

    "Vue d'ensemble": [["Typologie", (row || ["", ""])[0].split(" · ")[1] || "—"],

    "Coordination": crossRows,

  const inner = `<div class="ph">${icon("circle")}<span class="lo bar" style="width:70px"></span><span class="hi">${title}</span></div>

      ${V.utab === 1
        /* Ouvertures is about doors and windows, so it shows the schedule
           sheet the sizes are read from, not a crop of the floor plan. */

           <div class="plan" data-img="doors" style="height:96px;flex:0 0 96px"><span class="hi">A-314 · tableau des portes</span></div>`
        : `<div class="plan" data-img="unit" style="height:110px;flex:0 0 110px;background-image:url(assets/plan-niveau-${(selRow("Unités") || [])[4] || paneLevel()}.jpg);${crop(boxForUnit((selRow("Unités") || [])[4] || paneLevel(), (selRow("Unités") || [])[2] ?? 0), .25, "height")}"><span class="hi">${UNIT_TABS[V.utab]} — recadrage de l'unité</span></div>`}` : ""}
      ${rows.map(([k, val]) => `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line-2);padding-bottom:6px">
        <span class="lo bar" style="width:70px"></span><span class="lo bar" style="width:46px"></span>
        <span class="hi" style="font-size:12px;color:var(--ink-2)">${k}</span>
        <span class="hi" style="font-size:12px">${val}</span></div>`).join("")}
      ${V.screen === "Codes" ? codeSideHTML(ARTICLES.find((x) => x.id === V.articleId) || ARTICLES[0])
      : decides ? `<div class="decide">
      <div class="tile" style="border-color:var(--ink)">
        <div class="lo bar" style="width:50%"></div><div class="hi" style="font-weight:600;font-size:12.5px">Pourquoi ce changement?</div>
        <div class="row" style="flex-wrap:wrap;gap:5px">${REASONS.map((m) => `<span class="chip" ${act("reason", m)} style="${m === V.reason ? "border-color:var(--ink)" : ""}">

        ${V.reason ? `<div class="hi" style="font-size:11.5px;color:var(--ink-2)">raison retenue: ${V.reason}</div>` : ""}
        <div class="lo bar" style="width:100%;height:34px;border-radius:5px"></div>
        <input class="hi note" value="${V.note.replace(/"/g, "&quot;")}" placeholder="une phrase pour la personne suivante">
        ${V.settled[settleKey()] ? `<div class="hi" style="font-size:11.5px;color:var(--ink-2)">enregistré — ${V.settled[settleKey()]}</div>` : ""}
        <span class="btnw solid ${saveReady() ? "go" : "off"}" data-save ${act("save")} style="justify-content:center"
          title="${saveReady() ? "Enregistrer" : "Choisissez une raison ou écrivez une phrase"}"><span class="lo bar" style="width:80px;background:#fff;opacity:.6"></span><span class="hi">Enregistrer la décision</span></span>
      </div>
      </div>`
      : `<div class="tile"><div class="lo col">${bars(3)}</div></div>`}
    </div>`;

  if (mode === "Bottom sheet") {
    return `<section class="pane rg sheet ${solo("inspector")}" data-rg="inspecteur → feuille du bas" data-fi="${fiOf("inspector")}" style="height:260px">
      ${step ? `<span class="step">${step}</span>` : ""}${inner}</section>`;
  }
  if (mode === "Overlay drawer") {
    return `<section class="pane rg drawer ${solo("inspector")}" data-rg="inspecteur → superposition" data-fi="${fiOf("inspector")}">
      ${step ? `<span class="step">${step}</span>` : ""}${inner}</section>`;
  }
  return region("inspector", "inspecteur", inner, step);
}

/* ------------------------------------------------------------ the margin
   A note is a sentence stuck to a point of a drawing. Two kinds share the
   list: a pin the invited collaborator can read, and a studio note that
   stays inside the office. The scope is written on the pin and carried by
   the share link; inside the studio both are shown. */
const PIN_KEY = "fitte:epingles:c3";
const PIN_SEED = [
  { id: 1, scope: "partage", surface: "plan", level: 5, sheet: "plan", x: .455, y: .565,

}
const savePins = () => localStorage.setItem(PIN_KEY, JSON.stringify(V.pins));
const nextPinId = () => V.pins.reduce((m, p) => Math.max(m, p.id), 0) + 1;
/* Both publics live in one list: the studio's own reminders and the ones a

const pinsVisible = () => V.pins;
const pinsOnSheet = () => pinsVisible().filter((p) => p.surface === "plan" && p.level === paneLevel());
const pinsOnModel = () => pinsVisible().filter((p) => p.surface === "model");
const SHEET_NAME = { plan: "plan d'unités", arp: "arpenteur", pay: "paysage" };
const pinAnchor = (p) => (p.surface === "model"
  ? `maquette · niv. ${p.level} · ${p.face}`

/* Which sheet was on screen when the point was put down: the floor plan

const currentSheetKey = () => {

/* The pins drawn on the 2D sheet. They live inside the transformed box with
   the unit outlines, so they pan and zoom with the drawing; their size is
   divided by the zoom so a pin stays a pin instead of growing into a sign. */
function pinMarkHTML() {

/* The note is written at the point it is about. A composer a column away

function marginHTML() {

        <div class="row nscope">

          <span class="chip ${team ? "" : "on"}" ${act("pinscope", "partage")}>${icon("users")}<span class="lb">Partagée</span></span>
        </div>
        <textarea class="hi nnew" data-pindraft rows="3"
          placeholder="${team ? "Note interne — l'invité ne la verra pas" : "Épingle partagée — visible par le lien"}">${V.draft.replace(/</g, "&lt;")}</textarea>
        <div class="nact">
          <span class="chip" ${act("pincancel")}>Annuler</span>
          <span class="btnw solid go" ${act("pinpost")}>${icon(team ? "lock" : "send")}<span class="hi">${team ? "Garder à l'interne" : "Poser l'épingle"}</span></span>
        </div></div>`

  const inner = `<div class="ph">${icon("message-square")}<span class="lo bar" style="width:70px"></span>
