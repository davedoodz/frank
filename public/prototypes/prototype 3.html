<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype C — wireframe</title>
<link rel="stylesheet" href="vendor/geist/geist.css">
<link rel="stylesheet" href="vendor/dialkit/styles.css">
<script type="importmap">
{"imports":{
  "three":"./vendor/three/build/three.module.js",
  "three/addons/":"./vendor/three/examples/jsm/"
}}
</script>
<script type="module" src="wireframe-c3-viewer.js"></script>
<script type="module" src="wireframe-c3-pdf.js"></script>
<style>
/* Low fidelity on purpose: one grey, one line weight, one type size ramp.
   What is being tested here is where things sit and in what order they are
   read, not how they look. */
:root{
  --sans:'Geist',ui-sans-serif,system-ui,sans-serif;
  --ink:#1b1b1b; --ink-2:#6b6b6b; --ink-3:#9b9b9b;
  --line:#c9c9c9; --line-2:#e2e2e2;
  --fill:#ededed; --fill-2:#f6f6f6; --page:#fafafa; --page-field:#f4f4f5;
  --bar:#dcdcdc;
  --hi:#111;
  /* The surface a card, a pane or a dialog is drawn on, the ink that reads
     on top of --hi, and the three washes a hover, a press and a selection
     use. They are tokens because dark mode is only these turned over. */
  --card:#fff; --on-hi:#fff;
  --wash:rgba(17,17,18,.055); --wash-2:rgba(17,17,18,.085); --wash-3:rgba(17,17,18,.11);
  /* The office green, used for one thing only: the level being read. It is
     the same green the black chrome already wore, lifted to the root so the
     level row carries it under either chrome. */
  --vert:#c3e05a; --vert-ink:#2f3a05;
  --gap:10px; --pad:12px; --r:6px;
}
/* Dark mode is the same screen with the ramp turned over: same spacing,
   same weights, same hairlines. Two things stay as they are — the drawing
   keeps its own paper, because a plan is a white sheet and inverting it
   would be redrawing it, and the black chrome stays black. */
[data-theme="dark"]{
  --ink:#ececed; --ink-2:#9b9b9f; --ink-3:#74747a;
  --line:#3c3c42; --line-2:#2b2b30;
  --fill:#2a2a2f; --fill-2:#202024; --page:#0f0f11; --page-field:#17171a;
  --bar:#32323a;
  --hi:#f1f1f2;
  --card:#17171a; --on-hi:#111;
  --wash:rgba(255,255,255,.07); --wash-2:rgba(255,255,255,.11); --wash-3:rgba(255,255,255,.16);
  color-scheme:dark;
}
[data-density="compact"]{--gap:6px;--pad:8px}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--sans)}
/* The app is a window, not a page. Nothing scrolls or rubber-bands at the
   document level, so the whole screen cannot be pulled up, down or sideways;
   what needs to scroll scrolls inside its own pane. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--page);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* The prototype is the screen: no page chrome around it, no explainer under
   it. What is being judged fills the window. */
.stage{padding:0;max-width:none;margin:0;height:100dvh;display:flex;overflow:hidden}
/* render() writes the frame into this wrapper, so the wrapper has to carry
   the stretch as well. */
#frame{flex:1;display:flex;min-width:0}

/* screen frame -------------------------------------------------------- */
.frame{margin:0;border:0;border-radius:0;background:var(--card);
  flex:1;height:100vh;display:grid;overflow:hidden;position:relative}
.frame[data-nav="rail"]{grid-template-columns:86px 1fr;grid-template-rows:1fr}
.frame[data-nav="wide"]{grid-template-columns:180px 1fr;grid-template-rows:1fr}
.frame[data-nav="top"]{grid-template-columns:1fr;grid-template-rows:1fr}
.frame[data-nav="stack"]{grid-template-columns:72px 1fr;grid-template-rows:1fr}

/* The chrome is a grey field and the work is a white card on it. The rail is
   as wide as its items, and an item is only drawn when it is under the
   pointer or current: resting state is the field itself. */
.rail{border-right:0;background:transparent;
  display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:10px 8px}
.rail.wide{align-items:stretch;padding:10px}
.rail .ic{width:auto;height:auto;min-height:32px;border-radius:9px;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:7px 4px;color:var(--ink-3);cursor:pointer;
  transition:background .12s ease,color .12s ease}
.rail .ic:hover{background:var(--wash);color:var(--ink-2)}
.rail .ic:active{background:var(--wash-3)}
.rail .ic.on{background:var(--wash-2);color:var(--ink)}
.rail .ic.on .cap{color:var(--ink-2)}
.rail .row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:9px;cursor:pointer;
  color:var(--ink-3);transition:background .12s ease,color .12s ease}
.rail .row:hover{background:var(--wash);color:var(--ink-2)}
.rail .row.on{background:var(--wash-2);color:var(--ink)}

/* min-height:0 is what keeps a tall screen — the code cards, a long list —
   inside the window instead of pushing the card past the bottom edge. The
   pane scrolls; the card keeps its four sides. */
.body{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.tabs{height:42px;border-bottom:0;display:flex;align-items:center;
  gap:4px;padding:0 12px;flex:0 0 auto}
.tabs button{border:0;background:transparent;font-size:12.5px;color:var(--ink-3);
  padding:6px 9px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background .12s ease,color .12s ease}
.tabs button:hover{background:var(--wash);color:var(--ink-2)}
.tabs button:active{background:var(--wash-3)}
.tabs button[aria-current="true"]{background:var(--wash-2);color:var(--ink);font-weight:500}
.tabs .sp{flex:1}
/* The project name holds its place; the views are what gives way when the
   strip runs out of room, so they scroll instead of pushing the name off. */
.tabs .crumb{flex:0 0 auto;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .views{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;
  scrollbar-width:none}
.tabs .views::-webkit-scrollbar{display:none}
.tabs .views button{flex:0 0 auto}

/* ------------------------------------------------- two rows, and no rail
   Row one is where one is and which screen is open. Row two is what that
   screen asks for — here, which level is being read. The dependency is
   stated by the order alone: no group boxes, no captions, nothing on the
   left edge. The level row is the only place the office green appears. */
.tabs.lvl{height:32px;background:var(--fill-2);border-top:1px solid var(--line-2);
  border-bottom:1px solid var(--line-2)}
.tabs.lvl .views{flex:1}
.tabs.lvl button{font-size:12px;padding:4px 9px}
.tabs.lvl button[aria-current="true"]{background:var(--vert);color:var(--vert-ink);font-weight:600}
.frame[data-chrome="black"] .tabs.lvl{background:#1e1e21;border-color:#2c2c31}
.frame[data-chrome="black"] .tabs.lvl button{color:rgba(255,255,255,.72);font-size:12.5px}
.frame[data-chrome="black"] .tabs.lvl button:hover{background:rgba(255,255,255,.1);color:#fff}
/* The green stays on the level and nowhere else: it is the one value the
   whole screen is filtered by, and it has to beat a white pill one row up. */
.frame[data-chrome="black"] .tabs.lvl button[aria-current="true"]{background:var(--vert);color:var(--vert-ink)}

/* rail with the label under the icon */
.rail.stack{align-items:stretch;padding:10px 6px}
.rail .stk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;
  border-radius:9px;font-size:10px;color:var(--ink-3);text-align:center;cursor:pointer;
  transition:background .12s ease,color .12s ease}
.rail .stk:hover{background:var(--wash);color:var(--ink-2)}
.rail .stk.on{background:var(--wash-2);color:var(--ink)}

/* how the tab strip presents itself */
.tabs[data-align="Centred"]{justify-content:center}
.tabs[data-align="Centred"] .sp{display:none}
.tabs[data-align="Spread"] button{flex:1;justify-content:center}
.tabs[data-align="Spread"] .sp{display:none}
.tabs[data-style="Underline"] button{border-radius:0}
.tabs[data-style="Underline"] button[aria-current="true"]{background:transparent;
  box-shadow:inset 0 -2px 0 var(--ink)}
.tabs[data-style="Pills"] button{border:1px solid var(--line-2);border-radius:999px}
.tabs[data-style="Pills"] button[aria-current="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tabs[data-style="Segmented"]{gap:0}
.tabs[data-style="Segmented"] button{border-radius:0;border-right:1px solid var(--line-2);background:var(--fill-2)}
.tabs[data-style="Segmented"] button:first-of-type{border-top-left-radius:6px;border-bottom-left-radius:6px}
.tabs[data-style="Segmented"] button:last-of-type{border-right:0;border-top-right-radius:6px;border-bottom-right-radius:6px}
.tabs[data-style="Segmented"] button[aria-current="true"]{background:var(--card);color:var(--ink)}

/* label presets, shared by the rail and the tab strip */
.rail[data-labels-mode="Hidden"] .hi:not(.code),.tabs[data-labels-mode="Hidden"] .hi:not(.code),
.rail[data-labels-mode="Hover only"] .hi:not(.code),.tabs[data-labels-mode="Hover only"] .hi:not(.code){display:none}
.tabs[data-labels-mode="Hover only"] button:hover .hi,
.rail[data-labels-mode="Hover only"] .row:hover .hi,
.rail[data-labels-mode="Hover only"] .stk:hover .hi{display:inline}
.rail[data-labels-mode="Uppercase"] .hi,.tabs[data-labels-mode="Uppercase"] .hi{
  text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.rail[data-labels-mode="Short code"] .hi,.tabs[data-labels-mode="Short code"] .hi{letter-spacing:.04em}
/* a caption that does not fit on one line wraps rather than truncating:
   "Quantités" is a destination, not an ellipsis */
.rail .ic .cap{font-size:9px;line-height:1.2;text-align:center;max-width:100%;
  white-space:normal;overflow-wrap:normal;hyphens:none;color:var(--ink-3)}
.rail .ic.on .cap{color:var(--ink)}
.rail .code{font-size:9.5px;letter-spacing:.03em;color:inherit}
.rail .sct{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:8px 4px 2px}
.rail.stack .stk .hi{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail.wide .row .hi{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* breadcrumb, screen menu and grouped tabs live in the tab strip */
.tabs .crumb{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
/* the crumb is a .hi too, and the fidelity rule sets .hi to block: this wins
   on specificity so the folder keeps its gap from the label */
.tabs .crumb.hi{display:inline-flex}
.tabs .crumb .lu{width:13px;height:13px;flex:0 0 13px}
.tabs .crumb:hover{color:var(--ink)}
.tabs .crumb.ech{padding:0 8px;height:24px;border-radius:7px;margin-left:2px}
.tabs .crumb.ech:hover{background:var(--fill-2)}
.tabs .crumb.ech .late{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;
  padding:0 4px;border-radius:8px;background:var(--rouge-soft,#f7e8e4);color:var(--rouge,#b4442f);
  font-size:10px;font-weight:600}
.tabs .crumb.on{cursor:default}
.tabs .crumb.on{color:var(--ink);font-weight:500}
.tabs .grp{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:0 6px 0 2px}
.tabs .div{width:1px;height:18px;background:var(--line-2);margin:0 6px}
.tabs [data-menu]{cursor:pointer}
.tabs[data-style="Top accent"] button{border-radius:0}
.tabs[data-style="Top accent"] button[aria-current="true"]{background:transparent;
  box-shadow:inset 0 2px 0 var(--ink)}
.tabs[data-style="Boxed"] button{border:1px solid transparent}
.tabs[data-style="Boxed"] button[aria-current="true"]{background:var(--card);border-color:var(--line-2);
  box-shadow:0 1px 2px rgba(0,0,0,.05)}

.work{flex:1;min-height:0;display:grid;gap:var(--gap);padding:var(--gap)}
.pane{border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);
  display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden}
.pane > .ph{height:38px;flex:0 0 auto;border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:8px;padding:0 11px;font-size:13px;font-weight:500;color:var(--ink);
  white-space:nowrap}
.pane > .ph > svg{width:15px;height:15px;color:var(--ink-2)}
/* Only the title is loud: chips, counts and buttons inside the header keep
   their own weight. */
.pane > .ph .chip,.pane > .ph .btnw{font-weight:400}
/* No overscroll-behavior here. A pane whose content fits still counts as a
   scroller, and `contain` on it swallows the wheel instead of handing it to
   the region behind — which is what actually scrolls on Aperçu. The window
   itself is already locked on html and body, so chaining stops there. */
.pane > .pb{flex:1;min-height:0;overflow:auto;
  padding:var(--pad);display:flex;flex-direction:column;gap:8px}
.pane.flat > .pb{padding:0}
/* The decision is the last thing in the column: it sits at the foot of the
   inspector rather than floating under the rows, so the empty space is above
   it and the button is where the thumb already is. */
.pane > .pb > .decide{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px}

/* low-fi primitives --------------------------------------------------- */
.bar{height:9px;border-radius:3px;background:var(--bar)}
.bar.lt{background:var(--fill)}
.box{background:var(--fill);border-radius:var(--r);flex:1}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.chip{height:22px;border:1px solid var(--line-2);border-radius:999px;background:var(--fill-2);
  display:inline-flex;align-items:center;gap:5px;padding:0 9px;font-size:11.5px;color:var(--ink-2)}
/* An icon chip: square, no label, the name carried by the tooltip and by the
   line beside the row. Four of them fit where two words did not. */
.chip.ico{width:26px;height:26px;padding:0;justify-content:center;border-radius:7px;flex:0 0 26px}
.chip.ico.on{border-color:var(--ink);color:var(--ink);background:var(--fill)}
.utabs{gap:5px;align-items:center}
.btnw{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--fill-2);
  display:inline-flex;align-items:center;gap:6px;padding:0 9px;font-size:12px;color:var(--ink-2)}
.btnw.solid{background:var(--bar);border-color:var(--line);color:var(--ink)}
/* A path as a control: one line, elided from the left, used by the share
   dialog for the link it hands over. */
.fpath{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;overflow:hidden;
  height:24px;padding:0 8px;border:1px solid var(--line-2);border-radius:5px;
  background:var(--fill-2);font-size:11.5px;color:var(--ink-2);cursor:pointer}
.fpath:hover{border-color:var(--line);background:var(--fill)}
.fpath .lu{flex:0 0 13px}
.pcard{cursor:pointer}
.pcard:hover{border-color:var(--line);background:var(--fill-2)}
.tile{border:1px solid var(--line-2);border-radius:var(--r);padding:10px;display:flex;
  flex-direction:column;gap:6px;min-width:0}
.listrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px}
.listrow.on{background:var(--fill)}
.listrow .dot{width:8px;height:8px;border-radius:50%;background:var(--bar);flex:0 0 8px}

/* Anything that does something says so under the cursor, and anything that
   cannot act yet is visibly out of reach rather than silently inert. */
[data-act],[data-screen]{cursor:pointer}
[data-act]:hover{border-color:var(--line)}
.chip[data-act]:hover,.btnw[data-act]:hover{background:var(--fill)}
.listrow[data-act]:hover{background:var(--fill-2)}
.tbl tr[data-act]:hover td{background:var(--fill-2)}
.tile[data-act].on,.chip.on{border-color:var(--ink)}
.btnw.off{opacity:.45}
input.find,input.note{border:1px solid var(--line-2);border-radius:5px;padding:5px 7px;
  font:inherit;font-size:11.5px;color:var(--ink);background:var(--card);min-width:0;width:100%}
input.find{border:0;background:transparent;padding:0;width:140px}
input.find:focus,input.note:focus{outline:1px solid var(--ink);outline-offset:1px}
/* The answer to an action that leaves no other mark on the screen. */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;
  background:var(--ink);color:var(--card);border-radius:7px;padding:8px 12px;font-size:12px;
  max-width:min(620px,80vw);box-shadow:0 8px 24px rgba(17,17,18,.22)}

/* The dialog sits over the frame, centred, and dims what it interrupts. */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(17,17,18,.28);
  display:grid;place-items:center;padding:24px}
.dialog{width:min(520px,92vw);background:var(--card);border-radius:12px;border:1px solid var(--line-2);
  box-shadow:0 12px 40px rgba(17,17,18,.22);display:flex;flex-direction:column;max-height:86vh}
.dialog .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.dialog .db{display:flex;flex-direction:column;gap:9px;padding:14px;overflow:auto;overscroll-behavior:contain}
.dialog .df{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line-2)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input{border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;font:inherit;font-size:12px;color:var(--ink);background:var(--card)}
.fld input:focus{outline:1px solid var(--ink);outline-offset:1px}
/* A message carries the article, its two numbers and the notes: the box has
   to show enough of it to be read before it is sent. */
.dialog.wide{width:min(680px,94vw)}
.mailbody{border:1px solid var(--line-2);border-radius:6px;padding:8px 9px;font:inherit;font-size:12px;
  line-height:1.45;color:var(--ink);background:var(--card);resize:vertical;min-height:150px}
.mailbody:focus{outline:1px solid var(--ink);outline-offset:1px}
/* The drop zone: one dashed line, the system picker behind a click, and
   the whole dialog accepting the drop so the aim does not have to be exact. */
.maildrop{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;
  border:1px dashed var(--line);border-radius:6px;color:var(--ink-2);font-size:12px;cursor:pointer}
.maildrop:hover{background:var(--fill)}
.maildrop.over{border-color:#8ba00f;background:#eef1e0;color:var(--ink)}
.maildrop u{text-underline-offset:2px}
.chip .mx{display:inline-flex;margin-left:2px;color:var(--ink-3);cursor:pointer}
.chip .mx:hover{color:var(--ink)}
.chip .mx svg{width:12px;height:12px}

/* A provision reads as a card, drawing first: the rule is seen before its
   number is read. The drawing touches the card's edges, the words sit under
   it, and the two numbers are not repeated — they are inside the drawing. */
.codegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}

/* The vertical reading of the same provisions: the drawing on the left at a
   fixed width so every row starts at the same place, the words on the right
   at full measure. A grid of cards made the quote a column three words
   wide; a list lets the sentence be read. */
.codelist{display:flex;flex-direction:column;gap:8px}
/* The body of rules an article belongs to, said once above its articles
   instead of once in every row, and said in the list rather than in a
   strip that would hide the other two. */
.codesec{display:flex;align-items:baseline;gap:8px;padding:10px 2px 2px;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.codesec:first-child{padding-top:0}
.coderow{display:grid;grid-template-columns:258px 1fr;gap:0;align-items:stretch;
  border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);overflow:hidden}
.coderow:hover{border-color:var(--line)}
/* An outline, not an inset shadow: a child's own background paints over a
   parent's inset shadow, so the left edge of the selected row disappeared
   behind the thumbnail's fill. */
.coderow.on{border-color:var(--ink);outline:1px solid var(--ink);outline-offset:-1px}
.coderow > .draw{padding:10px;background:var(--fill-2);border-right:1px solid var(--line-2);
  display:grid;place-items:center}
.coderow > .draw img{width:100%;height:auto;display:block;mix-blend-mode:multiply}
.coderow > .tx{padding:11px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.coderow .note{border-left:2px solid var(--vert);padding-left:9px;display:flex;flex-direction:column}
/* A note in the right column: the one place a note is written, read,
   rewritten or dropped. */
.anote{border-left:2px solid var(--vert);padding:2px 0 2px 9px;display:flex;flex-direction:column;gap:2px}
.anote.edit{gap:6px}
.nedit{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:5px;color:var(--ink-3);cursor:pointer}
[data-fi="high"] .nedit.hi{display:inline-flex}
.nedit:hover{background:var(--fill-2);color:var(--ink)}
.nedit svg{width:13px;height:13px}
/* A disagreement between two drawings, marked where it happens. Red is
   not decoration here: it is the one thing on the sheet that is wrong. */
.xmark{position:absolute;z-index:16;transform:translate(-50%,-50%);display:inline-flex;align-items:center;
  border:1px solid #b3261e;background:rgba(255,255,255,.95);color:#b3261e;font-weight:600;
  line-height:1.2;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums;
  box-shadow:0 1px 3px rgba(17,17,18,.18)}
.xmark:hover{background:#b3261e;color:#fff}
.xmark.has{border-color:#4c7a2f;color:#3d6b22;background:rgba(255,255,255,.95)}
.xmark.has:hover{background:#3d6b22;color:#fff}
[data-fi="low"] .xmark b{display:none}
/* Its card sits in the pane, not on the sheet: it must not move or grow
   with the drawing it is talking about. */
.xcard{position:absolute;left:12px;top:12px;z-index:9;width:296px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;
  box-shadow:0 8px 24px rgba(17,17,18,.14)}
.xcard .hd{display:flex;align-items:baseline;gap:7px}
.xcard .hd b{font-size:12.5px}
.xcard .hd .dt{font-size:11px;color:var(--ink-3);flex:1}
.xcard .hd .x{cursor:pointer;color:var(--ink-3);display:inline-flex}
.xcard .hd .x:hover{color:var(--ink)}
.xcard .wh{font-size:12px;color:var(--ink)}
.xcard .fn{font-family:var(--mono,monospace);font-size:10.5px;color:var(--ink-3);line-height:1.5}
.xcard .cg{font-size:11px;color:var(--ink-2)}
.xcard .lb{font-size:11px;color:var(--ink-3)}
.xcard .tk{display:flex;gap:7px;align-items:flex-start;border-left:2px solid var(--vert);padding-left:8px}
.xcard .tk svg{width:13px;height:13px;color:#3d6b22;flex:0 0 13px;margin-top:2px}
.xcard .tk b{font-size:12px;font-weight:600;display:block}
.xcard .tk i{font-size:11px;color:var(--ink-3);font-style:normal}
/* The card in the list only counts them. */
.nct{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3)}
[data-fi="high"] .nct.hi{display:inline-flex}
.nct svg{width:12px;height:12px}
.noteinput{flex:1;resize:vertical;border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;
  font:inherit;font-size:12px;color:var(--ink);background:var(--card)}
.noteinput:focus{outline:1px solid var(--ink);outline-offset:1px}
/* How clear the provision is to read, as the office judged it: a dot, a
   word, and a menu of three. The dot is the only colour on the row, and it
   is there to be caught out of the corner of the eye when a client asks
   why the rule says what it says. */
.clarity{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
  color:var(--ink-2);border:1px solid transparent;border-radius:5px;padding:2px 6px;white-space:nowrap}
.clarity:hover{border-color:var(--line);background:var(--card)}
/* The fidelity switch turns every .hi into a block, which dropped this
   chip's flex row — and an inline box ignores a width, so the dot was
   painted at nothing and the colour only ever showed in the open menu.
   Stated again at a weight that holds. */
[data-fi="high"] .clarity.hi{display:inline-flex}
.clarity::before{content:"";flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--cl)}
.clarity[data-c="clair"]{--cl:#2f7a4d}
.clarity[data-c="moyen"]{--cl:#b58900}
.clarity[data-c="obscur"]{--cl:#b3261e}
.clarity svg{width:12px;height:12px;color:var(--ink-3)}
.claritymenu{position:absolute;top:calc(100% + 4px);right:0;z-index:7;min-width:168px;
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  display:flex;flex-direction:column;overflow:hidden}
.claritymenu .opt{display:flex;align-items:center;gap:7px;padding:6px 9px;font-size:11.5px;
  color:var(--ink);background:var(--card)}
.claritymenu .opt:hover{background:var(--fill-2)}
.claritymenu .opt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cl)}
.claritymenu .opt[data-c="clair"]{--cl:#2f7a4d}
.claritymenu .opt[data-c="moyen"]{--cl:#b58900}
.claritymenu .opt[data-c="obscur"]{--cl:#b3261e}
/* The people the provision is argued with, and how long ago each one last
   wrote: the wait is the part of the file nobody tracks. */
.contact{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.contact .who{flex:1;min-width:0;display:flex;flex-direction:column}
.contact .who b{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact .who span{font-size:11px;color:var(--ink-3)}
/* The fidelity switch blocks every .hi, which flattened this button's
   row: the glyph and the word ran together with no gap. */
[data-fi="high"] .contact .mailto.hi{display:inline-flex}
.contact .mailto .hi{display:inline}
.contact .sent{font-size:11px;color:var(--vert-ink,#4c5906)}
.contact .mailto{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  text-decoration:none;color:var(--ink-2);
  border:1px solid var(--line-2);border-radius:5px;padding:3px 7px;font-size:11px}
.contact .mailto:hover{background:var(--fill);color:var(--ink)}
.contact.slow .who span{color:#b3261e}
@media (max-width:900px){.coderow{grid-template-columns:1fr}
  .coderow > .draw{border-right:0;border-bottom:1px solid var(--line-2)}}

/* The calendar is a table of days with hairlines, not a card grid: a month
   has to be read as one block, so the cells share their borders. */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line-2);
  border-radius:var(--r);overflow:hidden;background:var(--line-2);gap:1px}
.cal .dow{background:var(--fill-2);padding:4px 6px;font-size:10.5px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em}
.cal .day{background:var(--card);padding:4px 6px;min-height:28px;min-width:0;display:flex;
  flex-direction:column;gap:2px;cursor:pointer;position:relative}
.cal.big .day{min-height:76px}
.cal .day:hover{background:var(--fill-2)}
.cal .day.dim{color:var(--ink-3);background:var(--fill-2);opacity:.65}
.cal .day.on{background:var(--fill);box-shadow:0 0 0 1px var(--ink) inset}
.cal .day.today .n{background:var(--ink);color:var(--card);border-radius:3px;padding:0 4px}
.cal .day .n{font-size:11.5px;font-weight:600;align-self:flex-start}
.cal .day .lbl{font-size:10.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .dots{display:flex;gap:3px;align-items:center}
.cal .dots em{font-size:10px;font-style:normal;color:var(--ink-3)}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--ink);display:inline-block}
.pdot[data-prio="moyenne"]{background:var(--ink-2)}
.pdot[data-prio="basse"]{background:var(--card);border:1px solid var(--ink-3)}
.pdot[data-done="true"]{background:var(--card);border:1px solid var(--line);opacity:.8}
.cal .day.late .n{text-decoration:underline;text-underline-offset:2px}
/* Twelve small months at once: the year is for seeing where the work
   piles up, not for reading titles. */
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.year .ym .row{cursor:pointer;padding:2px 0}
.year .cal.sm .day{min-height:20px;padding:2px 3px}
.year .cal.sm .day .n{font-size:10px;font-weight:500}
.year .cal.sm .dow{padding:2px 3px;font-size:9.5px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line-2);
  border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;min-height:260px}
.week .wcol{background:var(--card);display:flex;flex-direction:column;cursor:pointer}
.week .wcol.on{background:var(--fill)}
.week .wh{padding:5px 6px;border-bottom:1px solid var(--line-2);font-size:11px;font-weight:600}
.week .wcol.today .wh{background:var(--ink);color:var(--card)}
.week .wb{padding:5px;display:flex;flex-direction:column;gap:4px}
.wtask{border:1px solid var(--line-2);border-left:2px solid var(--ink-3);border-radius:5px;
  padding:4px 5px;font-size:11px;display:flex;flex-direction:column;gap:1px;background:var(--card)}
.wtask[data-prio="haute"]{border-left-color:var(--ink);border-left-width:3px}
.wtask[data-prio="moyenne"]{border-left-color:var(--ink-2)}
.wtask .who{font-size:10px;color:var(--ink-3)}
/* A task row reads left to right as: done, what, how urgent, when. */
.task{display:flex;align-items:center;gap:8px;padding:6px 7px;border:1px solid var(--line-2);
  border-radius:var(--r);background:var(--card);cursor:pointer}
.task:hover{border-color:var(--line)}
.task.on{box-shadow:0 0 0 1px var(--ink) inset;border-color:var(--ink)}
/* A ticked line stays readable: it is still being looked at, and it only
   leaves the list when someone files it. */
.task.done{opacity:.72}
.task.done .ttl{text-decoration:line-through}
.task.late{border-left:3px solid var(--ink)}
.task .pr{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;white-space:nowrap}
.task .pr[data-prio="haute"]{background:var(--vert);color:var(--vert-ink);border-color:var(--vert)}
.task .pr[data-prio="moyenne"]{color:var(--ink)}
.task .dte{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;
  min-width:52px;text-align:right}
/* The tick is the one control that must be hittable without aiming, so it
   is a real 15 px box with a pointer target around it. */
.task .tick{flex:0 0 auto;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line);
  background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.task:hover .tick{border-color:var(--ink-2)}
.task .tick.on{background:var(--ink);border-color:var(--ink)}
.task .tick .lu{width:10px;height:10px;stroke-width:3}
.task .file{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:11px;cursor:pointer;flex:0 0 auto}
.task .file:hover{border-color:var(--ink-2);color:var(--ink)}
.task .file svg{width:12px;height:12px}
[data-fi="high"] .task .file.hi{display:inline-flex}
.task .file .hi{display:inline}
.task .tact{display:flex;align-items:center;color:var(--ink-3);opacity:0;padding:2px}
.task:hover .tact,.task.on .tact{opacity:1}
.task .tact:hover{color:var(--ink)}
.task .tact .lu{width:13px;height:13px}
/* Carried to another day: lifted out of the list and following the pointer,
   with no transition, so it sits exactly where the hand is. */
.task.carry{position:relative;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.18);
  border-color:var(--ink);cursor:grabbing}
body.tdrag,body.tdrag *{cursor:grabbing !important}
/* The day the task would land on, named before the drop rather than after. */
.day.drop,.wcol.drop{box-shadow:0 0 0 2px var(--ink) inset}

/* Who holds the task: initials of the seat, not a name. */
.avs{display:flex;gap:-2px;flex:0 0 auto}
.av{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:50%;background:var(--fill);border:1px solid var(--line-2);color:var(--ink-2);
  font-size:9px;font-weight:650;font-style:normal;letter-spacing:.02em}
.avs .av + .av{margin-left:-6px}
.chip.who .av{width:16px;height:16px;font-size:8px;margin-right:3px}

/* One editor for a new task and for an existing one, in the row's place. */
.tedit{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--ink);
  border-radius:var(--r);background:var(--card)}
.tin{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--line-2);border-radius:5px;padding:5px 7px;width:100%}
.tin:focus{outline:none;border-color:var(--ink)}
.tin.day{width:auto;font-size:11.5px;font-variant-numeric:tabular-nums}
.tedit .chip{cursor:pointer;font-size:11px}
.plan{position:relative;flex:1;background:repeating-linear-gradient(0deg,var(--fill-2) 0 15px,transparent 15px 16px),
  repeating-linear-gradient(90deg,var(--fill-2) 0 15px,transparent 15px 16px);
  border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--ink-3);font-size:11.5px}
/* A card with no drawing behind it shows the picture glyph, not a sentence
   describing a picture. */
.plan.ghost{color:var(--line-2)}
.plan.ghost .lu{width:22px;height:22px;stroke-width:1.5}
/* the projects page: one ratio for every project, so the rows line up */
.pcard{cursor:pointer}
.pcard .thumb{aspect-ratio:16 / 9;flex:0 0 auto;position:relative}
.pcard .thumb.mark{display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);
  border-radius:var(--r);overflow:hidden;background:var(--tint);color:var(--mark)}
.pcard .thumb.mark span{font-size:20px;font-weight:600;letter-spacing:.04em}
.pcard .thumb .lv{position:absolute;right:6px;bottom:5px;z-index:2;font-size:10px;color:var(--ink-3);
  background:rgba(255,255,255,.86);border-radius:4px;padding:1px 5px}
/* The rendering reads as the cover once the screen is at full fidelity; the
   initials carry the card until then. */
[data-fi="high"] .pcard .thumb.cover{background-image:url(assets/baldwin-cover.png);
  background-size:cover;background-position:center 42%}
[data-fi="high"] .pcard .thumb.cover span{display:none}
[data-fi="high"] .plan.ghost.cover{background:url(assets/baldwin-cover.png) center 42%/cover no-repeat;
  border-style:solid}
[data-fi="high"] .plan.ghost.cover svg{display:none}
.pnew .newbox{aspect-ratio:16 / 9;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--fill-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:12px}
.state{display:inline-flex;align-items:center;gap:5px}
/* the home fills the width it is given, whatever the window is */
.work > div > .pane{flex:1 1 auto;min-width:0}
.state .d{width:6px;height:6px;border-radius:50%;background:var(--bar)}
.state[data-open="1"]{color:var(--hi)}
.state[data-open="1"] .d{background:var(--hi)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-weight:500;color:var(--ink-3);font-size:11px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
/* The floor's area table: the selected unit is the plan outline's green. */
.tbl tr.on td{background:#eef1e0;color:var(--ink);font-weight:600}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--fill)}
.tbl tbody tr.on[data-act]:hover td{background:#e4e9cf}
.tbl tr.dim td{color:var(--ink-3)}
/* An open crossing rides on the unit number. */
.xdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hi);margin-left:5px;vertical-align:1px}
.tbl tfoot td{color:var(--ink);font-weight:600}
.fqt{display:flex;flex-direction:column;gap:4px;min-width:0}
.fqh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink)}
.fqh svg{width:13px;height:13px}
.fqs{font-size:12px;font-weight:400;color:var(--ink-2);margin-left:6px}
.fqn{font-size:11px;color:var(--ink-3)}
.fq-unit{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line-2);padding-top:10px}
[data-theme="dark"] .tbl tr.on td{background:#2b3313}
/* A figure and its head belong on one line: a wrapped "pi² total" stops
   being a column heading and becomes two words floating over numbers. */
.tbl th,.tbl td{white-space:nowrap}
/* The levels under a building-wide count: dimmed, because the figures are
   not theirs — still clickable, because that is how one comes back. */
.tabs.lvl[data-off="true"] .views button{opacity:.42}
.sheet{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--line);
  background:var(--card);box-shadow:0 -8px 24px rgba(0,0,0,.07);z-index:3}
.drawer{position:absolute;top:0;right:0;bottom:0;width:360px;border-left:1px solid var(--line);
  background:var(--card);box-shadow:-10px 0 28px rgba(0,0,0,.08);z-index:3}

/* fidelity ------------------------------------------------------------ */
[data-fi="high"] .bar{display:none}
[data-fi="high"] .hi{display:block}
/* A button that only exists at high fidelity still has to be a row: without
   this, display:block wins over .btnw's inline-flex and the icon falls back
   to the text baseline instead of the centre of the button. */
[data-fi="high"] .btnw.hi,[data-fi="high"] .chip.hi{display:inline-flex}
.hi{display:none}
/* The dialog and the toast are not part of the fidelity study: they are the
   application answering, so their words show at any fidelity. */
.dialog .hi,.toast.hi{display:block}
.dialog .chip .hi,.dialog .btnw .hi{display:inline}
[data-fi="high"] .lo{display:none}
[data-fi="high"] .pane{border-color:var(--line)}

/* inset card: the chrome sinks into a grey field and the work becomes one
   white card floating on it, the way a document-first app reads. The card
   is held by its own light edge and a soft drop, not by a hard border. */
.frame[data-shell="inset"]{background:var(--page-field);border-color:#eaeaec}
.frame[data-shell="inset"] .rail{background:none;border-right:0}
.frame[data-shell="inset"] .tabs{border-bottom:0}
.frame[data-shell="inset"] .body{padding:0 10px 10px}
.frame[data-shell="inset"] .work{background:var(--card);border:1px solid var(--line-2);border-radius:12px;
  gap:0;padding:0;overflow:hidden;box-shadow:0 1px 2px rgba(17,17,18,.04),0 10px 26px rgba(17,17,18,.045)}
.frame[data-shell="inset"] .pane{border:0;border-radius:0;background:none}
.frame[data-shell="inset"] .work > div > .pane,
.frame[data-shell="inset"] .work > .pane{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.frame[data-shell="inset"] .pane.sheet,.frame[data-shell="inset"] .pane.drawer{background:var(--card);
  border:1px solid rgba(17,17,18,.07);box-shadow:0 10px 26px rgba(17,17,18,.06)}

/* --------------------------------------------------------- black chrome
   The navigation goes black and the white card is the only lit surface, so
   the drawing gets all the attention. Green marks one thing: the view being
   read. The rail stays sober — where one came from is not the question. */
.frame[data-chrome="black"]{background:#141416;border-color:#141416;--vert:#C3E05A}
.frame[data-chrome="black"] .rail .ic,
.frame[data-chrome="black"] .rail .row,
.frame[data-chrome="black"] .rail .stk{color:rgba(255,255,255,.52)}
.frame[data-chrome="black"] .rail .ic:hover,
.frame[data-chrome="black"] .rail .row:hover,
.frame[data-chrome="black"] .rail .stk:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.frame[data-chrome="black"] .rail .ic.on,
.frame[data-chrome="black"] .rail .row.on,
.frame[data-chrome="black"] .rail .stk.on{background:rgba(255,255,255,.12);color:#fff}
.frame[data-chrome="black"] .rail .ic.on .cap{color:rgba(255,255,255,.72)}
.frame[data-chrome="black"] .tabs button{color:rgba(255,255,255,.72);font-size:13.5px}
.frame[data-chrome="black"] .tabs button:hover{background:rgba(255,255,255,.1);color:#fff}
/* The open view is white on black — the strongest mark the bar can make,
   and it costs no colour. Green is spent one row down on the level, so the
   two rows never argue over which one is the filter. */
.frame[data-chrome="black"] .tabs button[aria-current="true"]{background:#fff;color:#141416;font-weight:600}
.frame[data-chrome="black"] .tabs .crumb{color:rgba(255,255,255,.58)}
.frame[data-chrome="black"] .tabs .crumb.ech:hover{background:rgba(255,255,255,.1);color:#fff}
.frame[data-chrome="black"] .tabs .crumb.on{color:#fff;font-size:13px}
.frame[data-chrome="black"] .tabs .div,
.frame[data-chrome="black"] .tabs .sep{background:rgba(255,255,255,.16)}
/* The card is the same white card; only what holds it changes. */
.frame[data-chrome="black"][data-shell="inset"] .work{border-color:rgba(255,255,255,.1);
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35)}
.frame[data-chrome="black"] .rg::before{color:rgba(255,255,255,.45)}

/* High fidelity swaps the hatch for the drawing it stands for: the floor
   plan, the elevation, or the massing view, all from the platform assets. */
[data-fi="high"] .plan{background:none;border-style:solid}
[data-fi="high"] .plan[data-img]{background-repeat:no-repeat;background-position:center;
  background-size:cover;border-color:var(--line)}
[data-fi="high"] .plan[data-img] > .hi{display:none}
/* --plan is set on the frame from the level the tabs are on: one sheet per
   level, not one picture relabelled. */
[data-fi="high"] .plan[data-img="plan"]{background-image:var(--plan,none)}
/* Une vignette est recadrée sur une boîte mesurée sur l'étage type: elle lit
   donc toujours cette feuille-là, pas celle du niveau courant, sinon le
   cadrage tombe à côté de l'unité. */
[data-fi="high"] .plan[data-img="unit"]{background-image:url(assets/plan-niveau-5.jpg)}
[data-fi="high"] .plan[data-img="massing"]{background-image:url(assets/skp-ensemble.jpg)}
/* The opening schedules: the sheets a window or door size is read from,
   which is what the Ouvertures tab is about — not another floor plan. */
[data-fi="high"] .plan[data-img="openings"]{background-image:url(assets/ouvertures-fenetres.jpg);
  background-size:contain;background-color:#fff}
[data-fi="high"] .plan[data-img="doors"]{background-image:url(assets/ouvertures-portes.jpg);
  background-size:contain;background-color:#fff}

/* The consultants' sheets sit over the floor plan in one shared coordinate
   space: the plan box takes the drawing's own aspect, so the drawing fills
   it without being stretched and a percentage means the same thing on every
   layer. Every sheet keeps its own ink: the architect's colour carries
   meaning too — stationnement, parcours sans obstacle, pentes — so it is
   shown as it was plotted and not flattened to grey. */
.plan.align{aspect-ratio:2000 / 1675;height:auto;flex:0 0 auto;overflow:hidden}
[data-fi="high"] .plan.align[data-img]{background:none}
/* The architect's sheet is a drawing in the pile like the others, so its
   ink has to be able to pass in front of the surveyor's or sink behind
   it. Both the raster that holds the pane while the vectors run and the
   canvas that replaces it read the same two variables, written on .plan
   from the order and the opacity of that one drawing. */
[data-fi="high"] .plan.align[data-img="plan"]::before{content:"";position:absolute;inset:0;
  background:var(--plan,none) center/contain no-repeat;z-index:var(--planz,1);opacity:var(--planop,1);
  mix-blend-mode:multiply}
/* Vectors over the picture, not instead of it: a pass takes a few seconds
   on a permit sheet, and the pane must never be empty while it runs. The
   canvas is transparent until the sheet lands on it, then it covers the
   JPEG exactly, in the same box, so every overlay keeps its coordinates. */
.plan canvas.sheetpdf{position:absolute;inset:0;width:100%;height:100%;display:block;
  z-index:var(--planz,1);opacity:var(--planop,1);mix-blend-mode:multiply}
.plan canvas.sheetpdf[data-ready="1"]{background:#fff}
/* While the pass runs the pane says so in its own title bar, at the end of
   the row: the file strip that used to carry it is gone. It is a transient
   note, so it gives way before anything else — under a pane wide enough to
   hold it the row would wrap, and a wrapped title costs more than the note
   is worth. */
.pane[data-pdf="busy"] > .ph::after{content:"rendu vectoriel…"}
.pane[data-pdf="error"] > .ph::after{content:"PDF indisponible — aperçu image"}
.pane[data-pdf] > .ph::after{order:9;color:var(--ink-3);font-size:10.5px;
  white-space:nowrap;flex:0 0 auto}
@container (max-width:620px){ .pane[data-pdf] > .ph::after{display:none} }
/* Inline z-index from the pile's order; 1 to 7, under the typology fills
   and the unit outlines, which always stay on top of every drawing. */
/* A drawing on tracing paper darkens what is under it; it does not hide
   it. Multiplying is that: the white of each sheet drops out and only the
   ink stacks, so the order of the pile can put any discipline in front
   without blanking the rest. */
.plan .lay{position:absolute;display:none;background-repeat:no-repeat;
  background-size:contain;background-position:center;pointer-events:none;z-index:1;
  mix-blend-mode:multiply}
[data-fi="high"] .plan[data-img] .lay{display:block}
/* The surveyor's sheet is drawn the other way round from the floor plan:
   north is at the bottom on it and at the top on A-209, so it takes a half
   turn here. The landscaping sheet is already the same way up as A-209 and
   takes none — turning it put its courtyard where the building is. The
   files stay as they were extracted; the box each one is placed by is
   measured in the orientation it is displayed in. */
.plan .lay[data-lay="arp"]{background-image:url(assets/arp-site.webp);transform:rotate(180deg)}
.plan .lay[data-lay="pay"]{background-image:url(assets/paysage.webp)}
/* The vector sheet fills the same box as the picture it replaces. */
.plan .lay canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
/* The engineering layers are already cropped to the floor plan's own
   2000×1675 canvas, so they fill the box edge to edge rather than being
   scaled and centred the way the surveyor's differently-cropped sheet is. */
.plan .lay.eng{inset:0;background-size:100% 100%;mix-blend-mode:multiply}
.model-context-note{padding:6px 10px;font-size:11px;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
/* The engineering chips keep the row under the pane header; the three
   drawings moved out of it and into the strip. */
/* The floor's mix: one bar, one chip per type, the net area at the end. */
.fqmix{display:flex;flex-direction:column;gap:6px}
.fqmix .mixbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--fill-2)}
.fqmix .mixbar span{display:block;height:100%}
.fqmix .mixrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.fqmix .chip{padding:1px 8px 1px 6px;font-size:11px;white-space:nowrap;gap:5px}
.fqmix .chip .sw{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.fqmix .mixnet{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fqmix .mixnet b{color:var(--ink);font-weight:600}
.laychips{display:flex;gap:4px;margin-right:6px;flex:0 0 auto}
.laychips .chip{padding:1px 8px 1px 6px;font-size:11px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px}
.laychips .chip .lu{width:12px;height:12px;flex:0 0 12px}
.pane.drawing{container-type:inline-size}
.pane.bare{border:0;background:none;border-radius:0}
.pane.bare > .pb{padding:0}
@container (max-width:470px){
  .laychips .chip .lb{display:none}
  .laychips .chip{padding:2px 5px}
}

/* The pile ------------------------------------------------------------
   Which drawings are laid on the sheet, in what order, and how strongly:
   a strip of thumbnails down the outer edge of the 2D pane. A chip row
   could say which ones are on, but not which is in front of which, and
   the order is half the question. The strip is the pile, top to bottom,
   and it is reordered by dragging. */
.lstrip{flex:0 0 104px;padding:8px 7px;display:flex;flex-direction:column;gap:6px;
  background:var(--paper);border-left:1px solid var(--line-2);z-index:5;
  overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.lpile{display:flex;flex-direction:column;gap:4px}
.ltile{position:relative;border:1px solid transparent;border-radius:6px;padding:4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;user-select:none;
  transition:transform .17s cubic-bezier(.2,.7,.3,1),background .12s,box-shadow .17s;
  will-change:transform}
.ltile .wrap{position:relative;width:100%}
.ltile .pic{display:block;width:100%;aspect-ratio:1.18;border:1px solid var(--line-2);
  border-radius:4px;background:#fff center/contain no-repeat}
.ltile .nm{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink);text-align:center}
/* The dimming goes on the picture only, never on the tile and never on the
   name. On the tile, the badge fades with it — a mark meant to be the
   loudest thing in the strip goes invisible. On the name, the one word
   that says which drawing this is becomes unreadable, and an engineering
   sheet is a pale grid: its thumbnail alone names nothing. "Off" is said
   by the picture and the badge; the word stays a word. */
.ltile .pic{opacity:.45}
.ltile:hover{background:var(--fill-2)}
.ltile:hover .pic{opacity:.8}
.ltile.on .pic{opacity:1}
.ltile.on .nm{color:#2f3a05;font-weight:600}
/* The selected drawing is ink with its name reversed out: a grey wash is
   lost against the strip at this size. */
.ltile.sel{background:var(--ink);border-color:var(--ink)}
.ltile.sel .nm{color:#fff}
.ltile.sel .pic{border-color:var(--ink)}
/* Carried: no transition at all, or the tile lags behind the pointer. */
.ltile.held{transition:none;z-index:9;cursor:grabbing;background:var(--card);
  border-color:var(--line-2);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ltile.held .pic{border-color:var(--ink-3)}
/* Kept through the landing so the lift fades instead of blinking off. */
.ltile.landing{z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.18)}
body.ldrag,body.ldrag *{cursor:grabbing !important}

/* The badge: black with a + while the drawing is aside, green with its
   place in the pile once it is on the sheet. Two things to show means a
   pill — a 24 px circle cannot hold a drawing and a figure at once. */
.lbadge{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;gap:1px;cursor:pointer;z-index:3;
  background:var(--ink);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:background .12s,transform .12s}
.lbadge:hover{background:#000;transform:scale(1.08)}
.lbadge .lu{width:12px;height:12px}
.lbadge.on{width:auto;min-width:40px;border-radius:12px;padding:0 7px 0 2px;
  background:#c3e05a;color:#2f3a05;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.lbadge.on:hover{background:#b6d93f}
.lbadge svg.pb3{width:24px;height:24px;display:block;overflow:visible}
.lbadge .rk{font-size:12.5px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}

/* The card belongs to the thumbnail it is opened from, so it is measured
   to that tile's height rather than parked at a corner. */
.lcard{position:absolute;z-index:8;width:248px;padding:9px 10px;display:flex;
  flex-direction:column;gap:7px;font-size:11.5px;background:var(--card);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.lcard .hd{display:flex;align-items:baseline;gap:8px}
.lcard .hd b{font-size:12.5px;font-weight:600}
.lcard .hd .dt{margin-left:auto;color:var(--ink-3);font-size:10.5px;white-space:nowrap}
.lcard .hd .x{display:grid;place-items:center;width:20px;height:20px;margin:-3px -4px -3px 2px;
  border-radius:5px;color:var(--ink-3);cursor:pointer}
.lcard .hd .x:hover{background:var(--fill);color:var(--ink)}
.lcard .hd .x svg{width:14px;height:14px}
.lcard .fn{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink-2);
  word-break:break-all}
.lcard .docbtn{display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;
  border:1px solid var(--line-2);border-radius:5px;padding:4px 8px;font-size:11.5px}
.lcard .docbtn:hover{border-color:var(--ink)}
.lcard .docbtn .lu{width:13px;height:13px}
.lmenu{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:5px;
  overflow:hidden}
.lmenu .mi{padding:5px 8px;cursor:pointer}
.lmenu .mi:hover{background:var(--fill-2)}
.lmenu .mi + .mi{border-top:1px solid var(--line-2)}
/* The export menu hangs off the table's header, right-aligned to the
   button that opens it so it never leaves the pane. */
.expwrap{position:relative;display:inline-flex}
.btnw.sm{padding:3px 7px;font-size:11.5px;gap:4px}
.btnw.sm svg{width:13px;height:13px}
.btnw.sm.on{border-color:var(--ink);background:var(--fill)}
.expmenu{position:absolute;right:0;top:calc(100% + 5px);z-index:12;display:flex;flex-direction:column;
  min-width:186px;background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden;
  font-size:12px;font-weight:400;box-shadow:0 10px 24px rgba(17,17,18,.18)}
.expmenu .mi{padding:7px 10px;cursor:pointer;white-space:nowrap}
.expmenu .mi:hover{background:var(--fill-2)}
.expmenu .mi + .mi{border-top:1px solid var(--line-2)}
/* One opacity control, named, with a knob: a bar that only fills reads as
   progress, a knob reads as something to take hold of. */
.oprow{display:flex;align-items:center;gap:8px}
.oplbl{display:flex;align-items:center;gap:5px;color:var(--ink-2);white-space:nowrap}
.oplbl .lu{width:13px;height:13px}
.optrack{position:relative;flex:1;height:14px;display:flex;align-items:center;cursor:pointer}
.optrack::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;
  background:var(--line-2)}
.optrack .fill{position:absolute;left:0;height:3px;border-radius:2px;background:var(--ink)}
.optrack .knob{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--card);
  border:1.5px solid var(--ink);transform:translateX(-50%);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.opval{min-width:32px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* North and the corner view stand clear of the strip, not under it. */
.zone[data-zone="plan"] .north,.zone[data-zone="plan"] .mini{right:154px}
/* One typology, one colour, laid on the unit it belongs to. */
.plan .utagsvg{position:absolute;inset:0;width:100%;height:100%;z-index:14;pointer-events:none;overflow:visible}
.plan .utagsvg polygon{opacity:.45;mix-blend-mode:multiply}
/* The 2D pane is a window onto a sheet that is larger than it: the drawing
   and everything laid over it move and scale together inside .vp, so a
   percentage keeps meaning the same thing at every zoom. */
/* Same box as the model pane beside it: the field is the pane, the drawing
   is centred in it, and neither drawing states an edge of its own. The
   field is the sheet's own white — the paper of these plans is #fff — so
   the drawing has no visible edge and the pane reads as one surface. */
.vp{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;background:#fff}
.vp.drag{cursor:grabbing}

/* The zoom is a fixture, not a hint: a flat opaque column against the outer
   edge of the pane, in the flow, so it takes its own 40 px and never covers
   a line of the drawing. Nothing about it fades. */
.pb.zone{position:relative}
.zcol{flex:0 0 40px;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:7px 0;background:var(--paper);border-left:1px solid var(--line-2);z-index:4}
.zslider{appearance:slider-vertical;-webkit-appearance:slider-vertical;writing-mode:vertical-lr;
  direction:rtl;width:18px;flex:1;min-height:50px;accent-color:var(--ink);cursor:ns-resize;margin:0}
.zread{font-size:10.5px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:center}
.zb{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);cursor:pointer;flex:0 0 26px}
.zb:hover{background:var(--fill);color:var(--ink)}
.zb svg{width:14px;height:14px}
.mtools{position:absolute;left:10px;top:10px;z-index:7;display:flex;gap:4px;padding:4px;
  background:#fff;border:1px solid var(--line);border-radius:12px}
.mtools .zb{width:52px;height:52px;flex:0 0 52px;border-radius:8px;color:var(--ink-3)}
.mtools .zb svg{width:28px;height:28px}
/* The tool in use is the one solid thing in the corner. */
.mtools .zb.on,.mtools .zb.on:hover{background:#111;color:#fff}
[data-fi="low"] .mtools{display:none}
/* The corner view, beside the column, never under it: the whole drawing at
   a glance and the rectangle of what is on screen. Flat, framed, opaque. */
.mini{position:absolute;right:50px;bottom:10px;z-index:5;width:132px;background:var(--paper);
  border:1px solid var(--line);user-select:none}
.mini .mi{position:relative;display:block;cursor:crosshair;overflow:hidden}
.mini img{display:block;width:100%;filter:contrast(.72);opacity:.85}
.mini .mrect{position:absolute;border:1.5px solid var(--ink);background:rgba(17,17,18,.08)}
[data-fi="low"] .mini{display:none}
/* The model's corner view is a live render, not a picture: it keeps the
   building's proportions and is never greyed, because the marker inside it
   is the only thing that has to stand out. */
.mini canvas[data-mini3d]{display:block;width:100%;height:84px;background:var(--fill-2)}
.mini[data-mini="model"] .mi{cursor:default}
/* North, top right of the drawing: a ring, a needle, a letter. Nothing but
   line work, so it reads over a white sheet and over a grey render alike. */
.north{position:absolute;right:50px;top:10px;z-index:5;width:34px;height:50px;
  pointer-events:none;overflow:visible}
.north circle{fill:#fff;stroke:var(--ink);stroke-width:1.7}
.north polygon{fill:none;stroke:var(--ink);stroke-width:1.7}
.north line{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}

/* ---------------------------------------------------------- the margin
   Notes live beside the drawings, never on top of them: the margin takes
   its own column. A studio note is a different object from a shared pin —
   square, slate, dashed, locked — so nobody has to read a legend to tell
   them apart, and nothing is tinted to mean private. */
.pane.margin .pb{gap:8px;overflow:auto}
.nscope{gap:5px;align-items:center}
.ncard{position:relative;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);
  padding:7px 9px;cursor:pointer}
.ncard:hover{background:var(--fill-2)}
.ncard.on{border-color:var(--ink)}
.ncard.team{background:#eef2f4;border-color:#c6d4dc;border-style:dashed}
.ncard.team.on{border-color:#2f4858}
.ncard .tie{position:absolute;left:-9px;top:14px;width:8px;height:1px;background:var(--line)}
.ncard .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.ncard .who b{color:var(--ink);font-size:12px;font-weight:600}
.ncard .who .when{margin-left:auto;color:var(--ink-3);font-size:11px}
.ncard .txt{margin-top:3px;font-size:12.5px}
.ncard .anch{margin-top:5px;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-3);
  font-family:var(--mono)}
.ncard.team .anch{color:#2f4858}
.ncard .nact{margin-top:7px;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.ncard.new{border-color:var(--ink);cursor:default}
.ncard .nnew{width:100%;margin-top:5px;border:1px solid var(--line-2);border-radius:6px;padding:5px 7px;
  font:inherit;font-size:12.5px;color:var(--ink);background:#fff;resize:none}

/* The pin itself. On the sheet it lives inside the transformed drawing and
   is scaled back down so it stays a pin instead of growing into a sign;
   over the model the viewer places it in pixels. The box has no size: the
   dot and the label hang off it, so the anchor stays exactly on the point
   whatever the label says. */
.npin{position:absolute;width:0;height:0;transform-origin:0 100%;cursor:pointer;z-index:16}
.npins{position:absolute;inset:0;z-index:16;pointer-events:none}
.npins .npin{pointer-events:auto}
.npin .nd{position:absolute;left:-11px;bottom:1px;width:22px;height:22px;border-radius:50% 50% 50% 2px;
  transform:rotate(-45deg);background:#c3e05a;color:#2f3a05;border:1.5px solid #2f3a05;display:grid;
  place-items:center;font-size:11px;font-weight:700;
  /* A white ring, because a pin sits on a drawing made of thin black lines
     and nothing else on the sheet carries one. */
  box-shadow:0 0 0 2px #fff,0 2px 5px rgba(17,17,18,.28)}
.npin .nd > svg{transform:rotate(45deg);width:11px;height:11px}
/* An internal note is still a pin: same green drop, same number, dashed
   outline. The lock that used to sit here read as a locked drawing rather
   than a note kept inside the office, and it broke the one shape the eye
   learns to look for on a sheet. */
.npin.team .nd{border-style:dashed}
.npin.on .nd{background:var(--ink);color:#fff;border-color:var(--ink);border-style:solid}
.npin.pending .nd{background:#fff;border-style:dashed}
.npin .nl{position:absolute;left:15px;top:-13px;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:2px 7px;font-size:10.5px;color:var(--ink);white-space:nowrap;max-width:190px;
  overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(17,17,18,.16)}
.npin:hover .nl{border-color:var(--ink-2)}
.npin.on .nl{background:var(--ink);color:#fff;border-color:var(--ink)}
.npin.team .nl{border-style:dashed}
/* The sentence is typed on the drawing, hung off the pin that anchors it. */
.pbub{position:absolute;left:0;top:0;width:258px;background:var(--card);border:1px solid var(--ink);
  border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:default;
  box-shadow:0 10px 26px rgba(17,17,18,.22);z-index:12}
.pbub .zone{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
/* Two scope chips and a zone name on one line: the chips never wrap, so
   "À l'interne" stays a phrase rather than two stacked words. */
.pbub{width:286px}
.pbub .chip{white-space:nowrap}
.pbub .nnew{width:100%;border:1px solid var(--line-2);border-radius:6px;padding:6px 7px;font:inherit;
  font-size:12.5px;color:var(--ink);background:#fff;resize:none}
.pbub .nnew:focus{outline:1px solid var(--ink);outline-offset:1px}
.pbub .kb{font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}

.npin.back{opacity:.32}
/* Pin mode: the next click on either drawing puts a point down, and both
   panes say so with the cursor. */
[data-pin="on"] .zone{cursor:crosshair}
[data-fi="low"] .npin,[data-fi="low"] .ncard .anch{display:none}
.north text{fill:var(--ink);font-size:17px;font-weight:500;text-anchor:middle}
[data-fi="low"] .north{display:none}
/* The three axes as the camera sees them, in the corner the drawing never
   uses. Red X, green Y, blue Z — the convention every host application the
   file passes through already draws. */
.axes{position:absolute;left:10px;bottom:10px;z-index:5;width:62px;height:62px;
  pointer-events:none}
.axes line{stroke-width:1.8;stroke-linecap:round}
.axes line[data-ax="x"]{stroke:#d24b3e}
.axes line[data-ax="y"]{stroke:#4f9b45}
.axes line[data-ax="z"]{stroke:#3a6fb0}
.axes text{font-family:var(--mono);font-size:7px;text-anchor:middle;dominant-baseline:middle}
.axes text[data-axt="x"]{fill:#d24b3e}
.axes text[data-axt="y"]{fill:#4f9b45}
.axes text[data-axt="z"]{fill:#3a6fb0}
.axes circle{fill:var(--ink-3)}
[data-fi="low"] .axes{display:none}
/* The two drawing panes are the thing being compared, so their edge is
   stated instead of implied — including in the inset shell, where panes
   otherwise give up their border to the grid lines. No shadow under them:
   a soft edge spreading into the gap hides the one place the pointer has
   to land to move that edge. The border alone says where the pane stops. */
.pane.drawing{border:1px solid #b4b4b7;border-radius:9px}
.frame[data-shell="inset"] .pane.drawing{border:1px solid #b4b4b7;border-radius:9px;background:#fff}
.frame[data-chrome="black"] .pane.drawing{border-color:rgba(255,255,255,.22)}
/* The sheet's own box is sized in script to fit this one, so 0–1 on the
   drawing stays 0–1 on the element the overlays are drawn in. */
.vp > .plan{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
  border:0;background-color:#fff}
/* The selected unit, drawn over the sheet and never into it: a thin outline
   and a light wash, both in the one accent the screen already uses. */
/* Above every drawing in the pile, whatever its order: the outlines are
   read against the sheet, not filed into it. */
.umark{position:absolute;inset:0;width:100%;height:100%;z-index:15;overflow:visible}
.umark polygon.hit{fill:transparent;pointer-events:auto;cursor:pointer}
/* The sheet answers the pointer the way the model does: the unit under it
   lights before any click, so a plan can be read by sweeping it. Lighter
   than the selection, which must stay the one unit that is chosen. */
.umark polygon.hit:hover{fill:rgba(139,160,15,.10);stroke:#8ba00f;vector-effect:non-scaling-stroke}
.vp.drag .umark polygon.hit:hover{fill:transparent;stroke:none}
.umark polygon.on{fill:rgba(139,160,15,.16);stroke:#8ba00f;stroke-width:1.6;
  vector-effect:non-scaling-stroke;pointer-events:auto;cursor:pointer}
/* The unit's number, over its outline: on hover, and kept on the selected
   unit after the click. Drawn on the viewport, not on the sheet: inside the
   scaled sheet a 12 px label became a 2 px one magnified six times — soft,
   and its padding rounded off-centre. Placed in whole screen pixels in
   script, above the sheet and its note pins; the viewport is isolated so
   the north arrow and the minimap still sit over it. */
.vp{isolation:isolate}
.uhover{position:absolute;left:0;top:0;z-index:8;pointer-events:none;
  display:flex;align-items:center;justify-content:center;height:22px;padding:0 8px;box-sizing:border-box;
  background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;
  font-size:12px;font-weight:600;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;
  box-shadow:0 1px 3px rgba(17,17,18,.14)}
.uhover[data-pill="sel"]{border:1.5px solid #8ba00f}
.uhover[hidden]{display:none}
[data-fi="low"] .uhover{display:none}
.vp.drag .uhover[data-pill="hover"]{display:none}
/* The live SketchUp export fills its pane. The previous facade JPG stays
   behind it only while the 58 MB GLB loads, or if WebGL cannot start. */
/* No border of its own: the pane around it now states the edge, and two
   boxes one inside the other state it twice. */
.model3d{position:relative;flex:1;min-height:0;overflow:hidden;
  background:#f1f3f4 url(assets/skp-facade.jpg) center/contain no-repeat}
.model3d-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
  opacity:0;touch-action:none;transition:opacity .18s ease}
.model3d[data-state="ready"]{background:#f1f3f4}
.model3d[data-state="ready"] .model3d-canvas{opacity:1}
.model3d-status{position:absolute;left:50%;bottom:12px;z-index:2;transform:translateX(-50%);
  border:1px solid rgba(17,17,18,.12);border-radius:999px;background:rgba(255,255,255,.9);
  padding:5px 9px;color:var(--ink-2);font-size:11px;white-space:nowrap;backdrop-filter:blur(8px)}
.model3d[data-state="ready"] .model3d-status{visibility:hidden;opacity:0}
.model3d[data-state="error"] .model3d-status{color:#8b2e2e;border-color:rgba(139,46,46,.25)}
/* What a click on the model would select, named the way the plan tags a
   unit: a white tag over the unit's glazing, or "Toiture" at the pointer. */
.mpill{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,calc(-100% - 6px));
  background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:2px 8px;font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.mpill[hidden]{display:none}
/* The same tag as on the sheet: white, with the selection's green as its
   edge. Filling it green made it a second kind of object on a facade that
   is already tinted green where the unit is. */
.mpill.sel{background:#fff;color:var(--ink);border:1.5px solid #8ba00f;
  box-shadow:0 1px 3px rgba(17,17,18,.14)}
/* No instructions and no running commentary laid over the model: the pane
   says what it is through the header, the corner view and the axes, and the
   selected unit is already named in the header and the inspector. Only the
   loading and error line remains, and it hides itself once ready. */
[data-fi="low"] .model3d-canvas,[data-fi="low"] .model3d-status{display:none}
[data-fi="high"] .btnw.solid{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
/* Ready to be saved: the project's green, the same one the selected level
   wears, so the one colour means "this is live" everywhere. */
[data-fi="high"] .btnw.solid.go{background:#8ba00f;border-color:#8ba00f;color:#fff}
[data-fi="high"] .listrow.on{background:#eef1e0}
[data-fi="high"] .listrow .dot{background:#8ba00f}

/* ------------------------------------------------- dark mode, exceptions
   Everything else turns over through the tokens. These do not: the model's
   field is a studio backdrop, the three labels over it are white films,
   and the selected row is a wash of the office green. The drawing's paper
   is deliberately not in this list. */
[data-theme="dark"] .model3d,
[data-theme="dark"] .model3d[data-state="ready"]{background:#1b1b1f}
[data-theme="dark"] .model3d-status{background:rgba(18,18,21,.84);
  border-color:rgba(255,255,255,.14)}
[data-theme="dark"] [data-fi="high"] .listrow.on{background:#2b3313}
[data-theme="dark"] .scrim{background:rgba(0,0,0,.55)}

/* region tagging ------------------------------------------------------ */
.rg{position:relative}
[data-labels="true"] .rg{outline:1px dashed #b9b9ff;outline-offset:-1px}
[data-labels="true"] .pane.rg,[data-labels="true"] .rail.rg,[data-labels="true"] .tabs.rg{padding-top:14px}  /* room for the tag */
[data-labels="true"] .rg::after{content:attr(data-rg);position:absolute;top:0;left:0;z-index:4;
  background:#4b4bd6;color:#fff;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 5px;border-bottom-right-radius:4px;pointer-events:none}
[data-isolate]:not([data-isolate="none"]) .rg{opacity:.12;filter:grayscale(1)}
[data-isolate]:not([data-isolate="none"]) .rg.solo{opacity:1;filter:none;outline:1px solid #4b4bd6}
.step{position:absolute;z-index:5;width:19px;height:19px;border-radius:50%;background:var(--hi);
  color:var(--on-hi);font-size:11px;display:none;place-items:center;top:6px;right:6px}
[data-journey="true"] .step{display:grid}

/* journey strip ------------------------------------------------------- */
.journey{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px 14px}
.journey h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .st{flex:1;min-width:150px;border:1px solid var(--line-2);border-radius:6px;padding:9px 10px;margin-right:18px;position:relative}
.flow .st:last-child{margin-right:0}
.flow .st::after{content:"";position:absolute;right:-13px;top:50%;width:8px;height:8px;
  border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.flow .st:last-child::after{display:none}
.flow .st.on{border-color:var(--hi)}
.flow .st b{display:block;font-size:12.5px;font-weight:600}
.flow .st span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.flow .st em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:4px;
  letter-spacing:.06em;text-transform:uppercase}
.flow .st .num{position:absolute;top:-8px;left:9px;width:17px;height:17px;border-radius:50%;
  background:var(--hi);color:var(--on-hi);font-size:10.5px;display:grid;place-items:center}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;background:var(--bar);display:inline-block}
.legend i.dash{background:none;border:1px dashed #b9b9ff}
/* --------------------------------------------------- the pane dividers
   The edge between two panes is a thing you can take hold of. At rest it
   is empty space the width of the gap, so the layout looks the same as
   before; under the pointer a hairline appears where the edge will move,
   and the little chevron folds the pane away entirely. Folding is how a
   drawing gets the whole window without a mode. */
/* The handle stands in for the column gap, so the panes sit exactly where
   they sat before it existed; it reaches a few pixels into each pane so
   there is something to catch. */
.work{column-gap:0}
.gut{position:relative;align-self:stretch;flex:0 0 var(--gap);width:var(--gap);cursor:col-resize;
  margin:0 -3px;z-index:3;display:flex;align-items:center;justify-content:center}
/* A hairline sits in the gap at rest — faint, but enough that the edge is
   a visible thing to take hold of rather than a strip of nothing — and
   goes to full ink under the pointer and while it is being dragged. */
.gut::before{content:"";position:absolute;top:6px;bottom:6px;left:50%;margin-left:-1px;width:2px;
  border-radius:1px;background:var(--line-2);transition:background .12s}
.gut:hover::before,body.splitting .gut.live::before{background:var(--ink)}
/* Between the two drawings the strip carries a full-height rule instead of
   a short hairline. Two plans side by side are two readings of the same
   building, and the eye needs to be told where one stops: the panes' own
   pale borders are not enough across that much white. */
.gut[data-gut="plan"]::before{top:0;bottom:0;width:1px;margin-left:0;background:var(--line)}
.gut[data-gut="plan"]:hover::before{width:2px;margin-left:-1px}
.gut.fold{cursor:default}
/* The tab is the whole control once a pane is folded, so it is sized to be
   seen from across the screen and hit without aiming: a 24 × 54 bar in
   solid ink with a white chevron. A pale tab was lost against the drawing
   on one side and the black rail on the other; ink with a light ring reads
   on both. */
.gut .gfold{position:relative;z-index:2;width:24px;height:54px;border-radius:7px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:var(--ink);
  border:0;box-shadow:0 0 0 1.5px var(--card);color:#fff;opacity:0;transition:opacity .12s}
.gut:hover .gfold,.gut.fold .gfold{opacity:1}
.gut .gfold:hover{background:#000}
.gut .gfold .lu{width:17px;height:17px;stroke-width:2.6}
/* Folded, the tab stops being a chevron and becomes a label, so a folded
   pane says what it is instead of asking to be opened to find out. The
   label is read on one line, white on black, and the tab sits above every
   pane and tool strip: written sideways or in grey it was not read, and the
   layer strip's buttons covered it. It is wider than the strip it lives in
   and lies over the drawing next to it; that drawing is still there. */
.gut.fold{z-index:60}
.gut.fold .gfold{width:auto;height:34px;padding:0 12px 0 9px;flex:0 0 auto;flex-direction:row;gap:6px;
  white-space:nowrap;user-select:none;background:var(--ink);color:#fff;border:0;
  box-shadow:0 0 0 1.5px var(--card)}
.gut.fold .gfold:hover{background:#000}
.gut.fold .gfold .lu{width:15px;height:15px}
.gut.fold .gname{font-size:13px;font-weight:600;line-height:1}
.gut.fold.fold-s{align-items:flex-start}
.gut.fold.fold-s .gfold{margin-left:5px}
.gut.fold.fold-e{align-items:flex-end}
.gut.fold.fold-e .gfold{margin-right:5px}
/* With the drawing and the notes both folded, two tabs land on the same
   edge at the same height. The drawing's tab sits one row lower. */
.gut.fold[data-gut="plan"] .gfold{transform:translateY(44px)}
/* Two tabs on one edge sit one above the other, not side by side: the
   strip is ten pixels wide and they would overlap the drawings. */
.gut .gfold + .gfold{margin-top:6px}
.gut{flex-direction:column}
/* While an edge is being dragged every cursor on the screen is the drag
   cursor: the pointer is on a 2 px line and will leave it. */
body.splitting,body.splitting *{cursor:col-resize !important;user-select:none}
svg.lu{width:14px;height:14px;stroke-width:1.8;color:currentColor}
</style>
</head>
<body>
<div class="stage">
  <div id="frame"></div>
</div>

<script src="vendor/lucide/lucide.min.js"></script>
<script src="vendor/dialkit/browser.global.js"></script>
<script src="assets/engineering/sheets.js"></script>
<script src="wireframe-c3-circulation.js"></script>
<script>
/* ---------------------------------------------------------------- state */

const V = {
  screen: "Unités",
  fidelity: "low",
  labels: true,
  journey: true,
  density: "comfortable",
  shell: "Inset card",
  chrome: "Black",
  homeLayout: "Card grid",
  isolate: "none",
  /* Where each movable edge sits, and which panes are folded away. Keyed
     by screen and edge name, so widening the unit list on Unités does not
     move the calendar on Échéancier. Empty means the designed width. */
  split: {},
  fold: {},
  /* One glyph per screen, written by the panel. Keyed by the French screen
     name, filled from NAV_ICONS which is declared further down the file. */
  icons: {},

  /* Everything below is what the screen is actually doing, as opposed to how
     it is drawn: which view, which row, which article, what has been decided.
     Every control on the screen writes one of these. */
  project: "Le Baldwin III",
  view: {},          // screen → index of the view in its tab strip
  sel: {},           // screen → index of the selected row
  article: 2,        // which article is open under Zonage et code
  /* Codes: which provision is open, which one is being annotated, and the
     notes written against each — nothing is ever written to a drawing. */
  articleId: "3.3.1.9",
  /* "id|rang" while one note is being rewritten; the composer stands down
     meanwhile, so there is never a second empty box asking for the same
     thing. */
  noteEdit: null,
  /* Writing happens here, not in a mail client: the address the office
     signs with is saved once, and every message sent stays attached to the
     person it was sent to. */
  mailFrom: "atelier@bureau-architectes.ca",
  mails: {},
  notes: {
    "3.3.1.18": [{ who: "Chargée de projet", when: "24 oct", txt: "Le garde-corps est dessiné à 1 020 mm sur l'élévation sud. À reprendre avant le dépôt." }],
    "art. 71": [{ who: "Entrepreneur général", when: "22 oct", txt: "Vérifier la réduction pour proximité du métro avant de recompter les cases." }],
  },
  /* The office's own reading of each provision — the one judgement a code
     screen can honestly carry, since nobody outside the firm decides how
     hard a sentence is to interpret. Seeded with what the studio already
     thinks; changed with a click on the row. */
  clarity: { "art. 9": "moyen", "3.2.3.1": "obscur", "A-19.1": "obscur", "art. 71": "obscur",
    "art. 134": "moyen", "art. 43": "clair", "art. 22": "moyen", "3.3.1.9": "clair",
    "3.4.2.1": "clair", "3.3.1.18": "clair", "3.8.1.3": "moyen", "3.2.1.1": "obscur" },
  clarityOn: null,
  /* Échéancier: the day the calendar is centred on, the scale it is drawn
     at — chosen on the calendar itself — and which task is open. */
  day: "2026-11-14",
  scale: "Mois",
  task: null,
  /* Which task's editor is open — a task id, or "new" for the composer —
     and the draft that composer writes into before the task exists. The
     archive is folded until it is asked for. */
  taskEdit: null,
  taskDraft: { title: "", day: "2026-11-14", prio: "moyenne", phase: "Permis", who: [] },
  taskArch: false,
  /* What the screen is counting. "Niveau" is one floor: the unit list, the
     two drawings and the right column. "Bâtiment" is all eight: the work
     area becomes the four quantity tables, and the level strip is dimmed
