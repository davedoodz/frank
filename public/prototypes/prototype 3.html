/* Hovering a drawing's thumbnail shows its card for as long as the pointer
   is on the thumbnail or on the card. A click — on the thumbnail, or
   anywhere in the card — is what keeps it. A card that was asked for is
   never taken away by the pointer passing over a neighbour: the hovered
   card is drawn beside the kept one, not in its place. The peek is written
   straight into the pane, not through render(): a full redraw per hover
   would rebuild the sheet and every thumbnail. */
let layPeek = null;       // the card on loan, while hovered
let layPeekTimer = 0;     // the grace for crossing from thumbnail to card
const keepLayPeek = () => { clearTimeout(layPeekTimer); layPeekTimer = 0; };
function showLayPeek(k) {
  keepLayPeek();
  if (layPeek?.isConnected && layPeek.dataset.anchor === k) return;
  clearLayPeek();
  const strip = document.querySelector("[data-lstrip]");
  if (!strip) return;
  const host = strip.parentElement;
  host.insertAdjacentHTML("beforeend", layCardHTML(k));
  layPeek = host.querySelector(":scope > [data-lcard][data-peek]");
  placeLayCard();
}
function clearLayPeek() {
  keepLayPeek();
  layPeek?.remove();
  layPeek = null;
  placeLayCard();
}
/* The card lives under the pointer: a thumbnail shows it, the card itself
   keeps it, and leaving both lets it go — the borrowed one and the one
   being used alike. Nothing is left open on the drawing after a click. */
function dropLayCard() {
  if (!V.layCard) return;
  V.layCard = false;
  V.layHist = false;
  document.querySelectorAll("[data-lcard]:not([data-peek])").forEach((el) => el.remove());
  placeLayCard();
}
document.addEventListener("pointerover", (e) => {
  if (e.pointerType === "touch" || document.body.classList.contains("dragging")) return;
  const tile = e.target.closest?.("[data-ltile]");
  if (tile) {
    const k = tile.dataset.ltile;
    keepLayPeek();
    // The card in use is already this one: nothing to lend.
    if (V.layCard && V.layPick === k) { clearLayPeek(); return; }
    dropLayCard();
    showLayPeek(k);
    return;
  }
  if (e.target.closest?.("[data-lcard]")) { keepLayPeek(); return; }
  /* The pointer crosses a few pixels of sheet between thumbnail and card;
     a held button (the opacity slider) keeps the card until it is let go. */
  if ((layPeek || V.layCard) && !layPeekTimer && !e.buttons)
    layPeekTimer = setTimeout(() => { layPeekTimer = 0; clearLayPeek(); dropLayCard(); }, 160);
});
/* Touching the borrowed card keeps it: it becomes the pinned card, and the
   one it stood in for is let go. The action under the pointer then runs on
   the card as it now is. */
document.addEventListener("pointerdown", (e) => {
  const card = e.target.closest?.("[data-lcard][data-peek]");
  if (!card) return;
  V.layPick = card.dataset.anchor;
  V.layCard = true;
  V.layHist = false;
  /* The borrowed card becomes the kept one, and the card it was shown
     beside gives way: one kept card at a time. */
  card.parentElement.querySelectorAll(":scope > [data-lcard]:not([data-peek])").forEach((el) => el.remove());
  card.removeAttribute("data-peek");
  layPeek = null;
  placeLayCard();
}, true);

/* ------------------------------------------------- opening another file
   A drawing set or a model is tens or hundreds of megabytes: opening it
   takes a moment, and the pane says so before it shows the new file. One
   load per pane is kept in LOADS, outside the DOM, because the plan's pane
   is rebuilt by every render: resumeLoads() hangs the overlay back on at
   the progress reached. The bar never runs at an even speed — it jumps
   while the header is read, waits on the geometry, then finishes. */
const LOADS = {};
const LOAD_STEPS = [[0, 0], [.18, .31], [.4, .55], [.62, .61], [.84, .9], [1, 1]];
/* How long each style takes to let go once the file is read, in ms. */
const REVEAL_MS = {
  "Dim + top bar": 350, "Veil + spinner": 420, "Status pill": 300, "Paced plotter": 1250, "Raster bands": 1000,
  "Tiles": 900, "Blur to sharp": 700, "Title block first": 520, "Paced side wipe": 1000, "Progress ring": 380,
  "Untextured first": 900, "Silhouette": 900, "Fade through paper": 600, "Rise up": 1100, "Settle in": 600,
};
const loadHost = (kind) => kind === "plan"
  ? document.querySelector('[data-zone="plan"] .vp')
  : document.querySelector("[data-building-model]");
const progressAt = (t) => {
  for (let i = 1; i < LOAD_STEPS.length; i++) {
    const [t1, p1] = LOAD_STEPS[i], [t0, p0] = LOAD_STEPS[i - 1];
    if (t <= t1) return p0 + (p1 - p0) * ((t - t0) / (t1 - t0));
  }
  return 1;
};
function hangLoad(kind) {
  const L = LOADS[kind], host = loadHost(kind);
  if (!L || !host) return null;
  let fx = host.querySelector(":scope > .ldfx");
  if (!fx) {
    fx = document.createElement("div");
    fx.className = "ldfx";
    fx.innerHTML = `<span class="lpaper"></span><span class="ltiles">${L.tiles.map((d) => `<i style="--d:${d}"></i>`).join("")}</span>
      <span class="lblock"><span><b>${L.file}</b>Lecture du fichier… <em class="lpct">0 %</em></span></span>
      <span class="lmid">${kind === "plan" ? "Ouverture du dessin…" : "Ouverture de la maquette…"}<i></i><span class="lf">${L.file}</span></span>
      <i class="lbar"></i><span class="lpill"><i class="lspin"></i><span class="lf">${L.file}</span><b class="lpct">0 %</b></span>
      <span class="lring"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22"/><circle class="arc" cx="26" cy="26" r="22" pathLength="100"/></svg><b class="lpct">0 %</b></span>
      <i class="lline"></i>`;
    host.append(fx);
  }
  fx.dataset.ld = L.style;
  host.dataset.ldst = L.style;
  host.style.setProperty("--rv", `${L.reveal}ms`);
  fx.style.setProperty("--rv", `${L.reveal}ms`);
  fx.classList.toggle("rv", L.phase === "reveal");
  host.classList.toggle("rv", L.phase === "reveal");
  return fx;
}
function endLoad(kind) {
  const host = loadHost(kind);
  host?.querySelector(":scope > .ldfx")?.remove();
  if (host) { delete host.dataset.ldst; host.classList.remove("rv"); host.style.removeProperty("--rv"); }
  delete LOADS[kind];
}
function startLoad(kind, style, file) {
  if (LOADS[kind]) endLoad(kind);
  if (!style || style === "Instant") return;
  const secs = kind === "plan" ? V.planLoad : V.modelLoad;
  const L = LOADS[kind] = {
    style, file, phase: "load", t0: performance.now(),
    load: secs * 1000 * (.88 + Math.random() * .24), reveal: REVEAL_MS[style] || 400,
    tiles: Array.from({ length: 24 }, () => Math.random().toFixed(2)),
  };
  hangLoad(kind);
  const tick = (now) => {
    if (LOADS[kind] !== L) return;
    const t = Math.min(1, (now - L.t0) / L.load);
    const fx = hangLoad(kind);
    if (fx) {
      const pr = progressAt(t);
      fx.style.setProperty("--p", pr.toFixed(3));
      const txt = `${Math.round(pr * 100)} %`;
      fx.querySelectorAll(".lpct").forEach((n) => { if (n.textContent !== txt) n.textContent = txt; });
    }
    if (t < 1) { requestAnimationFrame(tick); return; }
    L.phase = "reveal";
    hangLoad(kind);
    setTimeout(() => { if (LOADS[kind] === L) endLoad(kind); }, L.reveal + 60);
  };
  requestAnimationFrame(tick);
}
/* After a render the plan's window is new: put its load back on. */
function resumeLoads() { Object.keys(LOADS).forEach(hangLoad); }
/* The plan's swap: whichever drawing changed, the window reads it. */
function swapFx(k) { startLoad("plan", V.planSwap, layDoc(k).file); }

/* ------------------------------------------------------- the conflicts
   A consultant's sheet laid over the architecture is read for one thing:
   where the two disagree. Those places are marked on the drawing itself —
   not in a list beside it — because the answer to "is this a problem" is
   the drawing underneath the mark. A mark only exists while the sheet that
   reveals it is on the pile. */
const layConflicts = () => {
  const lv = paneLevel();
  return CROSSINGS.filter((c) => c[4] === lv && c[6] && V.lay[c[6]].on && !c[5]);
};

/* Placed from the unit's own contour, so a mark stays on its room at any
   zoom and survives a sheet being re-exported larger. */
function conflictPoint(c) {
  const row = (UNITS_BY_LEVEL[levelView(c[4])] || []).find((r) => r[0].startsWith(c[3]));
  const poly = row && contoursFor(c[4])[row[2]];
  if (!poly) return null;
  const [x, y, w, h] = polyBounds(poly);
  return [x + w / 2, y + h / 2];
}

const taskForConflict = (code) => TASKS.find((t) => t.src === code);

/* The clock is real; the calendar is the project's. A stamp that said
   "29 oct" against a file dated 14 nov would be read as an error. */
const stampNow = () => {
  const d = new Date();
  return `${fmtDay(TODAY)} à ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};

function conflictMarkHTML() {
  const list = layConflicts();
  if (!list.length) return "";
  return list.map((c) => {
    const pt = conflictPoint(c);
    if (!pt) return "";
    const t = taskForConflict(c[0]);
    return `<span class="xmark ${t ? "has" : ""}" data-xmark="${c[0]}" ${act("xopen", c[0])}
      style="left:${(pt[0] * 100).toFixed(2)}%;top:${(pt[1] * 100).toFixed(2)}%"
      title="${c[0]} — ${c[1]}">${icon(t ? "check" : "alert-triangle")}<b>${c[3]}</b></span>`;
  }).join("");
}

/* Deadlines are offered the way they are said out loud, and the date field
   stays for the day that has none of these names. */
const dayPlus = (n) => {
  const d = dOf(TODAY);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const DEADLINES = [["Aujourd'hui", 0], ["Demain", 1], ["Dans 3 jours", 3], ["Dans une semaine", 7]];

function conflictCardHTML() {
  const c = CROSSINGS.find((x) => x[0] === V.xopen);
  if (!c || !layConflicts().includes(c)) return "";
  const t = taskForConflict(c[0]);
  const d = V.xdraft;
  const sheet2 = engFileName(c[6], c[4]);
  return `<div class="xcard" data-xcard>
    <div class="hd"><span class="xi">${icon("alert-triangle")}</span><b>${c[0]}</b><span class="dt">unité ${c[3]} — niveau ${c[4]}</span>
      <span class="x" ${act("xclose")} title="Fermer">${icon("x")}</span></div>
    <div class="wh">${c[1]}</div>
    <div class="fn">${dwgName()}<br>${sheet2}</div>
    <div class="cg">Relevé ${V.caught[c[0]] || stampNow()} — en superposant ${ENG_LABELS[c[6]].toLowerCase()}</div>
    ${t ? `<div class="tk">${icon("check")}<span><b>${t.title}</b><i>${whoLabel(t)} — échéance ${fmtDay(t.day)} — relevé ${t.caught}</i></span></div>
      <span class="btnw" ${act("xgo")}>${icon("calendar-check")}<span class="hi">Voir dans l'échéancier</span></span>`
      : `<div class="lb">Qui s'en occupe</div>
      <div class="row" style="gap:3px;flex-wrap:wrap">${PEOPLE.map((p) => `<span class="chip who ${d.who.includes(p.id) ? "on" : ""}"
        ${act("xwho", p.id)} title="${p.label}"><i class="av">${p.ini}</i><span class="lb">${p.label}</span></span>`).join("")}</div>
      <div class="lb">Pour quand</div>
      <div class="row" style="gap:3px;flex-wrap:wrap">${DEADLINES.map(([word, k]) => `<span
        class="chip ${(d.day || dayPlus(3)) === dayPlus(k) ? "on" : ""}" ${act("xday", String(k))}>${word}</span>`).join("")}
        <input class="tin day" type="date" data-xdate value="${d.day || dayPlus(3)}"></div>
      <div class="row" style="gap:6px">
        <span class="btnw solid" ${act("xmake")}>${icon("plus")}<span class="hi">Créer la tâche</span></span>
        <span class="btnw" ${act("xclose")}><span class="hi">Fermer</span></span>
      </div>`}
  </div>`;
}

/* ------------------------------------------------------- the problems
   Every open problem in the project in one list, whatever found it: two
   drawings that disagree in a unit, two that disagree only once one is
   laid over the other, and a material the legend names that the maker no
   longer sells or the model does not carry. Each knows the section it is
   read in, so a section can say how many it holds before anyone scrolls
   down to it, and each knows how to take the reader to itself. */
const ISSUE_KINDS = {
  plan: { nm: "Superposition des plans", ic: "layers" },
  unit: { nm: "Unités", ic: "table" },
  mat: { nm: "Matériaux par façade", ic: "box" },
};
function issues() {
  const out = CROSSINGS.filter((c) => !c[5]).map((c) => ({
    id: c[0], kind: c[6] ? "plan" : "unit", level: c[4], title: c[1],
    where: `${c[3] ? `unité ${c[3]} — ` : ""}niv. ${c[4]}`,
    pair: `architecture × ${c[6] ? ENG_LABELS[c[6]].toLowerCase() : c[2]}`,
  }));
  const fm = window.fitteMaterials, data = window.fitteModel?.facades?.();
  if (fm) for (const c of fm.CATEGORIES) {
    const faces = data ? FACADES.filter((f) => data[f].find((r) => r.n === c.n)?.ft2 >= 1) : [];
    const absent = Boolean(data) && !faces.length;
    if (!c.check && !absent) continue;
    out.push({ id: `M-${c.n}`, kind: "mat", n: c.n, faces, title: c.check || "absent de la maquette 3D",
      where: `${c.n} ${c.name}${faces.length ? ` — ${faces.join(", ")}` : ""}`,
      pair: c.check ? `légende × ${c.maker || "fabricant"}` : "légende × maquette 3D" });
  }
  return out;
}
/* What the page is answering for: the level on screen, or the whole
   project under « Bâtiment entier ». A material conflict belongs to a
   façade, not to a floor, so it is only ever counted on the building —
   which is also the only scope where the façade tables are read. */
const issuesHere = () => (buildingScope() ? issues()
  : issues().filter((i) => i.kind !== "mat" && i.level === paneLevel()));
/* The count a section carries, within whatever the page is reading. */
function issuesIn(kind) {
  return issuesHere().filter((i) => i.kind === kind);
}
/* The count a section carries in its header. It opens the list. */
function issueBadge(kinds) {
  const n = kinds.reduce((s, k) => s + issuesIn(k).length, 0);
  return n ? `<span class="ibadge hi" ${act("issues")} title="${n} conflit${n > 1 ? "s" : ""} dans cette section — voir la liste">${icon("alert-triangle")}${n}</span>` : "";
}

/* Opening a problem from the list shows it, wherever the page was: a
   superposition conflict lays exactly the two drawings that reveal it on
   the sheet, opens its card and frames its unit; a unit conflict selects
   the unit; a material opens the façade it is on with its sheet. */
function goIssue(id) {
  const it = issues().find((i) => i.id === id);
  if (!it) return;
  V.issueSel = id;
  V.marginTab = "conf";
  if (V.screen !== "Unités") { V.screen = "Unités"; dial.setValue("screen", FR_SCREEN[V.screen]); }
  if (it.kind === "mat") {
    V.matShow = it.n;
    /* The façades are counted on the whole building only. */
    V.scope = "Bâtiment";
    V.bTab = "m";
    render();
    const face = it.faces[0];
    if (face) {
      V.facade = { face };
    }
    paintFacades();
    document.querySelector(face ? "[data-facades] tr.fopen" : "[data-facades] > .fqn:last-child")
      ?.scrollIntoView({ block: "center", inline: "nearest" });
    return;
  }
  /* A conflict is read on the drawings: the model folds to its strip so the
     sheet takes the width. The strip reopens it. */
  V.fold[splitKey("model")] = true;
  delete V.split[splitKey("model")];
  const c = CROSSINGS.find((x) => x[0] === id);
  if (it.kind === "plan") {
    V.lay.plan.on = true;
    ENG_DISCIPLINES.forEach((d) => { V.lay[d].on = d === c[6]; });
    /* The drawing in conflict is laid over the architecture, not under it:
       it moves to just above the plan in the stack (first is on top). */
    if (V.layOrder.indexOf(c[6]) > V.layOrder.indexOf("plan")) {
      const o = V.layOrder.filter((k) => k !== c[6]);
      o.splice(o.indexOf("plan"), 0, c[6]);
      V.layOrder = o;
    }
    V.layPick = c[6];
    V.xopen = c[0];
    V.caught[c[0]] ||= stampNow();
    V.xdraft = { who: [], day: dayPlus(3) };
  } else V.xopen = null;
  render();
  if (it.kind === "plan") {
    /* The surveyor's and the landscaper's sheets are dials; they would
       only cover the two drawings being compared. */
    if (V.lay.arp?.on) dial.setValue("layers.surveyor", false);
    if (V.lay.pay?.on) dial.setValue("layers.landscaping", false);
  }
  if (c[3]) window.fitteSelectUnit(c[3]); else window.fitteSelectLevel(c[4]);
}

function issuesListHTML() {
  const all = issuesHere();
  const lv = paneLevel();
  if (!all.length) return `<div class="hi" style="font-size:12px;color:var(--ink-3);padding:4px 2px">Aucun conflit ouvert.</div>`;
  return Object.entries(ISSUE_KINDS).map(([k, g]) => {
    /* The level on screen first, then the others in order. */
    const list = all.filter((i) => i.kind === k)
      .sort((a, b) => (a.level === lv ? -1 : 0) - (b.level === lv ? -1 : 0) || (a.level || 0) - (b.level || 0));
    if (!list.length) return "";
    return `<div class="igrp">${icon(g.ic)}<span>${g.nm}</span><i>${list.length}</i></div>
      ${list.map((i) => `<div class="icard ${V.issueSel === i.id ? "on" : ""}" ${act("issue", i.id)} title="Afficher ce conflit">
        <div class="who">${icon("alert-triangle")}<b>${k === "mat" ? `Légende ${i.n}` : i.id}</b><span class="when">${i.where}</span></div>
        <div class="txt">${i.title}</div>
        <div class="anch">${icon(k === "plan" ? "layers" : k === "mat" ? "box" : "table")}${i.pair}</div></div>`).join("")}`;
  }).join("");
}

/* Typology fill is the one colour the prototype adds to the sheet: the
   architect's own ink stays as it was plotted. */
const typosOn = () => TYPOS.filter((t) => V.typo[t]);
const typoHTML = () => {
  const on = typosOn();
  if (!on.length) return "";
  const polys = polysForPane();
  const levelRows = UNITS_BY_LEVEL[levelView(paneLevel())] || [];
  /* Laid on the sheet the level tabs opened, so the fill sits on the unit
     and not on the courtyard beside it. */
  const parts = levelRows.map((r) => {
    if (!on.includes(r[3])) return "";
    const poly = polys[r[2]];
    if (!poly) return "";
    return `<polygon points="${poly.map(([x, y]) => `${x},${y}`).join(" ")}" fill="${TYPO_INK[r[3]]}" stroke="${TYPO_INK[r[3]]}"></polygon>`;
  }).join("");
  return parts ? `<svg class="utagsvg" viewBox="0 0 1 1" preserveAspectRatio="none">${parts}</svg>` : "";
};

/* The selected unit, outlined on the sheet. Every other unit on this
   level keeps an invisible hit box, so the plan can be clicked the way
   the list can; a row from a different level is skipped, since its
   contour doesn't belong to the sheet actually on screen. Its number is a
   pill placed in script (placePlanPills), so it follows the zoom. */
function unitMarkHTML() {
  const rows = rowsOf("Unités");
  /* Counting the building selects no unit — the list beside the plan is
     the levels, not the units — so nothing on the sheet is lit. */
  const sel = buildingScope() ? -1 : selIndex("Unités");
  const polys = polysForPane();
  const lv = paneLevel();
  const zs = V.zoom / 100;
  const parts = rows.map((r, i) => {
    if (r[4] !== lv) return "";
    const poly = polys[r[2]];
    if (!poly) return "";
    const on = i === sel;
    /* The whole pane is scaled by a CSS transform, which thickens a stroke
       along with everything else; dividing by the zoom keeps the outline
       the hairline it is meant to be at any magnification. */
    return `<polygon class="${on ? "on" : "hit"}" points="${poly.map(([x, y]) => `${x},${y}`).join(" ")}"
      style="stroke-width:${(1.6 / zs).toFixed(3)}px" data-act="row" data-value="${i}"></polygon>`;
  }).join("");
  return `<svg class="umark" viewBox="0 0 1 1" preserveAspectRatio="none">${circulationMarkHTML()}${parts}</svg>`;
}



/* The tab glyph is a decision, not a default: what an architect reads in
   two seconds for "the floor and its units", "what the rules demand",
   "what is due when". Each screen carries its own shortlist, and the panel
   picks one per screen; the first of each list is what it opens with. */
const NAV_ICONS = {
  /* Coordination: two drawings brought side by side, which is the glyph
     git uses for the same idea. Layers stays on the shortlist. */
  "Unités": [["Compare", "git-compare"], ["Layers", "layers"], ["Floor grid", "grid-2x2"],
    ["Rooms", "bed-double"], ["Ruler", "ruler"]],
  "Codes": [["Number", "hash"], ["Checklist", "clipboard-list"], ["Flag", "flag"],
    ["Book", "book-open"], ["Shield", "shield-check"]],
  "Échéancier": [["Calendar", "calendar-check"], ["Timer", "timer"], ["Clock", "calendar-clock"],
    ["Checklist", "list-checks"], ["Flag", "flag"]],
};
const NAV = Object.keys(NAV_ICONS).filter((n) => !SCREENS[n].studio);
const navIcon = (name) => V.icons[name] || NAV_ICONS[name][0][1];


/* ------------------------------------------------------------- fidelity */

/* Isolation keeps the frame intact and fades everything that is not the
   region under study, so a variant is judged in place rather than alone. */
const solo = (region) => (V.isolate !== "none" && V.isolate === region ? "solo" : "");

/* The panel speaks French; the data attribute stays English because the
   stylesheet keys off it. */
const fiOf = (region) => (V[region] && V[region].fidelity !== "inherit" ? V[region].fidelity : V.fidelity);
const wrap = (region, label, html, step) =>
  `<div class="rg" data-rg="${label}" data-fi="${fiOf(region)}" style="display:contents">${html}</div>`
    .replace("</div>", "</div>"); // regions are grid children; see region()

/* A region is a grid child, so the tag and fidelity attributes live on the
   element itself rather than on a wrapper that would break the layout. */
function region(name, label, inner, cls = "") {
  return `<section class="pane rg ${solo(name)} ${cls}" data-rg="${label}" data-fi="${fiOf(name)}" data-region="${name}">${inner}</section>`;
}

/* ------------------------------------------------------- movable edges
   Every edge between two panes is the same object: a strip as wide as the
   gap that drags the edge, and one chevron per pane that can be folded
   away. "size" names the width being written, "grab" says which pane that
   width belongs to — the one before the strip or the one after — because
   that decides which way a drag of ten pixels moves the number. A folded
   pane leaves a strip of itself beside the edge (foldStripHTML), which is
   the way back. */
const SPLIT_MIN = 170;
const splitKey = (name) => `${V.screen}/${name}`;
const splitW = (name, def) => (V.split[splitKey(name)] ?? def);
const folded = (name) => (name === "plan" && buildingScope() ? !V.planWhole : !!V.fold[splitKey(name)]);
/* Tooltips read with the article — "Replier la liste"; a folded pane whose
   header was never read names itself from the same label: "Liste". */
const gutName = (label) => {
  const noun = label.replace(/^(le |la |l'|les )/, "");
  return noun.charAt(0).toUpperCase() + noun.slice(1);
};
/* The edge only drags. Each pane it separates is named on it, so the
   pass after render can put the fold button in that pane's header. */
function gutter({ size, grab, prev, next, lprev, lnext }) {
  const shut = (prev && folded(prev)) || (next && folded(next));
  /* Beside a folded pane the strip is the way back, so the edge has nothing
     to offer and cannot be dragged. */
  const named = shut ? "" : `${prev ? `data-prev="${prev}" data-lprev="${lprev}"` : ""} ${next ? `data-next="${next}" data-lnext="${lnext}"` : ""}`;
  return `<div class="gut${shut ? " fold" : ""}" data-gut="${size}" data-grab="${grab}" ${named}
      title="${shut ? "" : "Glisser pour déplacer le bord"}"></div>`;
}
/* Which way each pane folds: toward the screen's edge it sits against. */
const FOLD_SIDE = { list: "left", plan: "left", cal: "left", side: "right", model: "right", todo: "right" };
/* The glyph a strip wears when it was never folded by hand — « Bâtiment
   entier » folds the sheet itself, so there is no header to read it off.
   Each one is the glyph that pane's own header carries. */
const FOLD_GLYPH = { list: "table", plan: "file", cal: "calendar-check", side: "message-square", model: "box", todo: "list-checks" };
const foldBtnHTML = (key, label) => `<span class="fbtn" ${act("gutfold", key)} data-fold="${key}"
  title="Replier ${label}">${icon(`panel-${FOLD_SIDE[key] || "left"}-close`)}</span>`;
/* Every pane an edge separates gets the button at the end of its header. */
function placeFoldButtons() {
  document.querySelectorAll(".gut:not(.fold)").forEach((gut) => {
    [["prev", gut.previousElementSibling], ["next", gut.nextElementSibling]].forEach(([side, pane]) => {
      const key = gut.dataset[side];
      const ph = pane && (pane.querySelector(":scope > .ph") || pane.querySelector(".ph"));
      if (!key || !ph || ph.querySelector(":scope > .fbtn")) return;
      ph.insertAdjacentHTML("beforeend", foldBtnHTML(key, gut.dataset[`l${side}`]));
    });
  });
}
/* The strip a folded pane leaves: the same button on the header's rule,
   turned to open; below it the title read upward, the pane's icon at the
   title's start. */
const FOLD_W = 38;
function foldStripHTML(key, label) {
  const h = V.foldHead[splitKey(key)] || {};
  return `<section class="pane fstrip" ${act("gutfold", key)} data-strip="${key}" title="Déplier ${label}">
    <div class="ph"><span class="fbtn">${icon(`panel-${FOLD_SIDE[key] || "left"}-open`)}</span></div>
    <div class="fsv"><span>${h.t || gutName(label)}</span>${icon(h.ic || FOLD_GLYPH[key] || "list")}</div></section>`;
}
const bars = (n, w = [100, 70, 85]) =>
  Array.from({ length: n }, (_, i) => `<div class="bar" style="width:${w[i % w.length]}%"></div>`).join("");

/* ------------------------------------------------------- what is selected
   The tab strip, the list and the chips all read from here, so a click
   changes the answer on the screen and not just the border of the control. */

const viewsOf = (screen) => CONTEXT[screen] || [];
/* Units opens on level 5: that is the floor every example here is about. */
const defaultView = (screen) => (screen === "Unités" ? Math.max(0, viewIndexOfLevel(5)) : 0);
const viewIndex = (screen) => Math.min(V.view[screen] === undefined ? defaultView(screen) : V.view[screen],
  Math.max(0, viewsOf(screen).length - 1));
const viewOf = (screen) => viewsOf(screen)[viewIndex(screen)];

/* The rows the current screen is showing, after its view and its search. */
function rowsOf(screen) {
  let all = screen === "Unités" ? (UNITS_BY_LEVEL[viewOf(screen)] || []) : [];
  /* No typology asked for means the whole level; asking for one narrows the
     list to it, the same units the plan then colours. */
  if (screen === "Unités" && typosOn().length) all = all.filter((r) => typosOn().includes(r[3]));
  const q = V.query.trim().toLowerCase();
  return q ? all.filter((r) => r.join(" ").toLowerCase().includes(q)) : all;
}

const selIndex = (screen) => {
  const n = rowsOf(screen).length;
  if (!n) return -1;
  /* -1 is a floor with nothing chosen on it, not a missing value: asking
     for a level is asking to see the level, and picking its first unit for
     the reader answers a question nobody put. */
  const want = V.sel[screen] === undefined ? 0 : V.sel[screen];
  return want < 0 ? -1 : Math.min(want, n - 1);
};
const selRow = (screen) => rowsOf(screen)[selIndex(screen)];
const settleKey = () => `${V.screen} — ${(selRow(V.screen) || [""])[0]}`;
/* A decision is saveable as soon as there is something to save: a reason
   from the list, or a sentence written by hand. */
const saveReady = () => Boolean(V.reason || V.note.trim());
function paintSaveButton() {
  const b = document.querySelector("[data-save]");
  if (!b) return;
  const ok = saveReady();
  b.classList.toggle("go", ok);
  b.classList.toggle("off", !ok);
  b.title = ok ? "Enregistrer" : "Choisissez une raison ou écrivez une phrase";
}

/* A control is a control: it says what it does and it is clickable. */
const act = (name, value) => `data-act="${name}"${value === undefined ? "" : ` data-value="${value}"`}`;

/* The drawing the screen is reading right now: the level tab's own sheet,
   or, where that tab has none, the selected unit's real level (paneLevel
   above), so every other screen shows that unit's true floor rather than
   a stand-in composite. */
/* The architectural sheet of the level the pane is on. Every level in
   LEVEL_VIEWS has one, so this never answers null. */
const sheet = () => SHEETS[levelView(paneLevel())];
const dwgName = () => V.docs.names[viewOf("Unités")] || sheet().file;

/* What a drawing pane says about its file: where it is, what it is called,
   which revision was read. The button that hands the drawing back to the
   application sits in the pane header, a thumb away from the drawing
   instead of up in the screen header. */
const HOSTS = { plan: ["autocad", "Ouvrir dans AutoCAD"], model: ["sketchup", "Ouvrir dans SketchUp"] };

function hostButton(kind) {
  const [a, label] = HOSTS[kind];
  /* The same quiet button as Exporter on the list: a pane header holds
     tools, and a black one there outweighed the drawing under it. */
  return `<span class="btnw sm" ${act(a)} title="${label}">${icon("external-link")}
    <span class="lo bar" style="width:46px"></span><span class="hi">${label}</span></span>`;
}

/* ------------------------------------------------------------ code cards
   A provision is only readable next to the number the drawings produced, so
   the card carries both, plus the sentence and the page it comes from. The
   link is a real link: the regulation is read where it is published. */
/* Schematics for the provisions that have no exported sheet behind them.

/* ------------------------------------------------------- the calendar */

/* Dates are handled as ISO strings and plain UTC arithmetic: the screen
   never needs a locale calendar, only the day a task falls on. */
const MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
  "août", "septembre", "octobre", "novembre", "décembre"];
const MONTHS_AB = ["janv", "févr", "mars", "avr", "mai", "juin", "juil", "août", "sept", "oct", "nov", "déc"];
const DOW = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];
/* The three scales the calendar can be drawn at, in the order they widen. */
const CAL_SCALES = ["Semaine", "Mois", "Année"];
const CAL_SCALE_ICONS = { Semaine: "calendar-range", Mois: "calendar-days", Année: "calendar" };
const iso = (d) => d.toISOString().slice(0, 10);
const dOf = (s) => new Date(s + "T00:00:00Z");
const shift = (s, n) => { const d = dOf(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
/* Monday as the first column, which is how a site week is read here. */
const monday = (s) => shift(s, -((dOf(s).getUTCDay() + 6) % 7));
const fmtDay = (s) => { const d = dOf(s); return `${d.getUTCDate()} ${MONTHS_AB[d.getUTCMonth()]}`; };
/* Each task keeps the day it was written down. The fixture's tasks were
   written one to two weeks before they fell due, never after today. */
TASKS.forEach((t, i) => { t.createdAt ||= shift(t.day < TODAY ? t.day : TODAY, -(6 + (i * 5) % 11)); });
const tasksOn = (s) => TASKS.filter((t) => t.day === s);

function calTitle() {
  const d = dOf(V.day), v = V.scale;
  if (v === "Année") return `${d.getUTCFullYear()}`;
  if (v === "Semaine") {
    const a = monday(V.day);
    return `semaine du ${fmtDay(a)} au ${fmtDay(shift(a, 6))}`;
  }
  return `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

/* One day cell, at every scale: the number, and a red flag for each task
   that has to pass before the rest. Nothing else — a dot per task said
   only that the day was busy, and the titles under them turned the month
   into fine print. A day with nothing urgent carries nothing; what it
   does hold is read by choosing the day. The chosen day, at month scale,
   also offers « + Tâche »: the list's form, already dated to it. */
function dayCell(s, dim, big) {
  const ts = tasksOn(s);
  const hot = ts.filter((t) => t.prio === "haute" && !t.done);
  const cls = [s === V.day ? "on" : "", dim ? "dim" : "", s === TODAY ? "today" : ""].join(" ");
  const cap = big ? 4 : 3;
  return `<div class="day ${cls}" ${act("calday", s)} title="${fmtDay(s)} — ${ts.length} élément${ts.length > 1 ? "s" : ""}${
    hot.length ? `, ${hot.length} à passer avant le reste` : ""}">
    <span class="lo bar" style="width:14px"></span>
    <span class="hi n">${dOf(s).getUTCDate()}</span>
    ${hot.length ? `<span class="hi dots">${hot.slice(0, cap).map(() =>
      `<i class="pflag">${FLAG_SOLID}</i>`).join("")}${
      hot.length > cap ? `<em>+${hot.length - cap}</em>` : ""}</span>` : ""}
    ${big && !dim && s === V.day ? `<span class="hi dadd" ${act("tnew")} title="Ajouter une tâche le ${fmtDay(s)}">${icon("plus")}Tâche</span>` : ""}</div>`;
}

function monthGrid(y, m, big) {
  const first = iso(new Date(Date.UTC(y, m, 1)));
  const start = monday(first);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const s = shift(start, i);
    if (i >= 35 && dOf(s).getUTCMonth() !== m) break;
    cells.push(dayCell(s, dOf(s).getUTCMonth() !== m, big));
  }
  /* "sm", not "mini": .mini is already the drawing's minimap. */
  return `<div class="cal ${big ? "big" : "sm"}">
    ${DOW.map((d) => `<div class="dow"><span class="lo bar" style="width:16px"></span><span class="hi">${big ? d : d[0]}</span></div>`).join("")}
    ${cells.join("")}</div>`;
}

function calendarHTML() {
  const v = V.scale, d = dOf(V.day);
  if (v === "Année") {
    const y = d.getUTCFullYear();
    return `<div class="year">${MONTHS.map((name, m) => `<div class="ym">
      <div class="row" ${act("calmonth", `${y}-${String(m + 1).padStart(2, "0")}-01`)}>
        <span class="lo bar" style="width:40px"></span>
        <span class="hi" style="font-size:11.5px;font-weight:600">${name}</span>
        <span style="flex:1"></span>
        <span class="hi" style="font-size:11px;color:var(--ink-3)">${
          TASKS.filter((t) => t.day.slice(0, 7) === `${y}-${String(m + 1).padStart(2, "0")}`).length || ""}</span>
      </div>${monthGrid(y, m, false)}</div>`).join("")}</div>`;
  }
  if (v === "Semaine") {
    const a = monday(V.day);
    return `<div class="week">${DOW.map((name, i) => {
      const s = shift(a, i), ts = tasksOn(s);
      return `<div class="wcol ${s === V.day ? "on" : ""} ${s === TODAY ? "today" : ""}" ${act("calday", s)}>
        <div class="wh"><span class="lo bar" style="width:30px"></span>
          <span class="hi">${name} ${dOf(s).getUTCDate()}</span></div>
        <div class="wb">${ts.map((t) => `<div class="wtask" ${act("task", t.id)}>
          <span class="lo bar" style="width:80%"></span>
          <span class="hi">${t.prio === "haute" && !t.done ? `<i class="pflag">${FLAG_SOLID}</i> ` : ""}${t.title}</span>
          <span class="hi who">${whoLabel(t)}</span></div>`).join("")}</div></div>`;
    }).join("")}</div>`;
  }
  return monthGrid(d.getUTCFullYear(), d.getUTCMonth(), true);
}

/* The list on the right is the same tasks, ordered by day and by priority
   inside a day. The calendar filters it: a day is selected, so the list
   opens on that day and keeps the rest below it under a divider.

   A ticked task leaves both lists and lands in the archive at the bottom,
   where it keeps the day it was closed on and can be brought back. Nothing
   is destroyed by a tick: that is what makes ticking safe to do quickly. */

/* Which object the open editor is writing into: a real task, or the draft
   that becomes one. */
const editingTask = () => (V.taskEdit === "new" ? V.taskDraft
  : TASKS.find((t) => t.id === V.taskEdit));

/* The two inputs hold their own value between renders, so what was typed is
   read back into the object before the screen is redrawn. Without this,
   clicking a priority chip would throw away a half-typed title. */
function readTaskForm() {
  const t = editingTask();
  const form = document.querySelector("[data-tedit]");
  if (!t || !form) return;
  form.querySelectorAll("[data-tfield]").forEach((el) => {
    if (el.value !== "") t[el.dataset.tfield] = el.value;
  });
}

const avatars = (t) => `<span class="avs">${t.who.map((id) =>
  `<i class="av" title="${person(id).label}">${person(id).ini}</i>`).join("")}</span>`;

/* One editor, used for a new task and for an existing one. It writes into
   the task itself — or into the draft, for a new one — so there is never a
   second copy of a task to keep in step. */
function taskForm(t, isNew) {
  return `<div class="tedit" data-tedit>
    <input class="tin" data-tfield="title" value="${(t.title || "").replace(/"/g, "&quot;")}"
      placeholder="Que faut-il faire?">
    <div class="row" style="gap:6px;flex-wrap:wrap">
      <input class="tin day" type="date" data-tfield="day" value="${t.day}">
      <span class="chip tfchip ${t.prio === "haute" ? "on" : ""}" ${act("tprio", t.prio === "haute" ? "normale" : "haute")}
        role="button" aria-pressed="${t.prio === "haute"}">${t.prio === "haute" ? FLAG_SOLID : icon("flag")}À passer avant le reste</span>
    </div>
    <div class="row" style="gap:3px;flex-wrap:wrap">
      ${PHASES.map((p) => `<span class="chip ${t.phase === p ? "on" : ""}" ${act("tphase", p)}>${p}</span>`).join("")}
    </div>
    <div class="row" style="gap:3px;flex-wrap:wrap">
      ${PEOPLE.map((p) => `<span class="chip who ${t.who.includes(p.id) ? "on" : ""}" ${act("twho", p.id)}
        title="${p.label}"><i class="av">${p.ini}</i><span class="lb">${p.label}</span></span>`).join("")}
    </div>
    <div class="row" style="gap:6px">
      <span class="btnw solid" ${act("tsave")}>${icon("check")}<span class="hi">${isNew ? "Ajouter" : "Enregistrer"}</span></span>
      <span class="btnw" ${act("tcancel")}><span class="hi">Annuler</span></span>
      <span style="flex:1"></span>
      ${isNew ? "" : `<span class="btnw" ${act("tdel", t.id)} title="Supprimer">${icon("trash-2")}</span>`}
    </div></div>`;
}

/* Option E of taches-liste.html: a segmented switch with its counts picks
   which tasks; the agenda files them under their day. Two tabs only, from
   taches-filtre-libelles.html F: « Actives » is everything not yet filed,
   ticked ones included, « Archivées » the journal, with the same icon as
   the « Archiver » button that sends a task there. Nothing is shown as late.
   Today wears its badge in the brand green, and the right of each row
   holds the flag that raises it above the rest. A tick checks the box and strikes the task through,
   where it is; only then does « Archiver » appear, and archiving files it
   under « Archivées ». Ticking it there reopens it. */
const TASK_FILTERS = [
  ["open", "Actives", (t) => !t.archived, "inbox"],
  ["hist", "Archivées", (t) => t.archived, "archive"],
];
const WEEKDAY = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const dayLabel = (s) => `${WEEKDAY[dOf(s).getUTCDay()]} ${fmtDay(s)}`;
/* The mark is also the control: the flag says a task passes before the
   rest, and clicking it is how it gets there or leaves. */
const prioFlag = (t) => `<span class="tflag ${t.prio === "haute" ? "on" : ""}" ${act("tflag", t.id)} role="button"
  aria-pressed="${t.prio === "haute"}" title="${t.prio === "haute" ? "Ne plus faire passer avant le reste" : "Faire passer avant le reste"}">${t.prio === "haute" ? FLAG_SOLID : icon("flag")}</span>`;
function taskListHTML() {
  const f = TASK_FILTERS.find(([k]) => k === V.taskFilter) || TASK_FILTERS[0];
  const journal = f[0] === "hist";
  const dayOf = (t) => (journal ? t.doneAt || t.day : t.day);
  const list = TASKS.filter(f[2]).sort((a, b) => (journal ? dayOf(b).localeCompare(dayOf(a)) : a.day.localeCompare(b.day))
    || PRIO[b.prio] - PRIO[a.prio]);
  const days = [...new Set(list.map(dayOf))];
  const seg = `<span class="tseg">${TASK_FILTERS.map(([k, nm, fn, ic]) => `<span class="${k === f[0] ? "on" : ""}" ${act("tfilter", k)}>${icon(ic)}${nm}<i class="${k === "hist" && V.archBump ? "bump" : ""}">${TASKS.filter(fn).length}</i></span>`).join("")}</span>`;
  const line = (t) => (V.taskEdit === t.id ? taskForm(t, false) : `<div class="task ${t.done ? "done" : ""} ${V.task === t.id ? "on" : ""}"
      data-task="${t.id}" ${act("task", t.id)}>
    <span class="tick dot ${t.done ? "on" : ""}" ${act("tasktick", t.id)} title="${t.done ? "Rouvrir" : "Cocher — elle reste ici, barrée"}">${t.done ? icon("check") : ""}</span>
    <span class="tw"><span class="ttl">${t.title}</span>
      <span class="tmeta">${t.phase}${t.code ? ` — <code>${t.code}</code>` : ""}${t.caught ? ` — relevé ${t.caught}` : ""}</span>
      <span class="tdates">créée le ${fmtDay(t.createdAt)}${t.done && t.doneAt ? ` · cochée le ${fmtDay(t.doneAt)}` : ""}${
        t.archived ? ` · échéance ${fmtDay(t.day)}` : ""}</span></span>
    ${(() => {
      /* A task born from a conflict keeps the way back to it: the row says
         which unit and level, and the button lays the two drawings that
         reveal it and opens its card there. Only while the conflict is
         open — once it is settled there is nothing to go and see. */
      const c = t.src && CROSSINGS.find((x) => x[0] === t.src && !x[5]);
      return c ? `<span class="tfile" ${act("taskgo", t.src)}
        title="Voir ${c[0]} sur le plan — ${c[3] ? "unité " + c[3] + ", " : ""}niveau ${c[4]}">${icon("layers")}Voir sur le plan</span>` : "";
    })()}
    ${t.done ? "" : `<span class="tact" ${act("tedit", t.id)} title="Modifier">${icon("pencil")}</span>`}
    ${t.done && !t.archived ? `<span class="tfile" ${act("taskfile", t.id)} title="Ranger dans « Archivées »">${icon("archive")}Archiver</span>` : ""}
    ${avatars(t)}
    ${prioFlag(t)}
  </div>`);
  const group = (d) => {
    const dl = list.filter((t) => dayOf(t) === d);
    const cls = !journal && d === TODAY ? "today" : "";
    return `<div class="tday ${cls}" data-tday="${d}"><span class="tcount" title="${dl.length} tâche${dl.length > 1 ? "s" : ""}">${dl.length}</span><b>${dayLabel(d)}</b></div>
      ${dl.map(line).join("")}`;
  };
  return `<div class="tlist">${seg}
    ${V.taskEdit === "new" ? taskForm(V.taskDraft, true) : ""}
    ${days.map(group).join("") || `<div class="tnone">${journal ? "Rien n'est encore archivé." : "Aucune tâche."}</div>`}
  </div>`;
}

/* Sections only appear in the grouped rail: the first three screens read a
   project, the next three act on it, the last one stores it. */
const SECTIONS = { 0: "Lecture", 3: "Décision", 6: "Archive" };
/* The key of a screen and the word on its tab are not the same thing. The
   key is "Unités" everywhere in this file — it indexes views, rows, titles
   and the fixture — while the tab says Coordination, because what the
   screen does is reconcile the drawing with the model, and the units are
   only the list it does it through. Renaming the key would touch thirty
   lookups for a word. */
const SCREEN_LABEL = { "Unités": "Coordination" };
const labelOf = (name) => SCREEN_LABEL[name] || name;
const SHORT = (name) => labelOf(name).slice(0, 3).toUpperCase();

/* One label rule for the rail and the tabs, so a title never reads two ways
   on the same screen. Hover and Hidden are CSS, the rest rewrite the text. */
function navLabel(name, i) {
  const m = V.nav.labels;
  if (m === "Short code") return SHORT(name);
  if (m === "Numbered") return `${i + 1}. ${labelOf(name)}`;
  return labelOf(name);
}

const railIcons = () => V.nav.icons === "Rail and tabs" || V.nav.icons === "Rail only";
/* With no rail to carry them, the glyphs belong to the tabs: "Rail only"
   would otherwise leave a row of bare words where the icon was promised. */
const tabIcons = () => V.nav.layout === "Two rows, no rail"
  || V.nav.icons === "Rail and tabs" || V.nav.icons === "Tabs only";

   Open a project that is running, or start one. The layouts differ only in
