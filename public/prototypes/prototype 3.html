<style>
/* Low fidelity on purpose: one grey, one line weight, one type size ramp.
   What is being tested here is where things sit and in what order they are
   read, not how they look. */
:root{
  --tabr:12px;
  --sans:'Geist',ui-sans-serif,system-ui,sans-serif;
  --ink:#1b1b1b; --ink-2:#6b6b6b; --ink-3:#9b9b9b;
  --line:#c9c9c9; --line-2:#e2e2e2;
  --fill:#ededed; --fill-2:#f6f6f6; --page:#fafafa; --page-field:#f4f4f5;
  --bar:#dcdcdc;
  --hi:#111;
  /* The surface a card, a pane or a dialog is drawn on, the ink that reads
     on top of --hi, and the three washes a hover, a press and a selection
     use. They are tokens because dark mode is only these turned over. */
  --card:#fff; --on-hi:#fff;
  --wash:rgba(17,17,18,.055); --wash-2:rgba(17,17,18,.085); --wash-3:rgba(17,17,18,.11);
  /* The office green, used for one thing only: the level being read. It is
     the same green the black chrome already wore, lifted to the root so the
     level row carries it under either chrome. */
  --vert:#c3e05a; --vert-ink:#2f3a05;
  --gap:10px; --pad:12px; --r:6px;
}
/* Dark mode is the same screen with the ramp turned over: same spacing,
   same weights, same hairlines. Two things stay as they are — the drawing
   keeps its own paper, because a plan is a white sheet and inverting it
   would be redrawing it, and the black chrome stays black. */
[data-theme="dark"]{
  --ink:#ececed; --ink-2:#9b9b9f; --ink-3:#74747a;
  --line:#3c3c42; --line-2:#2b2b30;
  --fill:#2a2a2f; --fill-2:#202024; --page:#0f0f11; --page-field:#17171a;
  --bar:#32323a;
  --hi:#f1f1f2;
  --card:#17171a; --on-hi:#111;
  --wash:rgba(255,255,255,.07); --wash-2:rgba(255,255,255,.11); --wash-3:rgba(255,255,255,.16);
  color-scheme:dark;
}
[data-density="compact"]{--gap:6px;--pad:8px}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--sans)}
/* The app is a window, not a page. Nothing scrolls or rubber-bands at the
   document level, so the whole screen cannot be pulled up, down or sideways;
   what needs to scroll scrolls inside its own pane. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--page);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* The prototype is the screen: no page chrome around it, no explainer under
   it. What is being judged fills the window. */
.stage{padding:0;max-width:none;margin:0;height:100dvh;display:flex;overflow:hidden}
/* render() writes the frame into this wrapper, so the wrapper has to carry
   the stretch as well. */
#frame{flex:1;display:flex;min-width:0}

/* screen frame -------------------------------------------------------- */
.frame{margin:0;border:0;border-radius:0;background:var(--card);
  flex:1;height:100vh;display:grid;overflow:hidden;position:relative}
.frame[data-nav="rail"]{grid-template-columns:86px 1fr;grid-template-rows:1fr}
.frame[data-nav="wide"]{grid-template-columns:180px 1fr;grid-template-rows:1fr}
.frame[data-nav="top"]{grid-template-columns:1fr;grid-template-rows:1fr}
.frame[data-nav="stack"]{grid-template-columns:72px 1fr;grid-template-rows:1fr}

/* The chrome is a grey field and the work is a white card on it. The rail is
   as wide as its items, and an item is only drawn when it is under the
   pointer or current: resting state is the field itself. */
.rail{border-right:0;background:transparent;
  display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:10px 8px}
.rail.wide{align-items:stretch;padding:10px}
.rail .ic{width:auto;height:auto;min-height:32px;border-radius:9px;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:7px 4px;color:var(--ink-3);cursor:pointer;
  transition:background .12s ease,color .12s ease}
.rail .ic:hover{background:var(--wash);color:var(--ink-2)}
.rail .ic:active{background:var(--wash-3)}
.rail .ic.on{background:var(--wash-2);color:var(--ink)}
.rail .ic.on .cap{color:var(--ink-2)}
.rail .row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:9px;cursor:pointer;
  color:var(--ink-3);transition:background .12s ease,color .12s ease}
.rail .row:hover{background:var(--wash);color:var(--ink-2)}
.rail .row.on{background:var(--wash-2);color:var(--ink)}

/* min-height:0 is what keeps a tall screen — the code cards, a long list —
   inside the window instead of pushing the card past the bottom edge. The
   pane scrolls; the card keeps its four sides. */
.body{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.tabs{height:42px;border-bottom:0;display:flex;align-items:center;
  gap:4px;padding:0 12px;flex:0 0 auto}
.tabs button{border:0;background:transparent;font-size:12.5px;color:var(--ink-3);
  padding:6px 9px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background .12s ease,color .12s ease}
.tabs button:hover{background:var(--wash);color:var(--ink-2)}
.tabs button:active{background:var(--wash-3)}
.tabs button[aria-current="true"]{background:var(--wash-2);color:var(--ink);font-weight:500}
.tabs .sp{flex:1}
/* The project name holds its place; the views are what gives way when the
   strip runs out of room, so they scroll instead of pushing the name off. */
.tabs .crumb{flex:0 0 auto;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .views{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;
  scrollbar-width:none}
.tabs .views::-webkit-scrollbar{display:none}
.tabs .views button{flex:0 0 auto}

/* ------------------------------------------------- two rows, and no rail
   Row one is where one is and which screen is open. Row two is what that
   screen asks for — here, which level is being read. The dependency is
   stated by the order alone: no group boxes, no captions, nothing on the
   left edge. The level row is the only place the office green appears. */
/* The level being read is not a pill sitting in the bar: it is the tab of
   the white page under it, the way a folder's tab is the folder. The page
   grows up into the chrome where the level is named, and the join is the
   whole mark — no green, nothing to decode. */
.tabs.lvl{height:44px;align-items:flex-end;background:none;border:0;padding:0 9px}
.tabs.lvl .views{flex:1;align-items:flex-end;overflow:visible}
/* The row's words sit in its middle: as much dark above them as below
   (8.5 px each way in the 44 px row). The open tab grows by the same 5 px
   so it still stands on the page. */
.tabs.lvl button{position:relative;font-size:12px;padding:0 10px;height:28px;margin-bottom:8px;
  border-radius:6px;white-space:nowrap}
.tabs.lvl button[aria-current="true"]{height:36px;margin-bottom:0;padding:0 12px 8px;
  border-radius:var(--tabr) var(--tabr) 0 0;background:var(--card);color:var(--ink);font-weight:600;--tabc:var(--card);z-index:1}
.tabs.lvl button[aria-current="true"]:hover{background:var(--card);color:var(--ink)}
.tabs.lvl .div{margin-bottom:14px}
/* The tab's two flared feet: a concave corner each side, where the page
   curves up into the tab. A masked square of the tab's own colour, so it
   is a shape the page makes, not a shading laid over it. */
.tabs.lvl button[aria-current="true"]::before,
.tabs.lvl button[aria-current="true"]::after{content:"";position:absolute;bottom:0;
  width:var(--tabr);height:var(--tabr)}
.tabs.lvl button[aria-current="true"]::before{right:100%;background:radial-gradient(circle at 0 0,transparent 11.2px,var(--tabc) 12.3px)}
.tabs.lvl button[aria-current="true"]::after{left:100%;background:radial-gradient(circle at 100% 0,transparent 11.2px,var(--tabc) 12.3px)}
/* No tab stands on the page's corner any more: the screen switch opens
   the row, so the first level tab is inboard like every other one and the
   page keeps one silhouette at both ends. */
/* The switch's lit pill while it slides: under the words, the real one
   unlit until it lands. */
.tabs.lvl .mseg.gliding{position:relative}
.tabs.lvl .msglide{position:absolute;left:0;z-index:0;border-radius:9px;background:rgba(255,255,255,.16);pointer-events:none}
.tabs.lvl .mseg.gliding .ms{position:relative;z-index:1}
.tabs.lvl .mseg.gliding .ms[aria-current="true"]{background:transparent}
.frame[data-chrome="black"] .tabs.lvl button{color:rgba(255,255,255,.72);font-size:12.5px}
.frame[data-chrome="black"] .tabs.lvl button:hover{background:rgba(255,255,255,.1);color:#fff}
.frame[data-chrome="black"] .tabs.lvl button[aria-current="true"]{background:var(--card);color:var(--ink)}

/* rail with the label under the icon */
.rail.stack{align-items:stretch;padding:10px 6px}
.rail .stk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;
  border-radius:9px;font-size:10px;color:var(--ink-3);text-align:center;cursor:pointer;
  transition:background .12s ease,color .12s ease}
.rail .stk:hover{background:var(--wash);color:var(--ink-2)}
.rail .stk.on{background:var(--wash-2);color:var(--ink)}

/* how the tab strip presents itself */
.tabs[data-align="Centred"]{justify-content:center}
.tabs[data-align="Centred"] .sp{display:none}
.tabs[data-align="Spread"] button{flex:1;justify-content:center}
.tabs[data-align="Spread"] .sp{display:none}
.tabs[data-style="Underline"] button{border-radius:0}
.tabs[data-style="Underline"] button[aria-current="true"]{background:transparent;
  box-shadow:inset 0 -2px 0 var(--ink)}
.tabs[data-style="Pills"] button{border:1px solid var(--line-2);border-radius:999px}
.tabs[data-style="Pills"] button[aria-current="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tabs[data-style="Segmented"]{gap:0}
.tabs[data-style="Segmented"] button{border-radius:0;border-right:1px solid var(--line-2);background:var(--fill-2)}
.tabs[data-style="Segmented"] button:first-of-type{border-top-left-radius:6px;border-bottom-left-radius:6px}
.tabs[data-style="Segmented"] button:last-of-type{border-right:0;border-top-right-radius:6px;border-bottom-right-radius:6px}
.tabs[data-style="Segmented"] button[aria-current="true"]{background:var(--card);color:var(--ink)}

/* label presets, shared by the rail and the tab strip */
.rail[data-labels-mode="Hidden"] .hi:not(.code),.tabs[data-labels-mode="Hidden"] .hi:not(.code),
.rail[data-labels-mode="Hover only"] .hi:not(.code),.tabs[data-labels-mode="Hover only"] .hi:not(.code){display:none}
.tabs[data-labels-mode="Hover only"] button:hover .hi,
.rail[data-labels-mode="Hover only"] .row:hover .hi,
.rail[data-labels-mode="Hover only"] .stk:hover .hi{display:inline}
.rail[data-labels-mode="Uppercase"] .hi,.tabs[data-labels-mode="Uppercase"] .hi{
  text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.rail[data-labels-mode="Short code"] .hi,.tabs[data-labels-mode="Short code"] .hi{letter-spacing:.04em}
/* a caption that does not fit on one line wraps rather than truncating:
   "Quantités" is a destination, not an ellipsis */
.rail .ic .cap{font-size:9px;line-height:1.2;text-align:center;max-width:100%;
  white-space:normal;overflow-wrap:normal;hyphens:none;color:var(--ink-3)}
.rail .ic.on .cap{color:var(--ink)}
.rail .code{font-size:9.5px;letter-spacing:.03em;color:inherit}
.rail .sct{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:8px 4px 2px}
.rail.stack .stk .hi{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail.wide .row .hi{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* breadcrumb, screen menu and grouped tabs live in the tab strip */
.tabs .crumb{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
/* the crumb is a .hi too, and the fidelity rule sets .hi to block: this wins
   on specificity so the folder keeps its gap from the label */
.tabs .crumb.hi{display:inline-flex}
.tabs .crumb .lu{width:13px;height:13px;flex:0 0 13px}
.tabs .crumb:hover{color:var(--ink)}
.tabs .crumb.ech{padding:0 8px;height:24px;border-radius:7px;margin-left:2px}
.tabs .crumb.ech:hover{background:var(--fill-2)}
/* The schedule is the one door out of every screen, so it reads at full
   strength rather than as a dimmed crumb; open, it is lit like a tab. */
.tabs .crumb.ech{color:var(--ink);font-weight:500}
.tabs .crumb.ech.cur{background:var(--fill)}
.tabs .crumb.on{cursor:default}
.tabs .crumb.on{color:var(--ink);font-weight:500}
.tabs .grp{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:0 6px 0 2px}
.tabs .div{width:1px;height:18px;background:var(--line-2);margin:0 6px}
.tabs [data-menu]{cursor:pointer}
.tabs[data-style="Top accent"] button{border-radius:0}
.tabs[data-style="Top accent"] button[aria-current="true"]{background:transparent;
  box-shadow:inset 0 2px 0 var(--ink)}
.tabs[data-style="Boxed"] button{border:1px solid transparent}
.tabs[data-style="Boxed"] button[aria-current="true"]{background:var(--card);border-color:var(--line-2);
  box-shadow:0 1px 2px rgba(0,0,0,.05)}

.work{flex:1;min-height:0;display:grid;gap:var(--gap);padding:var(--gap)}
.pane{border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);
  display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden}
.pane > .ph{height:38px;flex:0 0 auto;border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:8px;padding:0 11px;font-size:13px;font-weight:500;color:var(--ink);
  white-space:nowrap}
/* A crowded header squeezes the title, never its icon. */
.pane > .ph > svg{width:15px;height:15px;flex:0 0 15px;color:var(--ink-2)}
/* and the title is what gives: it shortens with an ellipsis so the edge
   between two panes can actually be dragged. The header's own width was the
   floor of a drag (headNeed), and a title held at full length made that floor
   wider than the pane already was, so the edge would not move at all. */
.pane > .ph > .hi{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* Only the title is loud: chips, counts and buttons inside the header keep
   their own weight. */
.pane > .ph .chip,.pane > .ph .btnw{font-weight:400}
/* No overscroll-behavior here. A pane whose content fits still counts as a
   scroller, and `contain` on it swallows the wheel instead of handing it to
   the region behind — which is what actually scrolls on Aperçu. The window
   itself is already locked on html and body, so chaining stops there. */
.pane > .pb{flex:1;min-height:0;overflow:auto;
  padding:var(--pad);display:flex;flex-direction:column;gap:8px}
.pane.flat > .pb{padding:0}
/* The decision is the last thing in the column: it sits at the foot of the
   inspector rather than floating under the rows, so the empty space is above
   it and the button is where the thumb already is. */
.pane > .pb > .decide{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px}

/* low-fi primitives --------------------------------------------------- */
.bar{height:9px;border-radius:3px;background:var(--bar)}
.bar.lt{background:var(--fill)}
.box{background:var(--fill);border-radius:var(--r);flex:1}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.chip{height:22px;border:1px solid var(--line-2);border-radius:999px;background:var(--fill-2);
  display:inline-flex;align-items:center;gap:5px;padding:0 9px;font-size:11.5px;color:var(--ink-2)}
/* An icon chip: square, no label, the name carried by the tooltip and by the
   line beside the row. Four of them fit where two words did not. */
.chip.ico{width:26px;height:26px;padding:0;justify-content:center;border-radius:7px;flex:0 0 26px}
.chip.ico.on{border-color:var(--ink);color:var(--ink);background:var(--fill)}
.utabs{gap:5px;align-items:center}
.btnw{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--fill-2);
  display:inline-flex;align-items:center;gap:6px;padding:0 9px;font-size:12px;color:var(--ink-2)}
.btnw.solid{background:var(--bar);border-color:var(--line);color:var(--ink)}
/* A path as a control: one line, elided from the left, used by the share
   dialog for the link it hands over. */
.fpath{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;overflow:hidden;
  height:24px;padding:0 8px;border:1px solid var(--line-2);border-radius:5px;
  background:var(--fill-2);font-size:11.5px;color:var(--ink-2);cursor:pointer}
.fpath:hover{border-color:var(--line);background:var(--fill)}
.fpath .lu{flex:0 0 13px}
.pcard{cursor:pointer}
.pcard:hover{border-color:var(--line);background:var(--fill-2)}
.tile{border:1px solid var(--line-2);border-radius:var(--r);padding:10px;display:flex;
  flex-direction:column;gap:6px;min-width:0}
.listrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px}
.listrow.on{background:var(--fill)}
.listrow .dot{width:8px;height:8px;border-radius:50%;background:var(--bar);flex:0 0 8px}
/* The link carries its own copy button: the field is what is copied. The
   corners nest: the button sits 4px inside the field's outer edge (3 of
   air, 1 of border), so its radius is the field's 8 less 4. */
.fpath.sharelink{cursor:default;height:34px;border-radius:8px;padding:3px 3px 3px 10px;gap:7px;font-size:12px}
.fpath.sharelink:hover{background:var(--fill-2);border-color:var(--line-2)}
/* « Copié »: the button goes solid black with white words and check — a
   change of state, not a colour of its own. */
.btnw.done,.btnw.done:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btnw.done svg{color:#fff}
/* The mail dialog's « Envoyer »: outlined until the pointer is on it. */
.btnw.send:not(.done){color:var(--ink)}
.btnw.send:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btnw.send:hover svg{color:#fff}
.lcrumbs.done,.lcrumbs.done .c{color:var(--ink)}
.fpath.sharelink .copy.done{background:var(--ink);border-color:var(--ink);color:#fff}
.fpath.sharelink .copy.done .lu{color:#fff}
.fpath.sharelink .copy{height:26px;border-radius:4px;padding:0 10px;cursor:pointer;flex:0 0 auto;
  background:var(--ink);border-color:var(--ink);color:#fff}
.fpath.sharelink .copy .lu{width:13px;height:13px;color:#fff}
/* An invited person: initials, name over role, and their access as the
   one control. The controls open under the row, inside the dialog's
   scroll, so nothing is clipped. */
.sperson{border-radius:6px;position:relative}
.sperson .avatar{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--fill);color:var(--ink);
  display:block;text-align:center;align-content:center;font-size:10.5px;font-weight:600;letter-spacing:0;line-height:1;
  text-box:trim-both cap alphabetic}
.sperson .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.sperson .nm{font-size:12.5px;color:var(--ink);font-weight:500}
.sperson .rl{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sperson .acc{cursor:pointer;flex:0 0 auto}
.sperson .acc .lu{width:12px;height:12px;color:var(--ink-3)}
/* The access menu: both rights with what each allows, the current one
   ticked, removal under a rule. It opens upward, over the rights above,
   so the dialog's scroll never hides it. */
.accmenu{position:absolute;right:8px;bottom:calc(100% - 4px);z-index:3;width:260px;background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column}
.accmenu .o{display:grid;grid-template-columns:14px 1fr;gap:1px 8px;padding:6px 8px;border-radius:4px;cursor:pointer}
.accmenu .o:hover{background:var(--fill-2)}
.accmenu .o b{font-weight:500;font-size:12px;color:var(--ink)}
.accmenu .o i{grid-column:2;font-style:normal;font-size:11px;color:var(--ink-3)}
.accmenu .o .lu{width:13px;height:13px;margin-top:2px;color:var(--ink)}
.accmenu hr{border:0;border-top:1px solid var(--line-2);margin:4px 2px}
.accmenu .o.del b,.accmenu .o.del .lu{color:#b3261e}

/* Anything that does something says so under the cursor, and anything that
   cannot act yet is visibly out of reach rather than silently inert. */
[data-act],[data-screen]{cursor:pointer}
[data-act]:hover{border-color:var(--line)}
.chip.on[data-act]:hover{border-color:var(--ink)}
.chip[data-act]:not(.on):hover{background:var(--fill)}
/* The outlined buttons — Exporter, Ouvrir dans…, Document — invert under
   the pointer: ink fill, card-coloured words and glyphs. The solid and the
   switched-off ones keep their own state. */
.btnw[data-act]:not(.solid):not(.off):hover,.lcard .docbtn:hover{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btnw[data-act]:not(.solid):not(.off):hover .hi{color:inherit}
/* On the black top bar an ink fill would vanish into the bar, so there the
   same press turns the light button full white with black words instead. */
.frame[data-chrome="black"] .tabs .btnw[data-act]:not(.solid):not(.off):not(.lvlshare):hover{background:#fff;border-color:#fff;color:#111}
/* Partager lights in the project's green under the pointer, the green the
   armed pin and its send wear: sharing is the project going out. */
.frame .tabs .btnw.lvlshare[data-act]:hover{background:#c3e05a;border-color:#c3e05a;color:#2f3a05}
.listrow[data-act]:hover{background:var(--fill-2)}
.tbl tr[data-act]:hover td{background:var(--fill-2)}
.tile[data-act].on{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .lb,.chip.on .hi,.chip.on svg{color:inherit}
.chip.on .av{background:#fff;border-color:#fff;color:var(--ink)}
.btnw.off{opacity:.45}
input.find,input.note{border:1px solid var(--line-2);border-radius:5px;padding:5px 7px;
  font:inherit;font-size:11.5px;color:var(--ink);background:var(--card);min-width:0;width:100%}
input.find{border:0;background:transparent;padding:0;width:140px}
input.find:focus,input.note:focus{outline:1px solid var(--ink);outline-offset:1px}
/* The answer to an action that leaves no other mark on the screen. */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;
  background:var(--ink);color:var(--card);border-radius:7px;padding:8px 12px;font-size:12px;
  max-width:min(620px,80vw);box-shadow:0 8px 24px rgba(17,17,18,.22)}

/* The dialog sits over the frame, centred, and dims what it interrupts. */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(17,17,18,.28);
  display:grid;place-items:center;padding:24px}
.dialog{width:min(520px,92vw);background:var(--card);border-radius:12px;border:1px solid var(--line-2);
  box-shadow:0 12px 40px rgba(17,17,18,.22);display:flex;flex-direction:column;max-height:86vh}
.dialog .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.dialog .db{display:flex;flex-direction:column;gap:9px;padding:14px;overflow:auto;overscroll-behavior:contain}
.dialog .df{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line-2)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input{border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;font:inherit;font-size:12px;color:var(--ink);background:var(--card)}
.fld input:focus{outline:1px solid var(--ink);outline-offset:1px}
/* A message carries the article, its two numbers and the notes: the box has
   to show enough of it to be read before it is sent. */
.dialog.wide{width:min(680px,94vw)}
.mailbody{border:1px solid var(--line-2);border-radius:6px;padding:8px 9px;font:inherit;font-size:12px;
  line-height:1.45;color:var(--ink);background:var(--card);resize:vertical;min-height:150px}
.mailbody:focus{outline:1px solid var(--ink);outline-offset:1px}
/* The drop zone: one quiet outline, the system picker behind a click, and
   the whole dialog accepting the drop so the aim does not have to be exact. */
.maildrop{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;
  border:1px solid var(--line);border-radius:6px;color:var(--ink-2);font-size:12px;cursor:pointer}
.maildrop:hover{background:var(--fill)}
.maildrop.over{border-color:#8ba00f;background:#eef1e0;color:var(--ink)}
.maildrop u{text-underline-offset:2px}
.chip .mx{display:inline-flex;margin-left:2px;color:var(--ink-3);cursor:pointer}
.chip .mx:hover{color:var(--ink)}
.chip .mx svg{width:12px;height:12px}

/* A provision reads as a card, drawing first: the rule is seen before its
   number is read. The drawing touches the card's edges, the words sit under
   it, and the two numbers are not repeated — they are inside the drawing. */
.codegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}

/* One body of rules at a time, named by the tab above the page: the three
   codes no longer share the width three ways, so an article reads at the
   full width of the card — drawing at the left, sentence at the right —
   instead of in a column narrow enough to stack them. */
.crumb .omark{width:14px;height:14px;flex:0 0 14px;color:#c0d739}
.codelist{display:flex;flex-direction:column;gap:8px}
.codelist .codeempty{font-size:12px;color:var(--ink-3);padding:4px 2px}
/* The question bar of a code: the whole code is read, in the office's
   copy then online, and the answer is the articles that govern the
   question, each saying where it was found. Its words show at any
   fidelity, like the dialog: it is the application answering. */
.cask{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 10px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
/* The search and « Ajouter » share one line, their centres level. */
.caskrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.caskrow .cask{flex:1;min-width:0}
.cask:focus-within{border-color:var(--ink)}
.cask svg{width:14px;height:14px;color:var(--ink-3);flex:none}
.cask input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:12.5px;color:var(--ink);background:transparent}
.cask input::placeholder{color:var(--ink-3)}
.cask .x{display:none}
.cask.has .x{display:flex}
.cask .x{align-items:center;color:var(--ink-3);cursor:pointer;padding:3px}
.cans{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cans:empty{display:none}
.cprog{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.cprog .s{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.cprog .s b{font-weight:500;color:var(--ink-2)}
.cprog .s.off{text-decoration:line-through;opacity:.6}
.cprog .s .ok svg{width:12px;height:12px;color:#2f7a4d}
.cprog .s svg{width:12px;height:12px}
.cprog .run{width:10px;height:10px;border:1.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:cspin .8s linear infinite}
@keyframes cspin{to{transform:rotate(360deg)}}
.chead{font-size:11.5px;color:var(--ink-3)}
.chead b{color:var(--ink);font-weight:600}
.csyn{padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--fill-2);font-size:12.5px;color:var(--ink)}
.csyn .cite{display:inline-flex;height:18px;padding:0 5px;margin:0 1px;border:1px solid var(--line);border-radius:4px;background:var(--card);font-size:11px;color:var(--ink-2);vertical-align:1px}
.csyn .cite[data-act]{cursor:pointer}
.csyn small{display:block;margin-top:3px;color:var(--ink-3);font-size:11px}
.chit{display:grid;grid-template-columns:minmax(78px,max-content) 1fr auto;gap:2px 12px;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card)}
.chit:hover{border-color:var(--line)}
.chit .id{font-weight:600;font-size:12.5px;white-space:nowrap}
.chit .t{font-weight:600;font-size:13px}
.chit .q{grid-column:2 / 4;color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chit .q mark{background:#f6e7a6;color:var(--ink);padding:0 1px;border-radius:2px}
.chit .why{grid-column:2 / 4;font-size:12.5px;color:var(--ink)}
.chit .why i{font-style:normal;color:var(--ink-3)}
.chit .from{grid-column:2 / 4;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);min-width:0}
.chit .from > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chit .from b{font-weight:500;color:var(--ink-2)}
.chit .from svg{width:12px;height:12px;flex:none}
.chit .from a{color:var(--ink-2);margin-left:auto;white-space:nowrap}
.chit .flag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:10.5px;white-space:nowrap;border:1px solid var(--line);flex:none}
.chit .flag.new{border-color:#b3261e;color:#b3261e}
.chit .clarity{cursor:default}
.chit .clarity:hover{border-color:transparent;background:none}
.celse{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.celse svg{width:12px;height:12px}
.celse u{color:var(--ink);cursor:pointer}
.clh{font-size:11.5px;color:var(--ink-3);padding-top:2px}
.coderow{display:grid;grid-template-columns:258px 1fr;gap:0;align-items:stretch;
  border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);overflow:hidden}
/* Under the pointer the card takes the lightest grey; chosen, a firmer grey
   or black fill turns its words, buttons, pin and linework over with it.
   No dark contour either way. The schematic has no ground of its own: it
   sits on the card's fill. */
.coderow{transition:background-color .12s,border-color .12s}
.coderow:hover{background:var(--fill-2);border-color:var(--fill-2)}
.coderow.on{background:var(--fill);border-color:var(--fill)}
:root[data-art-sel="black"] .coderow.on{background:var(--ink);border-color:var(--ink)}
:root[data-art-sel="black"] .coderow.on > .tx,:root[data-art-sel="black"] .coderow.on > .draw{--ink:#fff;--ink-2:rgba(255,255,255,.78);--ink-3:rgba(255,255,255,.55);
  --line:rgba(255,255,255,.28);--line-2:rgba(255,255,255,.18);--card:transparent;--fill:rgba(255,255,255,.1);--fill-2:rgba(255,255,255,.1);color:#fff}
:root[data-art-sel="black"] .coderow.on > .draw img{filter:invert(1);mix-blend-mode:screen}
:root[data-art-sel="black"] .coderow.on .btnw{background:transparent;border-color:rgba(255,255,255,.28);color:#fff}
:root[data-art-sel="black"] .coderow.on .btnw:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5)}
:root[data-art-sel="black"] .coderow.on .btnw.done{background:#fff;border-color:#fff;color:var(--ink)}
:root[data-art-sel="black"] .coderow.on .btnw.done svg{color:var(--ink)}
:root[data-art-sel="black"] .coderow.on .artpin:hover{background:rgba(255,255,255,.12)}
.coderow > .draw{padding:10px;background:transparent;display:grid;place-items:center}
/* Every card says it opens a thread: « Commenter », or how many are there. */
.ccmt{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--line-2);
  font-size:11.5px;color:var(--ink-2);background:var(--card);cursor:pointer;white-space:nowrap}
.ccmt .lu{width:13px;height:13px}
.ccmt b{font-weight:600;color:var(--ink)}
.ccmt:hover{background:var(--fill)}
.coderow.on .ccmt{background:var(--ink);border-color:var(--ink);color:#fff}
.coderow.on .ccmt b{color:#fff}
/* The Codes column: thread, composer, and the interlocutors at its foot. */
.csub{font-size:11.5px;font-weight:400;color:var(--ink-3);margin-left:6px}
.cside{display:flex;flex-direction:column;gap:9px;min-height:100%}
.cnone{font-size:12px;color:var(--ink-3);padding:2px}
.ncard.acmt{cursor:default}
.ncard.acmt .au{padding-right:0}
.ncard.acmt .aact{margin-left:auto;display:inline-flex;gap:2px}
.ncard.acmt.new{border-color:var(--line-2)}
.ncard.acmt .noteinput{width:100%}
/* The interlocutors stand apart from the thread on a grey ground, not
   behind a rule; between people, space does the separating. */
.cfoot{margin-top:auto;background:var(--fill-2);border-radius:8px;padding:10px 10px 4px;display:flex;flex-direction:column}
.cfoot .contact{border-bottom:0;padding:5px 0}
.cfoot .mailto{background:#fff}
.clbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 0 4px}
.clbl .lu{width:14px;height:14px}
.clbl i{font-style:normal;font-weight:400;color:var(--ink-3);font-size:11px}
.coderow > .draw img{width:100%;height:auto;display:block;mix-blend-mode:multiply}
.coderow > .tx{padding:11px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.coderow .note{border-left:2px solid var(--vert);padding-left:9px;display:flex;flex-direction:column}
.nedit{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:5px;color:var(--ink-3);cursor:pointer}
[data-fi="high"] .nedit.hi{display:inline-flex}
.nedit:hover{background:var(--fill-2);color:var(--ink)}
.nedit svg{width:13px;height:13px}
/* A disagreement between two drawings, marked where it happens. Red is
   not decoration here: it is the one thing on the sheet that is wrong. */
/* The mark is drawn once, at one size, and the sheet's scale is undone on
   it in paintSheet: typesetting a 1.75 px font at 600 % lost the metrics
   and the digits fell out of the pill. Its height is fixed and both
   children are centred in it; the number is nudged by the small gap
   between a digit's ink and its line box, so the glyph — not the box —
   lines up with the triangle at any magnification. */
.xmark{position:absolute;z-index:16;transform-origin:50% 50%;display:inline-flex;align-items:center;gap:4px;
  height:19px;padding:0 7px 0 6px;border-radius:999px;
  border:1px solid #b3261e;background:rgba(255,255,255,.95);color:#b3261e;font-weight:600;font-size:10.5px;
  line-height:1;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums;
  box-shadow:0 1px 3px rgba(17,17,18,.18)}
.xmark svg.lu{width:11px;height:11px;flex:0 0 11px;display:block}
.xmark b{display:block;font-weight:600;transform:translateY(-.03em)}
/* Under the pointer it fills: the contour would only repeat the fill it
   sits on, so it goes with it. */
.xmark:hover{background:#b3261e;color:#fff;border-color:transparent}
.xmark.has{border-color:#4c7a2f;color:#3d6b22;background:rgba(255,255,255,.95)}
.xmark.has:hover{background:#3d6b22;color:#fff;border-color:transparent}
[data-fi="low"] .xmark b{display:none}
/* Its card sits in the pane, not on the sheet: it must not move or grow
   with the drawing it is talking about. */
.xcard{position:absolute;left:12px;top:12px;z-index:9;width:296px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;
  box-shadow:0 8px 24px rgba(17,17,18,.14)}
.xcard .hd{display:flex;align-items:baseline;gap:7px}
.xcard .hd b{font-size:12.5px}
/* The card opens with the conflict's own mark: the same red triangle the
   drawing and the list carry, so the three surfaces say one thing. */
.xcard .hd .xi{display:inline-flex;align-self:center;color:#b3261e}
.xcard .hd .xi svg{width:14px;height:14px}
.xcard .hd .dt{font-size:11px;color:var(--ink-3);flex:1}
.xcard .hd .x{cursor:pointer;color:var(--ink-3);display:inline-flex}
.xcard .hd .x:hover{color:var(--ink)}
.xcard .wh{font-size:12px;color:var(--ink)}
.xcard .fn{font-family:var(--mono,monospace);font-size:10.5px;color:var(--ink-3);line-height:1.5}
.xcard .cg{font-size:11px;color:var(--ink-2)}
.xcard .lb{font-size:11px;color:var(--ink-3)}
.xcard .tk{display:flex;gap:7px;align-items:flex-start;border-left:2px solid var(--vert);padding-left:8px}
.xcard .tk svg{width:13px;height:13px;color:#3d6b22;flex:0 0 13px;margin-top:2px}
.xcard .tk b{font-size:12px;font-weight:600;display:block}
.xcard .tk i{font-size:11px;color:var(--ink-3);font-style:normal}
.noteinput{flex:1;resize:vertical;border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;
  font:inherit;font-size:12px;color:var(--ink);background:var(--card)}
.noteinput:focus{outline:1px solid var(--ink);outline-offset:1px}
/* How clear the provision is to read, as the office judged it: a dot, a
   word, and a menu of three. The dot is the only colour on the row, and it
   is there to be caught out of the corner of the eye when a client asks
   why the rule says what it says. */
.clarity{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
  color:var(--ink-2);border:1px solid transparent;border-radius:5px;padding:2px 6px;white-space:nowrap}
.clarity:hover{border-color:var(--line);background:var(--card)}
/* The fidelity switch turns every .hi into a block, which dropped this
   chip's flex row — and an inline box ignores a width, so the dot was
   painted at nothing and the colour only ever showed in the open menu.
   Stated again at a weight that holds. */
[data-fi="high"] .clarity.hi{display:inline-flex}
.clarity::before{content:"";flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--cl)}
.clarity[data-c="clair"]{--cl:#2f7a4d}
.clarity[data-c="moyen"]{--cl:#b58900}
.clarity[data-c="obscur"]{--cl:#b3261e}
.clarity svg{width:12px;height:12px;color:var(--ink-3)}
/* An article's bookmark: grey outline at rest, the project green once kept. */
.artpin{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--ink-3);cursor:pointer;flex:0 0 auto;align-self:center}
.artpin:hover{background:var(--fill);color:var(--ink-2)}
.artpin .lu{width:15px;height:15px}
.artpin:not(.on) .lu{fill:none}
.artpin.on{color:var(--vert)}
.artpin.on:hover{color:var(--vert)}
.claritymenu{position:absolute;top:calc(100% + 4px);right:0;z-index:7;min-width:168px;
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  display:flex;flex-direction:column;overflow:hidden}
.claritymenu .opt{display:flex;align-items:center;gap:7px;padding:6px 9px;font-size:11.5px;
  color:var(--ink);background:var(--card)}
.claritymenu .opt:hover{background:var(--fill-2)}
.claritymenu .opt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cl)}
.claritymenu .opt[data-c="clair"]{--cl:#2f7a4d}
.claritymenu .opt[data-c="moyen"]{--cl:#b58900}
.claritymenu .opt[data-c="obscur"]{--cl:#b3261e}
/* The people the provision is argued with, and how long ago each one last
   wrote: the wait is the part of the file nobody tracks. */
.contact{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.contact .who{flex:1;min-width:0;display:flex;flex-direction:column}
.contact .who b{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact .who span{font-size:11px;color:var(--ink-3)}
/* The fidelity switch blocks every .hi, which flattened this button's
   row: the glyph and the word ran together with no gap. */
[data-fi="high"] .contact .mailto.hi{display:inline-flex}
.contact .mailto .hi{display:inline}
.contact .sent{font-size:11px;color:var(--vert-ink,#4c5906)}
.contact .mailto{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  text-decoration:none;color:var(--ink-2);
  border:1px solid var(--line-2);border-radius:5px;padding:3px 7px;font-size:11px}
.contact .mailto:hover{background:var(--fill);color:var(--ink)}
.contact.slow .who span{color:#b3261e}
@media (max-width:900px){.coderow{grid-template-columns:1fr}
  .coderow > .draw{border-right:0;border-bottom:1px solid var(--line-2)}}

/* The calendar is a table of days with hairlines, not a card grid: a month
   has to be read as one block, so the cells share their borders. */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line-2);
  border-radius:var(--r);overflow:hidden;background:var(--line-2);gap:1px}
.cal .dow{background:var(--fill-2);padding:4px 6px;font-size:10.5px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em}
.cal .day{background:var(--card);padding:4px 6px;min-height:28px;min-width:0;display:flex;
  flex-direction:column;gap:2px;cursor:pointer;position:relative}
.cal.big .day{min-height:76px}
.cal .day:hover{background:var(--fill-2)}
.cal .day.dim{color:var(--ink-3);background:var(--fill-2);opacity:.65}
.cal .day.on{background:var(--fill)}
/* « + Tâche » at the foot of the chosen day only — one action at a time. */
.cal .day .dadd{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;
  border-radius:5px;background:var(--card);border:1px solid var(--line-2);font-size:11px;font-weight:500;color:var(--ink);white-space:nowrap}
.cal .day .dadd .lu{width:12px;height:12px}
.cal .day .dadd:hover{background:var(--ink);border-color:var(--ink);color:#fff}
/* Today is the whole cell in the pale green of the page's highlights, the
   same ground a chosen row wears — not a chip around its number. */
.cal .day.today{background:#eef3dc}
.cal .day.today.on{box-shadow:none}
/* « Aujourd'hui » is there only once the calendar has left today: on today
   it has nothing to do, so it is hidden, its place kept so the header does
   not shift. It hovers like every .btnw, and presses a shade blacker. */
.btnw.today.here{visibility:hidden}
.btnw.today:active{background:#000;border-color:#000;color:#fff;transform:translateY(1px)}
.cal .day .n{font-size:11.5px;font-weight:600;align-self:flex-start}
.cal .day .lbl{font-size:10.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .dots{display:flex;gap:3px;align-items:center}
.cal .dots em{font-size:10px;font-style:normal;color:var(--ink-3)}
/* A day is marked only by what has to pass before the rest. */
.pflag{display:inline-flex;align-items:center}
.pflag svg.lu{width:11px;height:11px;color:#c0362c}
/* Twelve small months at once: the year is for seeing where the work
   piles up, not for reading titles. */
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.year .ym .row{cursor:pointer;padding:2px 0}
.year .cal.sm .day{min-height:20px;padding:2px 3px}
.year .cal.sm .day .n{font-size:10px;font-weight:500}
.year .cal.sm .dow{padding:2px 3px;font-size:9.5px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line-2);
  border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;min-height:260px}
.week .wcol{background:var(--card);display:flex;flex-direction:column;cursor:pointer}
.week .wcol.on{background:var(--fill)}
.week .wh{padding:5px 6px;border-bottom:1px solid var(--line-2);font-size:11px;font-weight:600}
/* Today is the whole green column, head and body; its cards stay white. */
.week .wcol.today{background:#eef3dc}
.week .wcol.today .wh{background:#eef3dc;border-bottom-color:var(--line-2)}
.week .wb{padding:5px;display:flex;flex-direction:column;gap:4px}
.wtask{border:1px solid var(--line-2);border-radius:5px;
  padding:4px 5px;font-size:11px;display:flex;flex-direction:column;gap:1px;background:var(--card)}
.wtask .who{font-size:10px;color:var(--ink-3)}
/* The task list, option E: rows on hairlines, no cards. Done, what (title,
   then phase and article in grey), the pencil on hover, who, priority. */
.tlist{display:flex;flex-direction:column}
.tseg{display:inline-flex;gap:2px;padding:2px;border-radius:7px;background:var(--fill);align-self:flex-start;margin-bottom:6px}
.tseg > span{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:5px;font-size:11.5px;
  font-weight:500;color:var(--ink-2);cursor:pointer}
.tseg > span.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.tseg .lu{width:12px;height:12px;margin-right:-1px}
.tseg > span:not(.on) .lu{color:var(--ink-3)}
/* « Archiver » is drawn by the page's .btnw rule: grey at rest, ink under
   the cursor, a shade blacker and a pixel down when pressed. */
.task .tfile{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:5px;flex:0 0 auto;
  border:1px solid var(--line);background:var(--fill-2);color:var(--ink-2);font-size:11px;cursor:pointer;user-select:none}
.task .tfile:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.task .tfile:active{background:#000;border-color:#000;color:#fff;transform:translateY(1px)}
.task .tfile .lu{width:12px;height:12px}
/* Archived: the row folds where it stood before it leaves, and the
   « Archivées » count it went to stands out for a moment. */
.task{transition:max-height .22s ease,padding .22s ease,opacity .18s ease}
.task.gone{max-height:0 !important;padding-top:0;padding-bottom:0;opacity:0;border-bottom-width:0;overflow:hidden}
.tseg i.bump{color:var(--ink);font-weight:650}
.toast u[data-act]{color:inherit;cursor:pointer;margin-left:12px}
.tseg i{font-style:normal;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tday{display:flex;align-items:baseline;gap:6px;padding:12px 6px 5px;border-bottom:1px solid var(--line)}
.tday b{font-size:12px;font-weight:600;color:var(--ink)}
/* The day's count, a number in a circle before its date. */
.tday{align-items:center}
.tday .tcount{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--fill);color:var(--ink-2);font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.tday.today .tcount{background:var(--lit,#eef3dc);color:var(--vert-ink)}
.tnone{padding:12px 6px;font-size:12px;color:var(--ink-3)}
.task{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px solid var(--line-2);background:var(--card);cursor:pointer}
.task:hover{background:var(--fill-2)}
.task.on{background:#eef3dc}
.task .tw{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.task .ttl{font-size:12.5px;color:var(--ink)}
.task .tmeta{font-size:11px;color:var(--ink-3)}
.task .tmeta code{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.task .tdates{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.task .tmeta em{font-style:normal;color:#b3261e;font-weight:500}
.task.done .ttl{text-decoration:line-through;color:var(--ink-3)}
/* The flag is the mark and the button: solid red when the task passes
   before the rest, a hollow outline the rest of the time — shown on the
   row under the pointer, so an ordinary row carries nothing at all. */
.tflag{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;
  border-radius:50%;cursor:pointer;opacity:0}
.tflag svg{width:14px;height:14px;color:var(--ink-3)}
.tflag.on{opacity:1}
.tflag.on svg{color:#c0362c}
.task:hover .tflag,.tflag:focus-visible{opacity:1}
.tflag:hover{background:var(--fill)}
.task.done .tflag{opacity:0}
.task.done .tflag.on svg{color:var(--ink-3)}
/* The same flag in the task's own form, where it is a word. */
.tfchip svg{width:13px;height:13px}
.chip.tfchip.on{background:#c0362c;border-color:#c0362c}
/* The tick is the one control that must be hittable without aiming, so it
   is a real 15 px box with a pointer target around it. */
.task .tick{flex:0 0 auto;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--ink-3);
  background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.task:hover .tick{border-color:var(--ink-2)}
.task .tick.on{background:var(--ink);border-color:var(--ink)}
.task .tick .lu{width:10px;height:10px;stroke-width:3}
.task .tact{display:flex;align-items:center;color:var(--ink-3);opacity:0;padding:2px}
.task:hover .tact,.task.on .tact{opacity:1}
.task .tact:hover{color:var(--ink)}
.task .tact .lu{width:13px;height:13px}
/* Carried to another day: lifted out of the list and following the pointer,
   with no transition, so it sits exactly where the hand is. */
.task.carry{position:relative;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.18);
  border-color:var(--ink);cursor:grabbing}
body.tdrag,body.tdrag *{cursor:grabbing !important}
/* The day the task would land on, named before the drop rather than after. */
.day.drop,.wcol.drop{box-shadow:0 0 0 2px var(--ink) inset}

/* Who holds the task: initials of the seat, not a name. */
.avs{display:flex;gap:-2px;flex:0 0 auto}
/* Initials centre on their capitals: the line box is trimmed to cap height
   (text-box), which only works in a block container, and the block centres
   that trimmed line (align-content). Flex or grid would centre the untrimmed
   line and leave the letters about a pixel high. */
.av{display:inline-block;text-align:center;align-content:center;vertical-align:middle;width:20px;height:20px;
  border-radius:50%;background:var(--fill);border:1px solid var(--line-2);color:var(--ink-2);
  font-size:9px;font-weight:650;font-style:normal;letter-spacing:0;line-height:1;text-box:trim-both cap alphabetic}
.avs .av + .av{margin-left:-6px}
.chip.who .av{width:16px;height:16px;font-size:8px;margin-right:3px}

/* One editor for a new task and for an existing one, in the row's place. */
.tedit{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--ink);
  border-radius:var(--r);background:var(--card)}
.tin{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--line-2);border-radius:5px;padding:5px 7px;width:100%}
.tin:focus{outline:none;border-color:var(--ink)}
.tin.day{width:auto;font-size:11.5px;font-variant-numeric:tabular-nums}
.tedit .chip{cursor:pointer;font-size:11px}
.plan{position:relative;flex:1;background:repeating-linear-gradient(0deg,var(--fill-2) 0 15px,transparent 15px 16px),
  repeating-linear-gradient(90deg,var(--fill-2) 0 15px,transparent 15px 16px);
  border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--ink-3);font-size:11.5px}
/* A card with no drawing behind it shows the picture glyph, not a sentence
   describing a picture. */
.plan.ghost{color:var(--line-2)}
.plan.ghost .lu{width:22px;height:22px;stroke-width:1.5}
/* the projects page: one ratio for every project, so the rows line up */
.pcard{cursor:pointer}
.pcard .thumb{aspect-ratio:16 / 9;flex:0 0 auto;position:relative}
.pcard .ppath{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:10.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .thumb.mark{display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);
  border-radius:var(--r);overflow:hidden;background:var(--tint);color:var(--mark)}
.pcard .thumb.mark span{font-size:20px;font-weight:600;letter-spacing:.04em}
.pcard .thumb .lv{position:absolute;right:6px;bottom:5px;z-index:2;font-size:10px;color:var(--ink-3);
  background:rgba(255,255,255,.86);border-radius:4px;padding:1px 5px}
/* The rendering reads as the cover once the screen is at full fidelity; the
   initials carry the card until then. */
[data-fi="high"] .pcard .thumb.cover{background-image:url(assets/baldwin-cover.webp);
  background-size:cover;background-position:center 42%}
[data-fi="high"] .pcard .thumb.cover span{display:none}
[data-fi="high"] .plan.ghost.cover{background:url(assets/baldwin-cover.webp) center 42%/cover no-repeat;
  border-style:solid}
[data-fi="high"] .plan.ghost.cover svg{display:none}
.pnew .newbox{aspect-ratio:16 / 9;border:1px solid var(--line-2);border-radius:var(--r);background:var(--fill-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:12px}
/* the home fills the width it is given, whatever the window is */
.work > div > .pane{flex:1 1 auto;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-weight:500;color:var(--ink-3);font-size:11px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
/* The floor's area table: the selected unit is the plan outline's green. */
.tbl tr.on td{background:#eef1e0;color:var(--ink);font-weight:600}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--fill)}
.tbl tbody tr.on[data-act]:hover td{background:#e4e9cf}
.tbl tr.dim td{color:var(--ink-3)}
/* An open conflict rides on the unit number: the same red triangle the
   section counts and the material rows carry. */
.tbl .xwarn{display:inline-flex;margin-left:5px;color:#b3261e;vertical-align:-2px}
.tbl .xwarn svg{width:12px;height:12px}
.tbl .xwarn[data-act]{cursor:pointer;width:20px;height:20px;align-items:center;justify-content:center;
  border-radius:50%;margin:-4px -4px -4px 2px}
.tbl .xwarn[data-act]:hover{background:rgba(179,38,30,.1)}
.tbl tfoot td{color:var(--ink);font-weight:600}
.fqt{display:flex;flex-direction:column;gap:4px;min-width:0}
.fqh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink)}
.fqh svg{width:13px;height:13px}
.fqs{font-size:12px;font-weight:400;color:var(--ink-2);margin-left:6px}
/* A section head stays one line at any width of its pane: the title, its
   badge and its button keep their size, and the grey caption gives way,
   cut short with an ellipsis. contain:inline-size keeps the caption out of
   the pane's minimum width, so the tables alone set where the edge stops. */
.fqh > *{flex:none;white-space:nowrap}
.fqh > .fqs{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;contain:inline-size}
.fqn{font-size:11px;color:var(--ink-3)}
/* The pane holds three tables about one floor, so its title names the
   figures and a segment in the same line says which of the three is under
   the eye. The jump costs no row: it rides in the header the title was
   already using, and it follows the scroll, because a jump control that
   does not move with the wheel lies as soon as the wheel is touched. */
.secseg{display:flex;gap:2px;flex:0 0 auto;padding:2px;background:var(--fill);border-radius:8px}
.secseg .ss{height:22px;padding:0 8px;border-radius:6px;display:flex;align-items:center;
  font-size:11.5px;color:var(--ink-2);cursor:pointer;user-select:none;white-space:nowrap}
.secseg .ss:hover{background:var(--wash)}
.secseg .ss[aria-current="true"]{background:var(--card);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(17,17,18,.12)}
/* The figures switch sits over the table it changes, at its left. */
.fqcolrow{display:flex;margin:0 0 6px}
.fqcols{display:inline-flex}
/* Façade tables: the head row opens the elevation, a material row keeps
   that material in colour. The swatch is the colour the model paints it. */
.fq-fac{display:flex;flex-direction:column;gap:8px}
/* The matrix: the material names on the left, the four façades as columns.
   Only the façade headings are doors, so only they take the pointer. */
.fmx th,.fmx td{padding-left:3px;padding-right:3px}
.fmx th.n{width:48px}
.fmx th.fsum{width:54px}
/* The eye leads its façade's name: hidden eye is grey, the open one white
   on the lit heading. */
.fmx th.fh{padding-top:1px;line-height:1.25}
.fmx th.fh .feye{display:block;height:14px}
.fmx th.fh svg{display:block;width:13px;height:13px;margin:0 0 1px auto}
.fmx th.fh:hover svg{color:var(--ink)}
.fmx th.fh.fon svg{color:#fff}
.fmx .fnm{cursor:pointer}
.fmx .fnm:hover{background:var(--fill-2)}
.fmx th.fh{cursor:pointer;color:var(--ink);font-weight:600}
.fmx th.fh .fhl{text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.fmx th.fh:hover .fhl{text-decoration-color:var(--ink-3)}
.fmx th.fh.fon{background:#111;color:#fff;border-radius:5px 5px 0 0}
.fmx td.fcol{background:var(--fill-2)}
/* The shown material's row is written in its own colour — the one the
   model paints it with — not in the green of a chosen unit. */
.fmx tbody tr.on td{background:color-mix(in srgb,var(--mc) 16%,#fff);font-weight:600}
.fmx tbody tr.on td.fcol{background:color-mix(in srgb,var(--mc) 30%,#fff)}
.fmx tbody tr.on .fnm{box-shadow:inset 3px 0 0 var(--mc)}
.fmx td.fnil{color:var(--ink-3)}
.fmx td.n{cursor:pointer}
.fmx td.fnil{cursor:default}
.fmx .fsum{border-left:1px solid var(--line-2)}
.fmx .fno{min-width:16px;margin-right:2px}
.fmx .fsw{margin-right:5px}
/* The types table: a swatch before each type, as in the mix band. */
.btypes .fsw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.btypes tbody tr{cursor:pointer}
.ftbl thead th{color:var(--ink);font-size:12px;font-weight:600;border-bottom-color:var(--line)}
.ftbl thead th svg{width:13px;height:13px;margin-right:6px;vertical-align:-2px;color:var(--ink-3)}
.ftbl td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:100%}
.ftbl .fsw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.ftbl .fno{display:inline-block;min-width:21px;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* The sheet a material's name opens, under its row. */
.ftbl tr.fopen td{border-bottom-color:transparent}
.ftbl tr.fsheet td{padding:2px 6px 12px;background:none;white-space:normal;max-width:none;overflow:visible}
.fsh{display:flex;gap:12px;align-items:flex-start}
.fimg{flex:0 0 72px;width:72px;height:72px;border-radius:4px;object-fit:cover;display:block;border:1px solid var(--line-2)}
.fimg.fit{object-fit:contain;background:#fff}
.finfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.fgrid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.fgrid .fk{color:var(--ink-3)}
.fgrid .fv{color:var(--ink)}
.fchk{display:flex;gap:6px;align-items:center;font-size:11.5px;color:#9a5b00}
.fchk svg{width:13px;height:13px;flex:0 0 auto}
.flinks{display:flex;flex-wrap:wrap;gap:6px}
.flinks a{text-decoration:none}
/* A problem, counted where it lives: the one red on the page outside the
   drawing's own conflict marks, which share it. */
.ibadge{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px 0 5px;margin-left:6px;border-radius:10px;
  background:#b3261e;color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;flex:0 0 auto}
/* Scoped past `svg.lu`, the `.hi` switch and a table head's icon rule,
   which would otherwise draw the icon at 14 px, grey and pushed off by a
   margin, and turn the badge back into a block. */
.ibadge svg.lu{width:11px;height:11px;flex:0 0 11px;margin:0;color:currentColor;vertical-align:0}
[data-fi="high"] .ibadge.hi{display:inline-flex}
.ibadge.lg{height:22px;gap:4px;padding:0 8px 0 7px;margin-left:10px;border-radius:11px;font-size:12px}
.ibadge.lg svg.lu{width:13px;height:13px;flex-basis:13px}
.ibadge.sm{height:17px;padding:0 5px 0 4px;font-size:10.5px;cursor:inherit}
.fwarn{display:inline-flex;margin-left:6px;color:#b3261e;vertical-align:-2px}
.fwarn svg{width:13px;height:13px}
/* The margin's two lists */
.mtabs{display:flex;gap:2px;min-width:0}
.mtab{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:500;
  color:var(--ink-2);cursor:pointer;white-space:nowrap}
.mtab svg{width:14px;height:14px}
.mtab i{font-style:normal;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mtab:hover{background:var(--fill)}
.mtab.on{background:#111;color:#fff}
.mtab.on i{color:#cfcfd2}
.mtab.conf:not(.on){color:#b3261e}
.mtab.conf:not(.on) i{color:#b3261e}
.mtab.conf.on{background:#b3261e}
.mtab.conf.on i{color:#fff}
.igrp{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:6px 2px 0}
.igrp svg{width:13px;height:13px}
.igrp i{font-style:normal;font-weight:400;color:var(--ink-3)}
.icard{display:flex;flex-direction:column;gap:3px;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);cursor:pointer}
/* Fills, not contours, as everywhere on this page: grey under the pointer.
   The chosen conflict wears one of the panel's « Conflict Selected »
   treatments. */
.icard{transition:background-color .12s,border-color .12s}
.icard:hover{background:var(--fill);border-color:var(--fill)}
/* The chosen conflict takes the conflict's own red, not the page's black:
   black is the colour of a chosen thing anywhere on this screen, and a
   conflict is not just chosen, it is wrong. */
.icard.on{background:#b3261e;border-color:#b3261e;color:#fff}
.icard.on .who svg{color:#fff}
.icard.on .when,.icard.on .anch{color:rgba(255,255,255,.72)}
.icard .who{display:flex;align-items:center;gap:5px;font-size:12px}
.icard .who svg{width:13px;height:13px;color:#b3261e;flex:0 0 auto}
.icard .when{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap}
.icard .txt{font-size:12.5px;line-height:1.35}
.icard .anch{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.icard .anch svg{width:12px;height:12px}
body.elev .mtools{display:none}
[data-theme="dark"] .tbl tr.on td{background:#2b3313}
/* A figure and its head belong on one line: a wrapped "pi² total" stops
   being a column heading and becomes two words floating over numbers. */
.tbl th,.tbl td{white-space:nowrap}
/* The levels under a building-wide count: dimmed, because the figures are
   not theirs — still clickable, because that is how one comes back. */
.tabs.lvl[data-off="true"] .views button{opacity:.42}
.sheet{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--line);
  background:var(--card);box-shadow:0 -8px 24px rgba(0,0,0,.07);z-index:3}
.drawer{position:absolute;top:0;right:0;bottom:0;width:360px;border-left:1px solid var(--line);
  background:var(--card);box-shadow:-10px 0 28px rgba(0,0,0,.08);z-index:3}

/* fidelity ------------------------------------------------------------ */
[data-fi="high"] .bar{display:none}
[data-fi="high"] .hi{display:block}
/* A button that only exists at high fidelity still has to be a row: without
   this, display:block wins over .btnw's inline-flex and the icon falls back
   to the text baseline instead of the centre of the button. */
[data-fi="high"] .btnw.hi,[data-fi="high"] .chip.hi{display:inline-flex}
.hi{display:none}
/* The dialog and the toast are not part of the fidelity study: they are the
   application answering, so their words show at any fidelity. */
.dialog .hi,.toast.hi{display:block}
.dialog .chip .hi,.dialog .btnw .hi{display:inline}
[data-fi="high"] .lo{display:none}
[data-fi="high"] .pane{border-color:var(--line)}

/* inset card: the chrome sinks into a grey field and the work becomes one
   white card floating on it, the way a document-first app reads. The card
   is held by its own light edge and a soft drop, not by a hard border. */
.frame[data-shell="inset"]{background:var(--page-field);border-color:#eaeaec}
.frame[data-shell="inset"] .rail{background:none;border-right:0}
.frame[data-shell="inset"] .tabs{border-bottom:0}
.frame[data-shell="inset"] .body{padding:0 6px 6px}
/* The sheet the project rests on: its own panel, one shade lighter than
   the studio's chrome, carrying the project's row and its levels down to
   the white page. The project is a thing set into the studio, not a second
   half of the same bar. */
.projsheet{background:var(--ch1);border-radius:12px 12px 0 0}
/* One left edge for the whole chrome: every row's pill starts at 15 and
   every word at 25, so the studio line, the project line and the levels
   read as one stack rather than three strips that happen to be piled. */
.tabs.one{height:36px;padding:0 9px}
.tabs.two{height:38px;padding:0 9px}
/* The screen switch at the head of the project's row. It sits on the
   tabs' line, not the row's middle: its words and the level names read
   as one line of text. */
.tabs.lvl .mseg{display:inline-flex;align-items:center;gap:2px;flex:0 0 auto;align-self:flex-end;margin-bottom:6.5px;padding:2px;
  border-radius:11px;background:rgba(255,255,255,.08)}
.tabs.lvl .ms{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:9px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:rgba(255,255,255,.72);white-space:nowrap}
.tabs.lvl .ms:hover{color:#fff}
.tabs.lvl .ms[aria-current="true"]{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.tabs.lvl .ms .lu{width:14px;height:14px}
.tabs.lvl .msep{flex:0 0 1px;width:1px;height:18px;align-self:flex-end;margin:0 8px 13px;background:rgba(255,255,255,.16)}
.tabs.one .crumb,.tabs.two .crumb{padding:5px 10px;border-radius:7px}
.tabs.one .crumb[data-screen]{cursor:pointer}
.tabs.one .crumb[data-screen]:hover{background:var(--wash)}
.frame[data-chrome="black"] .tabs.one .crumb[data-screen]:hover{background:rgba(255,255,255,.1);color:#fff}
/* The project's name is the tab of the sheet it names, the way a level is
   the tab of its page: it stands on the studio's line, in the sheet's own
   shade, and its two flared feet carry it down into the sheet. Naming the
   project on the sheet itself left the sheet unlabelled above and the name
   competing with the screens beside it; as a tab it labels the sheet from
   outside and gives the second row back to the screens. */
.projtab{position:relative;align-self:flex-end;display:flex;align-items:center;height:32px;
  padding:0 12px;border-radius:var(--tabr) var(--tabr) 0 0;background:var(--ch1);color:#fff;font-size:12.5px;
  font-weight:500;white-space:nowrap;flex:0 0 auto;margin-left:6px;--tabc:var(--ch1)}
.projtab::before,.projtab::after{content:"";position:absolute;bottom:0;
  width:var(--tabr);height:var(--tabr)}
.projtab::before{right:100%;background:radial-gradient(circle at 0 0,transparent 11.2px,var(--tabc) 12.3px)}
.projtab::after{left:100%;background:radial-gradient(circle at 100% 0,transparent 11.2px,var(--tabc) 12.3px)}
/* Away from the project, its name is one more item on the studio's line:
   no sheet under it, so no tab — the same 26 px pill as the schedule, the
   same lift under the pointer. Its text stays where it was. */
.projtab.away{cursor:pointer;height:26px;margin-bottom:3px;border-radius:7px;background:none;color:rgba(255,255,255,.92)}
.projtab.away::before,.projtab.away::after{display:none}
.projtab.away:hover{background:rgba(255,255,255,.1);color:#fff}
[data-tone-top="green"] .frame[data-chrome="black"] .projtab.away{color:#141416}
[data-tone-top="green"] .frame[data-chrome="black"] .projtab.away:hover{background:rgba(0,0,0,.08)}
/* Who is signed in: the initials are the mark, the name is there because
   an office runs on several people with the same two letters. */
.me{display:flex;align-items:center;gap:8px;padding:3px 9px 3px 3px;border-radius:999px;
  color:var(--ink);font-size:12.5px;cursor:pointer;flex:0 0 auto}
.me:hover{background:var(--wash)}
.me i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--wash-2);color:var(--ink);font-style:normal;font-size:10.5px;font-weight:600}
.frame[data-chrome="black"] .me{color:#fff}
.frame[data-chrome="black"] .me:hover{background:rgba(255,255,255,.1)}
.frame[data-chrome="black"] .me i{background:rgba(255,255,255,.16);color:#fff}
.frame[data-shell="inset"] .work{background:var(--card);border:1px solid var(--line-2);border-radius:12px;
  gap:0;padding:0;overflow:hidden;box-shadow:0 1px 2px rgba(17,17,18,.04),0 10px 26px rgba(17,17,18,.045)}
.frame[data-shell="inset"] .pane{border:0;border-radius:0;background:none}
.frame[data-shell="inset"] .work > div > .pane,
.frame[data-shell="inset"] .work > .pane{border-right:1px solid var(--line)}
/* The card's own edge closes the panes: no rule runs along its foot, and
   the last pane draws no right edge, so the seams run down into the card's
   border and the header rules run out to it. */
.frame[data-shell="inset"] .work > div > .pane:not(:has(~ .pane)),
.frame[data-shell="inset"] .work > .pane:not(:has(~ .pane)){border-right:0}
/* The screen's title block sits above the panes: its rule is the line the
   pane headers hang from, not the card's foot, so it keeps it. */
.frame[data-shell="inset"] .work > div > .pane{border-bottom:1px solid var(--line)}
.frame[data-shell="inset"] .pane.sheet,.frame[data-shell="inset"] .pane.drawer{background:var(--card);
  border:1px solid rgba(17,17,18,.07);box-shadow:0 10px 26px rgba(17,17,18,.06)}

/* --------------------------------------------------------- black chrome
   The navigation goes black and the white card is the only lit surface, so
   the drawing gets all the attention. Green marks one thing: the view being
   read. The rail stays sober — where one came from is not the question. */
.frame[data-chrome="black"]{background:var(--ch0);border-color:var(--ch0);--vert:#C3E05A}
.frame[data-chrome="black"] .rail .ic,
.frame[data-chrome="black"] .rail .row,
.frame[data-chrome="black"] .rail .stk{color:rgba(255,255,255,.52)}
.frame[data-chrome="black"] .rail .ic:hover,
.frame[data-chrome="black"] .rail .row:hover,
.frame[data-chrome="black"] .rail .stk:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.frame[data-chrome="black"] .rail .ic.on,
.frame[data-chrome="black"] .rail .row.on,
.frame[data-chrome="black"] .rail .stk.on{background:rgba(255,255,255,.12);color:#fff}
.frame[data-chrome="black"] .rail .ic.on .cap{color:rgba(255,255,255,.72)}
.frame[data-chrome="black"] .tabs button{color:rgba(255,255,255,.72);font-size:13.5px}
.frame[data-chrome="black"] .tabs button:hover{background:rgba(255,255,255,.1);color:#fff}
/* The open view is white on black — the strongest mark the bar can make,
   and it costs no colour. Green is spent one row down on the level, so the
   two rows never argue over which one is the filter. */
.frame[data-chrome="black"] .tabs button[aria-current="true"]{background:#fff;color:#141416;font-weight:600}
/* A screen with no level row under it (Codes): its tab is the folder tab of
   the white card, as a level's is — it runs down to the card's top edge,
   squares its foot and flares into the card on both sides. */
.frame[data-chrome="black"] .projsheet:not(:has(> .tabs.lvl)) > .tabs.two .views{align-self:stretch;align-items:flex-end;
  padding:0 8px;margin:0 -8px}
.frame[data-chrome="black"] .projsheet:not(:has(> .tabs.lvl)) > .tabs.two button[aria-current="true"]{
  position:relative;z-index:1;height:34px;border-radius:var(--tabr) var(--tabr) 0 0;--tabc:#fff}
.frame[data-chrome="black"] .projsheet:not(:has(> .tabs.lvl)) > .tabs.two button[aria-current="true"]::before,
.frame[data-chrome="black"] .projsheet:not(:has(> .tabs.lvl)) > .tabs.two button[aria-current="true"]::after{
  content:"";position:absolute;bottom:0;width:var(--tabr);height:var(--tabr)}
.frame[data-chrome="black"] .projsheet:not(:has(> .tabs.lvl)) > .tabs.two button[aria-current="true"]::before{right:100%;
  background:radial-gradient(circle at 0 0,transparent 11.2px,var(--tabc) 12.3px)}
.frame[data-chrome="black"] .projsheet:not(:has(> .tabs.lvl)) > .tabs.two button[aria-current="true"]::after{left:100%;
  background:radial-gradient(circle at 100% 0,transparent 11.2px,var(--tabc) 12.3px)}
.frame[data-chrome="black"] .tabs .crumb{color:rgba(255,255,255,.58)}
.frame[data-chrome="black"] .tabs .crumb.ech{color:rgba(255,255,255,.92)}
.frame[data-chrome="black"] .tabs .crumb.ech:hover{background:rgba(255,255,255,.1);color:#fff}
.frame[data-chrome="black"] .tabs .crumb.ech.cur{background:#fff;color:#111}
/* The index, when it is the page being read, is lit the way the schedule is. */
.tabs .crumb.cur{background:var(--fill);color:var(--ink);font-weight:500}
.frame[data-chrome="black"] .tabs .crumb.cur{background:#fff;color:#111}
/* On the studio's own pages the lit item is the tab of the white page under
   it, the same folder tab as a level: it grows down into the page, with a
   flared foot each side. The first one stands on the page's corner — one
   straight left edge, the tab's rounded top as the corner. */
/* The studio's line holds still whichever page is open: every item keeps
   its place, its weight and its text line (centre 20 px down the 36 px
   row); only the fill says which page is read. The crumbs are 26 px pills
   standing 3 px off the floor; the open one and the project's tab are
   32 px tabs standing on it, with nothing between them and the page. */
.tabs.one{align-items:flex-end}
.tabs.one > .crumb,.tabs.one > .crumb.ech{height:26px;margin-bottom:3px;padding-top:0;padding-bottom:0}
.tabs.one > .me,.tabs.one > .btnw{align-self:center}
.tabs.one .crumb.cur:not(.ech){font-weight:400}
/* overflow:visible is what makes the feet appear at all: a crumb clips its
   own overflow so a long project name ends in an ellipsis, and that clip
   was cutting the two flared feet off flush, leaving a square step where
   the tab meets the page. The lit crumb is one short word, so it has
   nothing to clip. */
.tabs.one.studio .crumb.cur{position:relative;margin-bottom:0;height:32px;display:inline-flex;align-items:center;
  overflow:visible;border-radius:var(--tabr) var(--tabr) 0 0;background:var(--card);color:var(--ink);
  --tabc:var(--card);z-index:1}
.frame[data-chrome] .tabs.one.studio .crumb.cur[data-screen]:hover{background:var(--card);color:var(--ink)}
.tabs.one.studio .crumb.cur::before,
.tabs.one.studio .crumb.cur::after{content:"";position:absolute;bottom:0;
  width:var(--tabr);height:var(--tabr)}
.tabs.one.studio .crumb.cur::before{right:100%;background:radial-gradient(circle at 0 0,transparent 11.2px,var(--tabc) 12.3px)}
.tabs.one.studio .crumb.cur::after{left:100%;background:radial-gradient(circle at 100% 0,transparent 11.2px,var(--tabc) 12.3px)}
.tabs.one.studio > .crumb:first-child.cur{margin-left:-9px;padding-left:13px}
.tabs.one.studio > .crumb:first-child.cur::before{display:none}
.body:has(.tabs.one.studio > .crumb:first-child.cur) .work{border-top-left-radius:0}
.frame[data-chrome="black"] .tabs .crumb.on{color:#fff;font-size:13px}
.frame[data-chrome="black"] .tabs .div,
.frame[data-chrome="black"] .tabs .sep{background:rgba(255,255,255,.16)}
/* The card is the same white card; only what holds it changes. */
.frame[data-chrome="black"][data-shell="inset"] .work{border-color:rgba(255,255,255,.1);
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35)}
/* On a project the white page rests inside the project's grey sheet rather
   than flush with it: the sheet runs on around the page's sides and foot,
   as wide as the black frame's own margin, so black → grey → white step in
   by the same 6 px all round. The grey around the page is the page's own
   spread shadow, so it follows the page's corners at radius + 6. */
.frame[data-shell="inset"] .body:has(> .projsheet) > .work{margin:0 6px 6px;
  border-radius:12px;box-shadow:0 0 0 6px var(--ch2)}
/* The band reaches 6px lower, behind the page's rounded top corners: what
   the corners curve away from is the band's own grey, so no chrome shows
   through the join and the page keeps curved corners on all four sides. */
.frame[data-shell="inset"] .body > .projsheet{padding-bottom:6px;margin-bottom:-6px}
.body > .projsheet{border-radius:18px 18px 0 0}
.frame[data-chrome="black"] .rg::before{color:rgba(255,255,255,.45)}

/* The three fills of the dark chrome, each picked on the panel: the top
   bar (the studio's field), the tab row (the project's sheet and its name
   tab) and the border round the white page. Each takes the current shade,
   a dark grey, true black or the office green. Words standing on green
   turn dark: white on that green is not read. */
:root{--ch0:#141416;--ch1:#232327;--ch2:#232327}
:root[data-tone-top="gray"]{--ch0:#2a2a2e}
:root[data-tone-top="black"]{--ch0:#000}
:root[data-tone-top="green"]{--ch0:#c3e05a}
:root[data-tone-row="gray"]{--ch1:#3a3a3f}
:root[data-tone-row="black"]{--ch1:#000}
:root[data-tone-row="green"]{--ch1:#c3e05a}
:root[data-tone-band="gray"]{--ch2:#3a3a3f}
:root[data-tone-band="black"]{--ch2:#000}
:root[data-tone-band="green"]{--ch2:#c3e05a}
/* on a green top bar: the studio's line */
[data-tone-top="green"] .frame[data-chrome="black"] .tabs.one .crumb{color:rgba(20,20,22,.7)}
[data-tone-top="green"] .frame[data-chrome="black"] .tabs.one .crumb.ech,
[data-tone-top="green"] .frame[data-chrome="black"] .me{color:#141416}
[data-tone-top="green"] .frame[data-chrome="black"] .tabs.one .crumb[data-screen]:hover,
[data-tone-top="green"] .frame[data-chrome="black"] .me:hover{background:rgba(0,0,0,.08);color:#141416}
[data-tone-top="green"] .frame[data-chrome="black"] .me i{background:rgba(0,0,0,.12);color:#141416}
/* on a green tab row: the project's name, the screen switch, the levels */
[data-tone-row="green"] .frame[data-chrome="black"] .projsheet .tabs button,
[data-tone-row="green"] .frame[data-chrome="black"] .projsheet .tabs .crumb,
[data-tone-row="green"] .frame[data-chrome="black"] .tabs.lvl .ms{color:rgba(20,20,22,.7)}
[data-tone-row="green"] .frame[data-chrome="black"] .projtab,
[data-tone-row="green"] .frame[data-chrome="black"] .projsheet .tabs .crumb.on,
[data-tone-row="green"] .frame[data-chrome="black"] .tabs.lvl .ms:hover{color:#141416}
[data-tone-row="green"] .frame[data-chrome="black"] .projsheet .tabs button:hover{background:rgba(0,0,0,.08);color:#141416}
[data-tone-row="green"] .frame[data-chrome="black"] .tabs.lvl .mseg{background:rgba(0,0,0,.07)}
[data-tone-row="green"] .frame[data-chrome="black"] .tabs.lvl .ms[aria-current="true"]{background:rgba(0,0,0,.12);color:#141416}
[data-tone-row="green"] .frame[data-chrome="black"] .projsheet .tabs .div,
[data-tone-row="green"] .frame[data-chrome="black"] .projsheet .tabs .sep,
[data-tone-row="green"] .frame[data-chrome="black"] .tabs.lvl .msep{background:rgba(0,0,0,.18)}

/* High fidelity swaps the hatch for the drawing it stands for: the floor
   plan, the elevation, or the massing view, all from the platform assets. */
[data-fi="high"] .plan{background:none;border-style:solid}
[data-fi="high"] .plan[data-img]{background-repeat:no-repeat;background-position:center;
  background-size:cover;border-color:var(--line)}
[data-fi="high"] .plan[data-img] > .hi{display:none}
/* --plan is set on the frame from the level the tabs are on: one sheet per
   level, not one picture relabelled. */
[data-fi="high"] .plan[data-img="plan"]{background-image:var(--plan,none)}
/* Une vignette est recadrée sur une boîte mesurée sur l'étage type: elle lit
   donc toujours cette feuille-là, pas celle du niveau courant, sinon le
   cadrage tombe à côté de l'unité. */
[data-fi="high"] .plan[data-img="unit"]{background-image:url(assets/plan-niveau-5.jpg)}
[data-fi="high"] .plan[data-img="massing"]{background-image:url(assets/skp-ensemble.webp)}
/* The opening schedules: the sheets a window or door size is read from,
   which is what the Ouvertures tab is about — not another floor plan. */
[data-fi="high"] .plan[data-img="openings"]{background-image:url(assets/ouvertures-fenetres.webp);
  background-size:contain;background-color:#fff}
[data-fi="high"] .plan[data-img="doors"]{background-image:url(assets/ouvertures-portes.webp);
  background-size:contain;background-color:#fff}

/* The consultants' sheets sit over the floor plan in one shared coordinate
   space: the plan box takes the drawing's own aspect, so the drawing fills
   it without being stretched and a percentage means the same thing on every
   layer. Every sheet keeps its own ink: the architect's colour carries
   meaning too — stationnement, parcours sans obstacle, pentes — so it is
   shown as it was plotted and not flattened to grey. */
.plan.align{aspect-ratio:2000 / 1675;height:auto;flex:0 0 auto;overflow:hidden}
[data-fi="high"] .plan.align[data-img]{background:none}
/* The architect's sheet is a drawing in the pile like the others, so its
   ink has to be able to pass in front of the surveyor's or sink behind
   it. Both the raster that holds the pane while the vectors run and the
   canvas that replaces it read the same two variables, written on .plan
   from the order and the opacity of that one drawing. */
[data-fi="high"] .plan.align[data-img="plan"]::before{content:"";position:absolute;inset:0;
  background:var(--plan,none) center/contain no-repeat;z-index:var(--planz,1);opacity:var(--planop,1);
  mix-blend-mode:multiply}
[data-fi="high"] .plan.align[data-img="plan"][data-supabase-tiles="ready"]::before{opacity:0}
/* Vectors over the picture, not instead of it: a pass takes a few seconds
   on a permit sheet, and the pane must never be empty while it runs. The
   canvas is transparent until the sheet lands on it, then it covers the
   JPEG exactly, in the same box, so every overlay keeps its coordinates. */
