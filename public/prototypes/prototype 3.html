        <div class="tile"><div class="row"><span class="lo bar" style="width:40%"></span><span class="hi">${ALL_UNITS.length} unités — 8 niveaux — lu il y a 6 min</span></div></div>`, "flex:1.5")}
    </div>`,

  "Recent, then all": () => `<div style="display:flex;gap:var(--gap);flex:1;min-height:0">
      <div class="col" style="flex:1;min-height:0">
        ${pane("récents", "Ouverts cette semaine", `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${PROJECTS.slice(0, 3).map((p, i) => pcard(p, i)).join("")}</div>`, "flex:0 0 210px")}
        ${pane("tous les projets", "Tout le reste", ptable())}
      </div>
      <div class="col" style="flex:.5;min-height:0">${pane("démarrer", "Démarrer un projet", pnew(true))}</div>
    </div>`,

  "Start first": () => `<div class="col" style="flex:1;min-height:0;gap:var(--gap)">
      ${pane("démarrer", "Démarrer un projet", pnew(true), "flex:0 0 55%")}
      ${pane("en cours", "Ou poursuivre avec", plist(-1))}
    </div>`,
};

function navHTML() {
  if (SCREENS[V.screen].index || SCREENS[V.screen].studio) return "";
  const mode = V.nav.layout;
  if (mode === "Top bar only" || mode === "Tabs only, no rail"
    || mode === "Two rows, no rail") return "";
  const sections = mode === "Wide rail with sections";
  const wide = mode === "Wide rail with labels" || sections;
  const stack = mode === "Rail with labels under icons";
  const ic = railIcons();
  const items = NAV.map((name, i) => {
    const on = name === V.screen ? "on" : "";
    const g = ic ? icon(navIcon(name)) : "";
    const text = `<span class="hi">${navLabel(name, i)}</span>`;
    const head = sections && SECTIONS[i] ? `<div class="sct hi">${SECTIONS[i]}</div>` : "";
    if (wide) return `${head}<div class="row ${on}" data-screen="${name}" title="${labelOf(name)}">${g}<span class="lo bar" style="width:70%"></span>${text}</div>`;
    if (stack) return `<div class="stk ${on}" data-screen="${name}" title="${labelOf(name)}">${g}<span class="lo bar" style="width:70%;height:6px"></span>${text}</div>`;
    return `<div class="ic ${on}" data-screen="${name}" title="${labelOf(name)}">${g || `<span class="code hi">${SHORT(name)}</span>`}${g ? `<span class="cap hi">${navLabel(name, i)}</span>` : ""}</div>`;
  }).join("");
  const cls = wide ? "wide" : stack ? "stack" : "";
  return `<nav class="rail rg ${solo("nav")} ${cls}" data-rg="navigation" data-fi="${fiOf("nav")}"
       data-labels-mode="${V.nav.labels}">${items}</nav>`;
}

/* The rail and the tab strip never carry the same destinations. When the
   rail lists the screens, the strip drops to the current screen's own views.
   The index has none: every project is on the page, and the Archivés tab
   filtered nothing — it offered a second list that was the same list. */
const CONTEXT = {
  "Unités": LEVEL_VIEWS,
  /* A body of rules is a tab the way a floor is: the page under it holds
     one code, read whole, instead of two codes each squeezed into half
     the width. Both are always offered, even when one has
     no article followed yet, so the strip does not change shape as
     articles are added. */
  "Codes": CODE_GROUPS.map(([, label]) => label),
};

function tabsHTML() {
  const mode = V.nav.layout;
  /* The rail belongs to a project, so it never carries the studio level:
     the studio strip is drawn even where tabs are off, or the week of the
     whole office would have no door. */
  const studio = SCREENS[V.screen].index || SCREENS[V.screen].studio;
  if (mode === "Rail only, no tabs" && !studio) return "";
  const top = mode === "Top bar only";
  const ic = tabIcons();
  const names = Object.keys(SCREENS).filter((n) => !SCREENS[n].index && !SCREENS[n].studio);
  /* Icons off and labels away would leave an empty strip, so the short code
     stands in: a tab target never renders without something to read. */
  const bare = !ic && (V.nav.labels === "Hidden" || V.nav.labels === "Hover only");
  const tab = (name, i) => `<button data-screen="${name}" aria-current="${name === V.screen}" title="${labelOf(name)}">
      ${ic ? icon(SCREENS[name].icon) : ""}<span class="lo bar" style="width:46px"></span>
      ${bare ? `<span class="hi code">${SHORT(name)}</span>` : `<span class="hi">${navLabel(name, i)}</span>`}</button>`;

  let items;
  const views = CONTEXT[V.screen] || [];
  /* Under "Bâtiment entier" no level is the one being read, so none is lit. */
  const viewBtn = (t, i) => `<button ${act("view", i)} aria-current="${i === viewIndex(V.screen) && !buildingScope()}">
    ${V.screen === "Codes" ? icon(CODE_GLYPH[t]) : ""}<span class="lo bar" style="width:46px"></span><span class="hi">${t}</span></button>`;
  /* The index is reached from the words "Tous les projets". They sit in the strip
     on every screen; on the index itself they are the only thing in it. */
  const idxOn = V.screen === "Projets";
  /* The office's mark stands where the folder was: the way home is the
     office's own sign, and the strip gains nothing to read. */
  const back = `<span class="crumb hi ${idxOn ? "cur" : ""}" data-screen="Projets" aria-current="${idxOn}" title="Tous les projets">${OFFICE_MARK}Tous les projets</span>`;
  /* The studio's schedule is not a step on the way into this project, so it
     leaves the path on the left and sits at the right end of the strip with
     the other things that are about leaving: it is a door out, like Partager
     is a door out, and the path reads project → screen without a detour. */
  const echOn = V.screen === "Échéancier";
  const ech = `<span class="crumb ech hi ${echOn ? "cur" : ""}" data-screen="Échéancier" aria-current="${echOn}"
      style="flex:0 0 auto"
      title="Échéancier de l'atelier — ce qui est dû, tous les projets">${icon("calendar-check")}Échéancier</span>`;
  /* The first row is the studio's, and it is the same row on every screen:
     every project, the schedule across them, the person signed in. The
     screen being read is lit in it — the index, the schedule — and on a
     project screen neither is, because the project's own row is below. */
  const me = `<span class="me" title="${ME.name}"><i>${ME.ini}</i><span class="hi">${ME.name}</span></span>`;
  /* The project's tab stays on the studio's line on every page. On the
     index and the schedule no project is open, so it is a tab behind the
     page rather than the top of a sheet: a click on it goes back to the
     screen the project was last read on. */
  if (!studio) V.projBack = V.screen;
  const projTab = studio
    ? `<span class="projtab away" data-screen="${V.projBack || "Unités"}" title="Revenir à ${V.project}">${V.project}</span>`
    : `<span class="projtab">${V.project}</span>`;
  /* Sharing names the project it shares, so on a project screen it sits on
     the studio's line, after the project's tab, beside the person sharing. */
  const shareLvl = studio || mode !== "Two rows, no rail" ? "" : `<span class="btnw lvlshare" ${act("share")} title="Partager le projet en lecture et commentaires"
       style="flex:0 0 auto;margin-left:10px;margin-bottom:9px">${icon("share-2")}<span class="hi">Partager</span></span>`;
  const one = `<div class="tabs one ${studio ? "studio" : ""} rg ${solo("nav")}" data-rg="atelier" data-fi="${fiOf("nav")}"
       data-labels-mode="${V.nav.labels}">
      ${back}${ech}${projTab}<span class="sp"></span>${me}
    </div>`;
  if (studio) return one;
  if (!views.length && mode !== "Two rows, no rail") {
    /* A screen that reads on one page has nothing to filter, so the strip
       carries the project's name and the way back, and no tabs at all. The
       two-row layout is the exception: it is the only way between screens,
       so its first row is on every screen, views or not. */
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span><span class="sp"></span>`;
  } else if (mode === "Rail + view menu") {
    /* One button that steps through the views, because a menu that cannot
       open is not a control. */
    items = `<span class="btnw solid" ${act("viewnext")} title="Vue suivante"><span class="hi">${views[viewIndex(V.screen)]}</span>${icon("chevron-down")}</span>
      <span class="sp"></span>
      <span class="chip hi">${viewIndex(V.screen) + 1} / ${views.length}</span>`;
  } else if (mode === "Rail + breadcrumb") {
    items = `${back}${icon("chevron-right")}
      <span class="crumb on hi">${V.project}</span>
      <span class="sp"></span>`;
  } else if (top || mode === "Tabs only, no rail" || mode === "Two rows, no rail") {
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span>
      <span class="div"></span><div class="views">${names.map(tab).join("")}</div><span class="sp"></span>`;
  } else {
    /* The project name is on the path, before the views: it is read at the
       same time as where one is, and it is the way back to the index. The
       views scroll under it rather than pushing it off the strip. */
    items = `${back}${icon("chevron-right")}<span class="crumb on hi">${V.project}</span>
      <span class="div"></span>
      <div class="views">${views.map(viewBtn).join("")}</div>
      <span class="sp"></span>`;
  }
  /* The second row only exists when the screen has something to ask for.
     Aperçu keeps the single row, and the drawing gets the thirty-two
     pixels back. "Bâtiment entier" sits at the head of that row, before
     Niveau 1, because it is the same question the levels answer: which
     floor — or all of them. Chosen, it dims the levels, since a figure
     counted over eight floors has no level; clicking one is how you come
     back. */
  const off = buildingScope();
  const wholeBtn = V.screen === "Unités"
    ? `<button ${act("scope", "Bâtiment")} aria-current="${off}" title="Compter le bâtiment entier"
         style="flex:0 0 auto">${icon("building-2")}<span class="hi">Bâtiment entier</span></button>`
    : "";
  /* One row for the project: the screen is a quiet switch at its head, and
     the levels follow it. The only white tab is the level, which touches
     the page it opens; the switch is a control, not a tab. Codes has no
     levels: the switch stands alone. */
  const modeSeg = `<span class="mseg" role="group" aria-label="Écran">${names.map((n, i) =>
    `<span class="ms" data-screen="${n}" aria-current="${n === V.screen}" title="${labelOf(n)}">${ic ? icon(SCREENS[n].icon) : ""}<span class="hi">${navLabel(n, i)}</span></span>`).join("")}</span>`;
  const row2 = mode === "Two rows, no rail"
    ? `<div class="tabs lvl rg ${solo("nav")}" data-rg="vues" data-fi="${fiOf("nav")}"
         data-style="${V.nav.tabStyle}" data-labels-mode="${V.nav.labels}" data-off="${off}">
        ${modeSeg}${views.length ? `<span class="msep"></span>${wholeBtn}
        <div class="views">${views.map(viewBtn).join("")}</div>` : ""}${shareLvl}</div>`
    : "";
  /* A project is read by people who do not draw: the client, the urbaniste,
     the contractor. Sharing ends the project's own row, on the same line as
     the name of what is being shared. */
  const share = `<span class="btnw" ${act("share")} title="Partager le projet en lecture et commentaires"
         style="margin-left:auto;flex:0 0 auto">${icon("share-2")}<span class="hi">Partager</span></span>`;

  /* Two subjects, two rows. The first belongs to the studio: every project,
     the week across them all, the person signed in — and, on a project, the
     project's tab and the button that shares it. The second is the
     project's sheet, one shade lighter: which screen, which level, down to
     the white page. */
  if (mode === "Two rows, no rail") {
    return `${one}
      <div class="projsheet">${row2}</div>`;
  }

  return `<div class="tabs rg ${solo("nav")}" data-rg="${top ? "navigation + onglets" : "onglets"}" data-fi="${fiOf("nav")}"
       data-style="${V.nav.tabStyle}" data-align="${V.nav.tabAlign}" data-labels-mode="${V.nav.labels}">
    ${top ? `<span class="btnw" style="margin-right:8px">${icon("box")}<span class="hi">ça fitte</span></span>` : ""}
    ${items}${ech}${share}
  </div>${row2}`;
}

function headerHTML() {
  /* The subtitle answers to the state: which project is open, which level is
     being read, how many rows the current view is actually showing. Codes
     has none: the articles are on screen and the only count that mattered
     there counted a compliance the screen does not declare. */
  const open = Object.keys(V.settled).length;
  /* The index needs no count: the projects are on screen, and one line of
     arithmetic above them only repeats what the eye already did. */
  /* Under "Bâtiment entier" the screen is not reading a floor, so the title
     says the building and counts it — the level in the strip below has no
     say in these figures, which is the confusion the scope switch removes.
     The counts are summed from the same unit rows the Statistiques pane
     reads, so the title and the pane never disagree. */
  const bq = buildingScope() ? buildingQuant() : null;
  const title = { "Projets": ["Projets Lafond Architecte", ""],
    /* The full name of the code being read; the tab above keeps its short one. */
    "Codes": [(() => { const c = CODE_SOURCES.find((x) => x.short === viewOf("Codes"));
      return c ? (c.name.includes(c.place) ? c.name : `${c.name} — ${c.place}`) : "Codes et règlements"; })(), ""],
    "Échéancier": ["Échéancier", ""],
    "Unités": buildingScope()
      ? [`${V.project} — bâtiment entier`,
        `${LEVELS.length} niveaux — ${bq.count} unités — ${fqNum(bq.net)} pi² nets`]
      : [`Plans — ${viewOf("Unités").toLowerCase()}`, ""],
  }[V.screen] || [V.screen, ""];
  const metrics = V.header.layout === "Title + metrics";
  const bare = V.header.layout === "Title only";
  return `<header class="pane rg ${solo("header")}" data-rg="entête" data-fi="${fiOf("header")}" style="flex:0 0 auto">
    <div class="pb" style="padding:10px 12px;gap:8px">
      <div class="row">
        <div class="col" style="flex:1;gap:5px">
          <div class="lo bar" style="width:170px;height:13px"></div>
          <div class="lo bar lt" style="width:260px;height:8px"></div>
          <div class="hi" style="font-size:16px;font-weight:600;display:flex;align-items:center">${title[0]}${(() => {
            /* The badge counts what the page is reading: this level, or the
               building under « Bâtiment entier ». A count that never moved
               told the reader nothing about where he was. */
            const n = V.screen === "Unités" ? issuesHere().length : 0;
            return n ? `<span class="ibadge lg" ${act("issues")} title="Voir la liste des conflits"
              >${icon("alert-triangle")}${n} conflit${n > 1 ? "s" : ""}</span>` : "";
          })()}</div>
          ${title[1] ? `<div class="hi" style="font-size:12px;color:var(--ink-2)">${title[1]}</div>` : ""}
        </div>
        ${bare ? "" : SCREENS[V.screen].home
          ? `<span class="btnw solid" ${act("newproject")} title="Démarrer un projet">${icon("plus")}<span class="lo bar" style="width:52px"></span><span class="hi">Nouveau projet</span></span>`
          /* AutoCAD and SketchUp used to sit up here, a screen away from the
             drawing they open. They live on the drawing pane now. */
          : buildingScope()
          ? `<span class="btnw" ${act("csvall")} title="Télécharger les quatre tableaux en .csv">${icon("download")}<span class="lo bar" style="width:40px"></span><span class="hi">Tout exporter en .csv</span></span>`
          /* Exporting a floor's table is an act on that table, so the
             button sits on the table's own header, not a screen away. */
          : ""}
      </div>
      ${metrics ? `<div class="row" style="gap:var(--gap)">${[1, 2, 3, 4].map((i) => `<div class="tile" style="flex:1">
        <div class="lo bar" style="width:38px;height:14px"></div><div class="lo bar lt" style="width:70%"></div>
        <div class="hi" style="font-size:17px;font-weight:600">${["6", "4", "5", "98"][i - 1]}</div>
        <div class="hi" style="font-size:11px;color:var(--ink-2)">${["écarts", "croisements", "articles à lire", "unités"][i - 1]}</div>
      </div>`).join("")}</div>` : ""}
    </div>
  </header>`;
}

function listHTML() {
  const mode = V.list.layout;
  if (mode === "Hidden") return "";
  const label = V.screen === "Unités" ? "Unités" : "Liste";
  /* The list reads the same rows the header counts, so the view above it and
     the search inside it both change what is on screen. */
  const pairs = rowsOf(V.screen);
  const rows = pairs.length ? pairs.map((r) => `${r[0]} — ${r[1]}`) : ["rien ne correspond"];
  const sel = selIndex(V.screen);

  if (mode === "Filter bar only") {
    return `<section class="pane rg ${solo("list")}" data-rg="liste → barre de filtres" data-fi="${fiOf("list")}" style="flex:0 0 auto;grid-column:1/-1">
      <div class="pb" style="flex-direction:row;align-items:center;padding:8px 10px">
        <span class="chip">${icon("search")}<span class="lo bar" style="width:70px"></span>
          <input class="hi find" value="${V.query}" placeholder="Chercher dans ${label.toLowerCase()}"></span>
        ${pairs.slice(0, 4).map((r, i) => `<span class="chip ${i === sel ? "on" : ""}" ${act("row", i)}><span class="lo bar" style="width:46px"></span><span class="hi">${r[0].split(" ")[0]}</span></span>`).join("")}
      </div></section>`;
  }
  /* On a floor the list is the area table (see "the floor's quantities"). */
  if (V.screen === "Unités") return unitListHTML();
  const inner = mode === "Card grid"
    ? (pairs.length ? `<div style="display:grid;grid-template-columns:1fr;gap:8px">${pairs.map((r, i) => `<div class="tile ${i === sel ? "on" : ""}" ${act("row", i)}>
        <div class="plan" style="height:54px;flex:0 0 54px"></div>
        <div class="lo bar" style="width:70%"></div><div class="hi" style="font-size:11.5px">${r[0]} — ${r[1]}</div></div>`).join("")}</div>`
      : `<div class="tile"><span class="hi" style="font-size:12px;color:var(--ink-2)">${emptyMsg}</span></div>`)
    : rows.map((r, i) => `<div class="listrow ${i === sel ? "on" : ""}" ${pairs.length ? act("row", i) : ""}><span class="dot"></span>
        <span class="lo bar" style="flex:1"></span><span class="hi" style="font-size:12px">${r}${V.settled[`${V.screen} — ${(pairs[i] || [""])[0]}`] ? " — réglé" : ""}</span></div>`).join("");

  return region("list", `list — ${label.toLowerCase()}`,
    `<div class="ph">${icon("list")}<span class="lo bar" style="width:60px"></span><span class="hi">${label}</span></div>
     <div class="pb">${inner}</div>`);
}

function contentHTML() {
  const mode = V.content.layout;
  const body = {
    "Unités": () => {
      const unit = (selRow("Unités") || ["—"])[0];
      /* The zoom is three things on one line, at the foot of each pane:
         step out, the percentage, step in. The wheel and the pinch do the
         rest; a slider was a long control for a number read at a glance. */
      const zoomPill = (side) => `<div class="zpill" data-zpill="${side}">
        <span class="zb" ${act("zstep", side + ":-")} title="Réduire">${icon("minus")}</span>
        <span class="zread hi ${side === "plan" ? "fit" : ""}" ${side === "plan"
          ? `data-zread ${act("zfit")} title="Revoir la feuille entière"` : "data-mread"}>${side === "plan" ? zoomShown(V.zoom) : V.mzoom}%</span>
        <span class="zb" ${act("zstep", side + ":+")} title="Agrandir">${icon("plus")}</span>
      </div>`;
      /* The corner view: the drawing whole, small. On the plan it is the
         sheet as a picture, with the rectangle of what is on screen, dragged
         to move it. On the model it is the model itself seen from straight
         above — the roof read in the same orientation as the sheet beside
         it — with a marker for the side the live camera stands on. Neither
         carries a caption: the percentage is already on the zoom column an
         inch away, and printing it twice only made the corner heavier. */
      const mini = (side) => (side === "plan"
        ? `<div class="mini hi" data-mini="plan">
        <span class="mi" data-mi>
          <img src="${sheet().thumb}" alt="">
          <span class="mrect" data-mrect></span>
        </span>
      </div>`
        : `<div class="mini hi" data-mini="model">
        <span class="mi" data-mi><canvas data-mini3d></canvas></span>
      </div>`);
      /* North, top right of each pane. On the sheet it turns with the
         drawing's quarter turns (see paintSheet). On the model it is the same mark laid flat on
         the ground and seen from wherever the camera is, so the ring
         flattens and the needle swings as the building is orbited. */
      const north = (side) => (side === "plan"
        ? `<svg class="north hi" data-north viewBox="-22 -32 44 64" aria-label="Nord">
        <text data-nl x="0" y="-21">N</text>
        <circle cx="0" cy="6" r="14"></circle>
        <line data-nneedle2d x1="0" y1="6" x2="0" y2="-7"></line>
      </svg>`
        : `<svg class="north hi" data-north3d viewBox="-22 -32 44 64" aria-label="Nord">
        <polygon data-nring points=""></polygon>
        <line data-nneedle x1="0" y1="0" x2="0" y2="-14"></line>
        <text data-nlabel x="0" y="-21">N</text>
      </svg>`);
      /* What a drag on the model does, top left where a hand reaches first:
         turn around the building, or move across it. */
      const mtools = `<div class="mtools" role="group" aria-label="Glisser pour">
        ${[["orbit", "rotate-3d", "Orbiter : glisser pour tourner autour du bâtiment"],
           ["pan", "move", "Déplacer : glisser pour déplacer la vue"]].map(([t, ic, tip]) =>
          `<span class="zb ${V.mtool === t ? "on" : ""}" ${act("mtool", t)} title="${tip}" aria-pressed="${V.mtool === t}">${icon(ic)}</span>`).join("")}
      </div>`;
      /* Which way is north, up, and along the façade: the three axes as the
         camera sees them, red X, green Y, blue Z, redrawn as it orbits. */
      const axes = `<svg class="axes hi" data-axes viewBox="-26 -26 52 52" aria-hidden="true">
        ${["x", "y", "z"].map((a) => `<line data-ax="${a}" x1="0" y1="0" x2="0" y2="0"></line>
          <text data-axt="${a}" x="0" y="0">${a.toUpperCase()}</text>`).join("")}
        <circle cx="0" cy="0" r="1.6"></circle>
      </svg>`;
      /* The model's header carries the cube, the same glyph that marks a
         note pinned on the model; the plan keeps the sheet. */
      const pane = (t, note, kind, cls = "", layers = "", fx = "1") => `<div class="pane drawing" style="flex:${fx}"><div class="ph">${icon(kind === "model" ? "box" : "file")}
        <span class="lo bar" style="width:90px"></span><span class="hi">${t}</span>${kind === "plan" ? issueBadge(["plan"]) : skpChipHTML()}
        <span style="flex:1"></span>
        ${hostButton(kind === "plan" ? "plan" : "model")}</div>
        ${kind === "plan"
          /* The sheet is larger than the pane, so the pane is a window onto
             it: the drawing, the consultants' layers, the typology fills and
             the unit outline all sit inside one transformed box and move
             together. The wheel zooms where the pointer is; dragging pans. */
          ? `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="plan">
              <div class="vp" data-vp>
              <div class="plan ${cls}" data-img="${kind}" data-plan-pdf="${sheet().pdf || ""}" data-src="${planVector() ? "vector" : "image"}"
                   style="transform:translate(${V.pan.x}px,${V.pan.y}px) scale(${V.zoom / 100});
                     --planz:${layZ("plan")};--planop:${V.lay.plan.on ? V.lay.plan.opacity / 100 : 0}">
                <span class="lo"></span><span class="hi">${note}</span>
                ${planVector() ? `<canvas class="sheetpdf" data-sheetpdf data-pdf-url="${sheet().pdf}"></canvas>` : ""}
                ${layers}${unitMarkHTML()}${conflictMarkHTML()}${pinMarkHTML()}</div></div>
              ${north("plan")}${mini("plan")}<div class="zctl">${zoomPill("plan")}${rotPillHTML()}</div>${pinArmHTML()}${layStripHTML()}${addPopHTML()}${layCardHTML()}${conflictCardHTML()}${pinBubbleHTML()}</div>`
          : `<div class="pb zone" style="padding:0;overflow:hidden;flex-direction:row;gap:0" data-zone="model">
              <div class="model3d" data-building-model data-state="loading" role="region"
                   aria-label="Maquette 3D interactive du Baldwin III" aria-busy="true">
                <div class="model3d-status" data-model-status aria-live="polite">Chargement de la maquette…</div>
              </div>
              <div class="npins" data-npins></div>
              ${elevNavHTML()}${north("model")}${axes}${mini("model")}<div class="zctl">${zoomPill("model")}${mtools}</div>
            </div>`}
        </div>`;
      /* The 2D pane carries the surveyor's and the landscaper's sheets, which
         is why it is the one pane drawn at the plan's own aspect. */
      /* Counting the whole building does not mean reading no drawing: the
         level on the tab is still the sheet on screen, it is simply not a
         unit that is being read, so the note names the level instead. */
      const planNote = isNonresLevel(paneLevel())
        ? `${levelView(paneLevel())} — aucune unité résidentielle à ce niveau`
        : buildingScope() ? `${levelView(paneLevel())} — contours par-dessus`
        : `${unit} — contours par-dessus`;
      /* The two basements are not in the model: the massing starts at the
         ground. A pane saying so is a pane of nothing, so the plan takes
         the full width there. The roof is in the model, so it keeps both. */
      const whole = buildingScope();
      const noModel = !whole && (paneLevel() === -1 || paneLevel() === 0);
      /* The two drawings share the width and the edge between them moves:
         a plan read closely wants the window, a massing check wants the
         opposite. Folding either one gives the other everything, which is
         how a drawing fills the screen here without a full-screen mode. */
      const planShut = folded("plan"), modelShut = noModel || folded("model");
      const planW = V.split[splitKey("plan")];
      /* An explicit width only means something while both are open. */
      const planFlex = planW && !modelShut ? `0 0 ${planW}px` : "1";
      const plan = () => pane("Plan 2D", planNote, "plan", "align", typoHTML() + layersHTML(), planFlex);
      const model = () => (noModel ? "" : pane("Maquette 3D", "", "model", "fit"));
      if (mode === "Stacked") return `<div class="col" style="flex:1">${plan()}${model()}</div>`;
      if (mode === "Single pane + inset") return `<div class="col" style="flex:1;gap:var(--gap)">
        <div style="position:relative;flex:1;display:flex">${plan()}
        ${noModel ? "" : `<div class="pane" style="position:absolute;right:10px;bottom:10px;width:220px;height:150px">
        <div class="pb"><div class="plan" data-img="massing"><span class="hi">3D inset</span></div></div></div>`}</div></div>`;
      return `<div class="row" style="flex:1;align-items:stretch;gap:0;min-height:0">${
        planShut ? foldStripHTML("plan", "le plan") : plan()}${noModel ? "" : gutter({ size: "plan", grab: "prev",
          prev: "plan", next: "model", lprev: "le plan", lnext: "la maquette" })}${
        noModel ? "" : modelShut ? foldStripHTML("model", "la maquette") : model()}</div>`;
    },
    /* Codes is the vertical reading of the provisions: the schematic of
       what each article measures, the sentence in French, what is still
       missing, and the notes written against it. Nothing here writes to a
       drawing. One body of rules is read at a time — the tab above the
       page names it, so the list needs no heading and no rule: the search
       and « Ajouter » share its first line. */
    "Codes": () => {
      const label = viewOf("Codes");
      /* Pinned articles lead the list, in the order they were pinned. */
      const all = codeGroups().find(([name]) => name === label)?.[1] || [];
      const rows = [...V.artPins.map((id) => all.find((a) => a.id === id)).filter(Boolean), ...all.filter((a) => !V.artPins.includes(a.id))];
      return `<div class="col" style="flex:1;gap:var(--gap)">
        <div class="pane" style="flex:0 0 auto">
          <div class="pb">
            <div class="caskrow">${codeAskBarHTML(label)}
              <span class="btnw solid" ${act("addcode")}>${icon("plus")}<span class="hi">Ajouter</span></span></div>${codeAskHTML(label)}
            <div class="codelist">${rows.length ? rows.map(codeRow).join("")
              : `<div class="codeempty">Aucun article suivi dans ce code</div>`}</div>
          </div></div>
      </div>`;
    },
    /* Échéancier is a calendar on the left and the work on the right. They
       are one object seen twice: a task has a date, so it is a mark on the
       calendar; a day holds tasks, so clicking it filters the list. The
       scale sits on the calendar it draws, beside the dates it changes,
       rather than in a strip above that looked like a change of screen. */
    "Échéancier": () => `<div class="row" style="flex:1;align-items:stretch;gap:0">
      ${folded("cal") ? foldStripHTML("cal", "le calendrier") : `<div class="pane" style="flex:${V.split[splitKey("cal")] ? `0 0 ${V.split[splitKey("cal")]}px` : "1.25"}">
        <div class="ph">${icon("calendar-check")}<span class="lo bar" style="width:70px"></span>
          <span class="hi">Calendrier</span><span style="flex:1"></span>
          <span class="btnw today ${V.day === TODAY ? "here" : ""}" ${act("calday", TODAY)} title="Revenir à aujourd'hui">${icon("undo-2")}<span class="hi">Aujourd'hui</span></span></div>
        <div class="pb"><div class="calmonth">
          <span class="tseg cal">${CAL_SCALES.map((s) => `<span class="${V.scale === s ? "on" : ""}" ${act("calscale", s)}
            title="Dessiner le calendrier par ${s.toLowerCase()}">${icon(CAL_SCALE_ICONS[s])}${s}</span>`).join("")}</span>
          <span class="cnav"><span class="calarr" ${act("calmove", "-1")} title="Avant">${icon("chevron-left")}</span>
          <span class="ct">${calTitle()}</span>
          <span class="calarr" ${act("calmove", "1")} title="Après">${icon("chevron-right")}</span></span></div>${calendarHTML()}</div></div>`}
      ${gutter({ size: "cal", grab: "prev", prev: "cal", next: "todo",
        lprev: "le calendrier", lnext: "la liste" })}
      ${folded("todo") ? foldStripHTML("todo", "la liste") : `<div class="pane" style="flex:1">
        <div class="ph">${icon("list-checks")}<span class="hi" style="font-weight:600">À faire</span>
          <span style="flex:1"></span>
          <span class="btnw" ${act("tnew")}>${icon("plus")}<span class="hi">Ajouter une tâche</span></span></div>
        <div class="pb">${taskListHTML()}</div></div>`}
    </div>`,
  }[V.screen]();

  /* No header strip on this pane: it only repeated the screen name already
     set in large type two lines above, and the pane is the whole middle of
     the card — nothing else it could be. */
  return region("content", "contenu", `<div class="pb">${body}</div>`,
    V.screen === "Unités" || V.screen === "Échéancier" ? "bare" : "");
}

/* ------------------------------------------------------- the quantities
   "Bâtiment entier" is read like a floor without its plan: the Statistiques
   pane counts the whole building — the mix, one line per level for areas
   and openings, and the materials of each façade — beside the 3D model and
   the margin. No floor is lit on the model and no unit is chosen. */
const buildingScope = () => V.screen === "Unités" && V.scope === "Bâtiment";

/* ------------------------------------------------ the floor's quantities
   On a floor the unit list is the floor's area table: every unit with its
   type, net area and share, the floor's totals at the foot, and under it
   the selected unit's windows, counted in the 3D model. The materials are
   read per façade, not per unit: a material is ordered and checked by
   elevation, so the list ends on one table per façade. */
const fqNum = (n, d = 0) => n.toLocaleString("fr-CA", { minimumFractionDigits: d, maximumFractionDigits: d });
const fqPct = (a, b) => `${b ? Math.round(a / b * 100) : 0} %`;
const unitNo = (r) => r[0].split(" — ")[0];
const M2 = 0.092903;

function floorQuant() {
  const floor = UNITS_BY_LEVEL[viewOf("Unités")] || [];
  const unit = selRow("Unités");
  const visible = rowsOf("Unités");
  const net = floor.reduce((s, r) => s + r[6], 0);
  const brut = net / 0.85;
  const types = [...new Set(floor.map((r) => r[5]))].sort();
  const ofType = (ty) => floor.filter((r) => r[5] === ty);
  return {
    level: viewOf("Unités"), unit, u: unit ? unitNo(unit) : null,
    /* A count answers "how many 4½"; the share answers "what kind of floor
       is this", which is the question a mix is read for. Both, plus the net
       area the type actually occupies. */
    types: types.map((ty) => [ty, ofType(ty).length, floor.length ? ofType(ty).length / floor.length : 0,
      ofType(ty).reduce((s, r) => s + r[6], 0)]),
    count: floor.length,
    net,
    /* An open conflict rides on the number, as it did on the card. */
    rows: floor.map((r) => ({
      cells: [`${unitNo(r)}${r[7] ? `<span class="xwarn" ${act("uconf", r[0].split(" ")[0])} title="${r[7]} conflit${r[7] > 1 ? "s" : ""} ouvert${r[7] > 1 ? "s" : ""} — afficher sur le dessin">${icon("alert-triangle")}</span>` : ""}`,
        `<span class="chip tpill"><span class="sw" style="background:${TYPO_INK[baseTypo(r[5])]}"></span>${r[5]}</span>`,
        fqNum(r[6]), fqNum(r[6] * M2, 1), fqPct(r[6], net)],
      on: r === unit, index: visible.indexOf(r),
    })),
    /* A share of nothing is not 100 %: with no unit on the level the
       three lines keep their place and stay empty. */
    foot: floor.length
      ? [["Net", "", fqNum(net), fqNum(net * M2), "100 %"],
        ["Circulation", "", fqNum(brut - net), fqNum((brut - net) * M2), "15 %"],
        ["Brut", "", fqNum(brut), fqNum(brut * M2), ""]]
      : [["Net", "", "", "", ""], ["Circulation", "", "", "", ""], ["Brut", "", "", "", ""]],
  };
}

/* The mix of a floor, read in one band: each type names itself at the left
   of its own share of the width, with that share written at the right. The
   bar was a legend before it was a measure, so the colour and the name are
   fused and the percentage follows. The floor's net area stands under it
   because every percentage in the band is a share of it. */
function fqMixHTML(q, onPlan = true) {
  if (!q.count) return `<div class="fqmix"><div class="mixrow">
    <span class="mixnet">Aucune unité résidentielle à ce niveau</span></div></div>`;
  return `<div class="fqmix">
    <div class="mixbar ${onPlan ? "pick" : ""} ${typosOn().length ? "some" : ""}">${q.types.map(([ty, count, share]) =>
      `<span class="${V.typo[ty] ? "on" : ""}" style="flex:${(share * 1000).toFixed(0)} 0 0;background:${TYPO_INK[ty]}"
        ${onPlan ? `${act("typo", ty)} aria-pressed="${!!V.typo[ty]}"` : ""}
        title="${count} unités de ${ty} — ${Math.round(share * 100)} % des pi² nets${onPlan ? (V.typo[ty] ? " — retirer du plan" : " — voir sur le plan") : ""}">${ty}<small>${Math.round(share * 100)} %</small></span>`).join("")}</div>
    <div class="mixrow">
      <span class="mixnet"><b>${fqNum(q.net)}</b> pi² nets sur ${q.count} unités</span>
    </div>
  </div>`;
}

/* One table of units, two sets of figures. The units are written once and
   never move; the switch above the table swaps only the number columns —
   the areas, or the openings the model counts in each unit — so the list
   is not read twice to learn both. The building reads the same way, one
   line per level. The choice holds from floor to building. */
const FQ_COLS = [["s", "Superficies"], ["o", "Ouvertures"]];
function fqColsHTML() {
  return `<span class="secseg fqcols" role="group" aria-label="Chiffres">${FQ_COLS.map(([k, label]) =>
    `<span class="ss" ${act("fqcols", k)} aria-current="${(V.fqCols || "s") === k}">${label}</span>`).join("")}</span>`;
}
/* Openings, as the columns of either table: windows, patio doors, glazing
   in ft² and its share. Until the model has counted them, each figure is
   an ellipsis rather than a zero, which would be a count. */
const OPEN_HEAD = [["Fen.", "Fenêtres"], ["P.-p.", "Portes-patio"], ["Vitr. pi²", "Vitrage pi²"], ["Part", "Part du vitrage"]];
function openCells(o, total, cell) {
  if (!o) return OPEN_HEAD.map(() => cell("…", 1)).join("");
  const ft2 = window.fitteMaterials.FT2_PER_UNIT2;
  return `${cell(o.windows, 1)}${cell(o.doors, 1)}${cell(fqNum(o.glass * ft2), 1)}${cell(fqPct(o.glass, total.glass), 1)}`;
}
const openHead = (cell) => OPEN_HEAD.map(([h, long]) => `<th class="n" title="${long}">${h}</th>`).join("");
const openFoot = (total, cell, lead) => `<tr>${cell("Total")}${lead}${total
  ? `${cell(total.windows, 1)}${cell(total.doors, 1)}${cell(fqNum(total.glass * window.fitteMaterials.FT2_PER_UNIT2), 1)}${cell(total.glass ? "100 %" : "", 1)}`
  : OPEN_HEAD.map(() => cell("…", 1)).join("")}</tr>`;

const FQ_TYPE = ["t", "t", "n", "n", "n"];
function fqTableHTML(q) {
  const cell = (c, j, tag = "td") => `<${tag} class="${FQ_TYPE[j] === "n" ? "n" : ""}">${c}</${tag}>`;
  const num = (c, n) => `<td class="${n ? "n" : ""}">${c}</td>`;
  const open = (V.fqCols || "s") === "o";
  const floor = UNITS_BY_LEVEL[q.level] || [];
  const counted = modelCounted();
  const each = counted ? floor.map((r) => unitOpenings(unitNo(r))) : [];
  const total = counted ? sumOpenings(each) : null;
  /* A unit the typology filter hides stays in the floor's arithmetic but
     is not offered as a click. */
  const body = q.rows.map((r, i) => `<tr class="${r.on ? "on" : ""} ${r.index < 0 ? "dim" : ""}" ${r.index >= 0 ? act("row", r.index) : ""}>
    ${cell(r.cells[0], 0)}${cell(r.cells[1], 1)}${open ? openCells(each[i], total, num)
      : r.cells.slice(2).map((c, j) => cell(c, j + 2)).join("")}</tr>`).join("");
  const head = `${cell("Unité", 0, "th")}${cell("Type", 1, "th")}${open ? openHead()
    : ["Net pi²", "m²", "Part"].map((h, j) => cell(h, j + 2, "th")).join("")}`;
  const foot = open ? (floor.length ? openFoot(total, num, num("")) : "")
    : q.foot.map((r) => r[0] === "Circulation" ? circulationRowHTML(r, cell) : `<tr>${r.map((c, j) => cell(c, j)).join("")}</tr>`).join("");
  return `<div class="fqt">${q.count ? `<div class="fqcolrow">${fqColsHTML()}</div>` : ""}
    <table class="tbl"><thead><tr>${head}</tr></thead>
      <tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`;
}

/* The openings, counted in the model and read like the area table: on a
   floor, one line per unit of that floor, the chosen unit lit — its own
   windows are the ones lit on the model; on the whole building, one line
   per level. A unit's panes are grouped into the openings they belong to;
   a patio door is an opening that starts at the floor. */
const OPEN_MEMO = new Map();
const modelCounted = () => Boolean(window.fitteModel?.facades?.());
function unitOpenings(u) {
  if (OPEN_MEMO.has(u)) return OPEN_MEMO.get(u);
  const faces = window.fitteModel.unitWindows(u) || [];
  const o = faces.reduce((s, f) => ({ windows: s.windows + f.windows, doors: s.doors + f.doors, glass: s.glass + f.glass }),
    { windows: 0, doors: 0, glass: 0 });
  OPEN_MEMO.set(u, o);
  return o;
}
const sumOpenings = (list) => list.reduce((s, o) => ({ windows: s.windows + o.windows, doors: s.doors + o.doors, glass: s.glass + o.glass }),
  { windows: 0, doors: 0, glass: 0 });
const levelRows = (lv) => UNITS_BY_LEVEL[levelView(lv)] || [];

/* The materials of the envelope, as the elevation sheets' legend numbers
   them, in square feet seen in elevation. The areas are what
   each material covers in the model's elevation of that façade. The nine
   materials are written once, the four façades are the columns: a click
   on a façade's heading turns the model to that elevation, square and
   without perspective, every material in the colour of its swatch; a
   click on a figure opens that façade with that material alone in colour;
   a click on the material's name opens its product sheet. A second click
   on the open façade goes back to the 3D view. */
const FACADES = ["nord", "est", "sud", "ouest"];
function facadeTablesHTML() {
  const fm = window.fitteMaterials;
  const data = window.fitteModel?.facades?.();
  const open = V.facade;
  const head = `<div class="fqh">${icon("layers")}<span>Matériaux</span>${issueBadge(["mat"])}<span class="fqs">pi² vus en élévation</span>
    ${open ? `<span style="flex:1"></span><span class="btnw sm" ${act("facade", open.face)} title="Revenir à la vue 3D">${icon("rotate-3d")}<span class="hi">Vue 3D</span></span>` : ""}</div>`;
  if (!data) return `<div class="fq-fac" data-facades>${head}<div class="fqn">Lecture de la maquette 3D…</div></div>`;
  const at = (face, n) => data[face].find((r) => r.n === n)?.ft2 || 0;
  const facTotal = (face) => data[face].reduce((s, r) => s + r.ft2, 0);
  /* Every number the legend gives on any façade, in the legend's order. A
     material under a square foot is not drawn and is not listed. */
  const nums = [...new Set(FACADES.flatMap((face) => data[face].filter((r) => r.ft2 >= 1).map((r) => r.n)))].sort((a, b) => a - b);
  const total = FACADES.reduce((s, face) => s + facTotal(face), 0);
  /* One material is shown at a time: its row carries its own colour, its
     sheet is open under it, and the model paints it in full colour with
     the rest of the building greyed — on the 3D view as on an elevation. */
  const body = nums.map((n) => {
    const c = fm.category(n);
    const shown = V.matShow === n;
    const sum = FACADES.reduce((s, face) => s + at(face, n), 0);
    const cells = FACADES.map((face) => {
      const v = at(face, n);
      const lit = open?.face === face;
      return `<td class="n ${lit ? "fcol" : ""} ${v ? "" : "fnil"}" ${v ? act("facmat", `${face}|${n}`) : ""}
        title="${v ? `${c.name} sur la façade ${face} — ${fqNum(v)} pi², ${fqPct(v, facTotal(face))} de la façade — voir cette élévation` : `${c.name} ne paraît pas sur la façade ${face}`}">${v ? fqNum(v) : "—"}</td>`;
    }).join("");
    return `<tr class="${shown ? "on fopen" : ""}" style="--mc:${c.color}">
      <td class="fnm" ${act("mat", n)} role="button" aria-pressed="${shown}"
        title="${shown ? `Masquer ${c.name} sur la maquette` : `${c.note} — montrer sur la maquette`}"><span class="fsw" style="background:${c.color}"></span><span class="fno">${c.n}</span>${c.name}${c.check
        ? `<span class="fwarn" title="${c.check}">${icon("alert-triangle")}</span>` : ""}</td>
      ${cells}<td class="n fsum">${fqNum(sum)}</td></tr>
      ${shown ? `<tr class="fsheet"><td colspan="6">${materialSheetHTML(c)}</td></tr>` : ""}`;
  }).join("");
  /* The façade headings are the doors of the table: nothing is drawn while
     the model is on screen, and the open elevation's heading is written
     white on ink with the eye that says it is the one being looked at. */
  const heads = FACADES.map((face) => {
    const on = open?.face === face;
    return `<th class="n fh ${on ? "fon" : ""}" ${act("facade", face)} aria-pressed="${on}"
      title="${on ? `Masquer l'élévation ${face} et revenir à la maquette` : `Afficher l'élévation ${face}`}"><span class="feye">${on ? icon("eye") : ""}</span><span class="fhl">${face[0].toUpperCase()}${face.slice(1)}</span></th>`;
  }).join("");
  const foot = FACADES.map((face) => `<td class="n ${open?.face === face ? "fcol" : ""}">${fqNum(facTotal(face))}</td>`).join("");
  const shownCat = V.matShow ? fm.category(V.matShow) : null;
  return `<div class="fq-fac" data-facades>${head}
    <table class="tbl ftbl fmx">
      <thead><tr><th>Matériau</th>${heads}<th class="n fsum">Total</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td>Total pi²</td>${foot}<td class="n fsum">${fqNum(total)}</td></tr></tfoot>
    </table>
    <div class="fqn">${open ? `Élévation ${open.face} ouverte — ${fqNum(facTotal(open.face))} pi², ${fqPct(facTotal(open.face), total)} de l'enveloppe`
      : shownCat ? `${shownCat.name} en couleur sur la maquette — le reste du bâtiment est en gris`
      : "Maquette 3D — un matériau se montre, un en-tête de façade ouvre son élévation"}</div></div>`;
}

/* A material's sheet, opened under its row: the legend's swatch, then what
   the specification gives (maker, colour, size) and the maker's page in a
   new tab. Items the legend names no maker for have no link. */
function materialSheetHTML(c) {
  const line = (k, v) => (v ? `<div class="fk">${k}</div><div class="fv">${v}</div>` : "");
  const pic = c.thumb
    ? `<img class="fimg ${c.n === 7 ? "fit" : ""}" src="assets/materials/${c.thumb}.png" alt="${c.name}">`
    : `<span class="fimg" style="background:${c.tile}"></span>`;
  const links = [
    c.url ? `<a class="btnw sm" href="${c.url}" target="_blank" rel="noopener noreferrer" title="${c.url}">${icon("external-link")}<span class="hi">${c.maker} — ${c.page}</span></a>` : "",
    c.colourUrl ? `<a class="btnw sm" href="${c.colourUrl}" target="_blank" rel="noopener noreferrer" title="${c.colourUrl}">${icon("external-link")}<span class="hi">Vicwest — ${c.colourPage}</span></a>` : "",
  ].join("");
  return `<div class="fsh">${pic}<div class="finfo">
    <div class="fgrid">${line("Fabricant", c.maker)}${line("Couleur", c.colour)}${line("Format", c.size)}</div>
    ${c.check ? `<div class="fchk">${icon("alert-triangle")}${c.check}</div>` : ""}
    ${links ? `<div class="flinks">${links}</div>` : `<div class="fqn">aucun fabricant nommé à la légende</div>`}
  </div></div>`;
}

/* The four façades in the order met walking round the building. The corner
   view marks which one is on screen with the letter it carries on the sheets. */
const ELEV_FACES = {
  nord: { nm: "Élévation nord" },
  est: { nm: "Élévation est" },
  sud: { nm: "Élévation sud" },
  ouest: { nm: "Élévation ouest" },
};
const ELEV_ORDER = ["nord", "est", "sud", "ouest"];
/* The switch over the model: the 3D view or one façade. The arrow keys walk
   round the building and Escape goes back to the model. One switch for both ways in: a façade picked here is seen with its own
   textures; one opened from its material table keeps the legend colours. */
function elevNavHTML() {
  const face = V.facade?.face || "";
  const seg = `<div class="eseg" role="group" aria-label="Vue">
    <span class="zs ${face ? "" : "on"}" ${act("elev", "")} aria-pressed="${!face}" title="Maquette 3D">3D</span><i class="div"></i>
    ${ELEV_ORDER.map((k) => `<span class="zs ${face === k ? "on" : ""}" ${act("elev", k)} aria-pressed="${face === k}"
      title="${ELEV_FACES[k].nm}">${k[0].toUpperCase()}${k.slice(1)}</span>`).join("")}</div>`;
  return `<div data-elevnav style="display:contents">${seg}</div>`;
}

/* What the viewer reads to draw an elevation. One opened from the material
   tables needs them on screen to be closed again; one picked from the
   switch over the model can always be left from that switch. */
function syncElevation() {
  const open = V.facade && (V.facade.plain || document.querySelector("[data-facades]"));
  window.fitteElevation = open ? { face: V.facade.face, focus: V.matShow || 0, plain: Boolean(V.facade.plain) } : null;
  /* With no elevation open the same material is painted on the 3D model. */
  window.fitteMaterialFocus = V.matShow || 0;
  // An elevation only moves and zooms: there is no drag tool to choose.
  document.body.classList.toggle("elev", Boolean(open));
}
function paintFacades() {
  document.querySelector("[data-facades]")?.replaceWith(document.createRange().createContextualFragment(facadeTablesHTML()));
  document.querySelector("[data-elevnav]")?.replaceWith(document.createRange().createContextualFragment(elevNavHTML()));
  syncElevation();
  window.dispatchEvent(new CustomEvent("fitte:render"));
}
/* In an elevation the arrow keys walk round the building and Escape goes
   back to the model — not while typing. */
document.addEventListener("keydown", (e) => {
  if (!V.facade || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); stepElevation(e.key === "ArrowRight" ? 1 : -1); }
  else if (e.key === "Escape") { V.facade = null; paintFacades(); }
});
function stepElevation(d) {
  const i = ELEV_ORDER.indexOf(V.facade?.face || "sud");
  V.facade = { face: ELEV_ORDER[(i + d + 4) % 4], plain: V.facade ? V.facade.plain : true };
  paintFacades();
}

/* One table, four ways out of it: the spreadsheet the broker opens, the
   plain text another tool reads, the page that is printed, and the drawing
   the table was measured from. Every line is named the same way — what the
   file is, then its extension — so the list is read by its ends, not by
   guessing which word is a format. */
const EXPORTS = [["xlsx", "Classeur Excel (.xlsx)"], ["csv", "Tableau CSV (.csv)"],
  ["pdf", "Document PDF (.pdf)"], ["dwg", "Dessin AutoCAD (.dwg)"]];

function exportMenuHTML() {
  return `<span class="expwrap">
    <span class="btnw sm ${V.exportMenu ? "on" : ""}" ${act("expmenu")}
      title="Exporter le tableau de ce niveau">${icon("download")}<span class="hi">Exporter</span>${icon("chevron-down")}</span>
    ${V.exportMenu ? `<span class="expmenu">${EXPORTS.map(([k, label]) =>
      `<span class="mi" ${act("export", k)}>${label}</span>`).join("")}</span>` : ""}
  </span>`;
}

/* The whole building, read the way a floor is: the mix over every unit,
   then one line per level instead of one per unit. A level's line opens
   that level. */
function buildingQuant() {
  const net = ALL_UNITS.reduce((s, r) => s + r[6], 0);
  const types = [...new Set(ALL_UNITS.map((r) => baseTypo(r[5])))].sort();
  const ofType = (ty) => ALL_UNITS.filter((r) => baseTypo(r[5]) === ty);
  return {
    count: ALL_UNITS.length, net,
    types: types.map((ty) => [ty, ofType(ty).length, ALL_UNITS.length ? ofType(ty).length / ALL_UNITS.length : 0,
      ofType(ty).reduce((s, r) => s + r[6], 0)]),
  };
}
/* The building, one line per level, read the way a floor is: the level
   and its unit count written once, the switch choosing areas or openings.
   A level's line lights that floor on the model and flies to it; the
   page stays on the whole building. A second click lets it go. */
const bLevelRow = (lv) => `class="${V.bLevel === lv ? "on" : ""}" ${act("blevel", lv)}
  title="${V.bLevel === lv ? "Revenir au bâtiment entier" : `Voir le ${levelView(lv).toLowerCase()} sur la maquette`}"`;
function buildingTableHTML(q) {
  const cell = (c, n, tag = "td") => `<${tag} class="${n ? "n" : ""}">${c}</${tag}>`;
  const brut = q.net / 0.85;
  const open = bTab() === "o";
  const counted = modelCounted();
  const each = counted ? LEVELS.map((lv) => sumOpenings(levelRows(lv).map((r) => unitOpenings(unitNo(r))))) : [];
  const total = counted ? sumOpenings(each) : null;
  const body = LEVELS.map((lv, i) => {
    const rows = levelRows(lv), net = rows.reduce((s, r) => s + r[6], 0);
    return `<tr ${bLevelRow(lv)}>
      ${cell(levelView(lv))}${cell(rows.length, 1)}${open ? openCells(each[i], total, cell)
        : `${cell(fqNum(net), 1)}${cell(fqNum(net * M2, 1), 1)}${cell(fqPct(net, q.net), 1)}`}</tr>`;
  }).join("");
  const foot = open ? openFoot(total, cell, cell(q.count, 1))
    : [["Net", q.net, "100 %"], ["Circulation", brut - q.net, "15 %"], ["Brut", brut, ""]]
      .map(([k, v, p]) => `<tr>${cell(k)}${cell("", 1)}${cell(fqNum(v), 1)}${cell(fqNum(v * M2), 1)}${cell(p, 1)}</tr>`).join("");
  const head = `${cell("Niveau", 0, "th")}${cell("Unités", 1, "th")}${open ? openHead()
    : ["Net pi²", "m²", "Part"].map((h) => cell(h, 1, "th")).join("")}`;
  return `<div class="fqt"><table class="tbl"><thead><tr>${head}</tr></thead>
    <tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`;
}

/* The building's statistics, four readings of the same 104 units and four
   façades, one at a time: the mix of types, the areas, the openings, the
   materials. Each fills the pane; nothing is scrolled past to reach the next. */
const B_TABS = [["t", "Types d'unités"], ["s", "Superficies"], ["o", "Ouvertures"], ["m", "Matériaux"]];
const bTab = () => V.bTab || "t";
function bTabsHTML() {
  return `<div class="fqcolrow"><span class="secseg fqcols" role="group" aria-label="Statistiques">${B_TABS.map(([k, label]) =>
    `<span class="ss" ${act("btab", k)} aria-current="${bTab() === k}">${label}</span>`).join("")}</span></div>`;
}
/* The types, level by level: how many of each a floor carries, then the
   building's count, share and mean area of each. A level's line is picked
   on the model as in the other tables. */
function buildingTypesHTML(q) {
  const cell = (c, n, tag = "td") => `<${tag} class="${n ? "n" : ""}">${c}</${tag}>`;
  const types = q.types.map((t) => t[0]);
  const sw = (ty) => `<span class="fsw" style="background:${TYPO_INK[ty] || "var(--ink-3)"}"></span>`;
  const body = LEVELS.map((lv) => {
    const rows = levelRows(lv);
    return `<tr ${bLevelRow(lv)}>${cell(levelView(lv))}
      ${types.map((ty) => cell(rows.filter((r) => baseTypo(r[5]) === ty).length || "—", 1)).join("")}${cell(rows.length, 1)}</tr>`;
  }).join("");
  const foot = [
    ["Total", (t) => t[1], q.count],
    ["Part", (t) => `${Math.round(t[2] * 100)} %`, "100 %"],
    ["Net pi²", (t) => fqNum(t[3]), fqNum(q.net)],
    ["Moy. pi²", (t) => fqNum(t[1] ? t[3] / t[1] : 0), fqNum(q.count ? q.net / q.count : 0)],
  ].map(([k, f, all]) => `<tr>${cell(k)}${q.types.map((t) => cell(f(t), 1)).join("")}${cell(all, 1)}</tr>`).join("");
  return `<table class="tbl btypes"><thead><tr>${cell("Niveau", 0, "th")}${types.map((ty) => cell(`${sw(ty)}${ty}`, 1, "th")).join("")}${cell("Unités", 1, "th")}</tr></thead>
    <tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
}

function unitListHTML() {
  /* The materials are read per façade, and a façade belongs to the whole
     building, not to one floor: they are counted on « Bâtiment entier » only. */
  const whole = buildingScope();
  const q = whole ? buildingQuant() : floorQuant();
  const tab = bTab();
  const inner = !whole ? `${fqMixHTML(q, true)}${fqTableHTML(q)}`
    : `${bTabsHTML()}${tab === "t" ? `${fqMixHTML(q, false)}${buildingTypesHTML(q)}`
      : tab === "m" ? facadeTablesHTML() : buildingTableHTML(q)}`;
  return region("list", whole ? "liste — statistiques du bâtiment" : "liste — statistiques du niveau",
    `<div class="ph">${icon("table")}<span class="hi">${whole ? "Statistiques" : "Unités & ouvertures"}</span>${issueBadge(whole ? ["unit", "mat"] : ["unit"])}
       <span style="flex:1"></span>
       ${exportMenuHTML()}</div>
     <div class="pb" style="overflow:auto;gap:10px">${inner}</div>`);
}

/* A new selection, the figures switch or the model's count redraws the
   table alone, not the drawings and not the pane's scroll. */
function paintFQ() {
  const list = document.querySelector('[data-region="list"] .fqt');
  if (!list) return;
  if (buildingScope()) { if (bTab() === "s" || bTab() === "o") list.outerHTML = buildingTableHTML(buildingQuant()); return; }
  list.outerHTML = fqTableHTML(floorQuant());
}

/* The same rows, four blocks, one file, a blank line between them: a
   take-off is passed around as one sheet, not as four attachments. */
function exportAllCSV() {
  const q = (c) => `"${String(c).replace(/"/g, '""')}"`;
  const block = (name) => [[`${V.project} — ${name} — bâtiment entier`],
    QTABS[name].head, ...QTABS[name].rows].map((r) => r.map(q).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + Object.keys(QTABS).map(block).join("\r\n\r\n")],
    { type: "text/csv;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: "baldwin-iii-quantites.csv" });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* A basement or the roof carries no apartment units: the inspector reads
   as the level itself — the architectural sheet it is on, then whichever
   disciplines are laid over it, each with its real code and page — never a
   stand-in unit, and never a decision panel with nothing to decide. */
function nonresInspectorHTML(mode) {
  const level = paneLevel();
  const s = sheet();
  const rows = [["Architecture", `${s.code} — p.${s.page}`],
    ...engOverlayDisciplines(level).map((d) => {
      const e = engSheet(d, level);
      return [ENG_LABELS[d], `${engCode(e)} — p.${e.page}`];
    })];
  const inner = `<div class="ph">${icon("circle")}<span class="lo bar" style="width:70px"></span><span class="hi">${levelView(level)}</span></div>
    <div class="pb">
      <div class="tile"><div class="lo col">${bars(2)}</div>
        <div class="hi" style="font-size:12px">Ce niveau ne porte aucune unité résidentielle.</div>
        <div class="hi" style="font-size:11.5px;color:var(--ink-2)">Lecture du plan et des disciplines superposées — rien à sélectionner comme unité, rien à décider ici.</div></div>
      ${rows.map(([k, val]) => `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line-2);padding-bottom:6px">
        <span class="lo bar" style="width:70px"></span><span class="lo bar" style="width:46px"></span>
        <span class="hi" style="font-size:12px;color:var(--ink-2)">${k}</span>
        <span class="hi" style="font-size:12px">${val}</span></div>`).join("")}
    </div>`;
  if (mode === "Bottom sheet") return `<section class="pane rg sheet" data-rg="inspecteur → feuille du bas" data-fi="${fiOf("inspector")}" style="height:260px">${inner}</section>`;
  if (mode === "Overlay drawer") return `<section class="pane rg drawer" data-rg="inspecteur → superposition" data-fi="${fiOf("inspector")}">${inner}</section>`;
  return region("inspector", "inspecteur", inner);
}

/* The right column of the Codes screen is where an article is commented:
   its thread, then the box to add to it. The people the office argues the
   code with sit at the foot of the column and do not change with the
   article — they are the project's interlocutors, not the article's. */
function codeSideHTML(a) {
  const notes = V.notes[a.id] || [];
  const msg = (n, i) => {
    const au = pinAuthor(n);
    if (V.noteEdit === `${a.id}|${i}`) return `<div class="ncard acmt">
      <textarea class="noteinput" data-noteedit="${a.id}|${i}" rows="3">${n.txt}</textarea>
      <div class="row" style="gap:6px">
        <span class="btnw solid" ${act("noteeditsave", `${a.id}|${i}`)}>${icon("check")}<span class="hi">Enregistrer</span></span>
        <span class="btnw" ${act("noteeditstop")}><span class="hi">Annuler</span></span>
      </div></div>`;
    return `<div class="ncard acmt">
      <div class="au"><span class="av ${au.me ? "mine" : ""}">${au.ini}</span><span class="w"><b>${au.name}</b><span>${au.role}</span></span>
        <span class="aact">
          <span class="nedit hi" ${act("noteedit", `${a.id}|${i}`)} title="Modifier le commentaire">${icon("pen-line")}</span>
          <span class="nedit hi" ${act("notedrop", `${a.id}|${i}`)} title="Supprimer le commentaire">${icon("trash-2")}</span>

      <div class="row" style="justify-content:flex-end">
        <span class="btnw solid pingo wait" ${act("notesave", a.id)} title="Commenter (⌘↵)">${icon("send")}<span class="hi">Commenter</span></span>
      </div></div>`}
    <div class="cfoot">
      <div class="clbl">${icon("users")}<span class="hi">Interlocuteurs</span><i>${Object.keys(CONTACTS).length}</i></div>
      ${Object.keys(CONTACTS).map((k) => { const c = CONTACTS[k]; const sent = (V.mails[k] || []).length; return `<div class="contact ${c.waited > 14 ? "slow" : ""}">
        <span class="who"><b class="hi">${c.role}</b><span class="hi">${c.waited === 0 ? "dernier échange aujourd'hui"
            : `dernier échange le ${c.last} — il y a ${c.waited} j`}</span>
          ${sent ? `<span class="hi sent">${sent} courriel${sent > 1 ? "s" : ""} envoyé${sent > 1 ? "s" : ""} d'ici</span>` : ""}</span>
        <span class="mailto hi" ${act("mailopen", `${a.id}|${k}`)} title="Écrire sans quitter fitte">${icon("mail")}<span class="hi">Écrire</span></span>
      </div>`; }).join("")}
    </div>
  </div>`;
}

function inspectorHTML() {
  const mode = V.inspector.layout;
  if (mode === "Hidden") return "";
  /* The quantities screen has no inspector: it is not reading anything. */
  if (V.screen === "Unités" && isNonresLevel(paneLevel())) return nonresInspectorHTML(mode);
  const row = selRow(V.screen);
  const title = { "Unités": `Unité ${(row || ["—"])[0].split(" ")[0]}`,
    "Codes": `Commentaires<span class="csub">${V.articleId || ""}</span>` }[V.screen] || "Détail";
  /* A decision panel on the screen where something is decided; a short
     read-only column everywhere else. */
  const decides = V.screen === "Unités";
  /* The unit inspector answers a different question per tab, so the tabs
     carry four sets of rows and not one set with four labels. */
  const no = (row || ["—"])[0].split(" ")[0];
  const level = paneLevel();
  /* Coordination is read here, on the unit the crossing lands on. A unit with
     no crossing says so, and says what the level and the project carry. */
  const mine = crossingsFor(no);
  const crossRows = mine.length
    ? mine.map(([id, what, disc, , , done]) => [`${id} — ${disc}`, done ? "réglé" : what])
    : [["Sur cette unité", "aucun croisement"],
      ["Sur ce niveau", `${CROSSINGS.filter((c) => c[4] === level && !c[5]).length} ouverts`],
      ["Dans le projet", `${openCrossings().length} ouverts`],
      ["Dernier dessin lu", "S-301 R02"]];
  const unitRows = {
    "Vue d'ensemble": [["Typologie", (row || ["", ""])[0].split(" — ")[1] || "—"],
      ["Superficie", (row || ["", ""])[1]], ["Niveau", `Niveau ${paneLevel()}`], ["Statut", V.settled[settleKey()] ? "réglé" : "non vérifié"]],
    "Ouvertures": [["Le plan dit", "1800 × 1500"], ["La maquette dit", "1560 × 1500"], ["Écart", "240 mm"], ["Apparu dans", "R04 — 24 Oct"]],
    "Coordination": crossRows,
    "Historique": [["R04 — 24 Oct", "fenêtre élargie"], ["R03 — 02 Oct", "cloison déplacée"], ["R02 — 19 Oct", "unité découpée"], ["R01 — 12 Sep", "première lecture"]],
  };
  const rows = {
    "Unités": unitRows[UNIT_TABS[V.utab]],
    /* The short column beside the provisions names the one that is open;
       what it asks and what the drawings say are in the reading itself. */
    "Codes": [],
  }[V.screen] || [["Chantier", "value"], ["Chantier", "value"], ["Chantier", "value"], ["Chantier", "value"]];

  const inner = `<div class="ph">${icon(V.screen === "Codes" ? "message-square" : "circle")}<span class="lo bar" style="width:70px"></span><span class="hi">${title}</span></div>
    <div class="pb">
      ${V.screen === "Unités" ? `<div class="row utabs">${UNIT_TABS.map((t, i) => `<span class="chip ico ${i === V.utab ? "on" : ""}" ${act("utab", i)} title="${t}" aria-label="${t}">
        ${icon(UNIT_TAB_ICONS[i])}</span>`).join("")}
        <span class="hi" style="font-size:11.5px;color:var(--ink-2);padding-left:2px">${UNIT_TABS[V.utab]}</span></div>
      ${V.utab === 1
        /* Ouvertures is about doors and windows, so it shows the schedule
           sheet the sizes are read from, not a crop of the floor plan. */
        ? `<div class="plan" data-img="openings" style="height:110px;flex:0 0 110px"><span class="hi">A-308 — tableau des fenêtres</span></div>
           <div class="plan" data-img="doors" style="height:96px;flex:0 0 96px"><span class="hi">A-314 — tableau des portes</span></div>`
        : `<div class="plan" data-img="unit" style="height:110px;flex:0 0 110px;background-image:url(assets/plan-niveau-${(selRow("Unités") || [])[4] || paneLevel()}.jpg);${crop(boxForUnit((selRow("Unités") || [])[4] || paneLevel(), (selRow("Unités") || [])[2] ?? 0), .25, "height")}"><span class="hi">${UNIT_TABS[V.utab]} — recadrage de l'unité</span></div>`}` : ""}
      ${rows.map(([k, val]) => `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line-2);padding-bottom:6px">
        <span class="lo bar" style="width:70px"></span><span class="lo bar" style="width:46px"></span>
        <span class="hi" style="font-size:12px;color:var(--ink-2)">${k}</span>
        <span class="hi" style="font-size:12px">${val}</span></div>`).join("")}
      ${V.screen === "Codes" ? codeSideHTML(ARTICLES.find((x) => x.id === V.articleId) || ARTICLES[0])
      : decides ? `<div class="decide">
      <div class="tile" style="border-color:var(--ink)">
        <div class="lo bar" style="width:50%"></div><div class="hi" style="font-weight:600;font-size:12.5px">Pourquoi ce changement?</div>
        <div class="row" style="flex-wrap:wrap;gap:5px">${REASONS.map((m) => `<span class="chip" ${act("reason", m)} style="${m === V.reason ? "border-color:var(--ink)" : ""}">
          <span class="lo bar" style="width:40px"></span><span class="hi">${m}</span></span>`).join("")}</div>
        ${V.reason ? `<div class="hi" style="font-size:11.5px;color:var(--ink-2)">raison retenue: ${V.reason}</div>` : ""}
        <div class="lo bar" style="width:100%;height:34px;border-radius:5px"></div>
        <input class="hi note" value="${V.note.replace(/"/g, "&quot;")}" placeholder="une phrase pour la personne suivante">
        ${V.settled[settleKey()] ? `<div class="hi" style="font-size:11.5px;color:var(--ink-2)">enregistré — ${V.settled[settleKey()]}</div>` : ""}
        <span class="btnw solid ${saveReady() ? "go" : "off"}" data-save ${act("save")} style="justify-content:center"
          title="${saveReady() ? "Enregistrer" : "Choisissez une raison ou écrivez une phrase"}"><span class="lo bar" style="width:80px;background:#fff;opacity:.6"></span><span class="hi">Enregistrer la décision</span></span>
      </div>
      </div>`
      : `<div class="tile"><div class="lo col">${bars(3)}</div></div>`}
    </div>`;

  if (mode === "Bottom sheet") {
    return `<section class="pane rg sheet ${solo("inspector")}" data-rg="inspecteur → feuille du bas" data-fi="${fiOf("inspector")}" style="height:260px">
      ${inner}</section>`;
  }
  if (mode === "Overlay drawer") {
    return `<section class="pane rg drawer ${solo("inspector")}" data-rg="inspecteur → superposition" data-fi="${fiOf("inspector")}">
      ${inner}</section>`;
  }
  return region("inspector", "inspecteur", inner);
}

/* ------------------------------------------------------------ the margin
   A note is a sentence stuck to a point of a drawing. Two kinds share the
   list: a pin the invited collaborator can read, and a studio note that
   stays inside the office. The scope is written on the pin and carried by
   the share link; inside the studio both are shown. */
/* The key carries a version: changing the seed resets what a browser kept,
   test notes included. Each seeded pin sits on what it talks about, read
   off plan-niveau-5: 507's entry door on the corridor, 510's balcony past
   the street face, the corridor at the stair. */
const PIN_KEY = "fitte:epingles:c3:v2";
const PIN_SEED = [
  { id: 1, scope: "partage", surface: "plan", level: 5, sheet: "plan", x: .432, y: .307, zone: "unité 507",
    who: "Entrepreneur général", when: "hier 16:20",
    txt: "Le dégagement devant la porte d'entrée du 507 fait 860 mm, il en faut 900." },
  { id: 2, scope: "partage", surface: "plan", level: 5, sheet: "plan", x: .719, y: .179, zone: "unité 510",
    who: "Chargée de projet", when: "lun. 09:05",
    txt: "Le balcon du 510 dépasse la ligne d'alignement de 0,4 m." },
  { id: 3, scope: "equipe", surface: "plan", level: 5, sheet: "plan", x: .577, y: .319, zone: "corridor commun",
    who: "Vous", when: "mar. 08:40",
    txt: "Rappel: la porte du corridor vers l'escalier est encore dessinée à l'ancienne position. À reprendre avant R05." },
];
function loadPins() {
  try {
    const raw = JSON.parse(localStorage.getItem(PIN_KEY));
    if (Array.isArray(raw)) return raw;
  } catch { /* a corrupt key is not worth a dialog: fall back to the seed */ }
  return PIN_SEED.map((p) => ({ ...p }));
}
const savePins = () => localStorage.setItem(PIN_KEY, JSON.stringify(V.pins));
const nextPinId = () => V.pins.reduce((m, p) => Math.max(m, p.id), 0) + 1;
/* Both publics live in one list: the studio's own reminders and the ones a
   shared link carries. The scope is written on each pin, and the screen
   shows them all — reading the project as the invited side sees it is the
   share dialogue's business, not a mode the studio sits inside. */
const pinsVisible = () => V.pins;
/* A resolved comment leaves the drawings; it is read under « Résolus ». */
const pinsOnSheet = () => pinsVisible().filter((p) => !p.res && p.surface === "plan" && p.level === paneLevel());
const pinsOnModel = () => pinsVisible().filter((p) => !p.res && p.surface === "model");
/* Who wrote a note, by name: the signed-in architect, or the person the
   project was shared with whose role it carries. */
function pinAuthor(p) {
  const s = /^Vous/.test(p.who) ? { name: ME.name, role: "Architecte — vous", me: true }
    : SHARE_PEOPLE.find((x) => x.role === p.who) || { name: p.who, role: "" };
  return { ...s, ini: s.name.split(/[\s-]+/).map((w) => w[0]).join("").slice(0, 2) };
}
const SHEET_NAME = { plan: "plan d'unités", arp: "arpenteur", pay: "paysage" };
const pinAnchor = (p) => (p.surface === "model"
  ? `maquette — niv. ${p.level} — ${p.face}`
  : `${SHEET_NAME[p.sheet] || "plan"} — niv. ${p.level}${p.zone ? ` — ${p.zone}` : ""}`);
/* Which sheet was on screen when the point was put down: the floor plan
   alone, or one of the two consultants' sheets laid over it. */
const currentSheetKey = () => {
  const keys = layKeys();
  return V.lay.arp.on && keys.includes("arp") ? "arp"
    : V.lay.pay.on && keys.includes("pay") ? "pay" : "plan";
};

/* The pins drawn on the 2D sheet. They live inside the transformed box with
   the unit outlines, so they pan and zoom with the drawing; their size is
   divided by the zoom so a pin stays a pin instead of growing into a sign.
   The zoom moves without a render, so paintSheet keeps the division. */
function pinMarkHTML() {
  const z = V.zoom / 100;

    </div>`).join("");
}

/* The note is written at the point it is about. A composer a column away

function pinBubbleHTML() {

/* Armed, the button is not a button any more: it is the pin, held. It
   stays lit, it says what to do with it, and it is the way out of the

function pinArmHTML() {
