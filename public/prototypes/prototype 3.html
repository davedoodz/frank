/* Three questions and nothing else: the body of rules, the part, the
   article. Each answer narrows the next list, so there is never a form to
   fill — only a choice to make. The added article arrives unmeasured: the
   drawing has not been read against it yet, and the screen says so. */
function addCodeDialogHTML(d) {
  const src = CODE_SOURCES.find((s) => s.name === d.source) || CODE_SOURCES[0];
  const sections = Object.keys(src.arts);
  const arts = d.section ? src.arts[d.section] : [];
  const chosen = arts.find((a) => a.id === d.art);
  const step = (n, label) => `<div class="row" style="gap:6px;align-items:baseline;padding-top:2px">
    <span class="hi tag">${n}</span>
    <span class="hi" style="font-size:11.5px;color:var(--ink-2)">${label}</span></div>`;
  const pickrow = (on, action, value, main, note) => `<div class="listrow ${on ? "on" : ""}"
      ${act(action, value)} title="${main}">
    <span class="hi" style="font-size:12px;flex:1">${main}</span>
    ${note ? `<span class="hi" style="font-size:11.5px;color:var(--ink-3)">${note}</span>` : ""}
    ${on ? icon("check") : ""}</div>`;
  return `<div class="scrim" ${act("dlgclose")}>
    <div class="dialog" ${act("dlgstop")} role="dialog" aria-modal="true">
      <div class="dh">${icon("plus")}<span class="hi" style="font-weight:600;font-size:13.5px">Ajouter un article à suivre</span>
        <span style="flex:1"></span>
        <span class="btnw" ${act("dlgclose")} title="Fermer">${icon("x")}</span></div>
      <div class="db">
        ${step("1", "Quel code")}
        <div class="col" style="gap:4px">${CODE_SOURCES.map((s) =>
          pickrow(s.name === d.source, "picksource", s.name, s.short, s.place)).join("")}</div>
        ${step("2", "Quelle partie")}
        <div class="col" style="gap:4px">${sections.map((s) =>
          pickrow(s === d.section, "picksection", s, s, `${src.arts[s].length} articles`)).join("")}</div>
        ${step("3", "Quel article")}
        ${d.section ? `<div class="col" style="gap:4px">${arts.map((a) =>
          pickrow(a.id === d.art, "pickart", a.id, `${a.id} — ${a.topic}`, a.required)).join("")}</div>`
          : `<div class="tile"><span class="hi" style="font-size:12px;color:var(--ink-3)">Choisissez d'abord une partie.</span></div>`}
        ${chosen ? `<blockquote class="hi quote">«&nbsp;${chosen.quote}&nbsp;»</blockquote>` : ""}
      </div>
      <div class="df">
        <span class="hi" style="font-size:11px;color:var(--ink-3);flex:1">L'article arrive non mesuré: rien n'est comparé tant que le dessin n'a pas été lu.</span>
        <span class="btnw" ${act("dlgclose")}><span class="hi">Annuler</span></span>
        <span class="btnw solid" ${act("addcodeok")}>${icon("plus")}<span class="hi">Ajouter</span></span>
      </div>
    </div></div>`;
}

/* Saying what just happened, briefly. An action that leaves no trace on the
   screen says so here instead of pretending to be a button. */
let TOAST_TIMER = null;
function fillToast(t) {
  t.textContent = V.toast;
  if (V.toastUndo) t.insertAdjacentHTML("beforeend", `<u ${act(V.toastUndo[0], V.toastUndo[1])}>Annuler</u>`);
}
/* A message may carry the way back: [action, value] draws « Annuler » in it
   and keeps it up a little longer, long enough to reach. */
function say(message, undo = null) {
  V.toast = message;
  V.toastUndo = undo;
  /* Shown now, not at the next render: a strip reorder redraws only the
     strip, and its message would otherwise wait for an unrelated change. */
  const frame = document.getElementById("frame");
  if (frame) {
    let t = frame.querySelector(":scope > .toast");
    if (!t) { t = document.createElement("div"); t.className = "toast hi"; frame.appendChild(t); }
    fillToast(t);
  }
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(() => { V.toast = null; V.toastUndo = null; render(); }, undo ? 4500 : 2600);
}

/* A note is written in one place, from the button or from the keyboard:
   the text is read off whichever composer carries the article's id — the
   row's or the right column's — and lands in the store both read. */
function saveNote(id) {
  const el = document.querySelector(`[data-note="${CSS.escape(id)}"]`);
  const txt = (el?.value || "").trim();
  if (!txt) { say("Rien à écrire: la note est vide."); return; }
  (V.notes[id] ||= []).push({ who: "Vous", when: "aujourd'hui", txt });
  say(`Commentaire ajouté sur ${id}. Il reste dans fitte, rien n'est envoyé au texte officiel.`);
}

/* A note is rewritten in place and keeps its author: the same person is
   still answering for it, and the date moves to the day it was changed. */
function editNote(key) {
  const [id, i] = key.split("|");
  const el = document.querySelector(`[data-noteedit="${CSS.escape(key)}"]`);
  const txt = (el?.value || "").trim();
  const note = V.notes[id]?.[Number(i)];
  if (!note) { V.noteEdit = null; return; }
  if (!txt) { say("Une note vide se supprime, elle ne s'enregistre pas."); return; }
  note.txt = txt;
  note.when = "aujourd'hui";
  V.noteEdit = null;
  say(`Note modifiée sur ${id}.`);
}

function dropNote(key) {
  const [id, i] = key.split("|");
  const list = V.notes[id];
  if (!list) return;
  list.splice(Number(i), 1);
  if (!list.length) delete V.notes[id];
  V.noteEdit = null;
  say(`Note supprimée sur ${id}.`);
}

function onClick(e) {
  /* Typing in a field is not clicking the thing it sits in. Without this
     the row's own action ran on pointer-down inside the note composer, the
     screen re-rendered, and the textarea the pointer had just landed in
     was replaced before a character could be typed. */
  if (e.target.closest("textarea,input,a[href^='mailto:']")) return;
  const screenEl = e.target.closest("[data-screen]");
  const el = e.target.closest("[data-act]");
  if (screenEl && !el) {
    V.screen = screenEl.dataset.screen;
    /* The panel speaks English: hand it the English name, or it rejects the
       value and the first click is swallowed. */
    dial.setValue("screen", FR_SCREEN[V.screen]);
    return render();
  }
  /* A click anywhere else closes the open menu, the way a menu is dismissed
     everywhere. */
  if (!el) { if (V.clarityOn) { V.clarityOn = null; render(); } return; }
  const value = el.dataset.value;
  const screen = V.screen;

  switch (el.dataset.act) {
    case "view":
      V.view[screen] = Number(value);
      /* A new view is a new set of rows, so the old row number means
         nothing — and on the units screen nothing is chosen in its place:
         the floor itself is what was asked for, and the model shows the
         whole building with that floor lit. */
      V.sel[screen] = screen === "Unités" ? -1 : 0;
      /* Asking for a floor is asking to read a floor: the building-wide
         count steps aside. */
      if (screen === "Unités") V.scope = "Niveau";
      /* A basement or the roof has no unit to glide to: landing with a
         residential floor's zoom and pan left over would show an empty,
         arbitrarily cropped corner of the sheet instead of the sheet. */
      if (screen === "Unités" && isNonresLevel(currentLevel())) { V.zoom = 100; V.pan = { x: 0, y: 0 }; }
      /* A code tab is a different set of articles, so the one open in the
         inspector would be read under a heading it does not belong to:
         the first article of the code chosen takes its place. */
      if (screen === "Codes") {
        const picked = codeGroups().find(([name]) => name === viewsOf("Codes")[Number(value)]);
        V.articleId = picked?.[1][0]?.id ?? null;
      }
      break;
    case "viewnext":
      V.view[screen] = (viewIndex(screen) + 1) % viewsOf(screen).length;
      V.sel[screen] = 0;
      if (screen === "Unités" && isNonresLevel(currentLevel())) { V.zoom = 100; V.pan = { x: 0, y: 0 }; }
      break;
    /* Picking a unit moves the sheet to it, whatever the zoom was: the list
       is a way of looking at the plan, so the answer to a click is the unit
       filling the pane, not a contour somewhere off-screen. Choosing a unit
       is also choosing to read a floor, so it ends the building scope. */
    case "circulation": selectCirculation(); return;
    /* The switch over the model: the model itself, or one façade with its
       own textures. */
    case "elev":
      V.facade = value ? { face: value, plain: true } : null;
      paintFacades();
      return;
    /* A façade's elevation, opened from its table; the open one closes. */
    case "facade":
      V.facade = V.facade?.face === value ? null : { face: value };
      paintFacades();
      return;
    /* A material is shown on whatever the pane is looking at — the 3D
       model, or the open elevation. Clicking it again gives the building
       back its colours. */
    case "mat":
      V.matShow = V.matShow === Number(value) ? 0 : Number(value);
      paintFacades();
      return;
    /* A figure is its material on that façade: the elevation opens and the
       material is the one in colour on it. */
    case "facmat": {
      const [face, num] = value.split("|");
      V.matShow = Number(num);
      V.facade = { face };
      paintFacades();
      return;
    }
    case "row":
      /* Clicking the unit already chosen lets it go: nothing is chosen, the
         whole sheet comes back, and the model shows the floor — the same
         reading as picking the level's tab. */
      if (screen === "Unités" && V.scope !== "Bâtiment" && selIndex(screen) === Number(value)) {
        V.sel[screen] = -1;
        V.zoom = 100; V.pan = { x: 0, y: 0 };
        break;
      }
      V.sel[screen] = Number(value);
      if (screen === "Unités" && V.scope === "Bâtiment") { V.scope = "Niveau"; break; }
      /* Mark the destination first, then move the sheet to it: the mark is
         visible for the whole journey, and the glide's first frame lands on
         a thread that has nothing left to rasterise. */
      if (screen === "Unités") { paintSelection(); fitUnit(); return; }
      break;
    case "article":
      if (V.articleId !== value) V.noteEdit = null;
      V.articleId = value; V.clarityOn = null;
      break;
    /* The office's reading of a provision, changed where it is shown. It is
       never a statement about compliance: the screen measures drawings, it
       does not interpret the law. */
    /* Pinning lifts an article to the top of its list; unpinning lets it
       fall back to its place. */
    case "artpin": {
      const i = V.artPins.indexOf(value);
      if (i < 0) { V.artPins.push(value); say(`Signet sur ${value}: il reste en haut de la liste.`); }
      else { V.artPins.splice(i, 1); say(`Signet retiré de ${value}.`); }
      break;
    }
    case "clarityopen": V.clarityOn = V.clarityOn === value ? null : value; break;
    case "clarity": {
      const [id, k] = value.split("|");
      V.clarity[id] = k; V.clarityOn = null;
      say(`${id} — ${CLARITY_LABEL[k].toLowerCase()}, lecture de l'atelier.`);
      break;
    }
    /* The article and every note written against it, as text: the mail to
       the borough is written by pasting, not by retyping a number. */
    case "copyarticle": {
      const a = ARTICLES.find((x) => x.id === value);
      /* The clipboard answers after this click has already been drawn, so
         the message it produces draws itself. */
      navigator.clipboard.writeText(articleText(a))
        .then(() => { say(`${value} et ses notes copiés.`); markCopied(`art|`+value); })
        .catch(() => { say("Copie refusée par le navigateur."); render(); });
      break;
    }
    /* One floor, or all of them. Leaving the building scope goes back to the
       unit that was being read, so the switch is not a one-way door. */
    case "scope":
      V.scope = value;
      /* A typology fill belongs to a floor plan, and the plan is leaving
         the screen: nothing should stay lit on a drawing no longer shown. */
      if (V.scope === "Bâtiment") TYPOS.forEach((ty) => { if (V.typo[ty]) dial.setValue(`typologies.${ty}`, false); });
      break;
    /* The typologies are dials (the fidelity panel owns them), so a band
       of the mix goes through the dial and lets applyDial write V. */
    /* Asking where a type is is a question about the whole floor, so no unit
       stays chosen: the fills are read without one outline singled out. */
    case "typo":
      V.sel["Unités"] = -1;
      dial.setValue(`typologies.${value}`, !V.typo[value]);
      return;
    /* Four files would be four clicks; the four tables in one file are read
       as one sheet with four blocks, which is how a quantity take-off is
       passed around anyway. */
    case "csvall": exportAllCSV(); say("Les quatre tableaux ont été téléchargés en .csv."); break;
    /* Writing a note never touches a drawing or a bylaw: it is a sentence
       stored against the provision's number, with a name and a day. */
    case "notesave": saveNote(value); break;
    /* The composer opens with the article already written into it: the
       question is about this provision, and retyping the numbers is how
       one of them changes on the way out. */
    case "mailopen": {
      const [artId, who] = value.split("|");
      const a = ARTICLES.find((x) => x.id === artId);
      V.dialog = { kind: "mail", art: artId, contact: who, from: V.mailFrom,
        to: CONTACTS[who].mail, cc: "", subject: `[${V.project}] ${a.id} — ${a.topic}`,
        body: `${articleText(a)}\n\n`, files: [], local: [] };
      break;
    }
    case "mailfile": {
      const f = V.dialog.files;
      V.dialog.files = f.includes(value) ? f.filter((x) => x !== value) : [...f, value];
      break;
    }
    case "maillocalrm":
      V.dialog.local = V.dialog.local.filter((_, i) => i !== Number(value));
      break;
    case "mailsend": {
      const d = V.dialog;
      if (!d.to.trim() || !d.subject.trim()) { d.error = "Il manque le destinataire ou l'objet."; break; }
      if (!d.body.trim()) { d.error = "Le message est vide."; break; }
      /* The address the office signs with is learned from the message that
         was actually sent, so it is typed once and never again. */
      V.mailFrom = d.from.trim() || V.mailFrom;
      const count = d.files.length + d.local.length;
      (V.mails[d.contact] ||= []).push({ when: "aujourd'hui", subject: d.subject.trim(), cc: (d.cc || "").trim(),
        body: d.body, files: [...d.files, ...d.local.map((f) => f.name)], art: d.art });
      CONTACTS[d.contact].last = "aujourd'hui";
      CONTACTS[d.contact].waited = 0;
      /* The button answers first — « Envoyé », black like « Copié » — then
         the dialog closes on its own. */
      d.sent = true;
      setTimeout(() => {
        if (V.dialog !== d) return;
        V.dialog = null;
        say(`Courriel envoyé à ${d.to.trim()}${(d.cc || "").trim() ? `, copie à ${d.cc.trim()}` : ""}${count
          ? ` avec ${count} pièce${count > 1 ? "s" : ""} jointe${count > 1 ? "s" : ""}`
          : ""}. Il reste au dossier de l'article.`);
        render();
      }, 900);
      break;
    }
    case "noteedit": V.noteEdit = value; break;
    case "noteeditsave": editNote(value); break;
    case "noteeditstop": V.noteEdit = null; break;
    case "notedrop": dropNote(value); break;
    /* Three questions, in the order a person asks them: which body of
       rules, which part of it, which article. */
    case "addcode": {
      const open = CODE_SOURCES.find((x) => x.short === viewOf("Codes")) || CODE_SOURCES[0];
      V.dialog = { kind: "addcode", source: open.name, section: null, art: null };
      break;
    }
    case "picksource": V.dialog = { ...V.dialog, source: value, section: null, art: null }; break;
    case "picksection": V.dialog = { ...V.dialog, section: value, art: null }; break;
    case "pickart": V.dialog = { ...V.dialog, art: value }; break;
    case "codeqclear": { const c = codeQ(); c.q = c.asked = ""; break; }
    case "codeqsrc": { const c = codeQ(); c.from[value] = !c.from[value]; codeScan(); return; }
    /* Following a found article puts it in the list as the Ajouter dialog
       does: unmeasured until the drawings are read against it. */
    case "codeqfollow": {
      const label = viewOf("Codes"), src = codeSource(label);
      const e = codeEntry(label, (CODE_INDEX[label] || []).find((x) => x.id === value) || {});
      if (!e.id || ARTICLES.some((x) => x.id === e.id)) break;
      ARTICLES.push({ id: e.id, topic: e.topic, doc: src.name, place: src.place,
        edition: e.from === "web" ? `en ligne — ${e.site}` : e.from === "bureau" ? "note interne du bureau" : src.edition,
        quote: e.quote, measured: "—", required: e.required || "—", state: "non résolu",
        needs: e.needs || "à lire contre les dessins", page: e.from === "bureau" ? null : e.page, fig: e.fig || "classement" });
      say(`${e.id} suivi. Rien n'est mesuré tant que le dessin n'a pas été lu.`);
      break;
    }
    case "addcodeok": {
      const d = V.dialog, src = CODE_SOURCES.find((s) => s.name === d.source);
      const a = (src?.arts[d.section] || []).find((x) => x.id === d.art);
      if (!a) { say("Choisissez un article avant d'ajouter."); break; }
      if (ARTICLES.some((x) => x.id === a.id)) { say(`${a.id} est déjà suivi.`); V.dialog = null; break; }
      ARTICLES.push({ id: a.id, topic: a.topic, doc: src.name, place: src.place, edition: src.edition,
        quote: a.quote, measured: "—", required: a.required, state: "non résolu",
        needs: a.needs, page: a.page, fig: a.fig });
      V.articleId = a.id; V.dialog = null;
      say(`${a.id} ajouté. Rien n'est mesuré tant que le dessin n'a pas été lu.`);
      break;
    }
    /* The calendar and the list are one object: a day click filters the
       list, a date in the list moves the calendar. */
    case "calday": V.day = value; break;
    /* Clicking a month in the year grid is asking to read that month. */
    case "calmonth": V.day = value; V.scale = "Mois"; break;
    case "calscale": V.scale = value; break;
    case "calmove": {
      const n = Number(value), v = V.scale;
      if (v === "Semaine") V.day = shift(V.day, 7 * n);
      else if (v === "Année") {
        const d = dOf(V.day); d.setUTCFullYear(d.getUTCFullYear() + n); V.day = iso(d);
      } else { const d = dOf(V.day); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); V.day = iso(d); }
      break;
    }
    case "task": { V.task = V.task === value ? null : value; const t = TASKS.find((x) => x.id === value);
      if (t && !t.done) V.day = t.day; break; }
    /* Ticking is not filing: the task stays on its day, struck through,
       and offers « Archiver ». Unticking reopens it, out of the archive. */
    case "tasktick": {
      const t = TASKS.find((x) => x.id === value);
      if (!t) break;
      t.done = !t.done;
      if (t.done) { t.doneAt = TODAY; say(`Faite: ${t.title}. Archiver pour la ranger.`); }
      else { delete t.doneAt; delete t.archived; V.day = t.day; say(`Rouverte: ${t.title}`); }
      if (V.taskEdit === t.id) V.taskEdit = null;
      break;
    }
    /* The row folds first, then the task moves to « Archivées », whose count
       stands out for a moment; the message offers the way back. */
    case "taskfile": {
      const t = TASKS.find((x) => x.id === value);
      if (!t) break;
      const row = document.querySelector(`.task[data-task="${value}"]`);
      if (row) { row.style.maxHeight = `${row.offsetHeight}px`; void row.offsetHeight; row.classList.add("gone"); }
      setTimeout(() => {
        t.archived = true; V.archBump = true;
        say(`Archivée: ${t.title}.`, ["taskunfile", t.id]);
        render();
        setTimeout(() => { V.archBump = false; render(); }, 1400);
      }, row ? 220 : 0);
      return;
    }
    case "taskunfile": {
      const t = TASKS.find((x) => x.id === value);
      if (t) { delete t.archived; V.archBump = false; say(`Reprise: ${t.title}.`); }
      break;
    }
    /* The flag on a row: raising a task, or letting it back down, without
       opening its form. The month follows, since it reads the same field. */
    case "tflag": {
      const t = TASKS.find((x) => x.id === value);
      if (!t) break;
      t.prio = t.prio === "haute" ? "normale" : "haute";
      say(t.prio === "haute" ? `À passer avant le reste: ${t.title}` : `${t.title} repasse avec le reste.`);
      break;
    }
    /* Straight to the conflict: goIssue does the whole move — the screen,
       the two sheets, the level, the unit and the card. */
    case "taskgo": goIssue(value); return;
    case "tfilter": V.taskFilter = value; break;
    /* The editor -------------------------------------------------------
       One form serves the new task and the existing one. "new" writes into
       V.taskDraft, an id writes into that task, and in both cases the open
       inputs are read back first so a half-typed title is never lost to a
       chip click. */
    case "tnew":
      readTaskForm();
      V.taskDraft = { title: "", day: V.day, prio: "normale", phase: "Permis", who: [] };
      V.taskEdit = "new";
      break;
    case "tedit": readTaskForm(); V.taskEdit = V.taskEdit === value ? null : value; break;
    case "tcancel": V.taskEdit = null; break;
    case "tprio": { const t = editingTask(); if (t) { readTaskForm(); t.prio = value; } break; }
    case "tphase": { const t = editingTask(); if (t) { readTaskForm(); t.phase = value; } break; }
    /* A task can sit on two seats at once, so the chip toggles rather than
       replaces: handing a drawing to the atelier does not take it off the
       project manager's list. */
    case "twho": {
      const t = editingTask();
      if (!t) break;
      readTaskForm();
      t.who = t.who.includes(value) ? t.who.filter((x) => x !== value) : [...t.who, value];
      break;
    }
    case "tsave": {
      readTaskForm();
      const t = editingTask();
      if (!t) break;
      if (!t.title.trim()) { say("Il faut un titre."); break; }
      if (V.taskEdit === "new") {
        TASKS.push({ ...t, id: `t${++taskSeq}`, title: t.title.trim(), done: false, createdAt: TODAY });
        say(`Ajoutée: ${t.title.trim()}`);
      } else say(`Modifiée: ${t.title.trim()}`);
      V.day = t.day;
      V.taskEdit = null;
      break;
    }
    case "tdel": {
      const i = TASKS.findIndex((x) => x.id === value);
      if (i < 0) break;
      say(`Supprimée: ${TASKS[i].title}`);
      TASKS.splice(i, 1);
      V.taskEdit = null;
      V.task = null;
      break;
    }
    /* Folding a pane forgets the width it was dragged to: coming back to
       a pane is coming back to the layout it was designed with, unless the
       edge is moved again. */
    case "gutfold": {
      /* While the building is counted the plan's state is its own: the
         strip reopens the sheet there without unfolding it on the floors,
         and leaving the scope puts the floor's own state back. */
      if (value === "plan" && buildingScope()) { V.planWhole = !V.planWhole; break; }
      const k = splitKey(value);
      if (V.fold[k]) delete V.fold[k];
      else { V.fold[k] = true; delete V.split[k]; }
      break;
    }
    /* The source link is a real link: the browser follows it, and the screen
       only notes what was opened. */
    case "source": say(`${value} — texte officiel ouvert dans un onglet. Lecture seule.`); return render();
    case "utab": V.utab = Number(value); break;
    case "pinscope": V.pinScope = value; break;
    /* Arming the pin: the next click on a drawing puts the point down, and
       nothing else on the screen changes meaning in the meantime. */
    case "pinmode": V.pinMode = !V.pinMode; V.pinFor = ""; V.pending = null; break;
    case "mscope": V.mScope = value; break;
    /* The sentence already written travels with the pin: arming carries
       the margin's draft into the bubble that will take the point. */
    /* Pinning from the margin: arm, click the plan, and the point is held
       for the margin's comment; clicking the green chip takes it back off. */
    case "markpin":
      if (V.mAnchor) { V.mAnchor = null; V.pinMode = false; V.pinFor = ""; break; }
      V.pinMode = !(V.pinMode && V.pinFor === "margin");
      V.pinFor = V.pinMode ? "margin" : "";
      V.pending = null;
      break;
    /* A comment about the project, with no point on a drawing. */
    case "postnote": {
      const txt = V.mdraft.trim();
      if (!txt) { document.querySelector("[data-mdraft]")?.focus(); return; }
      V.pins.push({ id: nextPinId(), scope: V.mScope,
        who: V.mScope === "equipe" ? "Vous" : "Vous (partagé)", when: "à l'instant", txt, ...(V.mAnchor || {}) });
      V.selPin = V.pins[V.pins.length - 1].id;
      V.mdraft = ""; V.mAnchor = null;
      savePins();
      break;
    }
    case "pincancel": V.pending = null; V.draft = ""; V.pinMode = false; V.pinFor = ""; break;
    case "pinpost": postPin(); return;
    /* Resolving files a comment under « Résolus » and takes its pin off
       the drawings; reopening puts both back. */
    case "noteres": {
      const p = V.pins.find((x) => x.id === Number(value));
      if (p) p.res = { by: ME.id, when: "à l'instant" };
      if (V.selPin === Number(value)) V.selPin = null;
      savePins();
      break;
    }
    case "notereo": {
      const p = V.pins.find((x) => x.id === Number(value));
      if (p) delete p.res;
      V.noteTab = "o";
      V.selPin = Number(value);
      savePins();
      break;
    }
    case "notetab": V.noteTab = value; break;
    case "note": {
      const id = Number(value);
      V.selPin = V.selPin === id ? null : id;
      const pin = V.selPin && V.pins.find((x) => x.id === id);
      if (pin) revealPin(pin);
      break;
    }
    case "notedel":
      V.pins = V.pins.filter((p) => p.id !== Number(value));
      V.selPin = null;
      savePins();
      break;
    /* The pile ---------------------------------------------------------
       Picking a thumbnail opens its document card; the badge adds the
       drawing to the sheet or takes it off. The two consultants' sheets
       are owned by the fidelity panel, so those two go through the dial
       and let applyDial write V — writing both would let them disagree
       on the next dial change. The architect's sheet is not on the panel,
       so it is written here. */
    /* Picking a thumbnail puts that drawing on top of the sheet: it is laid
       on if it was off, and moved to the head of the pile, which is the
       front of the stack. Its card stays a hover card. */
    case "lpick":
      V.layCard = false;
      V.layPick = value;
      bringLayFront(value);
      return;
    /* The last drawing on the sheet carries no badge at all, so there is
       no way in here to empty the pane. */
    case "lstack": {
      const show = !V.lay[value].on;
      V.layPick = value;
      setLayShown(value, show);
      say(`${LAYDOC[value].short} ${show ? "affiché" : "masqué"}.`);
      return;
    }
    /* A conflict is caught the first time it is looked at: the stamp is
       written once and the ticket quotes it, so "when did we see this"
       has one answer. */
    case "xopen": {
      V.xopen = V.xopen === value ? null : value;
      if (V.xopen) {
        V.caught[V.xopen] ||= stampNow();
        V.xdraft = { who: [], day: dayPlus(3) };
      }
      break;
    }
    case "xclose": V.xopen = null; break;
    case "mtab": V.marginTab = value; break;
    case "issues": V.marginTab = "conf"; break;
    case "issue": goIssue(value); return;
    /* The warning beside a unit opens its conflict where it is seen: the
       drawing that reveals it laid over the architecture, its card open.
       A unit with two takes the next one on each click. */
    case "uconf": {
      const list = crossingsFor(value).filter((c) => !c[5]).sort((a, b) => Boolean(b[6]) - Boolean(a[6]));
      const at = list.findIndex((c) => c[0] === V.issueSel);
      goIssue(list[(at + 1) % list.length][0]);
      return;
    }
    case "xwho": {
      const w = V.xdraft.who;
      V.xdraft.who = w.includes(value) ? w.filter((x) => x !== value) : [...w, value];
      break;
    }
    case "xday": V.xdraft.day = dayPlus(Number(value)); break;
    case "xmake": {
      const c = CROSSINGS.find((x) => x[0] === V.xopen);
      if (!c) break;
      if (!V.xdraft.who.length) { say("À qui? Une tâche sans personne n'est pas assignée."); break; }
      const field = document.querySelector("[data-xdate]");
      const day = (field && field.value) || V.xdraft.day || dayPlus(3);
      TASKS.push({ id: `t${++taskSeq}`, day, title: `${c[0]} — ${c[1]} (unité ${c[3]})`,
        who: [...V.xdraft.who], prio: "haute", done: false, phase: "Chantier", createdAt: TODAY,
        src: c[0], caught: V.caught[c[0]] });
      say(`Tâche créée pour ${c[0]}, échéance ${fmtDay(day)}.`);
      break;
    }
    case "xgo": {
      const t = taskForConflict(V.xopen);
      V.xopen = null;
      V.screen = "Échéancier";
      if (t) V.day = t.day;
      dial.setValue("screen", FR_SCREEN["Échéancier"]);
      break;
    }
    /* The whole path, file included, as it would be pasted into Explorer. */
    case "lcopy":
      navigator.clipboard?.writeText(`${LAYDOC[value].dir()}${layDoc(value).file}`).catch(() => {});
      say(`Chemin copié: ${LAYDOC[value].dir()}${layDoc(value).file}`);
      markCopied(`path|`+value);
      return;
    case "lswap":
      V.layHist = false;
      say(`Choisir un autre document dans ${LAYDOC[value].dir()}`);
      break;
    /* The list opens in place, under its row: the card stays the one
       place a drawing's documents are read. */
    case "lhist": V.layHist = !V.layHist; break;
    /* Picking a document from the list lays it on the sheet in place of
       the current one: the card's name and date change, and the drawing
       redraws from the top so the swap is seen, not just read. */
    case "lold": {
      const [lk, i] = value.split("|");
      V.layCur[lk] = Number(i);
      V.layHist = false;
      V.laySwap = lk;
      render();
      swapFx(lk);
      say(`${layDoc(lk).file} — posé sur le plan.`);
      setTimeout(() => { if (V.laySwap === lk) V.laySwap = null; }, 900);
      return;
    }
    case "pdfview":
      say(`${layDoc(value).file} — ouvert dans Acrobat.`);
      break;
    case "mtool":
      V.mtool = value;
      document.querySelectorAll('[data-act="mtool"]').forEach((b) => {
        b.classList.toggle("on", b.dataset.value === value);
        b.setAttribute("aria-pressed", String(b.dataset.value === value));
      });
      window.fitteModel?.setTool(value);
      return;
    /* The steppers move the zoom without going through render: the drawing
       must not be rebuilt to be pushed one notch. */
    case "zfit": { V.zoom = 100; V.pan = { x: 0, y: 0 }; paintSheet(); return; }
    case "rot": rotatePlan(Number(value)); return;
    case "rot0": resetPlanTurn(); return;
    case "zstep": {
      const [side, dir] = value.split(":");
      const k = dir === "+" ? 1 : -1;
      if (side === "plan") {
        /* Above 100 % a step is a quarter more; below it, where the sheet
           only shrinks from filling the pane to three quarters of it, a
           step is a quarter of that range, so 100 → 75 → 50 → 25 → 0. */
        const up = dir === "+";
        const s = zoomShown(V.zoom);
        const below = up ? s < 100 : V.zoom <= 100;
        const toZ = (t) => ZMIN + (Math.max(0, Math.min(100, t)) / 100) * (100 - ZMIN);
        zoomBy(below ? toZ(up ? Math.floor(s / 25) * 25 + 25 : Math.ceil(s / 25) * 25 - 25)
          : Math.round(V.zoom * (up ? 1.25 : 1 / 1.25)));
        paintSheet();
      } else {
        V.mzoom = Math.max(0, Math.min(100, V.mzoom + k * 8));
        paintModelRead();
        window.fitteModel?.writeZoom(V.mzoom);
      }
      return;
    }
    case "reason": V.reason = V.reason === value ? null : value; break;
    case "save":
      if (!saveReady()) { say("Rien à enregistrer: choisissez une raison ou écrivez une phrase."); break; }
      V.settled[settleKey()] = [V.reason, V.note.trim()].filter(Boolean).join(" — ");
      say(`Décision enregistrée sur ${settleKey()}.`);
      V.reason = null; V.note = "";
      break;
    case "open":
      V.project = value;
      V.screen = "Unités";
      dial.setValue("screen", FR_SCREEN[V.screen]);
      break;
    /* A project is not created by a click: it is a folder on the server that
       someone points at, so the button opens the dialog that asks where. */
    case "newproject":
      V.dialog = { name: "", folder: "", kinds: ["Dessins DXF"], error: "" };
      break;
    /* A click elsewhere in the dialog closes an open access menu. */
    case "dlgstop":
      if (V.dialog?.edit == null) return;
      V.dialog = { ...V.dialog, edit: null };
      break;
    case "dlgclose": V.dialog = null; break;
    case "dlgfolder": V.dialog.folder = value; V.dialog.error = ""; break;
    case "dlgkind": {
      const k = V.dialog.kinds;
      V.dialog.kinds = k.includes(value) ? k.filter((x) => x !== value) : [...k, value];
      break;
    }
    case "dlgcreate": {
      const d = V.dialog;
      /* Both answers are needed: a name with no folder has nothing to read,
         a folder with no name cannot be found again in the list. */
      if (!d.name.trim() || !d.folder.trim()) {
        d.error = "Il faut un nom et un dossier: la lecture part du dossier, la liste part du nom.";
        break;
      }
      if (!d.kinds.length) { d.error = "Choisissez au moins un type de fichier à lire."; break; }
      if (PROJECTS.some((p) => p[0].toLowerCase() === d.name.trim().toLowerCase())) {
        d.error = "Ce nom est déjà dans la liste."; break;
      }
      PROJECTS.unshift([d.name.trim(), "aucun dessin lu",
        `${d.folder.trim()} — ${d.kinds.length} type${d.kinds.length > 1 ? "s" : ""}`, "première lecture en attente", true]);
      say(`${d.name.trim()} — dossier connecté. La première lecture est en file; rien n'est écrit dans le dossier.`);
      V.dialog = null;
      V.screen = "Projets";
      dial.setValue("screen", FR_SCREEN[V.screen]);
      V.view["Projets"] = 0;
      break;
    }
    /* Sharing: a link, a right, and nothing else. The invitation itself is
       out of scope for the prototype — what is being judged is that read
       and comment are two different grants. */
    case "share":
      V.dialog = { kind: "share", right: "Lecture et commentaires" };
      break;
    case "shareright":
      V.dialog = { ...V.dialog, right: value };
      break;
    /* One person's access opens under their row: change the right, or
       take it away. */
    case "sharepedit": {
      const i = Number(value);
      V.dialog = { ...V.dialog, edit: V.dialog.edit === i ? null : i };
      break;
    }
    case "sharepright": {
      const [i, right] = value.split("|");
      const p = SHARE_PEOPLE[Number(i)];
      if (p && p.right !== right) { p.right = right; say(`${p.name}: ${right.toLowerCase()}.`); }
      V.dialog = { ...V.dialog, edit: null };
      break;
    }
    case "sharepremove": {
      const [p] = SHARE_PEOPLE.splice(Number(value), 1);
      V.dialog = { ...V.dialog, edit: null };
      if (p) say(`${p.name} n'a plus accès au projet.`);
      break;
    }
    case "sharecopy":
      navigator.clipboard?.writeText(value).catch(() => {});
      say(`Lien copié: ${value} — ${(V.dialog && V.dialog.right) || "Lecture et commentaires"}.`);
      markCopied(`link|`+value);
      return;
    case "autocad":
      say(`Remise à AutoCAD: ${value && LAYDOC[value] ? layDoc(value).file : dwgName()} s'ouvre sur l'unité, la décision suit.`);
      break;
    case "sketchup":
      say(`Remise à SketchUp: ${skpDoc().file} s'ouvre sur ${viewOf("Unités").toLowerCase()}. Lecture seule.`);
      break;
    case "skpchip": V.docs.skpOpen = !V.docs.skpOpen; V.docs.skpHist = V.docs.skpList = false; break;
    case "laddopen": V.docs.addOpen = !V.docs.addOpen; V.layCard = false; break;
    case "laddpick": {
      const [disc, ic, file, date] = String(value).split("|");
      V.docs.added.push({ lv: paneLevel(), disc, ic, file, date });
      V.docs.addOpen = false;
      break;
    }
    case "skphist": V.docs.skpHist = !V.docs.skpHist; V.docs.skpList = false; break;
    case "skplist": V.docs.skpList = !V.docs.skpList; V.docs.skpHist = false; break;
    case "skppick": skpPick(Number(value)); return;
    case "expmenu": V.exportMenu = !V.exportMenu; break;
    /* A jump is not a state change: scrolling the pane and then rendering
       it would throw away the scroll that was just asked for. */
    case "fqcols":
      V.fqCols = value;
      paintFQ();
      return;
    /* The building's four readings. Areas and openings are the same two the
       floor offers, so picking one here holds when a level is opened. */
    case "btab":
      V.bTab = value;
      if (value === "s" || value === "o") V.fqCols = value;
      break;
    case "blevel":
      V.bLevel = V.bLevel === Number(value) ? null : Number(value);
      break;
    case "export": {
      V.exportMenu = false;
      const name = EXPORTS.find(([k]) => k === value)?.[1] || value;
      say(`Export préparé — ${name} — ${viewOf("Unités")}.`);
      break;
    }
    default: return;
  }
  render();
}

/* ------------------------------------------------ production view */

/* The authoring panel is intentionally absent from the deployed prototype.
   This state freezes its approved values while preserving the interaction
   paths that change screens, typologies, and plan layers. */
const SCREEN_FR = { Projects: "Projets", Units: "Unités", Codes: "Codes", Schedule: "Échéancier" };
const FR_SCREEN = Object.fromEntries(Object.entries(SCREEN_FR).map(([en, fr]) => [fr, en]));

const productionView = () => ({
  screen: "Projects",
  fidelity: "high",
  regionLabels: false,
  density: "comfortable",
  fileSwap: { plan: "Dim + top bar", planSeconds: 1.4, model: "Dim + top bar", modelSeconds: 2.2 },
  elevationMark: { arrowScale: 100, arrowLength: 100, arrowOffset: 0 },
  shell: "Inset card",
  chrome: "Black",
  chromeColors: { topBar: "Current", tabRow: "Current", pageBorder: "Current" },
  tabMotion: { style: "Slide", ms: 280 },
  foldedIcons: "Upright",
  commentHover: "Grey fill",
  articleSelected: "Grey fill",
  theme: "Light",
  homeLayout: "Card grid",
  isolate: "none",
  railIcons: { units: "Compare", codes: "Number", schedule: "Calendar" },
  typologies: { "3½": false, "4½": false, "5½": false },
  layers: {
    surveyor: false,
    surveyorOpacity: 100,
    landscaping: false,
    landscapingOpacity: 100,
    align: {
      surveyorScale: 100,
      surveyorX: 0,
      surveyorY: 0,
      landscapingScale: 100,
      landscapingX: 0,
      landscapingY: 0,
    },
  },
  nav: { fidelity: "inherit", layout: "Two rows, no rail", icons: "Rail only", labels: "Full label", tabStyle: "Plain", tabAlign: "Left" },
  header: { fidelity: "inherit", layout: "Title + actions" },
  list: { fidelity: "inherit", layout: "Card grid" },
  content: { fidelity: "inherit", layout: "Two panes" },
  inspector: { fidelity: "inherit", layout: "Right panel" },
});

const dial = {
  values: productionView(),
  setValue(path, value) {
    const keys = path.split(".");
    const last = keys.pop();
    let target = this.values;
    for (const key of keys) target = target[key];
    target[last] = value;
    applyDial(this.values);
  },
};

function applyDial(v) {
  V.screen = SCREEN_FR[v.screen] || V.screen;
  V.fidelity = v.fidelity;
  V.labels = v.regionLabels;
  V.density = v.density;
  V.planSwap = v.fileSwap.plan;
  V.planLoad = v.fileSwap.planSeconds;
  V.modelSwap = v.fileSwap.model;
  V.modelLoad = v.fileSwap.modelSeconds;
  document.documentElement.style.setProperty("--em-scale", v.elevationMark.arrowScale / 100);
  document.documentElement.style.setProperty("--em-len", v.elevationMark.arrowLength / 100);
  document.documentElement.style.setProperty("--em-off", `${v.elevationMark.arrowOffset}px`);
  V.shell = v.shell;
  V.chrome = v.chrome;
  V.homeLayout = v.homeLayout;
  V.isolate = v.isolate;
  /* On the root, not on the frame: the toast and the dialog sit outside it
     and read the same tokens. */
  document.documentElement.dataset.theme = String(v.theme || "").toLowerCase() === "dark" ? "dark" : "light";
  const tone = (label) => ({ "dark gray": "gray", black: "black", "brand green": "green" })[String(label || "").toLowerCase()] || "";
  const cc = v.chromeColors || {};
  Object.assign(document.documentElement.dataset,
    { toneTop: tone(cc.topBar), toneRow: tone(cc.tabRow), toneBand: tone(cc.pageBorder) });
  TAB_MOTION.kind = String(v.tabMotion?.style || "none").toLowerCase();
  TAB_MOTION.ms = v.tabMotion?.ms ?? 280;
  document.documentElement.dataset.foldIcon = v.foldedIcons === "Turned with text" ? "turn" : "upright";
  document.documentElement.dataset.pinHover = String(v.commentHover || "Grey fill").split(" ")[0].toLowerCase();
  document.documentElement.dataset.artSel = v.articleSelected === "Black fill" ? "black" : "grey";
  /* The panel names the glyph in English and title-cases what it is given,
     so the label is matched without regard to case. */
  const pick = (screen, label) => {
    const want = String(label || "").toLowerCase();
    const hit = NAV_ICONS[screen].find(([l]) => l.toLowerCase() === want);
    V.icons[screen] = (hit || NAV_ICONS[screen][0])[1];
  };
  pick("Unités", v.railIcons.units);
  pick("Codes", v.railIcons.codes);
  pick("Échéancier", v.railIcons.schedule);
  const la = v.layers, al = la.align;
  TYPOS.forEach((t) => { V.typo[t] = v.typologies[t]; });
  V.lay.arp = { on: la.surveyor, opacity: la.surveyorOpacity,
    scale: al.surveyorScale, x: al.surveyorX, y: al.surveyorY };
  V.lay.pay = { on: la.landscaping, opacity: la.landscapingOpacity,
    scale: al.landscapingScale, x: al.landscapingX, y: al.landscapingY };
  ["nav", "header", "list", "content", "inspector"].forEach((r) => { V[r] = v[r]; });
  render();
}

/* The send button follows its draft as it is typed, without a render that
   would take the caret out of the field. */
function armSend(action, text) {
  document.querySelector(`[data-act="${action}"]`)?.classList.toggle("wait", !text.trim());
}
/* « Écrire la note » stays grey until there is something to write. The
   field is redrawn by both render() and paintSelection(), so the page
   listens once instead of each redraw wiring it again. */
document.addEventListener("input", (e) => {
  if (e.target.matches?.("textarea[data-note]")) armSend("notesave", e.target.value);
});

/* Level tabs switch in place, with no travelling tab. TAB_MOTION only
   paces the Coordination / Codes switch below. */
const TAB_MOTION = { kind: "slide", ms: 280 };
/* The Coordination / Codes switch: its lit pill slides from one screen to
   the other (springing when TAB_MOTION is a spring). Measured as the
   pointer goes down, played on the new row. */
let msFrom = null, msFromAt = 0;
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".tabs.lvl .ms");
  const cur = b?.closest(".mseg").querySelector('.ms[aria-current="true"]');
  msFrom = cur && cur !== b ? cur.getBoundingClientRect() : null;
  msFromAt = performance.now();
}, true);
/* A change of screen renders twice (the panel's echo, then the click's),
   so the slide waits a frame and plays on the row that stays. */
window.addEventListener("fitte:render", () => {
  const from = msFrom;
  msFrom = null;
  if (!from || TAB_MOTION.kind === "none" || performance.now() - msFromAt > 800) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  requestAnimationFrame(() => slideSwitch(from));
});
function slideSwitch(from) {
  const seg = document.querySelector(".tabs.lvl .mseg"), to = seg?.querySelector('.ms[aria-current="true"]');
  if (!to) return;
  const t = to.getBoundingClientRect(), s = seg.getBoundingClientRect();
  if (Math.abs(t.left - from.left) < 1) return;
  const pill = document.createElement("span");
  pill.className = "msglide";
  Object.assign(pill.style, { top: `${t.top - s.top}px`, height: `${t.height}px` });
  seg.append(pill);
  seg.classList.add("gliding");
  const spring = TAB_MOTION.kind === "spring";
  const a = pill.animate([
    { transform: `translateX(${from.left - s.left}px)`, width: `${from.width}px` },
    { transform: `translateX(${t.left - s.left}px)`, width: `${t.width}px` }],
    { duration: spring ? TAB_MOTION.ms * 1.3 : TAB_MOTION.ms, easing: spring ? "cubic-bezier(.34,1.5,.5,1)" : "cubic-bezier(.25,.8,.25,1)" });
  const end = () => { pill.remove(); seg.classList.remove("gliding"); };
  a.onfinish = end;
  a.oncancel = end;
}

sprite();
/* The notes outlive the tab: they are read back before the first paint, and
   the model's picker is wired once because its canvas survives re-renders. */
V.pins = loadPins();
/* The first paint happens while the model is still downloading, so the pins
   hung on it are handed over again the moment there is a camera. */
window.addEventListener("fitte:model-state", (e) => {
  if (e.detail !== "ready") return;
  pushModelPins();
  /* The openings are counted in the model: drawn once it is in. */
  paintFQ();
});
/* The façade areas are counted once, after the model loads. The materials'
   problems are only known then, so every count on the page is redrawn. */
window.addEventListener("fitte:facades", () => render());
applyDial(dial.values);
</script>
</body>
</html>
