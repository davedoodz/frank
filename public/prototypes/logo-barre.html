<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo du bureau — dans la barre du haut</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Five ways to set the office's mark at the head of the studio's line,
   left of « Tous les projets ». Each is the real top of prototype 3 — the
   studio's line, the project's sheet with the levels, the white page —
   cut at 760 px, so the mark is judged where it will be seen. The mark is
   the office's own file, traced to three shapes, so it can be drawn at
   any size and in any colour without blurring. */
:root{--ink:#1b1b1b;--ink-2:#55565a;--ink-3:#8b8c90;--line-2:#e6e6e8;--ch0:#141416;--ch1:#232327;--logo:#c0d739;--tabr:12px}
*{box-sizing:border-box}
body{margin:0;font:12px/1.4 Geist,"Inter",system-ui,-apple-system,sans-serif;color:var(--ink);background:#fafafa}
header{padding:20px 24px 4px;max-width:1100px}
header h1{margin:0;font-size:16px;font-weight:600}
header p{margin:4px 0 0;color:var(--ink-2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(640px,1fr));gap:18px;padding:12px 24px 30px}
.opt{border:1px solid var(--line-2);border-radius:8px;background:#fff;padding:12px 14px 14px}
.opt.rec{border-color:var(--ink)}
.opt h3{margin:0;font-size:13px;font-weight:600}
.opt h3 i{font-style:normal;font-weight:500;font-size:11px;color:var(--ink-2);margin-left:6px}
.opt .why{margin:2px 0 10px;font-size:11.5px;color:var(--ink-2)}
.svg{width:14px;height:14px;flex:0 0 14px}

/* the top of prototype 3 */
.top{background:var(--ch0);border-radius:10px;overflow:hidden;padding:6px 0 0}
.one{display:flex;align-items:flex-end;height:36px;padding:0 9px;gap:2px}
.crumb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;align-self:center;
  color:rgba(255,255,255,.58);font-size:12.5px;white-space:nowrap;cursor:pointer}
.crumb:hover{background:rgba(255,255,255,.1);color:#fff}
.crumb.ech{color:rgba(255,255,255,.92)}
.crumb .late{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:8px;
  background:#fff;color:#111;font-size:10px;font-weight:600}
.projtab{position:relative;align-self:flex-end;display:flex;align-items:center;height:30px;padding:0 12px;margin-left:6px;
  border-radius:var(--tabr) var(--tabr) 0 0;background:var(--ch1);color:#fff;font-size:15px;font-weight:600;white-space:nowrap}
.projtab::before,.projtab::after{content:"";position:absolute;bottom:0;width:var(--tabr);height:var(--tabr)}
.projtab::before{right:100%;background:radial-gradient(circle at 0 0,transparent 11.2px,var(--ch1) 12.3px)}
.projtab::after{left:100%;background:radial-gradient(circle at 100% 0,transparent 11.2px,var(--ch1) 12.3px)}
.sheet{background:var(--ch1);border-radius:18px 18px 0 0;padding:0 0 0}
.lvl{display:flex;align-items:flex-end;height:44px;padding:0 9px;gap:2px}
.mseg{display:inline-flex;gap:2px;padding:2px;border-radius:11px;background:rgba(255,255,255,.08);margin-bottom:1.5px}
.ms{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:9px;color:rgba(255,255,255,.72);font-size:12.5px;font-weight:500}
.ms.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.msep{width:1px;height:18px;margin:0 8px 8px;background:rgba(255,255,255,.16)}
.lt{display:inline-flex;align-items:center;gap:6px;height:28px;margin-bottom:3px;padding:0 10px;color:rgba(255,255,255,.72);font-size:12.5px;white-space:nowrap}
.lt.on{position:relative;height:31px;margin-bottom:0;padding:0 12px 3px;background:#fff;color:var(--ink);font-weight:600;border-radius:var(--tabr) var(--tabr) 0 0}
.lt.on::before,.lt.on::after{content:"";position:absolute;bottom:0;width:var(--tabr);height:var(--tabr)}
.lt.on::before{right:100%;background:radial-gradient(circle at 0 0,transparent 11.2px,#fff 12.3px)}
.lt.on::after{left:100%;background:radial-gradient(circle at 100% 0,transparent 11.2px,#fff 12.3px)}
.page{background:#fff;margin:0 6px;border-radius:12px 12px 0 0;height:54px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.page b{font-size:15px}
.page span{font-size:11.5px;color:var(--ink-2)}

/* the mark, in each of its forms */
.mark{display:block;color:var(--logo);flex:0 0 auto}
.home{display:inline-flex;align-items:center;align-self:center;cursor:pointer;border-radius:7px}
/* A: green mark, its own place */
.a .home{padding:0 8px 0 6px}
.a .mark{width:18px;height:18px}
/* B: the file as drawn — green on a white tile */
.b .home{width:26px;height:26px;justify-content:center;background:#fff;border-radius:7px;margin:0 6px 0 2px}
.b .mark{width:16px;height:16px}
/* C: the mark is the way home — it stands where the folder was */
.c .crumb.first .mark{width:14px;height:14px}
/* D: white, separated by a hairline */
.d .home{padding:0 6px}
.d .mark{width:16px;height:16px;color:#fff;opacity:.9}
.d .rule{width:1px;height:18px;align-self:center;background:rgba(255,255,255,.16);margin:0 6px 0 4px}
/* E: the corner — one tall mark beside both dark rows; the page below
   keeps its full width */
.e .top{position:relative}
.e .corner{position:absolute;left:0;top:0;width:58px;height:86px;display:flex;align-items:center;justify-content:center}
.e .corner .mark{width:34px;height:34px}
.e .one{padding-left:58px}
.e .lvl{padding-left:58px}
</style>
</head>
<body>
<header>
  <h1>Logo du bureau — dans la barre du haut, à gauche de « Tous les projets »</h1>
  <p>Cinq façons de le poser, sur le vrai haut du prototype 3. La marque est le fichier du bureau, redessinée en trois formes: nette à toute taille, dans n'importe quelle couleur. L'option recommandée a la bordure noire.</p>
</header>
<div class="grid" id="grid"></div>
<script src="vendor/lucide/lucide.min.js"></script>
<script>
const svg = (n) => `<svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${
  lucide.icons[n][2].map(([t, a]) => `<${t} ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`).join("")}</svg>`;
const MARK = `<svg class="mark" viewBox="0 0 1342 1341" aria-hidden="true"><g fill="currentColor"><path d="M0 0H145V1340H0Z"/><path d="M168 0H618V1340H283V341L572 667V454Z"/><path d="M752 0H1342V1320L797 708V960L1035 1229H752Z"/></g></svg>`;
const home = (inner = MARK) => `<span class="home" title="Tous les projets">${inner}</span>`;
const studio = (lead, folder = svg("Folder")) => `<div class="one">${lead}<span class="crumb first">${folder}Tous les projets</span>
  <span class="crumb ech">${svg("CalendarCheck")}Échéancier <span class="late">1</span></span><span class="projtab">Le Baldwin III</span></div>`;
const rows = `<div class="sheet"><div class="lvl"><span class="mseg"><span class="ms on">${svg("GitCompare")}Coordination</span><span class="ms">${svg("Hash")}Codes</span></span>
  <span class="msep"></span><span class="lt on">${svg("Building2")}Bâtiment entier</span><span class="lt">Sous-sol 00</span><span class="lt">Sous-sol 0</span><span class="lt">Niveau 1</span><span class="lt">Niveau 2</span></div>
  <div class="page"><b>Le Baldwin III — bâtiment entier</b><span>8 niveaux — 104 unités — 108 893 pi² nets</span></div></div>`;
const OPTS = [
  { k: "a", rec: true, title: "A — La marque seule, en vert",
    why: "18 px, dans la couleur du bureau, avant le premier mot de la ligne. Elle mène aussi à « Tous les projets », comme le logo d'un site. La seule couleur de la barre est la marque: elle n'a besoin de rien autour.",
    html: () => `<div class="top">${studio(home())}${rows}</div>` },
  { k: "b", title: "B — Le fichier tel quel: vert sur une tuile blanche",
    why: "La marque comme dans le fichier, sur son blanc, en tuile de 26 px — la forme d'une icône d'application. La plus fidèle au logo, mais la tuile blanche est le point le plus clair de la barre et tire l'œil avant l'onglet ouvert.",
    html: () => `<div class="top">${studio(home())}${rows}</div>` },
  { k: "c", title: "C — La marque remplace le dossier de « Tous les projets »",
    why: "Aucun élément de plus: le logo devient l'icône du chemin du retour. La barre garde sa longueur; en revanche, le dossier qui disait « une liste de projets » disparaît.",
    html: () => `<div class="top">${studio("", MARK)}${rows}</div>` },
  { k: "d", title: "D — En blanc, séparée par un trait",
    why: "Monochrome, 16 px, un trait fin avant « Tous les projets »: la marque se lit comme une signature, pas comme une couleur. La plus calme; le vert du bureau n'apparaît plus.",
    html: () => `<div class="top">${studio(home() + '<span class="rule"></span>')}${rows}</div>` },
  { k: "e", title: "E — Le coin: une grande marque sur les deux rangées",
    why: "34 px, dans une colonne à elle, à gauche de la ligne du bureau et de celle du projet. La plus affirmée, mais elle décale toute la ligne du projet vers la droite et coûte 58 px de largeur à chaque écran.",
    html: () => `<div class="top"><span class="corner home">${MARK}</span>${studio("")}${rows}</div>` },
];
document.getElementById("grid").innerHTML = OPTS.map((o) => `<div class="opt ${o.k} ${o.rec ? "rec" : ""}">
  <h3>${o.title}${o.rec ? "<i>recommandée</i>" : ""}</h3><div class="why">${o.why}</div>${o.html()}</div>`).join("");
</script>
</body>
</html>
