<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every page, day by day</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="vendor/geist/geist.css">
<style>
/* An index of every HTML page built for this project, in the order it was
   made. Two decisions:

   1. The day is the unit, not the folder. The work moved by day — a morning
      of navigation, an afternoon of layers — so the day is the heading and
      the only thing that folds.
   2. The thumbnail animates. A still frame of these pages is unreadable
      small, and most of them are a list of six to eighteen options; the
      five-frame loop scrolls through the page so the eye can tell which one
      it is without opening it. The frames are captured from the live pages
      at 1280x800, so the loop is the page, not a drawing of it.

   Same design system as index.html: the Geist Pixel eyebrow, the 40 px
   title over an accent rule, paper on #f7f7f5, and the thumbnail that lifts
   on hover. */
@font-face{font-family:"Geist Pixel Square";src:url("assets/GeistPixel-Square.woff2") format("woff2");font-display:swap}

:root{
  --ink:#111111; --ink-2:#5a5a5a; --ink-3:#8f8f8f;
  --line:#e6e6e4; --line-2:#d4d4d1; --paper:#ffffff; --bg:#f7f7f5;
  --accent:#C0D739;
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,monospace;
  --pixel:"Geist Pixel Square",var(--mono);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.page{width:100%;max-width:1020px;margin:0 auto;padding:56px 24px 96px}

.tete{text-align:center}
.tete .d{font-family:var(--pixel);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.tete h1{margin-top:10px;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.tete p{margin:14px auto 0;max-width:62ch;font-size:13px;color:var(--ink-2);line-height:1.6;text-wrap:balance}
.tete .rule{width:82px;height:7px;background:var(--accent);margin:18px auto 0}

.tools{display:flex;justify-content:center;gap:8px;margin-top:26px}
.btn{font-family:var(--pixel);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:7px 15px;
  color:var(--ink-2);cursor:pointer;transition:border-color .2s,color .2s,background-color .2s}
.btn:hover{border-color:var(--ink);color:var(--ink)}

.days{display:flex;flex-direction:column;gap:14px;margin-top:56px}

.day{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dayhead{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 18px;
  cursor:pointer;user-select:none}
.dayhead:hover{background:#fcfcfb}
.dayhead b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.dayhead .n{font-family:var(--pixel);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.caret{width:9px;height:9px;flex:0 0 9px;border-right:1.5px solid var(--ink-3);
  border-bottom:1.5px solid var(--ink-3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.day.shut .caret{transform:rotate(-45deg) translate(-1px,1px)}
.day.shut .rows{display:none}

.rows{display:flex;flex-direction:column;padding:0 18px 10px}
.row{display:grid;grid-template-columns:480px 1fr;gap:28px;align-items:center;
  padding:22px 4px;border-top:1px solid var(--line)}
.row .shot{position:relative;width:480px;aspect-ratio:1280/800;overflow:hidden;border-radius:var(--r);
  background:var(--bg);box-shadow:0 10px 28px rgba(0,0,0,.09);
  transition:transform .25s ease,box-shadow .25s ease}
.row:hover .shot{transform:translateY(-6px);box-shadow:0 20px 46px rgba(0,0,0,.15)}
.row .shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
.row .txt{display:flex;flex-direction:column;gap:8px}
.row h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.row .f{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.row .f b{font-weight:500;color:var(--ink-2)}
.row .go{display:inline-flex;align-items:center;gap:6px;margin-top:4px;
  font-family:var(--pixel);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  opacity:0;transition:opacity .2s ease}
.row:hover .go{opacity:1}
.row .go svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

@media (prefers-reduced-motion:reduce){.row .shot{transition:none}}
@media (max-width:1000px){
  .row{grid-template-columns:1fr;justify-items:center;text-align:center;gap:16px}
  .row .shot{width:100%;max-width:480px}
  .row .txt{align-items:center}
}
</style>
</head>
<body>
<div class="page">
  <div class="tete">
    <p class="d" id="eyebrow"></p>
    <h1>Every page, day by day</h1>
    <div class="rule"></div>
    <p>Every HTML page built for this project, in the order it was made. The thumbnail is the page
      itself, captured in five frames on the real screen, so it scrolls through what is inside.
      Click a row to open the page.</p>
  </div>

  <div class="tools">
    <button class="btn" data-act="allopen">Expand all</button>
    <button class="btn" data-act="allshut">Collapse all</button>
  </div>

  <div class="days" id="days"></div>
</div>

<script>
// [date, folder (p = prototypes, e = explorations), file, title, thumbnail]
const PAGES = [
["2026-10-25","e","dashboard-styles.html","Dashboard styles","dashboard-styles"],
["2026-10-26","e","navigation-patterns.html","Navigation patterns","navigation-patterns"],
["2026-10-26","e","navigation-mixes.html","Navigation mixes","navigation-mixes"],
["2026-10-26","p","feedback-options.html","User feedback on the prototype page","feedback-options"],
["2026-10-26","p","feedback-corner.html","Corner access to the raw interview notes","feedback-corner"],
["2026-10-26","p","accueil-variantes.html","Home screen — layout options","accueil-variantes"],
["2026-10-26","p","index.html","Prototype 01 — the home page","index"],
["2026-10-26","p","option-a.html","Option A","option-a"],
["2026-10-26","p","option-b.html","Option B","option-b"],
["2026-10-26","p","plateforme-a.html","Option A · coordination is a page","plateforme-a"],
["2026-10-26","p","plateforme-b.html","Option B · coordination is a layer of the unit","plateforme-b"],
["2026-10-26","p","notes-panel.html","Raw notes panel","notes-panel"],
["2026-10-26","p","notes-button-options.html","User notes button","notes-button-options"],
["2026-10-26","p","plateforme-c.html","Option C · what repeats","plateforme-c"],
["2026-10-26","p","interview-features.html","What Guy and Benoît asked for","interview-features"],
["2026-10-26","p","wireframe-c.html","Prototype C — wireframe","wireframe-c"],
["2026-10-26","p","wireframe-c2.html","Prototype C, adapted — composable low-fidelity wireframe","wireframe-c2"],
["2026-10-26","p","wireframe-c2-variants.html","Prototype C, adapted — ten hierarchies","wireframe-c2-variants"],
["2026-10-26","p","wireframe-c3.html","Prototype C3 — wireframe","wireframe-c3"],
["2026-10-26","p","wireframe-c3-layouts.html","Prototype C3 — the projects page, eight ways","wireframe-c3-layouts"],
["2026-10-27","p","wireframe-c4.html","Where the projects live — five ways","wireframe-c4"],
["2026-10-27","p","notes-presentation.html","Six ways to open the user notes","notes-presentation"],
["2026-10-27","p","wireframe-c3-name.html","Prototype C3 — where the project name lives","wireframe-c3-name"],
["2026-10-27","p","plan-lisibilite.html","Reading the plan — six solutions","plan-lisibilite"],
["2026-10-27","p","zonage-visualisations.html","Zoning and code — six ways to read it","zonage-visualisations"],
["2026-10-27","p","wireframe-c3-couleur.html","Prototype C3 — the studio green, and the black chrome","wireframe-c3-couleur"],
["2026-10-27","p","wireframe-c3-noir.html","Prototype C3 — black chrome, nine ways to put the green in it","wireframe-c3-noir"],
["2026-10-27","p","zonage-visuel.html","Zoning and code — ten graphic readings","zonage-visuel"],
["2026-10-27","p","zonage-en-contexte.html","Zoning and code — four placements, one drawing per rule","zonage-en-contexte"],
["2026-10-27","p","wireframe-c3-espace.html","Prototype C3 — ten ways to give the drawing room","wireframe-c3-espace"],
["2026-10-27","p","zoom-controles.html","Zoom, fold, show — eight ways to give the drawing back to the drawing","zoom-controles"],
["2026-10-27","p","zonage-fiches.html","Zoning and code — ten ways to draw the card (option A)","zonage-fiches"],
["2026-10-28","p","nav-haut.html","Top navigation — six options","nav-haut"],
["2026-10-28","p","unite-carte.html","Unit card — ten hierarchies","unite-carte"],
["2026-10-28","p","zoom-plat.html","Flat zoom, and the plan in the corner — six controls, three previews","zoom-plat"],
["2026-10-28","p","commentaires.html","Guest comments — six ways","commentaires"],
["2026-10-28","p","quantites.html","Quantities in the Units screen — six ways","quantites"],
["2026-10-28","p","lisibilite.html","The top navigation, more legible — six options","lisibilite"],
["2026-10-28","p","epingles.html","Pins and notes — internal and shared","epingles"],
["2026-10-28","p","epingles-pages.html","Pins — five full screens","epingles-pages"],
["2026-10-28","p","dessins-sources.html","Drawings and versions — six ways","dessins-sources"],
["2026-10-28","p","inspecteur-quantites.html","The right pane and the quantities — explorations","inspecteur-quantites"],
["2026-10-28","p","calques-compact.html","Layers without stealing the drawing","calques-compact"],
["2026-10-28","p","calques-ligne.html","The layer row — eight layouts","calques-ligne"],
["2026-10-28","p","calques-rail.html","Layer rail — a door to the document","calques-rail"],
["2026-10-28","p","calques-solo.html","Show one drawing, overlay two","calques-solo"],
["2026-10-28","p","calendrier.html","Schedule — six ways to draw the calendar","calendrier"],
["2026-10-28","p","calques-conflits.html","Thumbnails, anchored card, crossings","calques-conflits"],
["2026-10-28","p","calques-mots.html","What to call what does not agree","calques-mots"],
["2026-10-28","p","calques-superposer.html","Overlaying two drawings — six gestures","calques-superposer"],
["2026-10-28","p","codes-sections.html","The three bodies of rules — eighteen presentations","codes-sections"],
["2026-10-28","p","carnet.html","Notebook — deadlines, today's list, history","carnet"],
["2026-10-28","p","navigation-carnet.html","Where the schedule and the history live","navigation-carnet"],
["2026-10-28","p","niveaux-3d-variantes.html","Levels on the model — six ways to hold them during an orbit","niveaux-3d-variantes"]
];

const MONTHS = ["January","February","March","April","May","June","July","August",
                "September","October","November","December"];
const WEEK = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// Read as a local date so the weekday name matches the file's own day.
function dayLabel(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return WEEK[new Date(y, m-1, d).getDay()] + ", " + MONTHS[m-1] + " " + d;
}

const DAYS = [];
for (const p of PAGES){
  let day = DAYS[DAYS.length-1];
  if (!day || day.iso !== p[0]) DAYS.push(day = {iso:p[0], rows:[]});
  day.rows.push(p);
}

const ARROW = '<svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

function rowHTML(p){
  const dir = p[1] === "e" ? "explorations/" : "prototypes/";
  return '<a class="row" href="' + (p[1] === "e" ? "../explorations/" : "") + p[2] + '">'
    + '<span class="shot"><img loading="lazy" src="assets/vignettes/' + p[4] + '.gif" alt=""></span>'
    + '<span class="txt"><h2>' + esc(p[3]) + '</h2>'
    + '<span class="f">' + dir + '<b>' + esc(p[2]) + '</b></span>'
    + '<span class="go">Open' + ARROW + '</span></span></a>';
}

function dayHTML(day){
  return '<section class="day">'
    + '<div class="dayhead" data-act="fold"><span class="caret"></span>'
    + '<b>' + dayLabel(day.iso) + '</b>'
    + '<span class="n">' + day.rows.length + (day.rows.length > 1 ? " pages" : " page") + '</span></div>'
    + '<div class="rows">' + day.rows.map(rowHTML).join("") + '</div></section>';
}

document.getElementById("eyebrow").textContent =
  PAGES.length + " pages · " + DAYS.length + " days";
document.getElementById("days").innerHTML = DAYS.map(dayHTML).join("");

document.addEventListener("click", e => {
  const head = e.target.closest('[data-act="fold"]');
  if (head){ head.parentElement.classList.toggle("shut"); return; }
  const btn = e.target.closest(".btn");
  if (!btn) return;
  const shut = btn.dataset.act === "allshut";
  document.querySelectorAll(".day").forEach(d => d.classList.toggle("shut", shut));
});
</script>
</body>
</html>
